# Siracusa behind nginx (docs/DEPLOY.md). Tested with nginx 1.24 (Ubuntu 24.04).
#   sudo cp deploy/nginx-siracusa.conf /etc/nginx/sites-available/siracusa
#   replace siracusa-sofia.com with the real domain, then: sudo ln -s ../sites-available/siracusa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# The certificate: sudo certbot --nginx -d siracusa-sofia.com -d www.siracusa-sofia.com (Let's Encrypt; it fills the two
# ssl_certificate lines and renews by itself).
# With this file the server's .env must have: TRUST_PROXY=1 and COOKIE_SECURE=1.

# the address of the visitor in the logs without its last part (GDPR: no full IP address kept in the access log)
map $remote_addr $siracusa_ip {
  ~^(?<a>\d+\.\d+\.\d+)\.\d+$  $a.0;
  ~^(?<b>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):  $b::;
  default  0.0.0.0;
}
# the tracking key of an order and the code of an office order are part of the address: never written to the log
map $request_uri $siracusa_uri {
  ~^(?<p>/porachka/\d+)-  $p-***/;
  ~^(?<q>/api/orders/\d+)-  $q-***;
  ~^(?<r>/api/office/)  $r***;
  ~^(?<s>/masa/)  $s***;
  ~^(?<t>/api/floor/t/)  $t***;
  ~^(?<u>[^?]*)\?  $u?***;
  default  $request_uri;
}
log_format siracusa '$siracusa_ip [$time_local] "$request_method $siracusa_uri" $status $body_bytes_sent $request_time';

upstream siracusa_app {
  server 127.0.0.1:8787;
  keepalive 32;
}

# http -> https, and www -> the bare domain
server {
  listen 80;
  listen [::]:80;
  server_name siracusa-sofia.com www.siracusa-sofia.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://siracusa-sofia.com$request_uri; }
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.siracusa-sofia.com;
  ssl_certificate     /etc/letsencrypt/live/siracusa-sofia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/siracusa-sofia.com/privkey.pem;
  return 301 https://siracusa-sofia.com$request_uri;
}

server {
  # HTTP/2: the speed of the site is measured with it (docs/DECISIONS.md 17.11). nginx 1.25.1+: "listen 443 ssl;" and "http2 on;"
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name siracusa-sofia.com;

  ssl_certificate     /etc/letsencrypt/live/siracusa-sofia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/siracusa-sofia.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:siracusa:10m;
  ssl_session_timeout 1d;

  access_log /var/log/nginx/siracusa.access.log siracusa;
  error_log  /var/log/nginx/siracusa.error.log warn;

  # a photo of a dish or of a fuel receipt is up to 5 MB (the app checks the exact limits itself)
  client_max_body_size 6m;
  # the app compresses its answers itself (brotli or gzip, kept in memory): nginx passes them on as they are
  gzip off;

  add_header Strict-Transport-Security "max-age=31536000" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  # the app compares Origin with Host (its protection of the forms): the Host must arrive unchanged
  proxy_set_header Host $host;
  # the visitor's address for the limits: the app takes the LAST one of this list (TRUST_PROXY=1)
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  # the live streams (kitchen, waiter, driver, tracking): long connections, nothing buffered, never cut by nginx
  location = /api/stream {
    proxy_pass http://siracusa_app;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location / {
    proxy_pass http://siracusa_app;
  }

  # the app is down for the seconds of a restart: a plain page instead of the nginx error
  error_page 502 503 504 /siracusa-503.html;
  location = /siracusa-503.html {
    internal;
    default_type "text/html; charset=utf-8";
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;
    return 503 '<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siracusa Bar &amp; Grill</title><body style="font:16px/1.5 system-ui,sans-serif;margin:0;display:grid;min-height:100vh;place-items:center;text-align:center;padding:24px"><div><h1 style="font-size:24px">Обновяваме сайта</h1><p>Ще сме готови след няколко секунди. Опитайте пак.</p><p>За поръчка по телефона: <a href="tel:+359894365577">0894 36 55 77</a></p></div></body></html>';
  }
}
