<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Добре дошли | Siracusa Bar & Grill</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_masa.css">
<style>
/* welcome.html: page-only styles, tokens only */
.wl{position:relative; overflow:clip; overflow-clip-margin:0}
.wl-hero{position:relative; padding-right:120px; min-height:200px}
.wl-art{position:absolute; top:-6px; right:-70px; width:200px; height:200px; pointer-events:none; animation:wlArt 900ms var(--ease) both}
.wl-art .pic{width:100%; height:100%; background:none; overflow:visible}
.wl-art .pic > svg{inset:0; width:100%; height:100%}
@keyframes wlArt{from{transform:rotate(-40deg) scale(.86); opacity:0}to{transform:none; opacity:1}}
.wl-t{margin:6px 0 0; font-size:60px; line-height:.95; letter-spacing:-.055em; font-weight:800}
.wl-z{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:24px; font-weight:800; letter-spacing:-.03em}
.wl-z .ic{color:var(--ok)}
.wl-lead{margin-top:14px; font-size:17px; color:var(--ink); max-width:30ch; text-wrap:pretty}
.wl-lead span{color:var(--muted)}
.wl-lang{margin-top:22px; display:grid; gap:8px}
.wl-lang .seg button{font-size:17px}
.wl-btns{display:grid; gap:10px; margin-top:16px}
.wl-btns .pill-line{min-height:56px; font-size:17px}
.wl .mnotes{margin-top:16px}
.can{margin-top:32px; display:grid; gap:12px}
.can h2{margin:0}
.can ul{list-style:none; margin:0; padding:4px 18px}
.can li{display:grid; grid-template-columns:48px minmax(0,1fr); gap:14px; align-items:center; padding:14px 0}
.can li + li{border-top:1px solid var(--line)}
.can .ci{width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--red)}
.can b{display:block; font-size:17px; line-height:1.3; letter-spacing:-.01em}
.can .d{display:block; color:var(--muted); font-size:16px; line-height:1.4}
.now{display:flex; align-items:center; gap:12px; padding:16px 18px; text-decoration:none; color:inherit; min-height:72px}
.now b{display:block; font-size:16px}
.now .d{display:block; font-size:14px; color:var(--muted); font-weight:600}
.now > .ic{margin-left:auto; color:var(--muted)}
.wl-menu{padding-top:44px}
.wl-menu .chips{margin-bottom:16px}
.wl-menu .chip{text-decoration:none}
.wl-menu .rail .dcard{flex-basis:188px}
.wl-menu .dcard .open{font:inherit}
.wl-menu .later{max-width:9ch}
@container app (min-width:700px){
  .wl-hero{padding-right:260px}
  .wl-art{width:240px; height:240px; right:0}
  .wl-btns{grid-template-columns:1fr 1fr; max-width:640px}
  .wl-lang{max-width:420px}
}
@container app (min-width:900px){
  .wl-grid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:56px; align-items:start}
  .wl-hero{padding-right:250px; min-height:0}
  .wl-art{top:20px; right:0; width:240px; height:240px}
  .wl-t{font-size:88px}
  .wl-z{font-size:30px}
  .wl-lead{font-size:19px}
  .wl-btns{grid-template-columns:1fr; max-width:420px}
  .can{margin-top:8px}
  .wl-menu{padding-top:72px}
  .wl-menu .rail{display:grid; grid-template-columns:repeat(4,1fr); gap:24px; overflow:visible; margin:0; padding:0}
  .wl-menu .rail .dcard{flex:auto}
  .wl-menu .chips{flex-wrap:wrap; overflow:visible; margin:0 0 20px; padding:0}
}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_masa.js"></script>
<script>
(function(){
"use strict";
var M = MASA, L = M.L, ic = SC.ic, esc = SC.esc, S = M.st;
var main = M.mount({page:"welcome", title:"Добре дошли", docTitle:"Добре дошли · QR маса"});
if (!main) return;
var t = M.table();
var PICKS = ["pitsa-s-burata-i-proshuto-krudo","svinski-rebra","pitsa-s-proshuto-koto-i-tryufel","gratska-salata"].map(function(id){ return SC.byId[id]; }).filter(Boolean);
var CATS = ["pitsi","skara-bertha","salati","pasta-i-rizoto","burgeri","deserti"].map(function(id){ return SC.catById[id]; }).filter(Boolean);

function nowCard(){ var n = M.qty(S.draft), sent = M.sent().length;
  var line = n ? L("В общата количка: ","In the table cart: ")+SC.plural(n, L("ястие","dish"), L("ястия","dishes"))+" · "+SC.fmt(M.sum(S.draft))
    : sent ? L("Поръчани: ","Ordered: ")+SC.plural(sent, L("ястие","dish"), L("ястия","dishes")) : L("Количката още е празна","The cart is still empty");
  var ph = M.order().filter(function(w){ return M.phones().indexOf(w) > -1; });
  return '<a class="core now" href="cart.html"><span class="avs">'+ph.map(function(w){ return M.av(w); }).join("")+'</span><span><b>'+L("На масата: ","At the table: ")+ph.map(function(w){ return esc(M.name(w)); }).join(", ")+'</b><span class="d">'+line+'</span></span>'+ic("caret-right",20)+'</a>'; }

function render(){
  main.innerHTML =
  '<section class="mpage wl" aria-labelledby="wl-h">'+
    '<div class="wl-grid"><div>'+
      '<div class="wl-hero"><div class="wl-art" aria-hidden="true"><div class="pic">'+SC.art(PICKS[0])+'</div></div>'+
        '<p class="eyebrow">'+L("Добре дошли в Siracusa","Welcome to Siracusa")+'</p>'+
        '<h1 class="wl-t" id="wl-h">'+L("Маса ","Table ")+t.n+'</h1>'+
        '<p class="wl-z">'+ic(t.zone==="garden"?"tree":"chair",26)+esc(M.zone(t))+'</p>'+
        (M.kitchen() ? '<p class="wl-lead">'+L("Поръчайте от телефона","Order from your phone")+' <span>'+L("- сервитьорът потвърждава първата поръчка.","- the waiter confirms your first order.")+'</span></p></div>'
          : '<p class="wl-lead">'+L("Разгледайте менюто","Browse the menu")+' <span>'+L("и повикайте сервитьор, ако ви трябва нещо.","and call a waiter if you need anything.")+'</span></p></div>')+
      '<div class="wl-lang"><span class="label" id="lng">Език · Language</span><div class="seg" role="group" aria-labelledby="lng"><button type="button" data-mlang="bg" aria-pressed="'+(S.lang==="bg")+'" lang="bg">Български</button><button type="button" data-mlang="en" aria-pressed="'+(S.lang==="en")+'" lang="en">English</button></div></div>'+
      '<div class="wl-btns"><a class="pill pill-red go" href="menu.html">'+L("Разгледай менюто","Browse the menu")+'<span class="knob">'+ic("arrow-right",22)+'</span></a>'+
        '<a class="pill pill-line" href="call.html">'+ic("bell-ringing",22)+L("Повикай сервитьор","Call a waiter")+'</a></div>'+
      '<div class="mnotes">'+M.banners({callLink:false})+'</div>'+
    '</div>'+
    '<div class="can"><h2 class="h3">'+L("Какво можете оттук","What you can do here")+'</h2>'+
      '<div class="shell"><div class="core"><ul>'+
        '<li><span class="ci">'+ic("users-three",24)+'</span><span><b>'+L("Поръчайте заедно","Order together")+'</b><span class="d">'+L("Всеки добавя от своя телефон в обща количка и вижда какво са избрали другите.","Everyone adds from their own phone to one shared cart and sees what the others picked.")+'</span></span></li>'+
        '<li><span class="ci">'+ic("bell-ringing",24)+'</span><span><b>'+L("Повикайте сервитьор","Call a waiter")+'</b><span class="d">'+L("За поръчка, сметка, вода или прибори, с едно докосване.","For an order, the bill, water or cutlery, with one tap.")+'</span></span></li>'+
        '<li><span class="ci">'+ic("receipt",24)+'</span><span><b>'+L("Поискайте сметката","Ask for the bill")+'</b><span class="d">'+L("В брой или с карта, заедно или поотделно.","Cash or card, together or split.")+'</span></span></li>'+
      '</ul></div></div>'+
      '<div class="shell">'+nowCard()+'</div>'+
      '<p class="note-auto">'+ic("lock",18)+'<span>'+L("Без вход и без парола. Масата се затваря със сметката.","No sign-in, no password. The table closes with the bill.")+'</span></p>'+
    '</div></div>'+
    '<div class="wl-menu"><div class="sec-h"><h2 class="h2">'+L("Менюто","The menu")+'</h2><a class="link" href="menu.html">'+L("Цялото меню","Full menu")+ic("caret-right",18)+'</a></div>'+
      '<div class="chips" role="list">'+CATS.map(function(c){ return '<a class="chip" role="listitem" href="menu.html#'+c.id+'">'+esc(c.n)+'</a>'; }).join("")+'</div>'+
      '<div class="rail">'+PICKS.map(M.card).join("")+'</div>'+
      (S.lang==="en" ? '<p class="note-auto" style="margin-top:14px">'+ic("info",18)+'<span>Dish names are in Bulgarian for now. <span class="missing">[ЛИПСВА: английски имена и състав на ястията]</span></span></p>' : '')+
    '</div>'+
    M.protoHTML('<a class="pill" href="welcome.html#demo=empty">Празна количка</a><a class="pill" href="welcome.html#demo=cooking">След първата поръчка</a>')+
  '</section><div class="mend"></div>';
}
render();
M.on(function(why){ if (why !== "lang") render(); });
})();
</script>
</body>
</html>
