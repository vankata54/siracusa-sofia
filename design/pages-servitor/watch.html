<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Смарт часовник | Siracusa · Персонал</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_staff.css">
<style>
.wsec{padding:28px 16px 0}
.wsec h2{margin:0; font-size:22px; font-weight:800; letter-spacing:-.03em}
.wsec > p{margin:4px 0 14px; color:var(--muted)}
.pair{display:flex; flex-wrap:wrap; justify-content:center; gap:20px; align-items:center}
.dev{display:grid; justify-items:center; gap:8px}
.dev figcaption{font-size:14px; font-weight:700; color:var(--muted)}
/* bezels: always dark, like the hardware */
.w{position:relative; padding:10px; background:var(--surface-3); box-shadow:0 0 0 1px var(--line-strong), var(--shadow-lg)}
.w.round{width:232px; height:232px; border-radius:50%}
.w.rect{width:204px; height:244px; border-radius:52px}
.face{position:relative; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); display:grid; align-content:center; justify-items:center; text-align:center; gap:4px}
.round .face{border-radius:50%; padding:22px 26px}
.rect .face{border-radius:42px; padding:16px 14px; align-content:space-between}
.face .wtop{display:flex; align-items:center; justify-content:center; gap:6px; font-size:15px; font-weight:800; color:var(--muted)}
.face .t{font-size:30px; font-weight:800; letter-spacing:-.04em; line-height:1}
.round .face .t{font-size:28px}
.face .why{display:flex; align-items:center; justify-content:center; gap:6px; font-size:18px; font-weight:800; line-height:1.15}
.face .tm{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1}
.face .btn{width:100%; min-height:56px; border:0; border-radius:999px; background:var(--red); color:var(--on-red); font-size:19px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; margin-top:4px}
.round .face .btn{min-height:52px; width:150px; font-size:18px}
.face.call{background:var(--bg)}
.face.call .why{color:var(--red)}
.face.call.late{box-shadow:inset 0 0 0 4px var(--red)}
.face.ready .why{color:var(--ember)}
.face.ready .btn{background:var(--ember); color:var(--on-ember)}
.face.ok .btn{background:var(--ok); color:var(--on-ok)}
.face.ok .why{color:var(--ok)}
.face .pager{display:flex; gap:6px; justify-content:center}
.face .pager span{width:8px; height:8px; border-radius:50%; background:var(--line-strong)}
.face .pager span.on{background:var(--ink)}
.face .big{color:var(--ok)}
.face .warn{color:var(--warn)}
.face .muted{font-size:15px; font-weight:700; line-height:1.3}
.vib{display:grid; gap:10px; margin-top:6px}
.vib .r{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:22px; background:var(--surface); box-shadow:var(--hi), var(--shadow)}
.vib .r b{flex:1}
.vib .bars{display:flex; gap:4px; align-items:center}
.vib .bars i{display:block; height:12px; border-radius:6px; background:var(--ink)}
.rules{margin:0; padding-left:20px; display:grid; gap:6px}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_staff.js"></script>
<script>
var main = ST.mount({page:"watch", title:"Смарт часовник", sub:"Само известия", back:{href:"index.html", label:"Екрани"}, nav:null});
var ic = SC.ic;
var now = Date.now(), c12 = now - 80000, r4 = now - 90000, late9 = now - 412000;
function pair(id, round, rect){ return '<div class="pair">'+
  '<figure class="dev" style="margin:0"><div class="w round st-dark" id="'+id+'-r">'+round+'</div><figcaption>Кръгъл · 232 px</figcaption></figure>'+
  '<figure class="dev" style="margin:0"><div class="w rect st-dark" id="'+id+'-q">'+rect+'</div><figcaption>Правоъгълен · 204 × 244 px</figcaption></figure></div>'; }
function callFace(cls, n, why, icon, since, btn){ return '<div class="face '+cls+'" data-lvl><div class="t">Маса '+n+'</div><div class="why">'+ic(icon,20)+why+'</div><div class="tm">'+ST.timer(since)+'</div>'+btn+'</div>'; }
function callRect(cls, n, why, icon, since, btn, top){ return '<div class="face '+cls+'" data-lvl><div class="wtop">'+(top||ic("bell-ringing",18)+'Повикване')+'</div><div style="display:grid;gap:6px;justify-items:center"><div class="t">Маса '+n+'</div><div class="why">'+ic(icon,20)+why+'</div><div class="tm">'+ST.timer(since)+'</div></div>'+btn+'</div>'; }
var take = '<button class="btn" type="button" data-take>Отивам</button>';
var served = '<button class="btn" type="button" data-served>'+ic("check",20)+'Сервирах</button>';
var html = '';
html += '<section class="wsec"><h2>1. Повикване от маса</h2><p>Един ред и вибрация. „Отивам“ (същата дума като на телефона) казва на колегите, че масата е поета. Масата и причината са най-едрите.</p>'+
  pair("call", callFace("call", 12, "Сметка", "receipt", c12, take), callRect("call", 12, "Сметка", "receipt", c12, take))+'</section>';
html += '<section class="wsec"><h2>2. Отивам</h2><p>Таймерът продължава до „Обслужено“.</p>'+
  pair("ok", '<div class="face ok" style="padding-bottom:34px"><div class="why">'+ic("check-circle",20)+'Отивам</div><div class="t">Маса 12</div><div class="muted">Сметка · '+ST.timer(c12)+'</div><button class="btn" type="button" data-done>'+ic("check",20)+'Обслужено</button></div>',
    '<div class="face ok"><div class="wtop">'+ic("check-circle",18)+'Отивам</div><div style="display:grid;gap:6px"><div class="t">Маса 12</div><div class="muted">Сметка · '+ST.timer(c12)+'</div></div><button class="btn" type="button" data-done>'+ic("check",20)+'Обслужено</button></div>')+'</section>';
html += '<section class="wsec"><h2>3. Готова поръчка</h2><p>Друга вибрация (3 кратки), цвят жар и готварска шапка като на телефона. „Сервирах“ е същото действие като в „Готови“.</p>'+
  pair("ready", '<div class="face ready"><div class="t">Маса 4</div><div class="why">'+ic("chef-hat",20)+'Готово</div><div class="muted">2× Пица Маргарита</div><div class="tm">'+ST.timer(r4)+'</div>'+served+'</div>',
    '<div class="face ready"><div class="wtop">'+ic("chef-hat",18)+'От кухнята</div><div style="display:grid;gap:6px;justify-items:center"><div class="t">Маса 4</div><div class="why">'+ic("chef-hat",20)+'Готово</div><div class="muted">2× Пица Маргарита</div></div>'+served+'</div>')+'</section>';
html += '<section class="wsec"><h2>4. Закъснява · няколко наведнъж</h2><p>След 5 мин (условно) рамката става червена и повикването отива и при управителя. С плъзгане към следващото; точките казват колко чакат.</p>'+
  pair("late", '<div class="face call late"><div class="pager" role="img" aria-label="1 от 4"><span class="on"></span><span></span><span></span><span></span></div><div class="t">Маса 9</div><div class="why">'+ic("chat-circle-dots",20)+'Друго</div><div class="tm">'+ST.timer(late9)+'</div>'+take+'</div>',
    callRect("call late", 9, "Друго", "chat-circle-dots", late9, take, '<span class="pager" role="img" aria-label="1 от 4"><span class="on"></span><span></span><span></span><span></span></span>'))+'</section>';
html += '<section class="wsec"><h2>5. Празно и без връзка</h2><p>Часовникът е тих, докато няма нищо. Без връзка с телефона казва какво да се направи.</p>'+
  pair("idle", '<div class="face"><span class="big">'+ic("check-circle",40)+'</span><div class="why">Няма повиквания</div><div class="muted">Маси: 3, 4, 7, 12, 14, 16</div></div>',
    '<div class="face" style="align-content:center;gap:10px"><span class="warn">'+ic("warning",40)+'</span><div class="why">Няма връзка</div><div class="muted">Дръж телефона с теб и провери Bluetooth</div></div>')+'</section>';
html += '<section class="wsec"><h2>Вибрации</h2><div class="vib"><div class="r">'+ic("bell-ringing",24)+'<b>Повикване</b><span class="bars" aria-label="2 дълги"><i style="width:44px"></i><i style="width:44px"></i></span></div><div class="r">'+ic("chef-hat",24)+'<b>Готово от кухнята</b><span class="bars" aria-label="3 кратки"><i style="width:14px"></i><i style="width:14px"></i><i style="width:14px"></i></span></div><div class="r">'+ic("warning",24)+'<b>Закъснява (5 мин)</b><span class="bars" aria-label="повтаря се"><i style="width:44px"></i><i style="width:14px"></i><i style="width:44px"></i></span></div></div></section>';
html += '<section class="wsec"><h2>Правила за часовника</h2><ul class="rules"><li>Нито един текст под 14 px; номерът на масата е 28-30 px.</li><li>Една цел на екран, поне 52 px висока, на цялата ширина.</li><li>Винаги тъмен екран (пести батерия, не свети в салона вечер).</li><li>Само известия: без меню и без поръчки от часовника.</li><li>Кои часовници поддържаме (Wear OS, Apple Watch, или известия от телефона): <span class="missing">[ЛИПСВА: решение]</span>.</li></ul></section>';
main.innerHTML = html; ST.tick();
main.addEventListener("click", function(e){ var b = e.target.closest("[data-take],[data-served],[data-done]"); if (!b) return; var t = b.hasAttribute("data-take") ? "Отивам ✓" : b.hasAttribute("data-served") ? "Сервирано ✓" : "Обслужено ✓"; b.textContent = t; b.style.background = "var(--ok)"; b.style.color = "var(--on-ok)"; ST.haptic(12); });
</script>
</body>
</html>
