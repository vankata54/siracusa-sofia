<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Повиквания | Siracusa · Персонал</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_staff.css">
<style>
.list{display:grid; gap:12px}
.lead2{display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:22px; background:var(--surface-2); font-weight:700; line-height:1.35}
.lead2 b{font-variant-numeric:tabular-nums}
.callc .zone{font-size:16px; font-weight:700; color:var(--muted)}
.callc.late .zone{color:var(--on-red); opacity:.85}
.qrc .why{color:var(--red)}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_staff.js"></script>
<script>
var main = ST.mount({page:"calls", title:"Повиквания", nav:"calls"});
var ic = SC.ic, esc = SC.esc, filter = "mine";

function card(c){ var r = ST.REASONS[c.r], t = ST.tableByN[c.t], mine = ST.isMine(c.t), s = ST.secs(c.since), lvl = ST.level(s);
  var cls = c.taken==="me" ? " mine-taken" : c.taken==="other" ? " other-taken" : "";
  var who = c.taken==="me" ? '<span>'+ic("check-circle",18)+'</span><span>Поехте я преди '+ST.timer(c.takenAt)+'</span>' : c.taken==="other" ? '<span>'+ic("user",18)+'</span><span>Поема '+ST.OTHER+'</span>' : (mine ? '<span>Ваша маса</span>' : '<span>Маса на '+ST.OTHER+' · свободно повикване</span>');
  var esc5 = '<span class="esc"'+(lvl==="late"?'':' hidden')+' data-esc>'+ic("warning",18)+'Изпратено и на управителя</span>';
  return '<article class="callc'+cls+'"'+(c.taken?'':' data-lvl')+' aria-label="Маса '+c.t+', '+r[0]+'">'+
    '<div class="t1"><b>Маса '+c.t+'</b><span class="zone">'+ST.ZONE[t.zone]+'</span></div>'+
    '<div class="timer" style="grid-row:span 2"><span>чака</span><b>'+ST.timer(c.since)+'</b></div>'+
    '<div class="why">'+ic(r[1],24)+r[0]+'</div>'+
    '<div class="meta">'+who+esc5+'</div>'+
    (c.taken==="other" ? '' : '<div class="acts">'+(c.taken==="me"
      ? '<button class="pill pill-red" type="button" data-done="'+c.id+'" style="background:var(--ok);color:var(--on-ok)">'+ic("check",22)+'Обслужено</button>'
      : '<button class="pill pill-red" type="button" data-take="'+c.id+'">Отивам</button>')+
      '<a class="pill pill-line" href="table.html#'+c.t+'">Масата</a></div>')+'</article>'; }

function qrCard(o){ var t = ST.tableByN[o.t], n = o.lines.reduce(function(s,l){ return s+l.q; },0);
  return '<article class="callc qrc" data-lvl aria-label="Маса '+o.t+', QR поръчка за потвърждение">'+
    '<div class="t1"><b>Маса '+o.t+'</b><span class="zone">'+ST.ZONE[t.zone]+'</span></div>'+
    '<div class="timer" style="grid-row:span 2"><span>чака</span><b>'+ST.timer(o.at)+'</b></div>'+
    '<div class="why">'+ic("qr-code",24)+'QR поръчка · '+SC.plural(n,"артикул","артикула")+'</div>'+
    '<div class="meta"><span>Първата поръчка от QR чака вашето потвърждение · '+SC.fmt(ST.linesTotal(o.lines))+'</span></div>'+
    '<div class="acts"><a class="pill pill-red" href="table.html#'+o.t+'">Виж и потвърди</a></div></article>'; }

function render(){
  var calls = ST.openCalls(), qr = ST.pendingQR();
  if (filter==="mine"){ calls = calls.filter(function(c){ return ST.isMine(c.t) || !c.taken || c.taken==="me"; }); qr = qr.filter(function(o){ return ST.isMine(o.t); }); }
  var all = ST.db.calls.length + ST.pendingQR().length;
  var html = '<section class="st-sec"><div class="st-seg" role="group" aria-label="Кои повиквания">'+
    '<button type="button" data-f="mine" aria-pressed="'+(filter==="mine")+'">За мен</button><button type="button" data-f="all" aria-pressed="'+(filter==="all")+'">Всички <span class="n">'+all+'</span></button></div></section>';
  if (!calls.length && !qr.length){
    html += '<div class="st-empty"><div class="ill">'+ic("check-circle",52)+'</div><h2>Няма повиквания</h2><p>Всички маси са обслужени. Щом някой повика, телефонът и часовникът ще вибрират.</p><a class="pill pill-line pill-lg" href="tables.html">'+ic("squares-four",22)+'Към залата</a></div>';
  } else {
    var oldest = calls.filter(function(c){ return !c.taken; })[0];
    if (calls.length + qr.length >= 5) html += '<section class="st-sec"><div class="lead2">'+ic("warning",24)+'<span><b>'+(calls.length+qr.length)+'</b> чакат наведнъж'+(oldest?' · най-старото: Маса '+oldest.t+', '+ST.mmss(ST.secs(oldest.since)):'')+'. Поемете най-старото, колегите виждат кое сте взели.</span></div></section>';
    html += '<section class="st-sec"><div class="list">'+qr.map(qrCard).join("")+calls.map(card).join("")+'</div></section>';
  }
  html += '<section class="st-sec"><div class="notice">'+ic("info",22)+'<span>Цветът се сменя след 2 мин (жълто) и след 5 мин (червено). Ако никой не поеме повикването, след 5 мин то отива и при управителя. Тези минути са условни: <span class="missing">[ЛИПСВА: настройва се в админ панела]</span>.</span></div></section>';
  main.innerHTML = html; ST.tick(); escTick();
}
function escTick(){ main.querySelectorAll("[data-esc]").forEach(function(el){ var card = el.closest(".callc"); el.hidden = !card.classList.contains("late"); }); }
setInterval(escTick, 1000);
render(); ST.on(render);
main.addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.f){ filter = b.dataset.f; render(); return; }
  if (b.dataset.take){ var c = ST.db.calls.filter(function(x){ return x.id===b.dataset.take; })[0]; ST.takeCall(c.id); ST.haptic(); ST.toast("Маса "+c.t+": отивате. Колегите виждат, че сте я поели."); return; }
  if (b.dataset.done){ var c2 = ST.db.calls.filter(function(x){ return x.id===b.dataset.done; })[0]; ST.doneCall(c2.id); ST.toast("Маса "+c2.t+" е обслужена", function(){ ST.restoreCall(c2); }); return; }
});
</script>
</body>
</html>
