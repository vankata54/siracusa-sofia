<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сега | Siracusa · Управител</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_mgr.css">
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="../pages-admin/_admin.js"></script>
<script src="../pages-admin/_seed-orders.js"></script>
<script src="../pages-admin/_res-lib.js"></script>
<script src="../pages-admin/_seed-res.js"></script>
<script src="_seed-shift.js"></script>
<script src="../pages-admin/_pencil.js"></script>
<script src="../pages-admin/_pen-mount.js" data-auto="false"></script>
<script src="_mgr.js"></script>
<script>
(function(){
"use strict";
var main = MG.mount({page:"now", title:"Сега", section:"orders"});
if (!main) return;
var ic = MG.ic, esc = MG.esc, fmt = MG.fmt, SH = A.sh, ADM = MG.ADMIN;

var NB = " "; /* неразделящ интервал: число и мерна дума на един ред */
if (MG.st === "loading"){ main.innerHTML = MG.statusLine() + MG.skel(4, "Зареждаме смяната…"); return; }
if (MG.st === "error"){ main.innerHTML = MG.statusLine() + MG.error("Поръчките и повикванията не се заредиха. Админът и кухнята работят; опитай пак след малко."); return; }

/* ---------- пулсът на смяната: 5 числа, всяко води към мястото си ---------- */
function pulse(c){ var pct = c.tables ? Math.round(c.seated / c.tables * 100) : 0, a = c.tables ? c.salon / c.tables * 100 : 0, b = c.tables ? c.garden / c.tables * 100 : 0;
  var rlab = c.closed ? "ресторантът е затворен" : "до " + String(Math.floor(c.resEnd / 60)).padStart(2, "0") + ":" + String(c.resEnd % 60).padStart(2, "0");
  return '<div class="mg-pulse" role="group" aria-label="Пулсът на смяната"><div class="in">' +
    '<a class="mg-kpi wide" href="hall.html"><span class="lb">' + ic("chair", 20) + 'Маси заети</span><span class="v tnum">' + c.seated + '<small>от' + NB + c.tables + '</small></span><span class="go">' + ic("caret-right", 20) + '</span>' +
      '<span class="bar"><span class="mg-occ" aria-hidden="true"><i style="width:' + a + '%"></i><i style="width:' + b + '%"></i></span><span class="mg-occl"><span><i></i>Салон' + NB + c.salon + '</span><span><i></i>Градина' + NB + c.garden + '</span><span>' + pct + '%' + NB + 'заети</span></span></span></a>' +
    '<a class="mg-kpi" href="' + ADM + 'orders.html#s=work"><span class="lb">' + ic("receipt", 20) + 'В работа</span><span class="v tnum">' + c.inWork + '</span><span class="ft">' + (c.inWork === 1 ? "поръчка" : "поръчки") + '</span></a>' +
    '<a class="mg-kpi' + (c.late ? ' hot' : '') + '" href="#problems" data-jump="problems"><span class="lb">' + ic(c.late ? "warning" : "check-circle", 20) + 'Закъсняват</span><span class="v tnum">' + c.late + '</span><span class="ft">' + (c.late ? "виж проблемите" : c.lateSeen ? "нищо не чака теб" : "нищо не закъснява") + (c.lateSeen ? " · " + c.lateSeen + "\u00a0видян" + (c.lateSeen === 1 ? "о" : "и") : "") + '</span></a>' +
    '<a class="mg-kpi" href="team.html#go=waiters"><span class="lb">' + ic("hand-waving", 20) + 'Повиквания</span><span class="v tnum">' + c.calls + '</span><span class="ft">' + (c.calls === 1 ? "чака сервитьор" : "чакат сервитьор") + '</span></a>' +
    '<a class="mg-kpi" href="hall.html#go=res"><span class="lb">' + ic("calendar-check", 20) + 'Резервации</span><span class="v tnum">' + c.res2 + '</span><span class="ft">' + rlab + '</span></a>' +
  '</div></div>'; }

/* ---------- „Проблеми сега“: едно число на карта (колко чака / колко закъснява), едно главно действие ---------- */
function probCard(p, i){ var first = i === 0 && !p.done, prim = first ? "pill-red" : "pill-ink", acts = "", tm = "";
  if (p.kind === "call") acts = '<button class="pill ' + prim + ' grow" type="button" data-a="go" data-id="' + p.id + '">' + ic("arrow-right", 20) + 'Отивам</button><button class="pill pill-line" type="button" data-a="assign" data-id="' + p.id + '">' + ic("user", 20) + 'Възложи на…</button>';
  if (p.kind === "qr") acts = '<button class="pill ' + prim + ' grow" type="button" data-a="qr" data-id="' + p.id + '">' + ic("check", 20) + 'Потвърди и прати</button><button class="pill pill-line" type="button" data-a="qrassign" data-id="' + p.id + '">' + ic("user", 20) + 'Възложи на…</button>';
  if (p.kind === "ask") acts = '<button class="pill ' + prim + ' grow" type="button" data-a="ask" data-id="' + p.id + '">' + ic("map-pin", 20) + 'Реши</button>';
  if (p.kind === "out") acts = '<button class="pill ' + prim + ' grow" type="button" data-a="callc" data-no="' + p.no + '" data-why="out">' + ic("phone", 20) + 'Обади се на клиента</button>';
  if (p.kind === "late" && !p.done) acts = p.table ? '<a class="pill ' + prim + ' grow" href="../pages-kuhnya/summary.html#s=all">' + ic("chef-hat", 20) + 'Виж в кухнята</a><button class="pill pill-line" type="button" data-a="seen" data-no="' + p.no + '">' + ic("check", 20) + 'Видях</button>'
    : '<button class="pill ' + prim + ' grow" type="button" data-a="callc" data-no="' + p.no + '" data-why="late">' + ic("phone", 20) + 'Обади се на клиента</button>';
  if (p.since) tm = '<div class="tm"><b class="tnum" data-since="' + new Date(p.since).toISOString() + '">' + MG.mmss(MG.secSince(p.since)) + '</b><span>' + esc(p.tl) + '</span></div>';
  return '<article class="mg-prob ' + p.cls + '" data-key="' + esc(p.key) + '">' + (first ? '<span class="rank">' + ic("warning", 14) + 'Първо това</span>' : '') +
    '<span class="pi">' + ic(p.done ? "check" : p.icon, 24) + '</span><div class="pt"><b>' + esc(p.title) + '</b><small>' + esc(p.meta) + '</small></div>' + tm + (acts ? '<div class="pa">' + acts + '</div>' : '') + '</article>'; }
function problems(list){ var open = list.filter(function(x){ return !x.done; }), done = list.filter(function(x){ return x.done; });
  var shown = showAll ? list : open.slice(0, 5), more = list.length - shown.length;
  return '<section class="mg-blk now-probs" id="problems" aria-labelledby="h-p"><div class="mg-h"><h2 id="h-p">Проблеми сега</h2>' + (open.length ? '<span class="mg-cnt hot">' + open.length + '</span>' : '') + '</div>' +
  (open.length ? '' : '<div class="mg-allok">' + ic("check-circle", 32) + '<div><b>Няма проблеми сега</b><span>Повикванията над ' + MG.callMgr() + NB + 'мин, закъсненията и въпросите на шофьорите идват тук сами.</span></div></div>') +
  (shown.length ? '<div class="mg-probs"' + (open.length ? '' : ' style="margin-top:12px"') + '>' + shown.map(probCard).join("") + '</div>' : '') +
  (more > 0 ? '<button class="pill pill-line pill-lg mg-more" type="button" data-a="allp">' + ic("caret-down", 20) + (more === done.length && open.length <= 5 ? 'Решени днес · ' + more : 'Покажи още ' + more) + '</button>' : '') + '</section>'; }

/* ---------- „Чака те“ (като таблото на админа) ---------- */
function waits(W){ var alert = A.data.get("order-alert", null), rows = "", out0 = A.soldOutToday();
  if (W.orders.length){ rows += '<div class="mg-wgrp">' + ic("receipt", 18) + 'Поръчки за приемане · ' + W.orders.length + '</div>' + W.orders.map(function(o){ var c = SH.CH[o.channel] || SH.CH.delivery, nw = alert && alert.no === o.no, bad = MG.outNames(o, out0);
      return '<div class="mg-wrow" data-wno="' + o.no + '"><span class="wi">' + ic(c[1], 22) + '</span><div class="wt"><b>№ ' + esc(o.no) + ' · ' + c[0] + (o.channel === "table" ? " " + esc(o.table) : "") + (nw ? ' ' + MG.tag("ember", "bell-ringing", "Нова") : '') + '</b><small>' + (o.channel !== "table" ? esc(o.name) + ' · ' : '') + A.plural(SH.items(o), "ястие", "ястия").replace(" ", NB) + ' · <span class="price">' + fmt(SH.total(o)).replace(" ", NB) + '</span> · ' + MG.agoMin(o.ts).replace(/ (мин)/, NB + "$1") + '</small>' +
        (bad ? '<span class="mg-wout">' + MG.tag("ember", "warning", "Изчерпано: " + bad) + '</span>' : '') + '</div>' +
        '<div class="wa"><button class="pill pill-ink" type="button" data-a="accept" data-no="' + o.no + '" aria-label="Приеми № ' + o.no + (bad ? ', в нея има изчерпано' : '') + '">' + ic("check", 20) + 'Приеми</button></div></div>'; }).join(""); }
  if (W.res.length){ rows += '<div class="mg-wgrp">' + ic("calendar-check", 18) + 'Резервации за потвърждаване · ' + W.res.length + '</div>' + W.res.map(function(r){ var t = A.tables().filter(function(x){ return x.id === r.table; })[0];
      return '<div class="mg-wrow"><span class="wi tnum">' + esc(r.time) + '</span><div class="wt"><b>' + esc(r.name) + ' ·\u00a0' + A.plural(+r.people, "човек", "души").replace(" ", NB) + '</b><small>Днес в ' + esc(r.time) + (t ? ' · Маса' + NB + t.n : ' · без маса') + (r.occasion ? ' · ' + esc(r.occasion) : '') + '</small></div>' +
        '<div class="wa"><button class="pill pill-ink" type="button" data-a="confirm" data-id="' + r.id + '" aria-label="Потвърди резервацията на ' + esc(r.name) + ' в ' + esc(r.time) + '">' + ic("check", 20) + 'Потвърди</button></div></div>'; }).join(""); }
  if (W.blocks.length){ rows += '<div class="mg-wgrp">' + ic("warning-circle", 18) + 'Неявили се за решение · ' + W.blocks.length + '</div>' + W.blocks.map(function(x){
      return '<div class="mg-wrow"><span class="wi">' + ic("user", 22) + '</span><div class="wt"><b>' + esc(x.b.name || "Клиент") + ' ·\u00a0' + A.plural(x.b.count || 2, "неявяване", "неявявания").replace(" ", NB) + '</b><small><span class="nw">' + esc(A.maskPhone(x.phone)).replace(/ /g, NB) + '</span> · последно ' + esc(A.fmtDate(new Date(x.b.at), true)) + '</small></div>' +
        '<div class="wa"><button class="pill pill-ink" type="button" data-a="block" data-ph="' + esc(x.phone) + '">' + ic("scales", 20) + 'Реши</button></div></div>'; }).join(""); }
  if (W.notes){ rows += '<div class="mg-wgrp">' + ic("pencil-simple", 18) + 'Твоите препоръки · ' + W.notes.n + '</div><div class="mg-wrow"><span class="wi">' + ic("pencil-simple", 22) + '</span><div class="wt"><b>' + esc((W.notes.title || "С нов статус").replace(/^\d+ ваш[аи] препорък[аи] (е|са)/, function(m){ return m.replace("ваша", "твоя").replace("ваши", "твои"); })) + '</b><small>От молива, в „Бележки“ на админа</small></div><div class="wa"><a class="pill pill-line" href="' + ADM + 'notes.html#src=' + esc(A.me.role) + '">Виж</a></div></div>'; }
  return '<section class="mg-blk now-wait" id="wait" aria-labelledby="h-w"><div class="mg-h"><h2 id="h-w">Чака те</h2>' + (W.n ? '<span class="mg-cnt">' + W.n + '</span>' : '') + '</div>' +
    (W.n ? '<div class="mg-card mg-list">' + rows + '</div>' : '<div class="mg-allok">' + ic("check-circle", 32) + '<div><b>Нищо не чака.</b><span>Всичко е наред. Новите онлайн поръчки идват тук със звук.</span></div></div>') + '</section>'; }

/* ---------- кухнята ---------- */
function kitchen(){ var k = A.settings().kitchen, secs = MG.kitchen(), out = A.soldOutToday().map(function(id){ return SC.byId[id]; }).filter(Boolean), open = MG.kitchenOpen();
  var busy = '<label class="mg-busy' + (k.busy ? ' on' : '') + (open ? '' : ' off') + '"><b>' + ic("hourglass", 24) + 'Натоварено</b><span class="mg-switch"><input type="checkbox" role="switch" data-busy data-keep="busy" aria-label="Натоварено"' + (k.busy ? ' checked' : '') + (open ? '' : ' disabled') + '><span class="tr"></span></span>' +
    '<span class="sub">' + (!open ? 'Кухнята не приема поръчки сега (от 10:00 до 22:30).' : k.busy ? 'Включено' + (k.busyBy ? ' от ' + esc(k.busyBy) : '') + (k.busyAt ? ' в ' + MG.hm(k.busyAt) : '') + '. Гостите виждат <q>Възможни са закъснения · около' + NB + k.etaBusyMin + NB + 'мин</q>.' : 'Изключено. Гостите виждат <q>около' + NB + k.etaMin + NB + 'мин</q> за доставка.') + '</span></label>';
  var sh = '<div class="mg-card mg-list mg-secs">' + secs.map(function(s){ return '<div class="mg-sec' + (s.online ? '' : ' offl') + '"><span class="si">' + ic(s.sec.ic, 22) + '</span><div class="sn"><b>' + esc(s.sec.n) + '</b>' +
      (s.online ? '<small><span class="mg-dot" aria-hidden="true"></span>Таблетът работи</small>' : '') + '</div>' +
      '<div class="sc"><span><b>' + s.wait + '</b>' + (s.wait === 1 ? 'чака' : 'чакат') + '</span>' + (s.late ? '<span class="late">' + ic("warning", 14) + '<b>' + s.late + '</b>' + (s.late === 1 ? 'закъснява' : 'закъсняват') + '</span>' : '') + '</div>' + (s.online ? '' : '<span class="mg-offtag">' + ic("warning-circle", 18) + 'Таблетът е без връзка от ' + MG.hm(s.seen) + '</span>') + '</div>'; }).join("") + '</div>';
  var so = '<div class="mg-h" style="margin:22px 0 10px"><h2 style="font-size:19px">Изчерпано днес</h2><span class="mg-cnt">' + out.length + '</span></div>' +
    (out.length ? '<div class="mg-card mg-list">' + out.map(function(x){ var c = SC.catById[x.cat]; return '<div class="mg-orow">' + SC.pic(x) + '<div><b>' + esc(x.n) + '</b><small>' + (c ? esc(c.n) : '') + ' · скрито с „Изчерпано днес“</small></div><button class="pill pill-line" type="button" data-a="back" data-id="' + x.id + '" aria-label="Върни в менюто: ' + esc(x.n) + '">' + ic("arrow-counter-clockwise", 20) + 'Върни</button></div>'; }).join("") + '</div>'
      : '<div class="mg-allok">' + ic("check-circle", 28) + '<div><b>Всичко е в менюто</b><span>Кухнята отбелязва изчерпаното от своя екран.</span></div></div>');
  return '<section class="mg-blk now-kit" id="kitchen" aria-labelledby="h-k"><div class="mg-h"><h2 id="h-k">Кухнята</h2><a class="mg-link more" href="../pages-kuhnya/summary.html#s=all">Екранът ' + ic("arrow-up-right", 18) + '</a></div>' +
    busy + sh + so + '</section>'; }

/* подредбата: на телефон „Проблеми сега“ (ако има) е над пулса, за да е „Първо това“ с бутона над долната лента; на компютър пулсът е горе на цялата ширина */
var showAll = false;
function render(){ var c = MG.counts(), P = MG.problems(), W = MG.waits(), has = P.some(function(x){ return !x.done; });
  main.innerHTML = '<div class="now-grid' + (has ? ' has-probs' : '') + '">' + '<div class="now-day">' + MG.statusLine() + '</div><div class="now-pulse">' + pulse(c) + '</div>' + problems(P) + waits(W) + kitchen() + '</div>'; }
MG.onRender(render);

/* ---------- действия ---------- */
function callByNo(no, why){ var o = MG.order(no); if (!o) return;
  if (why === "out"){ var out = A.soldOutToday(), bad = o.lines.filter(function(l){ return out.indexOf(l.id) > -1; }).map(function(l){ return SC.byId[l.id].n; });
    MG.callSheet(o, "Изчерпано днес: " + bad.join(", ") + ". Предложи друго ястие или откажи само него.", "out:" + o.no); }
  else MG.callSheet(o, "Закъснява " + SH.lateMin(o) + "\u00a0мин" + (o.status === "on_way" ? ", на път с " + (o.driver || "шофьор") : ", още в кухнята") + ". Кажи на клиента новото време.", "late:" + o.no); }
function askSheet(id){ var s = MG.shift(), a = (s.asks || []).filter(function(x){ return x.id === id; })[0]; if (!a) return; var o = MG.order(a.no);
  var sh = MG.sheet({title:"Адрес извън зоните", html:'<p>' + esc(a.driver) + ' пита какво да прави с <b>№ ' + esc(a.no) + '</b>. Адресът е извън зоните за доставка.</p>' +
    (o ? '<div class="mg-kv"><span>Адрес</span><b>' + esc(o.addr || "") + '</b></div><div class="mg-kv"><span>Клиент</span><b>' + esc(o.name || "") + '</b></div><div class="mg-kv"><span>Плащане</span><b>' + esc({cash:"В брой", card:"Карта при получаване", voucher:"Ваучер"}[o.pay] || "") + '</b></div>' : '') +
    '<p class="mg-note">' + ic("info", 16) + 'В системата шофьорът вижда отговора в своето приложение.</p>',
    foot:'<button class="pill pill-line pill-lg" type="button" data-r="back">' + ic("storefront", 22) + 'Върни я в ресторанта</button><button class="pill pill-red pill-lg" type="button" data-r="go">' + ic("moped", 22) + 'Да я достави</button>'});
  sh.foot.addEventListener("click", function(e){ var b = e.target.closest("[data-r]"); if (!b) return; sh.close(); MG.answerAsk(id, b.dataset.r === "go" ? "да достави поръчката" : "да върне поръчката в ресторанта"); }); }
function blockSheet(ph){ var bl = A.data.get("blocks", {}) || {}, b = bl[ph]; if (!b) return;
  var sh = MG.sheet({title:"Неявили се: реши", html:'<p><b>' + esc(b.name || "Клиент") + '</b> не дойде ' + (b.count || 2) + ' пъти без да се обади (' + esc(A.maskPhone(ph)) + ').</p><p>Ако блокираш номера, резервацията от сайта иска обаждане до ресторанта. Отблокира се от „Резервации“ в админа.</p>',
    foot:'<button class="pill pill-line pill-lg" type="button" data-b="no">Не блокирай</button><button class="pill pill-red pill-lg" type="button" data-b="yes">' + ic("lock", 22) + 'Блокирай номера</button>'});
  sh.foot.addEventListener("click", function(e){ var x = e.target.closest("[data-b]"); if (!x) return; sh.close(); MG.decideBlock(ph, x.dataset.b === "yes"); }); }
function busySheet(){ var k = A.settings().kitchen;
  MG.confirm({title:"Включи „Натоварено“?", ok:"Включи", icon:"hourglass",
    html:'<p>Новите поръчки за доставка получават +' + (k.etaBusyMin - k.etaMin) + NB + 'мин. Приетите пазят своя час.</p><div class="mg-cmp"><div><span>Сега гостите виждат</span><b>около' + NB + k.etaMin + NB + 'мин</b></div><div class="now"><span>След включване</span><b>Възможни са закъснения · около' + NB + k.etaBusyMin + NB + 'мин</b></div></div>' +
      '<p class="mg-note">' + ic("info", 16) + '<span>В системата сайтът, кухнята и админът показват това веднага; кой и кога го е включил се пише в дневника.</span></p>'},
    function(){ MG.setBusy(true); }); }
main.addEventListener("click", function(e){ var j = e.target.closest("[data-jump]"); if (j){ e.preventDefault(); var t = document.getElementById(j.dataset.jump); t && t.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  var b = e.target.closest("[data-a]"); if (!b) return; var a = b.dataset.a;
  if (a === "allp"){ showAll = true; render(); MG.tick(); return; }
  if (a === "go") MG.takeCall(b.dataset.id, MG.who());
  if (a === "assign"){ var c = MG.shift().calls.filter(function(x){ return x.id === b.dataset.id; })[0]; if (c) MG.pickWaiter("Маса " + c.n + ": кой отива?", MG.waiterOf(c.n), function(name){ MG.takeCall(c.id, name); }); }
  if (a === "qr") MG.confirmQR(b.dataset.id);
  if (a === "qrassign"){ var q = MG.shift().qr.filter(function(x){ return x.id === b.dataset.id; })[0]; if (q) MG.pickWaiter("QR поръчка на Маса " + q.n + ": кой потвърждава?", MG.waiterOf(q.n), function(name){ if (name === MG.who()) MG.confirmQR(q.id); else MG.assignQR(q.id, name); }); }
  if (a === "ask") askSheet(b.dataset.id);
  if (a === "callc") callByNo(b.dataset.no, b.dataset.why);
  if (a === "seen") MG.ack("late:" + b.dataset.no, "№ " + b.dataset.no + ": видяно, кухнята е предупредена", "order.note", b.dataset.no, "видяно");
  if (a === "accept") MG.accept(b.dataset.no);
  if (a === "confirm") MG.confirmRes(b.dataset.id);
  if (a === "block") blockSheet(b.dataset.ph);
  if (a === "back") MG.backIn(b.dataset.id);
});
main.addEventListener("change", function(e){ var t = e.target; if (!t.matches("[data-busy]")) return;
  if (t.checked){ t.checked = false; busySheet(); } else MG.setBusy(false); });

MG.onHash = function(h){ if (h.n) setTimeout(function(){ MG.see(h.n); }, 60); if (h.go){ var el = document.getElementById(h.go); el && setTimeout(function(){ el.scrollIntoView({block:"start"}); }, 60); } };
MG.onHash(A.hash);
})();
</script>
</body>
</html>
