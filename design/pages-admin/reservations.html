<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Резервации | Siracusa · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_admin.css">
<style>
.rs{display:grid; gap:16px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:1000px){ .rs{grid-template-columns:344px minmax(0,1fr); align-items:start} .rs-side{position:sticky; top:96px} }
.rs-side{display:grid; gap:12px; min-width:0}
.rs-main{min-width:0; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-content:start}
/* календар */
.cal{padding:14px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow)}
.cal-h{display:flex; align-items:center; gap:4px; margin-bottom:6px}
.cal-h b{flex:1; font-size:18px; letter-spacing:-.02em; padding-left:6px}
.cal-h .iconbtn{background:transparent}
.cal-g{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:0; text-align:center}
.cal-g .dw{font-size:14px; font-weight:700; color:var(--muted); padding:4px 0}
.cal-g button{position:relative; min-height:48px; min-width:44px; border:0; border-radius:16px; background:transparent; color:var(--ink); font-weight:700; font-size:16px; cursor:pointer; font-variant-numeric:tabular-nums; display:grid; place-items:center; padding:0}
.cal-g button:hover{background:var(--surface-2)}
.cal-g button.out{color:var(--muted); opacity:.55}
.cal-g button.today{box-shadow:inset 0 0 0 2px var(--red)}
.cal-g button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.cal-g button .dots{position:absolute; bottom:5px; left:50%; transform:translateX(-50%); display:flex; gap:2px}
.cal-g button .dots i{width:5px; height:5px; border-radius:50%; background:var(--red)}
.cal-g button[aria-pressed="true"] .dots i{background:var(--ember)}
.cal-g button.past .dots i{background:var(--muted)}
.cal-foot{display:flex; gap:8px; margin-top:8px}
.cal-foot .pill{flex:1}
/* лента с дни (телефон) */
.days{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:6px 16px 22px; -webkit-mask-image:linear-gradient(to right, var(--ink) calc(100% - 40px), transparent); mask-image:linear-gradient(to right, var(--ink) calc(100% - 40px), transparent); margin:0 -16px; scroll-padding:0 16px}
.days::-webkit-scrollbar{display:none}
.days button{flex:none; width:66px; min-height:84px; border:0; border-radius:20px; background:var(--surface); box-shadow:var(--hi), var(--shadow); color:var(--ink); cursor:pointer; display:grid; place-items:center; align-content:center; gap:0; font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; position:relative}
.days button small{font-size:14px; font-weight:700; color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.days button[aria-pressed="true"] small{color:var(--bg); opacity:.75}
.days button .n{font-size:14px; font-weight:700; color:var(--muted); line-height:1.2}
.days button[aria-pressed="true"] .n{color:var(--bg); opacity:.75}
.days button .nw{position:absolute; top:8px; right:8px; width:9px; height:9px; border-radius:50%; background:var(--red)}
.days button.cal{width:auto; padding:0 16px; font-size:15px; grid-auto-flow:row}
.cal-wrap{display:none}
.rs-phone{display:grid; grid-template-columns:minmax(0,1fr); gap:10px}
@container page (min-width:1000px){ .rs-phone{display:none} .cal-wrap{display:block} }
/* ден */
.dayh{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 16px}
.dayh h2{margin:0; font-size:28px; letter-spacing:-.035em; line-height:1.1; flex:1 1 auto}
.dayh h2 small{display:block; font-size:15px; letter-spacing:0; color:var(--muted); font-weight:700; margin-bottom:4px}
.kpis{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:0; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); overflow:hidden}
@container page (min-width:720px){ .kpis{grid-template-columns:repeat(4, minmax(0,1fr))} }
.kpi{padding:14px 16px; display:grid; gap:2px; box-shadow:inset -1px -1px 0 var(--line)}
.kpi b{font-size:30px; letter-spacing:-.04em; line-height:1.1; font-variant-numeric:tabular-nums}
.kpi span{font-size:14px; font-weight:700; color:var(--muted)}
.kpi.hot b{color:var(--red)}
/* натоварване по час */
.load{padding:14px 16px 10px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow)}
.load-h{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; align-items:baseline; margin-bottom:10px}
.load-h b{font-size:16px}
.load-h small{font-size:14px; color:var(--muted); font-weight:600}
.bars{display:grid; grid-template-columns:repeat(22, minmax(0,1fr)); gap:3px; align-items:end; height:84px}
.bars span{display:block; border-radius:4px 4px 2px 2px; background:var(--surface-3); min-height:4px; position:relative}
.bars span.now{background:var(--red)}
.bars span.pk{background:var(--ink)}
.bars-x{display:grid; grid-template-columns:repeat(22, minmax(0,1fr)); gap:3px; margin-top:6px; font-size:14px; color:var(--muted); font-weight:700}
.bars-x span{grid-column:span 4; white-space:nowrap}
.bars-x span:last-child{grid-column:span 2; text-align:right}
/* филтри и списък */
.rs-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.rs-bar .sa-tabs{flex:1 1 520px}
.rs-sel{display:none; flex:1 1 160px}
@container page (max-width:699px){ .rs-bar .sa-tabs{display:none} .rs-sel{display:block} }
.rs-bar .sa-field-s{flex:1 1 220px}
.hr{display:grid; grid-template-columns:76px minmax(0,1fr); gap:10px; align-items:start}
.hr > .t{position:sticky; top:84px; padding-top:14px; font-size:20px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.hr > .t small{display:block; font-size:14px; font-weight:700; color:var(--muted); letter-spacing:0}
@container page (max-width:560px){ .hr{grid-template-columns:minmax(0,1fr)} .hr > .t{position:static; padding:6px 2px 0; display:flex; align-items:baseline; gap:10px} }
.hr + .hr{margin-top:6px}
.rlist{display:grid; gap:10px}
.rsv{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 14px; align-items:center; padding:14px 14px 14px 18px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); position:relative; overflow:hidden}
.rsv::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:4px; border-radius:0 4px 4px 0; background:var(--line-strong)}
.rsv.s-new::before{background:var(--ember)}
.rsv.s-confirmed::before{background:var(--ink)}
.rsv.s-seated::before{background:var(--ok)}
.rsv.s-no_show::before{background:var(--red)}
.rsv.s-cancelled{opacity:.72}
.rsv.s-cancelled .who{text-decoration:line-through; text-decoration-color:var(--line-strong)}
.rsv .who{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px}
.rsv .who b{font-size:18px; letter-spacing:-.015em}
.rsv .who .ph{font-size:15px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
.rsv .meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.rsv .meta .sa-tag .ic{color:var(--ink)}
.rsv .note{margin:8px 0 0; font-size:15px; color:var(--muted); display:flex; gap:6px; align-items:flex-start}
.rsv .note .ic{flex:none; margin-top:2px}
.rsv .acts{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end}
.rsv .acts .pill{padding:0 14px}
@container page (max-width:640px){ .rsv{grid-template-columns:minmax(0,1fr)} .rsv .acts{justify-content:stretch} .rsv .acts .pill{flex:1 1 auto} .rsv.compact{grid-template-columns:minmax(0,1fr) auto; align-items:start} .rsv.compact .acts .pill{flex:none} }
.side-only{display:none} .main-only{display:grid}
@container page (min-width:1000px){ .side-only{display:grid} .main-only{display:none} }
.st{display:inline-flex; align-items:center; gap:6px; min-height:28px; padding:0 10px; border-radius:999px; font-size:14px; font-weight:800; white-space:nowrap}
.st-new{background:var(--ember); color:var(--on-ember)}
.st-confirmed{background:var(--ink); color:var(--bg)}
.st-seated{background:var(--ok); color:var(--on-ok)}
.st-no_show{background:var(--red); color:var(--on-red)}
.st-cancelled{background:var(--surface-2); color:var(--muted)}
.st-waitlist{box-shadow:inset 0 0 0 1.5px var(--line-strong); color:var(--ink)}
.late{color:var(--warn); font-weight:800; font-size:14px; display:inline-flex; align-items:center; gap:4px}
/* странични карти */
.box{padding:16px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); display:grid; gap:10px}
.box h3{margin:0; font-size:18px; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.box h3 .ic{color:var(--red)}
.box h3 .c{margin-left:auto; min-width:26px; height:26px; padding:0 7px; border-radius:13px; background:var(--surface-2); font-size:14px; display:grid; place-items:center}
.box p{margin:0; font-size:15px; color:var(--muted)}
.bi{display:grid; gap:8px; padding:12px 0 0; border-top:1px solid var(--line)}
.bi .l1{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline}
.bi .l1 b{font-size:16px}
.bi .l1 span{font-size:15px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums}
.bi .row{flex-wrap:wrap; gap:6px}
.bi .row .pill{flex:1 1 auto; padding:0 14px}
/* лист */
.kvs .kv b{font-weight:700; white-space:nowrap}
.kvs .kv span{color:var(--muted); text-align:right}
.seg-st{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px}
.seg-st button{min-height:52px; border:0; border-radius:16px; background:var(--surface-2); color:var(--ink); font-weight:800; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px}
.seg-st button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.form{display:grid; gap:14px}
.form .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@container app (max-width:440px){ .form .two{grid-template-columns:1fr} }
.form input[type=date]{min-height:52px}
.form .err{font-size:14px; color:var(--danger); font-weight:700}
/* листове: дългите думи в долните бутони се пренасят, не излизат извън листа */
.sa-sfoot .pill{white-space:normal; text-align:center; line-height:1.15; padding:0 14px}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_admin.js"></script>
<script src="_seed-orders.js"></script>
<script src="_seed-res.js"></script>
<script src="_pencil.js"></script>
<script>
(function(){
var ic = A.ic, esc = A.esc, st = A.st;
A.liveHash = true;
var body = A.mount({section:"reservations", title:"Резервации",
  sub:"Денят по часове: кой идва, на коя маса, с какъв повод. Потвърдете новите, отбележете дошлите и неявилите се; два пъти „Неявили се“ предлагат номера за блокиране.",
  actions:'<button class="pill pill-red" type="button" data-new>' + ic("plus",20) + 'Нова резервация</button>',
  states:[["","Обичайно"],["loading","Зареждане"],["empty","Празен ден"],["error","Грешка"],["offline","Без връзка"]]});
if (!body) return;

/* ---------- време: часът на прототипа A.now() (по подразбиране 19:42) ---------- */
var now = A.now || function(){ return new Date(); }, SD = A.seed;
var TODAY = SD.today(), NOWM = SD.nowMin();
function ymd(d){ return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0"); }
function parse(k){ var p = k.split("-").map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2], 10)); }
function addD(k, n){ var d = parse(k); d.setUTCDate(d.getUTCDate() + n); return ymd(d); }
function fdate(k, short){ return A.fmtDate(parse(k), short); }
function toM(t){ return +t.slice(0, 2) * 60 + +t.slice(3); }
function hm(m){ return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
var SLOTS = []; for (var m0 = 660; m0 <= 1290; m0 += 30) SLOTS.push(hm(m0)); /* 11:00-21:30 през 30 мин (OPEN-QUESTIONS 18) */

/* ---------- маси, настройки, примерни данни: _seed-res.js (един източник за таблото и разделите) ---------- */
var TABLES = SD.tables().tables.filter(function(t){ return !t.off; });
function tab(id){ return TABLES.filter(function(t){ return t.id === id; })[0]; }
var SET = A.data.get("settings", SD.SETTINGS), DUR = SET.resMinutes || 120, NOSHOW = SET.noShowLimit || 2;
var ZN = {salon:"Салон", garden:"Градина"};
var fmtPh = SD.fmtPhone, maskPh = SD.maskPhone;
var OCC = ["Рожден ден","Имен ден","Годишнина","Делова среща","Друго"];
var RES = SD.reservations(), BL = A.data.get("blocks", {});
function save(){ A.data.set("reservations", RES); }
function saveBL(){ A.data.set("blocks", BL); }
var CAN_BLOCK = A.me.role === "admin" || A.me.role === "owner" || A.me.role === "manager";

/* ---------- изглед ---------- */
var SN = {"new":"Нова", confirmed:"Потвърдена", seated:"Дошли", no_show:"Неявили се", cancelled:"Отказана", waitlist:"Чака маса"};
var SI = {"new":"sparkle", confirmed:"check", seated:"check-circle", no_show:"warning-circle", cancelled:"x", waitlist:"hourglass"};
var day = /^\d{4}-\d{2}-\d{2}$/.test(A.hash.d || "") ? A.hash.d : TODAY, flt = A.hash.f || "", q = "", month = day.slice(0, 7);
var revealed = {};
function ofDay(d){ return st === "empty" && d === day ? [] : RES.filter(function(r){ return r.date === d; }); }
function noShows(phone){ return RES.filter(function(r){ return r.phone === phone && r.status === "no_show"; }).length; }
function visits(phone){ return RES.filter(function(r){ return r.phone === phone && r.status === "seated"; }).length; }
function takenAt(d, t, except){ var a = toM(t); return RES.filter(function(r){ return r.date === d && r.table && r.id !== except && ["cancelled","no_show","waitlist"].indexOf(r.status) < 0 && toM(r.time) < a + DUR && a < toM(r.time) + (r.dur || DUR); }).map(function(r){ return r.table; }); }
function lateBy(r){ if (r.date !== TODAY || r.status !== "confirmed") return 0; var l = NOWM - toM(r.time); return l >= 15 ? l : 0; }
function stTag(s){ return '<span class="st st-' + s + '">' + ic(SI[s],16) + SN[s] + '</span>'; }

function calHTML(){ var y = +month.slice(0, 4), mo = +month.slice(5, 7) - 1, first = new Date(Date.UTC(y, mo, 1, 10)), off = (first.getUTCDay() + 6) % 7, start = addD(ymd(first), -off), h = '';
  var dim = new Date(Date.UTC(y, mo + 1, 0, 10)).getUTCDate(), cells = Math.ceil((off + dim) / 7) * 7;
  for (var i = 0; i < cells; i++){ var k = addD(start, i), L = RES.filter(function(r){ return r.date === k && r.status !== "cancelled"; }).length, inM = k.slice(0, 7) === month;
    h += '<button type="button" data-day="' + k + '" class="' + (inM ? '' : 'out ') + (k === TODAY ? 'today ' : '') + (k < TODAY ? 'past' : '') + '" aria-pressed="' + (k === day) + '" aria-label="' + fdate(k) + (L ? ', ' + A.plural(L, "резервация", "резервации") : ', няма резервации') + '">' + +k.slice(8) + (L ? '<span class="dots" aria-hidden="true">' + '<i></i>'.repeat(Math.min(3, Math.ceil(L / 4))) + '</span>' : '') + '</button>'; }
  return '<div class="cal" data-edit-id="admin.reservations.calendar"><div class="cal-h"><b>' + SC.MONTHS[mo].replace(/^./, function(c){ return c.toUpperCase(); }) + ' ' + y + '</b><button class="iconbtn" type="button" data-mon="-1" aria-label="Предишен месец">' + ic("caret-left",22) + '</button><button class="iconbtn" type="button" data-mon="1" aria-label="Следващ месец">' + ic("caret-right",22) + '</button></div>' +
    '<div class="cal-g" role="group" aria-label="Дни">' + ["пн","вт","ср","чт","пт","сб","нд"].map(function(d){ return '<span class="dw" aria-hidden="true">' + d + '</span>'; }).join("") + h + '</div>' +
    '<div class="cal-foot"><button class="pill pill-soft" type="button" data-day="' + TODAY + '">Днес</button><button class="pill pill-soft" type="button" data-day="' + addD(TODAY, 1) + '">Утре</button></div></div>'; }
function daysHTML(){ var h = ''; for (var i = -1; i <= 6; i++){ var k = addD(day < TODAY ? day : TODAY, i), L = RES.filter(function(r){ return r.date === k && r.status !== "cancelled" && r.status !== "waitlist"; }).length, nw = RES.filter(function(r){ return r.date === k && r.status === "new"; }).length, s = A.sofia(parse(k));
    h += '<button type="button" data-day="' + k + '" aria-pressed="' + (k === day) + '" aria-label="' + fdate(k) + ', ' + A.plural(L, "резервация", "резервации") + (nw ? ', ' + nw + ' чакат потвърждение' : '') + '"><small>' + (k === TODAY ? 'днес' : A.DAYS[s.dow]) + '</small>' + s.d + '<span class="n" aria-hidden="true">' + (L ? L + ' рез.' : 'няма') + '</span>' + (nw ? '<span class="nw" aria-hidden="true"></span>' : '') + '</button>'; }
  return '<div class="days" role="group" aria-label="Ден">' + h + '<button class="cal" type="button" data-calsheet>' + ic("calendar-blank",22) + 'Календар</button></div>'; }
function waitHTML(sfx){ sfx = sfx || ''; var W = ofDay(day).filter(function(r){ return r.status === "waitlist"; });
  return '<section class="box" aria-labelledby="wl-h' + sfx + '" data-edit-id="admin.reservations.waitlist"><h3 id="wl-h' + sfx + '">' + ic("hourglass",20) + 'Чакащи<span class="c">' + W.length + '</span></h3>' +
    (W.length ? '<p>Няма свободна маса за техния час. Щом се освободи, дайте им маса и им се обадете.</p>' + W.map(function(r){ return '<div class="bi"><div class="l1"><b>' + esc(r.name) + '</b><span>' + r.time + ' · ' + A.plural(r.people, "човек", "души") + '</span></div><div class="row"><button class="pill pill-red" type="button" data-seat-wl="' + r.id + '">' + ic("chair",18) + 'Дай маса</button><button class="pill pill-line" type="button" data-open="' + r.id + '">Детайли</button></div></div>'; }).join("")
      : '<p>Никой не чака за ' + (day === TODAY ? 'днес' : fdate(day)) + '.</p>') + '</section>'; }
function blockHTML(sfx){ sfx = sfx || ''; var keys = Object.keys(BL), pend = keys.filter(function(k){ return BL[k].status === "pending"; }), blk = keys.filter(function(k){ return BL[k].status === "blocked"; });
  function item(k){ var b = BL[k];
    return '<div class="bi"><div class="l1"><b>' + esc(b.name || "Без име") + '</b><span>' + maskPh(k) + '</span><span>' + (b.manual ? 'добавен ръчно' : A.plural(b.count || noShows(k), "неявяване", "неявявания")) + '</span></div>' +
      (b.status === "pending" ? '<div class="row"><button class="pill pill-red" type="button" data-bl="block" data-ph="' + k + '"' + (CAN_BLOCK ? '' : ' disabled') + '>' + ic("lock",18) + 'Блокирай</button><button class="pill pill-line" type="button" data-bl="dismiss" data-ph="' + k + '"' + (CAN_BLOCK ? '' : ' disabled') + '>Не блокирай</button></div>'
        : '<p>Блокиран ' + A.ago(b.at) + (b.by ? ' от ' + esc(b.by) : '') + '. Не може да резервира онлайн и да прави профил.</p><div class="row"><button class="pill pill-line" type="button" data-bl="unblock" data-ph="' + k + '"' + (CAN_BLOCK ? '' : ' disabled') + '>' + ic("arrow-counter-clockwise",18) + 'Отблокирай</button></div>') + '</div>'; }
  return '<section class="box" aria-labelledby="bl-h' + sfx + '" data-edit-id="admin.reservations.blocks"><h3 id="bl-h' + sfx + '">' + ic("lock",20) + 'Блокиране<span class="c">' + (pend.length + blk.length) + '</span></h3>' +
    '<p>След ' + A.plural(NOSHOW, "неявяване", "неявявания") + ' номерът чака решение. Блокира и отблокира управителят (или собственикът и главният админ).</p>' +
    (!CAN_BLOCK ? '<p style="color:var(--ink);display:flex;gap:8px;align-items:flex-start">' + ic("info",18) + '<span>Ролята „' + esc(A.roleName(A.me.role)) + '“ само вижда списъка.</span></p>' : '') +
    (pend.length ? '<p style="color:var(--ink);font-weight:800;margin-top:4px">Чакат решение</p>' + pend.map(item).join("") : '') +
    (blk.length ? '<p style="color:var(--ink);font-weight:800;margin-top:4px">Блокирани</p>' + blk.map(item).join("") : '') +
    (!pend.length && !blk.length ? '<p>Няма блокирани номера.</p>' : '') +

/* ---------- блокиране ---------- */
function blockAct(act, ph){ var was = JSON.stringify(BL), b = BL[ph], who = b.name || maskPh(ph);
  if (act === "block"){ b.status = "blocked"; b.at = now().toISOString(); b.by = A.me.name; A.audit("customer.block", "Блокиран номер " + maskPh(ph) + " (" + who + ")", ph); }
  else if (act === "dismiss"){ delete BL[ph]; A.audit("customer.block", "Не е блокиран: " + maskPh(ph) + " (" + who + ")", ph); }
  else { delete BL[ph]; A.audit("customer.unblock", "Отблокиран номер " + maskPh(ph) + " (" + who + ")", ph); }
  saveBL(); draw(); A.toast(act === "block" ? who + " е блокиран" : act === "dismiss" ? who + " не е блокиран" : who + " е отблокиран", {undo:function(){ BL = JSON.parse(was); saveBL(); draw(); }}); }
function addBlock(){ var s = A.sheet({title:"Добави номер за блокиране", html:'<div class="form"><div class="field"><label for="ba-p">Телефон</label><input class="input" id="ba-p" type="tel" inputmode="tel" placeholder="0888 12 34 56"></div><div class="field"><label for="ba-r">Причина</label><input class="input" id="ba-r" placeholder="Например: неявяване без обаждане"></div><p class="muted" style="margin:0;font-size:15px">Блокираният номер не може да резервира онлайн и да прави профил. Списъкът се описва в политиката за поверителност (срок на пазене: ' + A.missing("срок") + ').</p></div>',
    foot:'<button class="pill pill-line pill-lg" type="button" data-x>Откажи</button><button class="pill pill-red pill-lg" type="button" data-ok>' + ic("lock",22) + 'Блокирай</button>', focus:"#ba-p"});
  s.foot.querySelector("[data-x]").onclick = s.close;
  s.foot.querySelector("[data-ok]").onclick = function(){ var el = s.body.querySelector("#ba-p"), ph = el.value.replace(/\D/g, "").replace(/^359/, "0"), f = el.closest(".field"), e = f.querySelector(".err");
    if (!/^0\d{9}$/.test(ph)){ if (!e){ e = document.createElement("span"); e.className = "err"; f.appendChild(e); } e.textContent = "Телефонът трябва да е 10 цифри, например 0888 12 34 56."; el.setAttribute("aria-invalid", "true"); el.focus(); return; }
    var g = RES.filter(function(r){ return r.phone === ph; })[0]; BL[ph] = {status:"blocked", name:g ? g.name : "", count:noShows(ph), at:now().toISOString(), by:A.me.name, manual:true, reason:s.body.querySelector("#ba-r").value.trim()}; saveBL(); s.close(); draw();
    A.audit("customer.block", "Блокиран ръчно: " + maskPh(ph), ph); A.toast("Номерът " + maskPh(ph) + " е блокиран", {undo:function(){ delete BL[ph]; saveBL(); draw(); }}); }; }

/* ---------- събития ---------- */
document.addEventListener("click", function(e){ var t;
  if ((t = e.target.closest("[data-day]"))){ day = t.dataset.day; month = day.slice(0, 7); hashSync(); draw(); if (t.closest(".sheet")){ var w = t.closest(".sheetwrap"); w && w.querySelector("[data-close]").click(); } return; }
  if ((t = e.target.closest("[data-mon]"))){ var y = +month.slice(0, 4), mo = +month.slice(5, 7) - 1 + +t.dataset.mon; var d = new Date(Date.UTC(y, mo, 1, 10)); month = ymd(d).slice(0, 7); var inSheet = t.closest(".sheet"); if (inSheet){ inSheet.querySelector(".body").innerHTML = calHTML(); } else draw(); return; }
  if (e.target.closest("[data-calsheet]")){ A.sheet({title:"Изберете ден", html:calHTML()}); return; }
  if ((t = e.target.closest("[data-flt]"))){ flt = t.dataset.flt; hashSync(); draw(); var b = body.querySelector('[data-flt="' + flt + '"]'); b && b.focus({preventScroll:true}); return; }
  if ((t = e.target.closest("[data-st]"))){ setStatus(byId(t.dataset.id), t.dataset.st); return; }
  if ((t = e.target.closest("[data-open]"))){ openRes(byId(t.dataset.open)); return; }
  if ((t = e.target.closest("[data-seat-wl]"))){ seatWaitlist(byId(t.dataset.seatWl)); return; }
  if ((t = e.target.closest("[data-bl]"))){ if (!t.disabled) blockAct(t.dataset.bl, t.dataset.ph); return; }
  if (e.target.closest("[data-bladd]")){ addBlock(); return; }
  if (e.target.closest("[data-new]")){ newRes(); return; }
});
body.addEventListener("change", function(e){ if (e.target.matches("[data-fsel]")){ flt = e.target.value; hashSync(); draw(); var x = body.querySelector("[data-fsel]"); x && x.focus({preventScroll:true}); } });
body.addEventListener("input", function(e){ if (e.target.id !== "rs-q") return; q = e.target.value; var pos = e.target.selectionStart; draw(); var i = body.querySelector("#rs-q"); i.focus(); try{ i.setSelectionRange(pos, pos); }catch(x){} });
})();
</script>
</body>
</html>
