<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Табло | Siracusa · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_admin.css">
<style>
/* status line under the greeting */
.db-st{display:inline-flex; align-items:center; gap:10px; margin-top:14px; min-height:44px; padding:0 16px 0 14px; border-radius:999px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); font-size:16px; color:var(--muted); font-weight:600}
.db-st b{color:var(--ink)}
.db-st .dot{width:10px; height:10px; border-radius:50%; background:var(--off); flex:none}
.db-st .dot.ok{background:var(--ok)} .db-st .dot.warn{background:var(--warn)}

/* today: one shell, four cores */
.kpis{display:grid; gap:6px; grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis.n1{grid-template-columns:minmax(0,1fr)}
@container page (max-width:899px){ .kpis.n3 > .kpi:last-child{grid-column:1/-1} }
@container page (min-width:900px){ .kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} }
.kpi .sm{display:none}
@container page (max-width:520px){ .kpi .lg{display:none} .kpi .sm{display:inline} }
.kpi{min-width:0; display:grid; align-content:space-between; gap:14px; min-height:168px; padding:18px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); text-decoration:none; color:inherit; transition:transform var(--t-base) var(--ease)}
.kpi:hover{transform:translateY(-2px)}
.kpi:active{transform:scale(.98)}
.kpi .lb{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; color:var(--muted); line-height:1.25}
.kpi .lb .ic{color:var(--red)}
.kpi .v{font-size:52px; line-height:.95; letter-spacing:-.05em; font-weight:800; font-variant-numeric:tabular-nums}
.kpi .ft{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:15px; color:var(--muted); font-weight:600; min-height:28px}
.kpi .sa-tag{white-space:normal; text-align:left}
.kpi.hot{background:var(--ink); color:var(--bg)}
.kpi.hot .lb, .kpi.hot .ft{color:var(--bg); opacity:.85}
.kpi.hot .sa-tag{color:inherit; box-shadow:inset 0 0 0 1.5px currentColor}
.kpi.hot .lb .ic{color:inherit}
@container page (max-width:420px){ .kpi{min-height:150px; padding:16px} .kpi .v{font-size:44px} }

.db-wait{margin-bottom:8px}
.waits{display:grid; gap:8px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:900px){ .waits{grid-template-columns:repeat(2,minmax(0,1fr))} }
.wt{display:flex; align-items:center; gap:14px; min-height:76px; padding:12px 12px 12px 16px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); text-decoration:none; color:inherit; transition:transform var(--t-base) var(--ease)}
.wt:hover{transform:translateY(-2px)}
.wt .si{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--red); flex:none}
.wt .tx{flex:1; min-width:0; display:grid; gap:2px}
.wt b{display:flex; align-items:center; gap:8px; font-size:17px; line-height:1.25}
.wt b .sa-n{min-width:28px; height:28px; border-radius:14px; font-size:15px}
.wt small{font-size:15px; color:var(--muted); font-weight:600}
.wt .wgo{flex:none; min-height:48px; padding:0 14px 0 18px; font-size:16px; gap:4px}
@container page (max-width:420px){ .wt{flex-wrap:wrap} .wt .wgo{width:100%; justify-content:center} }
.wt-ok{display:flex; align-items:center; gap:12px; min-height:64px; padding:12px 18px; border-radius:var(--r-core); background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--line); font-size:17px}
.wt-ok .ic{color:var(--ok); flex:none}
.db-today{margin-top:28px}
.kpi .sum{font-size:40px; letter-spacing:-.04em; white-space:nowrap}
@container page (max-width:520px){ .kpi .sum{font-size:30px} }
@container page (min-width:900px){ .db-today{margin-top:36px} }
.no-rise .sa-rise{animation:none}
/* modules */
.mods{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:620px){ .mods{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container page (min-width:1000px){ .mods{grid-template-columns:repeat(3,minmax(0,1fr))} }
.mod{display:flex; flex-direction:column; padding:6px; border-radius:var(--r-shell); background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}
.mod .vis{position:relative; height:172px; padding-top:30px; /* рисунката под значката „N екрана“ */ border-radius:22px; overflow:hidden; display:grid; place-items:center; background:radial-gradient(120% 120% at 70% 0%, var(--plate-1), var(--plate-2))}
.mod .vis .cnt{position:absolute; left:12px; top:12px; width:max-content; display:inline-flex; align-items:center; min-height:30px; padding:0 11px; border-radius:999px; background:var(--glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:inset 0 0 0 1px var(--glass-line); font-size:14px; font-weight:800; color:var(--ink)}
.mod .vis .dv{position:absolute; right:14px; top:16px; width:max-content; font-size:14px; font-weight:700; color:var(--muted)}
.mod .body{flex:1; display:grid; gap:8px; align-content:start; padding:16px 14px 6px}
.mod h3{margin:0; font-size:21px; letter-spacing:-.025em; font-weight:800; line-height:1.15; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.mod p{margin:0; color:var(--muted)}
.mod .who{font-size:15px; font-weight:700; color:var(--ink)}
.mod .who span{color:var(--muted); font-weight:600}
.mod .act{padding:10px 8px 8px}
.mod .open{width:100%; justify-content:space-between; padding:0 6px 0 20px; min-height:56px; font-size:17px}
.mod .open .knob{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); transition:transform var(--t-slow) var(--ease)}
.mod .open .sm{display:none}
@container page (max-width:619px){
  .mods{grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
  /* значката с броя екрани стои горе (8-38 px), рисунката под нея: без застъпване и на 360 */
  .mod .vis{height:120px; padding-top:38px} .mod .vis .cnt{top:8px; left:8px} .mod .g{transform:scale(.64)} .mod:hover .g{transform:scale(.64)} .mod .vis .dv{display:none}
  .mod .body{padding:12px 10px 4px; gap:4px} .mod h3{font-size:18px} .mod .body p:not(.who){display:none} .mod .who{font-size:14px}
  .mod .act{padding:8px 4px 4px} .mod .open{padding:0 4px 0 14px; min-height:52px; font-size:16px} .mod .open .lg{display:none} .mod .open .sm{display:inline} .mod .open .knob{width:40px; height:40px}
  .mod.soon .note{display:none}
}
.mod .open:hover .knob{transform:translate(2px,-2px) scale(1.05)}
.mod.soon .vis{background:transparent; box-shadow:inset 0 0 0 2px var(--line-strong); box-shadow:none; border:2px dashed var(--line-strong)}
.mod.soon .note{padding:10px 14px 14px; font-size:15px; color:var(--muted); font-weight:600}
/* device glyphs (pure CSS, token colours) */
.g{position:relative; display:grid; place-items:center; color:var(--red); background:var(--surface); box-shadow:inset 0 0 0 3px var(--ink), var(--shadow); transition:transform var(--t-spring) var(--ease)}
.mod:hover .g{transform:translateY(-4px) rotate(-2deg)}
.g.phone{width:58px; height:104px; border-radius:16px}
.g.phone::before{content:""; position:absolute; top:7px; width:16px; height:4px; border-radius:2px; background:var(--ink)}
.g.tablet{width:132px; height:92px; border-radius:14px}
.g.desktop{width:136px; height:84px; border-radius:10px; margin-bottom:14px}
.g.desktop::after{content:""; position:absolute; bottom:-14px; width:44px; height:9px; border-radius:0 0 8px 8px; background:var(--ink)}
.g.watch{width:74px; height:74px; border-radius:50%}
.g.watch::before, .g.watch::after{content:""; position:absolute; left:50%; width:30px; height:16px; margin-left:-15px; background:var(--ink)}
.g.watch::before{top:-14px; border-radius:6px 6px 0 0} .g.watch::after{bottom:-14px; border-radius:0 0 6px 6px}
.soon .g{box-shadow:inset 0 0 0 3px var(--line-strong); color:var(--muted); background:transparent}
.soon .g::before, .soon .g::after{background:var(--line-strong)}

/* sections: bento of groups */
.groups{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:700px){ .groups{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container page (min-width:1100px){ .groups{grid-template-columns:repeat(3,minmax(0,1fr))} .groups > .grp:last-child:nth-child(3n+1){grid-column:1/-1} .groups > .grp:last-child:nth-child(3n+1) .core{grid-template-columns:repeat(3,minmax(0,1fr))} .groups > .grp:last-child:nth-child(3n+1) .srow + .srow{border-top:0; border-left:1px solid var(--line)} }
.grp{padding:6px; border-radius:var(--r-shell); background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line); align-self:start}
.grp h3{margin:10px 14px 10px; font-size:15px; font-weight:800; color:var(--muted); display:flex; justify-content:space-between}
.grp .core{display:grid}
.srow{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; min-height:72px; padding:12px 14px; text-decoration:none; color:inherit; border:0; background:transparent; width:100%; text-align:left; cursor:pointer; font:inherit}
.srow + .srow{border-top:1px solid var(--line)}
.srow:hover{background:color-mix(in srgb, var(--surface-2) 50%, transparent)}
.srow .si{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--red)}
.srow b{display:block; font-size:16px; font-weight:800; line-height:1.25}
.srow small{display:block; font-size:15px; color:var(--muted); font-weight:600; line-height:1.35; margin-top:2px}
.srow .end{display:flex; align-items:center; gap:6px; color:var(--muted)}
.srow.soon .si{color:var(--muted)}
.mine{display:grid; gap:16px; padding:22px; border-radius:var(--r-core); background:var(--chip-dark); color:var(--on-chip-dark); box-shadow:var(--shadow)}
.mine h2{margin:0; font-size:26px; letter-spacing:-.03em; line-height:1.15}
.mine p{margin:0; color:var(--on-chip-dark); opacity:.85}
@container page (min-width:700px){ .mine{grid-template-columns:1fr auto; align-items:center; padding:28px} }
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_admin.js"></script>
<script src="_seed-orders.js"></script>
<script src="_res-lib.js"></script>
<script src="_seed-res.js"></script>
<script src="_pencil.js"></script>
<script>
(function(){
if (!A.me){ A.mount({}); return; }
var ic = A.ic, esc = A.esc, st = A.st, me = A.me, s = A.sofia();
var hello = s.h >= 5 && s.h < 12 ? "Добро утро" : s.h >= 12 && s.h < 18 ? "Добър ден" : "Добър вечер";
var staffApp = ["waiter","kitchen","driver"].indexOf(me.role) > -1;
/* статус по часа на прототипа (A.now(), по подразбиране 19:42) */
var status = A.status();
var body = A.mount({section:"dashboard", title:hello + ", " + (staffApp || me.role === "kitchen" ? me.name : me.name.split(" ")[0]), eyebrow:"Днес · " + A.fmtDate(A.now()) + " · " + A.hm(A.now()), docTitle:"Табло",
  sub:'<span class="db-st" data-edit-id="admin.dashboard.status"><span class="dot ' + status[0] + '"></span><span>' + status[1] + '</span></span>',
  /* управител и собственик: горе „Отвори приложението“ към своя модул (стъпка 5); сайтът на живо остава до него */
  actions: (A.hasApp() ? '<a class="pill pill-red pill-lg" href="' + A.MODULE_HOME[me.role] + '" data-home="app" data-edit-id="admin.dashboard.openapp">' + ic(A.MOD[me.role].ic,22) + 'Отвори приложението</a>' : '') +
    (A.MOD.site && A.modCan(A.MOD.site) ? '<a class="pill ' + (A.hasApp() ? 'pill-line' : 'pill-ink') + ' pill-lg" href="preview.html#m=site&p=home&d=phone">' + ic("eye",22) + 'Сайтът на живо</a>' : ''),
  states:[["","Обичайно"],["loading","Зареждане"],["empty","Без бележки"],["error","Грешка"],["offline","Без връзка"]]});
if (!body) return;

/* ---------- today: същите ключове като разделите (sa-orders, sa-reservations, sa-soldout, бележките) ---------- */
/* всичко на таблото се смята тук, от общите ключове; draw() се вика наново при нова поръчка */
function draw(){
var outs = A.soldOutToday();
var inWork = A.ordersInWork().length, resToday = A.reservationsToday().length, kitchenOpen = A.minutes() >= 600 && A.minutes() < 1350;
var newNotes = st === "empty" ? 0 : A.notes.count("new");
var SAMPLE = '<span class="sa-tag sample">' + ic("info",16) + '<span class="lg">Примерни данни</span><span class="sm">Примерно</span></span>';
var K = [
  ["orders","Поръчки в работа","receipt", inWork, inWork ? SAMPLE : (kitchenOpen ? "Няма поръчки в работа" : "Кухнята не работи сега"), "orders.html"],
  ["reservations","Резервации днес","calendar-check", resToday, SAMPLE, "reservations.html"],
  ["menu","Изчерпани днес","clock", outs.length, outs.length ? esc(outs.slice(0,2).map(function(id){ return SC.byId[id].n; }).join(", ")) + (outs.length > 2 ? " и още " + (outs.length - 2) : "") : "Всичко е налично", "menu.html#f=out", outs.length > 0]
].filter(function(k){ return A.can(k[0]); });
/* обърната е само плочката, която иска действие сега: изчерпани днес (и нови бележки, ако няма изчерпани) */
K.forEach(function(k){ k[7] = k[0] === "menu" && k[6]; });
/* оборотът днес: само собственик и главен админ (решение 15.11, „Админът, допълнения“ 5) */
if (me.role === "admin" || me.role === "owner"){ var sales = A.todaySales(); K.unshift(["dashboard","Днес","wallet", '<span class="sum">' + SC.fmt(sales.sum) + '</span>', "от " + A.plural(sales.n, "поръчка", "поръчки") + " " + SAMPLE, "reports.html#p=today"]); }
function kpis(){ if (st === "loading") return A.skel(2, "Зареждаме таблото …");
  if (st === "error") return A.error("Не успяхме да заредим числата за днес. Модулите и разделите работят.");
  if (!K.length) return "";
  return '<div class="sa-shell sa-rise" data-edit-id="admin.dashboard.today"><div class="kpis n' + K.length + '">' + K.map(function(k){
    return '<a class="kpi' + (k[7] ? ' hot' : '') + '" href="' + k[5] + '"><span class="lb">' + ic(k[2],20) + k[1] + '</span><span class="v">' + k[3] + '</span><span class="ft">' + k[4] + '</span></a>'; }).join("") + '</div></div>'; }

/* ---------- „Чака те“ (решение 15.11, „Админът, допълнения“ 3): само каквото ролята вижда, всяко с бутон направо към действието ---------- */
function waitHTML(){ if (st === "loading" || st === "error") return "";
  var nw = A.notesWaiting(), CANB = ["admin","owner","manager"].indexOf(me.role) > -1, W = [
    ["orders", A.can("orders"), A.orders().filter(function(o){ return o.status === "accepted"; }).length, "receipt", "Поръчки за приемане", "Нови, още не са започнати", "orders.html#s=accepted", "Приеми", "orders"],
    ["res", A.can("reservations"), A.reservationsToday().filter(function(r){ return r.status === "new"; }).length, "calendar-check", "Резервации за потвърждаване", "Днес, чакат потвърждение", "reservations.html#f=new", "Потвърди"],
    /* главният админ: два реда, всеки с бутон към изгледа със същия брой (нови / за преглед) */
    ["notes", A.isMainAdmin(), st === "empty" ? 0 : (nw.newN || 0), "pencil-simple", "Бележки за одобрение", "Нови бележки и препоръки", "notes.html#s=new", "Одобри"],
    ["review", A.isMainAdmin(), st === "empty" ? 0 : (nw.reviewN || 0), "eye", "Бележки за преглед", "Изпълнени, чакат „Публикувай“", "notes.html#s=review", "Прегледай"],
    ["mine", !A.isMainAdmin(), st === "empty" ? 0 : nw.n, "pencil-simple", "Вашите препоръки", nw.title || "", "notes.html", "Виж"],
    ["noshow", A.can("reservations") && CANB, A.blocksPending(), "warning-circle", "Неявили се за решение", "Две неявявания: блокиране или не", "reservations.html#blocks", "Реши"]
  ].filter(function(x){ return x[1] && x[2] > 0; });
  return '<section class="db-wait sa-rise" data-edit-id="admin.dashboard.waiting" aria-labelledby="db-wait-h"><div class="sa-sh" style="margin-top:0"><h2 id="db-wait-h">Чака те</h2>' + (W.length ? '<p>' + A.plural(W.reduce(function(a0, x){ return a0 + x[2]; }, 0), "нещо", "неща") + ' за действие</p>' : '') + '</div>' +
    (W.length ? '<div class="waits">' + W.map(function(x){ return '<a class="wt" href="' + x[6] + '"' + (x[8] ? ' data-fresh="' + x[8] + '"' : '') + '><span class="si">' + ic(x[3], 22) + '</span><span class="tx"><b><span class="sa-n">' + x[2] + '</span>' + esc(x[4]) + '</b>' + (x[5] ? '<small>' + esc(x[5]) + '</small>' : '') + '</span><span class="wgo pill pill-ink">' + esc(x[7]) + ic("caret-right", 18) + '</span></a>'; }).join("") + '</div>'
      : '<div class="wt-ok">' + ic("check-circle", 24) + '<span><b>Нищо не чака.</b> Всичко е наред.</span></div>') + '</section>'; }

/* ---------- my app (персонал) ---------- */
var app = ["waiter","kitchen","driver"].filter(function(id){ return me.role === id; })[0];
var mine = app ? '<section class="mine sa-rise" data-edit-id="admin.dashboard.myapp"><div><h2>' + (app === "waiter" ? "Приложението на сервитьора" : app === "kitchen" ? "Екранът на кухнята" : "Приложението на шофьора") + '</h2><p>' + ({waiter:"Повикванията, масите, поръчките и сметките.", kitchen:"Опашката на вашата секция, изчерпано днес и „Натоварено“.", driver:"Вашите доставки, маршрутът, горивото и краят на смяната."})[app] + '</p></div><a class="pill pill-red pill-lg" href="' + A.SEC[app].href + '">' + ic(A.SEC[app].ic,22) + 'Отвори приложението</a></section>' : '';

/* ---------- modules ---------- */
var mods = A.MODULES.filter(A.modCan);
function screensN(mm){ return (mm.screens || []).length; }
function glyph(mm){ var d = mm.id === "watch" ? "watch" : mm.dev || "phone"; return '<span class="g ' + d + '">' + ic(mm.ic, 30) + '</span>'; }
var DEV = {phone:"Телефон", tablet:"Таблет", desktop:"Компютър"};
function modCard(mm, i){
  if (mm.soon) return '<article class="mod soon sa-rise d' + (i%4) + '" data-edit-id="admin.dashboard.module.' + mm.id + '"><div class="vis">' + glyph(mm) + '<span class="cnt">Скоро</span></div><div class="body"><h3>' + esc(mm.n) + '</h3><p>' + esc(mm.what) + '</p><p class="who">За: <span>' + esc(mm.who) + '</span></p></div><p class="note">Скоро. Тук ще виждате ' + esc(mm.what.charAt(0).toLowerCase() + mm.what.slice(1)) + '</p></article>';
  var n = screensN(mm);
  return '<article class="mod sa-rise d' + (i%4) + '" data-edit-id="admin.dashboard.module.' + mm.id + '"><div class="vis">' + glyph(mm) + '<span class="cnt">' + A.plural(n, "екран", "екрана") + '</span><span class="dv">' + (mm.id === "watch" ? "Часовник" : DEV[mm.dev] || "") + '</span></div>' +
    '<div class="body"><h3>' + esc(mm.n) + '</h3><p>' + esc(mm.what) + '</p><p class="who">За: <span>' + esc(mm.who) + '</span></p></div>' +
    '<div class="act"><a class="pill pill-line open" href="preview.html#m=' + mm.id + '&p=' + mm.screens[0].k + '&d=' + (mm.dev || "phone") + '" aria-label="Отвори на живо: ' + esc(mm.n) + '"><span class="lg">Отвори на живо</span><span class="sm">На живо</span><span class="knob">' + ic("arrow-up-right",20) + '</span></a></div></article>'; }

/* ---------- sections ---------- */
var KS = A.settings().kitchen, busy = !!KS.busy;
var lunchDay = (function(){ var d = SC.menu.lunch.date.split("-"); return A.fmtDate(new Date(+d[0], +d[1]-1, +d[2], 12)); })();
var ev = SC.events()[0];
var META = {
  dashboard:"Тук сте", orders:A.plural(inWork, "в работа", "в работа") + " · примерни", reservations:A.plural(resToday, "днес", "днес") + " · примерни",
  menu:SC.items.length + " ястия · " + A.plural(outs.length, "изчерпано", "изчерпани") + " днес", lunch:"Последно качено: " + lunchDay,
  offers:A.plural(SC.offers().length, "оферта", "оферти") + " в сайта сега", events:ev ? esc(ev.n) + ", " + A.fmtDate(ev.date, true) : "Няма предстоящи", zones:SC.ZONES.length + " квартала · доставка до 21:00",
  hall:A.activeTables().length + " маси (условни за макета)", qr:A.activeTables().length + " етикета за печат",
  customers:"Примерни данни", staff:A.ACCOUNTS.length + " пробни акаунта", roles:A.DEFAULT_ROLES.length + " роли",
  reports:"Основни отчети", audit:A.plural(A.data.get("audit", []).length, "запис", "записа"), finance:"За собственика",
  notes:newNotes ? A.plural(newNotes, "нова бележка", "нови бележки") : "Няма нови", site:"Модулите на живо", settings:busy ? "Натоварено: около " + KS.etaBusyMin + " мин" : "Доставка: около " + KS.etaMin + " мин"
};
function groups(){ return '<div class="groups" data-edit-id="admin.dashboard.sections">' + A.GROUPS.map(function(g, gi){ var items = g[1].filter(function(id){ return A.can(id) && id !== "dashboard"; }); if (!items.length) return "";
  return '<section class="grp sa-rise d' + (gi%4) + '"><h3>' + esc(g[0]) + '</h3><div class="core">' + items.map(function(id){ var sc = A.SEC[id], meta = META[id] || "";
    var end = sc.soon ? A.soonTag() : (id === "notes" && newNotes ? '<span class="sa-n">' + newNotes + '</span>' : '') + ic("caret-right",20);
    var inner = '<span class="si">' + ic(sc.ic,22) + '</span><span><b>' + esc(sc.n) + '</b><small>' + (sc.soon ? esc(sc.desc) : meta) + '</small></span><span class="end">' + end + '</span>';
    return sc.soon ? '<button class="srow soon" type="button" data-sa="soon" data-id="' + id + '">' + inner + '</button>' : '<a class="srow" href="' + sc.href + '">' + inner + '</a>'; }).join("") + '</div></section>'; }).join("") + '</div>'; }

var html = (st === "offline" ? A.offline("Показваме последно зареденото. Числата за днес не се обновяват.") + '<div style="height:16px"></div>' : '') + mine + waitHTML() +
  (K.length || st === "loading" || st === "error" ? '<div class="sa-sh db-today"><h2>Днес</h2></div>' + kpis() : '');
html += '<div class="sa-sh" id="modules"><h2>Модулите</h2><p>Всеки се отваря на живо в рамка на телефон, таблет или компютър.</p></div>' +
  (st === "loading" ? A.skel(3, "Зареждаме модулите …") : '<div class="mods">' + mods.map(modCard).join("") + '</div>');
var gh = groups();
if (gh.indexOf("srow") > -1) html += '<div class="sa-sh"><h2>Разделите</h2><p>Каквото не е готово, е „Скоро“ с описание.</p></div>' + (st === "loading" ? A.skel(3) : gh);
body.innerHTML = html;
A.markFresh();
}
draw();

A.onNewOrder = function(){ var y = A.scroller.scrollTop; body.classList.add("no-rise"); draw(); A.scroller.scrollTop = y; };
if (location.hash.indexOf("modules") > -1){ var t = document.getElementById("modules"); t && setTimeout(function(){ t.scrollIntoView({block:"start"}); }, 60); }
})();
