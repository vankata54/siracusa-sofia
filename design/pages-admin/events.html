<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Събития | Siracusa · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_admin.css">
<style>
/* Събития (автор 2). Само токени; ширини само с @container page. */
.ev-top{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:0 0 16px}
.ev-top .sa-tabs{flex:0 1 auto}
.ev-top .sp{flex:1}
.ev-cats{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px; margin:0 -2px 16px}
.ev-cats::-webkit-scrollbar{display:none}
.ev-cats .chip .ic{color:var(--muted)}
.ev-cats .chip[aria-pressed="true"] .ic{color:var(--ember)}

.ev-list{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:940px){ .ev-list{grid-template-columns:repeat(2,minmax(0,1fr))} }
.ev{display:grid; grid-template-columns:92px minmax(0,1fr); gap:14px 16px; padding:16px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); align-content:start}
.ev.draft{background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}
.ev-date{display:grid; justify-items:center; align-content:center; gap:0; min-height:104px; border-radius:20px; background:var(--ink); color:var(--bg); text-align:center}
.ev-date small{font-size:14px; font-weight:700; opacity:.85}
.ev-date b{font-size:36px; line-height:1; letter-spacing:-.05em; font-variant-numeric:tabular-nums}
.ev.draft .ev-date{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.ev-b{min-width:0; display:grid; gap:6px; align-content:start}
.ev-tags{display:flex; flex-wrap:wrap; gap:6px}
.ev-tags .ic{color:var(--red)}
.ev-tags .st-pub .ic{color:inherit}
.ev-b h3{margin:0; font-size:21px; letter-spacing:-.03em; line-height:1.2}
.ev-b .when{font-weight:700}
.ev-facts{grid-column:1 / -1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin:0}
.ev-facts div{padding:10px 12px; border-radius:16px; background:var(--surface-2); min-width:0}
.ev.draft .ev-facts div{background:var(--surface)}
.ev-facts dt{font-size:14px; font-weight:700; color:var(--muted)}
.ev-facts dd{margin:0; font-weight:800; overflow-wrap:anywhere; line-height:1.3}
.ev-facts dd .missing{font-weight:600; font-size:15px}
@container page (max-width:520px){ .ev{grid-template-columns:76px minmax(0,1fr)} .ev-date{min-height:88px} .ev-date b{font-size:30px} .ev-facts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .ev-facts div:first-child{grid-column:1 / -1} }
.ev-f{grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding-top:12px; border-top:1px solid var(--line)}
.ev-f .sp{flex:1}
.ev-f .del .ic{color:var(--danger)}
@container page (max-width:520px){ .ev-f .sp{display:none} .ev-f .pill{flex:1 1 auto; padding:0 14px} }
.st-pub{background:var(--ok); color:var(--on-ok)}
.st-draft{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.st-past{background:var(--surface-3); color:var(--ink)}

.ev-help{display:grid; gap:10px; margin-top:24px; padding:18px; border-radius:var(--r-core); border:2px dashed var(--line-strong)}
.ev-help h3{margin:0; font-size:18px; display:flex; align-items:center; gap:8px}
.ev-help ul{margin:0; padding-left:20px; color:var(--muted)}

/* editor sheet */
.ev-form{display:grid; gap:18px; padding:4px 0 8px}
.ev-form .two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.ev-form .grp{display:grid; gap:8px}
.ev-form .seg button{font-size:15px; min-height:48px; padding:0 6px; white-space:normal; line-height:1.15}
.ev-eu{position:relative}
.ev-eu .input{padding-right:40px; font-weight:800}
.ev-eu .u{position:absolute; right:16px; top:15px; font-weight:800; color:var(--muted); pointer-events:none}
.ev-photo{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px; background:var(--surface-2); font-size:15px}
.ev-photo .ic{color:var(--muted)}
.ev-prevh{display:flex; align-items:center; gap:8px; margin:0; font-size:14px; font-weight:700; color:var(--muted)}
.ev-prev{position:relative; display:grid; gap:10px; padding:14px; border-radius:24px; background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--line)}
.ev-prev .pv{position:relative; aspect-ratio:16/8; border-radius:18px; display:grid; place-items:center; background:radial-gradient(120% 90% at 50% 30%, var(--plate-1), var(--plate-2)); color:var(--muted)}
.ev-prev .flag{position:absolute; top:10px; right:10px; display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 12px 0 10px; border-radius:999px; font-size:14px; font-weight:800; background:var(--chip-dark); color:var(--on-chip-dark)}
.ev-prev .flag .ic{color:var(--ember)}
.ev-prev .cap{position:absolute; left:10px; bottom:10px; font-size:14px}
.ev-prev h4{margin:0; font-size:21px; letter-spacing:-.03em; line-height:1.2}
.ev-prev .meta{display:flex; flex-wrap:wrap; gap:4px 12px; color:var(--muted); font-weight:600; font-size:15px}
.ev-prev .go{min-height:52px; font-size:16px; pointer-events:none}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_admin.js"></script>
<script src="_pencil.js"></script>
<script>
(function(){
var ic = A.ic, esc = A.esc, st = A.st;
A.liveHash = true;

var body = A.mount({section:"events", title:"Събития", docTitle:"Събития",
  sub:"Тематични вечери, жива музика и празници. Ново събитие за под 2 минути; страницата в сайта се прави сама.",
  actions:'<button class="pill pill-red pill-lg" type="button" data-new>' + ic("plus",22) + 'Ново събитие</button>',
  states:[["","Обичайно"],["loading","Зареждане"],["empty","Празно"],["error","Грешка"],["offline","Без връзка"]]});
if (!body) return;

var CATI = {"Жива музика":"music-notes","Тематични вечери":"globe","Празници":"confetti","Рождени дни":"cake","Кръщенета":"baby","Юбилеи":"heart","Фирмени партита":"briefcase","Абитуриентски":"star","Детски":"balloon","Частни партита":"users-three"};
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function lastSat(y, m){ var d = new Date(y, m + 1, 0); while (d.getDay() !== 6) d.setDate(d.getDate() - 1); return d; }
function dateOf(s){ return new Date(s + "T10:00:00Z"); }
function long(s){ return A.fmtDate(dateOf(s)); }
var today = A.todayKey();

/* ---------- данни: истинската Гръцка вечер (SC.events) + бъдещите тематични вечери като чернови с [ЛИПСВА] ---------- */
function seed(){ var e = SC.events()[0], d = e.date, out = [{id:e.id, n:e.n, cat:e.cat, date:ymd(d), time:e.time, text:e.text, prog:"", menu:"", price:null, priceMode:"tbd", seats:null, status:"pub", real:true}];
  for (var k = 1; k <= 2; k++){ var n = lastSat(d.getFullYear(), d.getMonth() + k); out.push({id:"tema-" + ymd(n), n:"Тематична вечер", cat:"Тематични вечери", date:ymd(n), time:"19:00", text:"Последната събота на " + SC.MONTHS[n.getMonth()] + ". Коя кухня ще бъде: [ЛИПСВА].", prog:"", menu:"", price:null, priceMode:"tbd", seats:null, status:"draft"}); }
  return out; }
var E = A.data.get("events", null); if (!E){ E = seed(); A.data.set("events", E); }
function save(){ A.data.set("events", E); }
var tab = A.hash.t === "past" ? "past" : "up", cat = A.hash.c || "";
function list(){ if (st === "empty") return []; return E.filter(function(e){ return (tab === "up" ? e.date >= today : e.date < today) && (!cat || e.cat === cat); }).sort(function(a, b){ return tab === "up" ? (a.date < b.date ? -1 : 1) : (a.date < b.date ? 1 : -1); }); }
function priceHTML(e, long){ return e.priceMode === "free" ? "Вход свободен" : e.priceMode === "price" && e.price != null ? SC.fmt(e.price) : A.missing(long ? "цена или вход свободен" : "цена"); }
function seatsHTML(e){ return e.seats != null ? A.plural(e.seats, "място", "места") : A.missing("брой"); }
function inDays(s){ var n = Math.round((dateOf(s) - dateOf(today)) / 864e5); return n === 0 ? "Днес" : n === 1 ? "Утре" : n > 0 ? "След " + n + " дни" : "Мина"; }

function cardHTML(e){ var d = dateOf(e.date), past = e.date < today, s = past ? "past" : e.status;
  var site = e.real ? "preview.html#m=site&p=event&d=phone" : "preview.html#m=site&p=events&d=phone";
  return '<article class="ev' + (s === "draft" ? ' draft' : '') + '" data-id="' + e.id + '" data-edit-id="admin.events.card"><div class="ev-date" aria-hidden="true"><small>' + A.DAYS[A.sofia(d).dow] + '</small><b>' + A.sofia(d).d + '</b><small>' + SC.MON[A.sofia(d).mo] + '</small></div>' +
    '<div class="ev-b"><div class="ev-tags"><span class="sa-tag ' + (s === "pub" ? 'st-pub' : s === "draft" ? 'st-draft' : 'st-past') + '">' + (s === "pub" ? ic("check",16) + 'В сайта' : s === "draft" ? 'Чернова' : 'Минало') + '</span><span class="sa-tag">' + ic(CATI[e.cat] || "calendar-blank",16) + esc(e.cat) + '</span></div>' +
      '<h3>' + esc(e.n) + '</h3><span class="when">' + esc(long(e.date)) + ' · ' + esc(e.time) + ' <span class="muted" style="font-weight:600">· ' + inDays(e.date) + '</span></span></div>' +
    '<dl class="ev-facts"><div><dt>Цена</dt><dd>' + priceHTML(e) + '</dd></div><div><dt>Места</dt><dd>' + seatsHTML(e) + '</dd></div><div><dt>Програма и меню</dt><dd>' + (e.prog && e.menu ? 'Попълнени' : A.missing([e.prog ? "" : "програма", e.menu ? "" : "меню"].filter(Boolean).join(" и "))) + '</dd></div></dl>' +
    '<div class="ev-f"><button class="pill pill-ink" type="button" data-edit aria-label="Промени ' + esc(e.n) + '">' + ic("pencil-simple",20) + 'Промени</button>' +
      (s === "pub" ? '<a class="pill pill-line" href="' + site + '">' + ic("eye",20) + 'Виж в сайта</a>' : s === "draft" ? '<button class="pill pill-line" type="button" data-pub>' + ic("paper-plane-right",20) + 'Публикувай</button>' : '') +
      '<span class="sp"></span><button class="pill pill-line del" type="button" data-del aria-label="Изтрий ' + esc(e.n) + '">' + ic("trash",20) + 'Изтрий</button></div></article>'; }

function draw(keep){
  if (st === "loading"){ body.innerHTML = A.skel(4, "Зареждаме събитията …"); return; }
  if (st === "error"){ body.innerHTML = A.error("Не успяхме да заредим събитията. Страниците в сайта остават, както са."); return; }
  var y = A.scroller.scrollTop, all = st === "empty" ? [] : E, up = all.filter(function(e){ return e.date >= today; }).length, past = all.length - up, l = list();
  var cats = SC.EVENT_CATS.filter(function(c){ return all.some(function(e){ return e.cat === c && (tab === "up" ? e.date >= today : e.date < today); }); });
  var html = (st === "offline" ? A.offline("Показваме последно заредените събития. Промените се пазят тук и се изпращат, щом има връзка.") + '<div style="height:16px"></div>' : '') +
    '<div class="ev-top" data-edit-id="admin.events.tabs"><div class="sa-tabs" role="tablist" aria-label="Събития"><button type="button" role="tab" aria-selected="' + (tab === "up") + '" data-tab="up" aria-controls="ev-p">Предстоящи<span class="c">' + up + '</span></button><button type="button" role="tab" aria-selected="' + (tab === "past") + '" data-tab="past" aria-controls="ev-p">Минали<span class="c">' + past + '</span></button></div><span class="sp"></span>' +
    '<a class="pill pill-line" href="preview.html#m=site&p=events&d=phone">' + ic("eye",20) + 'Страницата в сайта</a></div>' +
    (cats.length > 1 ? '<div class="ev-cats" role="group" aria-label="Категория"><button class="chip" type="button" data-c="" aria-pressed="' + (!cat) + '">Всички</button>' + cats.map(function(c){ return '<button class="chip" type="button" data-c="' + esc(c) + '" aria-pressed="' + (cat === c) + '">' + ic(CATI[c],18) + esc(c) + '</button>'; }).join("") + '</div>' : '');
  html += '<div id="ev-p" role="tabpanel">';
  if (!l.length) html += '<div class="sa-card">' + (tab === "up" ? A.empty({icon:"confetti", title:"Няма предстоящи събития.", text:"Добавете тематична вечер, жива музика или празник. Страницата в сайта се прави сама.", action:'<button class="pill pill-red pill-lg" type="button" data-new>' + ic("plus",22) + 'Ново събитие</button>'})
    : A.empty({icon:"images", title:"Още няма минали събития.", text:"Тук остават събитията след датата им, със снимки и отзиви от гостите. Архивът отпреди: " + A.missing("архив със снимки") + "."})) + '</div>';
  else html += '<div class="ev-list">' + l.map(cardHTML).join("") + '</div>';
  html += '</div><section class="ev-help" data-edit-id="admin.events.help"><h3>' + ic("info",20) + 'Какво трябва за всяка тематична вечер</h3><ul><li>Програма, меню на вечерта и цена (или „Вход свободен“): ' + A.missing("от ресторанта") + '</li><li>Капацитет на салона и градината: ' + A.missing("брой места") + '</li><li>Снимки от минали вечери: ' + A.missing("след фотосесията") + '</li></ul></section>';
  body.innerHTML = html; if (keep) A.scroller.scrollTop = y; }
draw();

/* ---------- действия ---------- */
function byId(id){ return E.filter(function(e){ return e.id === id; })[0]; }
function offlineNote(){ return st === "offline" ? " Ще се изпрати, щом има връзка." : ""; }
function sync(){ A.setHash(Object.assign({}, A.st ? {st:A.st} : {}, tab === "past" ? {t:"past"} : {}, cat ? {c:cat} : {})); }
body.addEventListener("click", function(e){ var t;
  if ((t = e.target.closest("[data-tab]"))){ tab = t.dataset.tab; cat = ""; sync(); draw(); var n = body.querySelector('[data-tab="' + tab + '"]'); n && n.focus({preventScroll:true}); return; }
  if ((t = e.target.closest("[data-c]"))){ cat = t.dataset.c; sync(); draw(true); return; }
  if ((t = e.target.closest("[data-edit]"))){ editor(t.closest("[data-id]").dataset.id); return; }
  if ((t = e.target.closest("[data-pub]"))){ var ev = byId(t.closest("[data-id]").dataset.id); if (missingForPub(ev)){ A.toast("Липсва " + missingForPub(ev) + ". Отворете „Промени“."); return; }
    ev.status = "pub"; save(); draw(true); A.audit("event.publish", "Публикувано: " + ev.n + ", " + long(ev.date), ev.id);
    A.toast("Публикувано в сайта: " + ev.n + offlineNote(), {undo:function(){ ev.status = "draft"; save(); draw(true); }}); return; }
  if ((t = e.target.closest("[data-del]"))){ var id = t.closest("[data-id]").dataset.id, ev2 = byId(id);
    A.confirm({title:"Да изтрием ли „" + ev2.n + "“?", text:esc(long(ev2.date) + ". " + (ev2.status === "pub" ? "Страницата изчезва от сайта." : "Черновата се изтрива.") + " Може да го върнете с „Отмени“ веднага след това."), ok:"Изтрий", danger:true, icon:"trash"}, function(){
      var i = E.indexOf(ev2); E.splice(i, 1); save(); draw(true); A.audit("event.delete", "Изтрито събитие: " + ev2.n + ", " + long(ev2.date), id);
      A.toast("Изтрито: " + ev2.n, {undo:function(){ E.splice(i, 0, ev2); save(); draw(true); A.audit("event.restore", "Върнато събитие: " + ev2.n, id); }}); }); return; }
});
document.addEventListener("click", function(e){ if (e.target.closest("[data-new]")) editor(null); });
function missingForPub(e){ return !e.n ? "име" : !e.date ? "дата" : ""; }

/* ---------- редактор: лист с преглед „Така изглежда в сайта“ ---------- */
function sheet(o){ var h = document.querySelector("sa-pen-ui"), fab = h && h.shadowRoot && h.shadowRoot.querySelector(".fab"), oc = o.onClose;
  if (fab && !(A.pen && A.pen.isOn())) fab.style.visibility = "hidden";
  o.onClose = function(){ if (fab) fab.style.visibility = ""; oc && oc(); }; return A.sheet(o); }
function editor(id){ var e = id ? byId(id) : {id:null, n:"", cat:"Тематични вечери", date:"", time:"19:00", text:"", prog:"", menu:"", price:null, priceMode:"tbd", seats:null, status:"draft"};
  var T = []; for (var m = 600; m <= 1350; m += 30) T.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
  var maxD = (function(){ var d = dateOf(today); d.setUTCDate(d.getUTCDate() + 365); return d.toISOString().slice(0, 10); })();
  var html = '<form class="ev-form" novalidate data-edit-id="admin.events.sheet">' +
    '<div class="field"><label for="ef-n">Име</label><input class="input" id="ef-n" name="n" value="' + esc(e.n) + '" autocomplete="off" placeholder="Например: Гръцка вечер" aria-describedby="ef-n-e"><span class="err" id="ef-n-e" hidden></span></div>' +
    '<div class="field"><label for="ef-cat">Категория</label><select class="input" id="ef-cat" name="cat">' + SC.EVENT_CATS.map(function(c){ return '<option' + (c === e.cat ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join("") + '</select></div>' +
    '<div class="two"><div class="field"><label for="ef-date">Дата</label><input class="input" id="ef-date" name="date" type="date" min="' + today + '" max="' + maxD + '" value="' + esc(e.date) + '" aria-describedby="ef-date-e"><span class="err" id="ef-date-e" hidden></span></div>' +
      '<div class="field"><label for="ef-time">Час</label><select class="input" id="ef-time" name="time">' + T.map(function(t){ return '<option' + (t === e.time ? ' selected' : '') + '>' + t + '</option>'; }).join("") + '</select></div></div>' +
    '<div class="field"><label for="ef-text">Кратко описание</label><textarea class="input" id="ef-text" name="text" rows="2" placeholder="Едно-две изречения за сайта">' + esc(e.text) + '</textarea></div>' +
    '<div class="field"><label for="ef-prog">Програма</label><textarea class="input" id="ef-prog" name="prog" rows="3" placeholder="19:00 посрещане, 20:00 музика …">' + esc(e.prog) + '</textarea><span class="help">Празно в сайта: ' + A.missing("програма") + '</span></div>' +
    '<div class="field"><label for="ef-menu">Меню на вечерта</label><textarea class="input" id="ef-menu" name="menu" rows="3" placeholder="Ястията на вечерта, по едно на ред">' + esc(e.menu) + '</textarea><span class="help">Празно в сайта: ' + A.missing("меню на вечерта") + '</span></div>' +
    '<div class="grp"><span class="label" id="ef-pl">Цена</span><div class="seg" role="group" aria-labelledby="ef-pl">' + [["price","Цена"],["free","Вход свободен"],["tbd","Още не е ясно"]].map(function(p){ return '<button type="button" data-pm="' + p[0] + '" aria-pressed="' + (e.priceMode === p[0]) + '">' + p[1] + '</button>'; }).join("") + '</div>' +
      '<div class="field" data-pricef' + (e.priceMode === "price" ? '' : ' hidden') + '><label for="ef-price">Цена на човек</label><div class="ev-eu" style="max-width:200px"><input class="input" id="ef-price" name="price" inputmode="decimal" autocomplete="off" value="' + (e.price != null ? String(e.price.toFixed(2)).replace(".", ",") : '') + '" placeholder="25,00" aria-describedby="ef-price-e"><span class="u" aria-hidden="true">€</span></div><span class="err" id="ef-price-e" hidden></span></div></div>' +
    '<div class="field"><label for="ef-seats">Места <span class="muted" style="font-weight:600">(по желание)</span></label><input class="input" id="ef-seats" name="seats" inputmode="numeric" maxlength="3" value="' + (e.seats != null ? e.seats : '') + '" style="max-width:200px" aria-describedby="ef-seats-h ef-seats-e"><span class="help" id="ef-seats-h">Капацитетът на залата: ' + A.missing("от собственика") + '. Сайтът показва „Остават 6 места“, когато са малко.</span><span class="err" id="ef-seats-e" hidden></span></div>' +
    '<div class="ev-photo">' + ic("image",22) + '<span>Снимка: ' + A.missing("след фотосесията") + '. Дотогава сайтът показва иконата на категорията.</span></div>' +
    '<p class="ev-prevh">' + ic("eye",18) + 'Така изглежда в сайта</p><div class="ev-prev" data-prev aria-live="polite"></div></form>';
  var s = sheet({title:id ? e.n : "Ново събитие", html:html, focus:id ? "[data-close]" : "#ef-n",
    foot:'<button class="pill pill-line pill-lg" type="button" data-draft>' + (id && e.status === "pub" ? 'Скрий от сайта' : 'Запази чернова') + '</button><button class="pill pill-red pill-lg" type="button" data-ok>' + ic("paper-plane-right",22) + (id && e.status === "pub" ? 'Запази' : 'Публикувай') + '</button>'});
  var f = s.body.querySelector("form"), pm = e.priceMode;
  function read(){ var p = String(f.price.value).replace(/\s/g, "").replace(",", "."), se = f.seats.value.trim();
    return {n:f.n.value.trim(), cat:f.cat.value, date:f.date.value, time:f.time.value, text:f.text.value.trim(), prog:f.prog.value.trim(), menu:f.menu.value.trim(), priceMode:pm, price:pm === "price" && /^\d{1,3}(\.\d{1,2})?$/.test(p) ? +p : null, priceRaw:p, seats:/^\d{1,3}$/.test(se) ? +se : null, seatsRaw:se}; }
  function prev(){ var v = read(), dd = v.date ? long(v.date) : '<span class="muted">Изберете дата</span>';
    s.body.querySelector("[data-prev]").innerHTML = '<div class="pv">' + ic(CATI[v.cat] || "calendar-blank",44) + '<span class="flag">' + ic("clock",16) + (v.date ? inDays(v.date) : 'Без дата') + '</span><span class="cap"><span class="missing">[ЛИПСВА: снимка]</span></span></div>' +
      '<span class="sa-tag" style="justify-self:start">' + ic(CATI[v.cat],16) + esc(v.cat) + '</span><h4>' + (v.n ? esc(v.n) : '<span class="missing">Име на събитието</span>') + '</h4>' +
      '<div class="meta"><span>' + dd + ' · ' + v.time + '</span><span>' + priceHTML(v) + '</span>' + (v.seats != null && v.seats <= 10 ? '<span>Остават ' + A.plural(v.seats, "място", "места") + '</span>' : '') + '</div>' +
      '<span class="pill pill-red go" aria-hidden="true">Запази място' + ic("arrow-right",20) + '</span>'; }
  prev(); f.addEventListener("input", prev); f.addEventListener("change", prev);
  f.addEventListener("click", function(ev){ var b = ev.target.closest("[data-pm]"); if (!b) return; pm = b.dataset.pm; f.querySelectorAll("[data-pm]").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); }); f.querySelector("[data-pricef]").hidden = pm !== "price"; if (pm === "price") f.price.focus(); prev(); });
  function er(name, m){ var i = f[name], el = s.body.querySelector("#ef-" + name + "-e"); if (m){ i.setAttribute("aria-invalid", "true"); el.hidden = false; el.textContent = m; } else { i.removeAttribute("aria-invalid"); el.hidden = true; } return !m; }
  function commit(status){ var v = read();
    var ok = [er("n", v.n.length < 3 ? "Напишете име, например „Гръцка вечер“." : ""), er("date", !v.date ? "Изберете дата." : v.date < today ? "Датата е минала. Изберете днес или по-късно." : v.date > maxD ? "До една година напред." : ""),
      er("price", pm === "price" && (v.price == null || v.price <= 0) ? "Напишете цена като 25,00 или изберете „Вход свободен“." : ""), er("seats", v.seatsRaw && v.seats == null ? "Само цифри, например 40." : "")];
    var bad = ["n","date","price","seats"].filter(function(n, i){ return !ok[i]; }); if (bad.length){ f[bad[0]].focus(); return; }
    var prevE = id ? JSON.parse(JSON.stringify(e)) : null, wasPub = id && e.status === "pub";
    var next = {n:v.n, cat:v.cat, date:v.date, time:v.time, text:v.text, prog:v.prog, menu:v.menu, priceMode:pm, price:v.price, seats:v.seats, status:status};
    if (id) Object.assign(e, next); else { e = Object.assign({id:"ev-" + Math.random().toString(36).slice(2, 7)}, next); E.push(e); }
    save(); s.close(); if (e.date >= today && tab !== "up"){ tab = "up"; sync(); } draw(true);
    var txt = (status === "pub" ? (wasPub ? "Запазено в сайта: " : "Публикувано: ") : (wasPub ? "Скрито от сайта: " : "Чернова: ")) + e.n + ", " + long(e.date);
    A.audit(id ? "event.update" : "event.create", txt, e.id);
    A.toast(txt + offlineNote(), {undo:function(){ if (prevE) Object.assign(e, prevE); else E.splice(E.indexOf(e), 1); save(); draw(true); A.audit("event.update", "Отменено: " + txt, e.id); }}); }
  s.foot.querySelector("[data-ok]").onclick = function(){ commit("pub"); };
  s.foot.querySelector("[data-draft]").onclick = function(){ commit("draft"); };
}
if (A.hash.e && byId(A.hash.e)) setTimeout(function(){ editor(A.hash.e); }, 300);
})();
</script>
