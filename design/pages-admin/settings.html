<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Настройки | Siracusa · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_admin.css">
<style>
.stg{display:grid; gap:16px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:1000px){ .stg{grid-template-columns:220px minmax(0,1fr); align-items:start} .stg-nav{position:sticky; top:96px} }
.stg-nav{display:none}
@container page (min-width:1000px){ .stg-nav{display:grid; gap:2px} }
.stg-nav a{display:flex; align-items:center; gap:10px; min-height:48px; padding:0 14px; border-radius:999px; text-decoration:none; color:var(--ink); font-weight:700}
.stg-nav a:hover{background:var(--surface-2)}
.stg-nav a[aria-current="true"]{background:var(--ink); color:var(--bg)}
.stg-nav a[aria-current="true"] .ic{color:var(--ember)}
.stg-nav a .ic{color:var(--muted)}
.stg-main{display:grid; gap:16px; min-width:0}
.card{padding:20px; display:grid; gap:16px; scroll-margin-top:96px}
.card > header{display:flex; align-items:flex-start; gap:14px}
.card > header .ill{width:48px; height:48px; border-radius:16px; display:grid; place-items:center; background:var(--surface-2); color:var(--red); flex:none}
.card > header h2{margin:0; font-size:22px; letter-spacing:-.03em; line-height:1.2}
.card > header p{margin:4px 0 0; color:var(--muted); font-size:16px}
.row-s{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 16px; align-items:center; padding-top:14px; border-top:1px solid var(--line)}
.row-s .l b{display:block; font-size:17px}
.row-s .l > span:not(.tags){display:block; color:var(--muted); font-size:15px; margin-top:2px}
.row-s .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
@container page (max-width:520px){ .row-s{grid-template-columns:minmax(0,1fr)} .row-s > :last-child{justify-self:start} }
.chg-dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ember); margin-left:8px; vertical-align:middle}
/* натоварено */
.busy{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px 16px; align-items:center; padding:18px; border-radius:20px; background:var(--surface-2)}
.busy.on{background:var(--ember); color:var(--on-ember)}
.busy b{font-size:20px; letter-spacing:-.02em; display:flex; align-items:center; gap:10px}
.busy > span > span{display:block}
.busy span{font-size:15px; font-weight:600; opacity:.85}
.busy .sa-switch input:checked + .tr{background:var(--ink)}
.prev{display:grid; gap:8px; min-width:0}
.prev .lab{font-size:14px; font-weight:700; color:var(--muted)}
.pill-st{display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:8px 16px; border-radius:26px; background:var(--glass); box-shadow:inset 0 0 0 1px var(--line-strong); font-size:15px; font-weight:600; color:var(--muted); width:fit-content; max-width:100%}
.pill-st b{color:var(--ink)}
.pill-st .dot{width:9px; height:9px; border-radius:50%; background:var(--ok); flex:none}
.pill-st .dot.warn{background:var(--warn)}
.counter output{min-width:76px; font-size:17px}
.counter output small{font-size:14px; font-weight:700; color:var(--muted)}
.seg2{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:6px; border-radius:22px; background:var(--surface-2)}
.seg2 button{min-height:52px; border:0; border-radius:16px; background:transparent; font-weight:800; font-size:16px; cursor:pointer; color:var(--ink); padding:0 10px}
.seg2 button[aria-pressed="true"]{background:var(--surface); box-shadow:var(--shadow)}
.hrs{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px}
@container page (min-width:760px){ .hrs{grid-template-columns:repeat(4, minmax(0,1fr))} }
.hrs div{padding:14px; border-radius:18px; background:var(--surface-2); display:grid; gap:2px}
.hrs b{font-size:22px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.hrs span{font-size:14px; font-weight:700; color:var(--muted)}
.oq{display:grid; gap:0}
.oq div{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 16px; padding:12px 0; border-top:1px solid var(--line); align-items:center}
.oq div:first-child{border-top:0}
.oq p{margin:0}
.oq small{display:block; font-size:14px; font-weight:700; color:var(--muted)}
.oq b{text-align:right}
@container page (max-width:520px){ .oq div{grid-template-columns:minmax(0,1fr)} .oq b{text-align:left} }
.err{font-size:14px; color:var(--danger); font-weight:700; grid-column:1 / -1}
.days-in{width:120px; text-align:center; font-weight:800}
.st-savebar{position:absolute; z-index:25; left:10px; right:10px; bottom:88px; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 20px; border-radius:999px; background:var(--glass); -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%); box-shadow:inset 0 0 0 1px var(--glass-line), var(--shadow-lg); transform:translateY(160%); opacity:0; pointer-events:none; transition:transform var(--t-slow) var(--ease), opacity var(--t-slow) var(--ease)}
.st-savebar.on{transform:none; opacity:1; pointer-events:auto}
.st-savebar .n{flex:1; min-width:0; font-weight:800; line-height:1.25}
.st-savebar .n small{display:block; font-size:14px; font-weight:600; color:var(--muted)}
.st-savebar .pill{flex:none}
@container app (min-width:700px){ .st-savebar{left:50%; right:auto; bottom:92px; width:min(620px, calc(100% - 48px)); transform:translate(-50%,160%)} .st-savebar.on{transform:translate(-50%,0)} }
@container app (max-width:420px){ .st-savebar{flex-wrap:wrap; border-radius:28px; padding:10px} .st-savebar .n{flex:1 1 100%; padding:0 8px 4px} .st-savebar .pill{flex:1} }
/* листове: дългите думи в долните бутони се пренасят, не излизат извън листа */
.sa-sfoot .pill{white-space:normal; text-align:center; line-height:1.15; padding:0 14px}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_admin.js"></script>
<script src="_seed-orders.js"></script>
<script src="_res-lib.js"></script>
<script src="_seed-res.js"></script>
<script src="_pencil.js"></script>
<script>
(function(){
var ic = A.ic, esc = A.esc, st = A.st;
A.liveHash = true;
var body = A.mount({section:"settings", title:"Настройки", eyebrow:"Работа по сайта",
  sub:"Числата, които сайтът, кухнята и резервацията четат от едно място: „Натоварено“ и минутите, колко време е масата на гостите, цената на празник. В системата промяната важи веднага навсякъде.",
  states:[["","Обичайно"],["loading","Зареждане"],["error","Грешка"],["offline","Без връзка"],["busy","Натоварено"]]});
if (!body) return;

/* ---------- настройките (като src/core/settings.ts + полетата, които още ги няма в ядрото) ---------- */
var now = A.now || function(){ return new Date(); };
var DEF = A.rl.SETTINGS; /* _res-lib.js: стойностите по подразбиране */
function clone(v){ return JSON.parse(JSON.stringify(v)); }
function load(){ var s = A.data.get("settings", {}); var o = Object.assign(clone(DEF), s); o.kitchen = Object.assign(clone(DEF.kitchen), s.kitchen || {}); return o; }
var saved = load(); if (st === "busy" && !saved.kitchen.busy){ saved.kitchen.busy = true; saved.kitchen.busyAt = new Date(now().getTime() - 38 * 60e3).toISOString(); }
var W = clone(saved), errs = {};
var CORE_NEW = ["noShowLimit","callCooldown","callManager"]; /* искане към шефа: да влязат в Settings */

function eq(a, b){ return JSON.stringify(a) === JSON.stringify(b); }
function ch(path){ var a = path.split("."), x = saved, y = W; a.forEach(function(k){ x = x[k]; y = y[k]; }); return !eq(x, y) ? '<span class="chg-dot" aria-label="променено"></span>' : ''; }
function counter(key, val, min, max, step, unit, label){ return '<div class="counter" role="group" aria-label="' + esc(label) + '"><button type="button" data-inc="' + key + '" data-d="-' + step + '" aria-label="' + esc(label) + ': по-малко"' + (val <= min ? ' disabled' : '') + '>' + ic("minus",20) + '</button><output aria-live="polite">' + val + ' <small>' + unit + '</small></output><button type="button" data-inc="' + key + '" data-d="' + step + '" aria-label="' + esc(label) + ': повече"' + (val >= max ? ' disabled' : '') + '>' + ic("plus",20) + '</button></div>'; }
function q(n){ return '<span class="sa-tag warn">' + ic("question",16) + 'Въпрос ' + n + '</span>'; }
function newCore(){ return '<span class="sa-tag">' + ic("info",16) + 'Ново поле в ядрото</span>'; }
function custText(busy){ return busy ? "Възможни са закъснения · около " + W.kitchen.etaBusyMin + " мин" : "около " + W.kitchen.etaMin + " мин"; }

function draw(){ var y = A.scroller.scrollTop;
  if (st === "loading"){ body.innerHTML = A.skel(5, "Зареждаме настройките …"); return; }
  if (st === "error"){ body.innerHTML = A.error("Не успяхме да заредим настройките. Сайтът и кухнята работят с последните запазени."); return; }
  var k = W.kitchen, R = SC.RESTAURANT;
  body.innerHTML = (st === "offline" ? A.offline("Промените се пазят тук и се изпращат, щом връзката се върне. Дотогава сайтът показва старите числа.") + '<div style="height:16px"></div>' : '') +
  '<div class="stg"><nav class="stg-nav" aria-label="Части"><a href="#s-kitchen">' + ic("chef-hat",20) + 'Кухнята</a><a href="#s-res">' + ic("calendar-check",20) + 'Резервации</a><a href="#s-celeb">' + ic("confetti",20) + 'Празник</a><a href="#s-hours">' + ic("clock",20) + 'Часове</a><a href="#s-masa">' + ic("bell-ringing",20) + 'QR маса</a><a href="#s-open">' + ic("question",20) + 'Отворени въпроси</a></nav>' +
  '<div class="stg-main">' +
  /* кухнята */
  '<section class="sa-card card" id="s-kitchen" data-edit-id="admin.settings.kitchen" aria-labelledby="h-k"><header><span class="ill">' + ic("chef-hat",24) + '</span><div><h2 id="h-k">Кухнята и времето до клиента</h2><p>Един източник за сайта, кухнята и админа. Минутите са около времето за доставка.</p></div></header>' +
    '<label class="busy' + (k.busy ? ' on' : '') + '"><span><b>' + ic("hourglass",24) + 'Натоварено' + ch("kitchen.busy") + '</b><span>' + (k.busy ? 'Сега: включено' + (k.busyAt ? ' от ' + A.hm(new Date(k.busyAt)) : '') + ' · около ' + k.etaBusyMin + ' мин. Новите поръчки са с +' + (k.etaBusyMin - k.etaMin) + ' мин.' : 'Сега: обичаен режим · около ' + k.etaMin + ' мин.') + '</span><span>Обикновено го включва кухнята от таблета.</span></span>' +
      '<span class="sa-switch"><input type="checkbox" role="switch" data-busy aria-label="Натоварено"' + (k.busy ? ' checked' : '') + '><span class="tr"></span></span></label>' +
    '<div class="row-s"><div class="l"><b>Обичайно време' + ch("kitchen.etaMin") + '</b><span>Какво виждат гостите в сайта и в количката.</span></div>' + counter("etaMin", k.etaMin, 5, 240, 5, "мин", "Обичайно време") + (errs.etaMin ? '<p class="err" role="alert">' + errs.etaMin + '</p>' : '') + '</div>' +
    '<div class="row-s"><div class="l"><b>При „Натоварено“' + ch("kitchen.etaBusyMin") + '</b><span>Поне колкото обичайното. По подразбиране +20 мин.</span></div>' + counter("etaBusyMin", k.etaBusyMin, 5, 240, 5, "мин", "Време при натоварване") + (errs.etaBusyMin ? '<p class="err" role="alert">' + errs.etaBusyMin + '</p>' : '') + '</div>' +
    '<div class="row-s"><div class="prev"><span class="lab">Така го виждат гостите сега</span><span class="pill-st"><span class="dot' + (k.busy ? ' warn' : '') + '"></span><span>Доставка до ' + R.delivery + ' · <b>' + esc(custText(k.busy)) + '</b></span></span>' +
      '<span class="lab">' + (k.busy ? 'Без „Натоварено“' : 'При „Натоварено“') + '</span><span class="pill-st"><span class="dot' + (k.busy ? '' : ' warn') + '"></span><span><b>' + esc(custText(!k.busy)) + '</b></span></span></div><span></span></div>' +
    '<p class="muted" style="margin:0;font-size:15px">Минутите по квартали (Дружба 2: около 25 мин и т.н.) засега са отделни числа в „Зони за доставка“. ' + q("от общата проверка") + '</p></section>' +
  /* резервации */
  '<section class="sa-card card" id="s-res" data-edit-id="admin.settings.reservations" aria-labelledby="h-r"><header><span class="ill">' + ic("calendar-check",24) + '</span><div><h2 id="h-r">Резервации</h2><p>Колко време масата е заета и кога номерът отива за блокиране.</p></div></header>' +
    '<div class="row-s"><div class="l"><b>Колко време е масата на гостите' + ch("resMinutes") + '</b><span>Продължителност на резервацията: после масата е свободна за следващите гости.</span><span class="tags">' + q("18а") + '</span></div>' + counter("resMinutes", W.resMinutes, 30, 360, 30, "мин", "Колко време е масата на гостите") + (errs.resMinutes ? '<p class="err" role="alert">' + errs.resMinutes + '</p>' : '') + '</div>' +
    '<div class="row-s"><div class="l"><b>Блокиране след неявявания' + ch("noShowLimit") + '</b><span>Номерът чака решение на управителя; той блокира и отблокира.</span><span class="tags">' + q(8) + newCore() + '</span></div>' + counter("noShowLimit", W.noShowLimit, 1, 5, 1, W.noShowLimit === 1 ? "път" : "пъти", "Блокиране след неявявания") + '</div>' +
    '<div class="row-s"><div class="l"><b>Часове за резервация</b><span>11:00 - 21:30 през 30 мин, до 92 дни напред. Масата е за броя места.</span><span class="tags">' + q(18) + '<span class="sa-tag">В ядрото</span></span></div><span></span></div></section>' +
  /* празник */
  '<section class="sa-card card" id="s-celeb" data-edit-id="admin.settings.celebration" aria-labelledby="h-c"><header><span class="ill">' + ic("confetti",24) + '</span><div><h2 id="h-c">Празник при нас</h2><p>Какво показва калкулаторът на празник в сайта.</p></div></header>' +
    '<div class="row-s" style="grid-template-columns:minmax(0,1fr)"><div class="l"><b>Цена в калкулатора' + ch("celebrationPrice") + '</b><span>' + (W.celebrationPrice === "offer" ? 'Гостът вижда „Ще ви изпратим оферта“, без сума.' : 'Гостът вижда ориентировъчна цена; точната е в офертата.') + '</span><span class="tags">' + q(3) + '</span></div>' +
      '<div class="seg2" role="group" aria-label="Цена в калкулатора"><button type="button" data-cp="offer" aria-pressed="' + (W.celebrationPrice === "offer") + '">Само оферта</button><button type="button" data-cp="estimate" aria-pressed="' + (W.celebrationPrice === "estimate") + '">Ориентировъчна цена</button></div></div>' +
    '<div class="row-s"><div class="l"><b>-5% за ранна резервация' + ch("earlyDays") + '</b><span>' + (W.earlyDays == null ? 'Изключено: колко дни по-рано е „ранна“ ' + A.missing("брой дни") + '. Без числото -5% не се дава.' : (W.earlyDays ? 'Празник, запазен поне ' + A.plural(W.earlyDays, "ден", "дни") + ' по-рано, получава -5%. Само за празник, не за тематични вечери.' : 'Напишете броя дни. Дотогава -5% не се дава.')) + '</span><span class="tags">' + q(13) + q(14) + '</span></div>' +
      '<span class="sa-switch"><input type="checkbox" role="switch" data-early aria-label="-5% за ранна резервация"' + (W.earlyDays != null ? ' checked' : '') + '><span class="tr"></span></span>' +
      (W.earlyDays != null ? '<div class="field" style="grid-column:1/-1"><label for="ed">Колко дни по-рано</label><input class="input days-in" id="ed" type="number" inputmode="numeric" min="1" max="365" value="' + (W.earlyDays || '') + '"><span class="help">От 1 до 365.</span></div>' : '') + (errs.earlyDays ? '<p class="err" role="alert">' + errs.earlyDays + '</p>' : '') + '</div></section>' +
  /* часове */
  '<section class="sa-card card" id="s-hours" data-edit-id="admin.settings.hours" aria-labelledby="h-h"><header><span class="ill">' + ic("clock",24) + '</span><div><h2 id="h-h">Часове</h2><p>Правилата на поръчките са в ядрото. Смяната от тук: ' + A.soonTag() + '</p></div></header>' +
    '<div class="hrs"><div><b>' + R.open + ' - ' + R.close + '</b><span>Ресторантът</span></div><div><b>до ' + R.kitchen + '</b><span>Кухнята приема поръчки</span></div><div><b>до ' + R.delivery + '</b><span>Доставка</span></div><div><b>до ' + R.lunchUntil + '</b><span>Обедно меню</span></div></div>' +
    '<p class="muted" style="margin:0;font-size:15px">След ' + R.lunchUntil + ' обедното меню е само за вземане от място, с -30%. Между ' + R.delivery + ' и ' + R.kitchen + ': „Доставката приключи за днес · Вземане до ' + R.kitchen + '“. Празнични дни: ' + A.missing("работно време в празнични дни") + '.</p></section>' +
  /* QR маса */
  '<section class="sa-card card" id="s-masa" data-edit-id="admin.settings.masa" aria-labelledby="h-m"><header><span class="ill">' + ic("bell-ringing",24) + '</span><div><h2 id="h-m">QR маса и сервитьори</h2><p>Повикванията от масата. Заглушаване на маса няма.</p></div></header>' +
    '<div class="row-s"><div class="l"><b>Между две еднакви повиквания' + ch("callCooldown") + '</b><span>Една маса не вика по-често за същото.</span><span class="tags">' + q("QR 1") + newCore() + '</span></div>' + counter("callCooldown", W.callCooldown, 1, 15, 1, "мин", "Между две повиквания") + '</div>' +
    '<div class="row-s"><div class="l"><b>Към управителя след' + ch("callManager") + '</b><span>Ако никой не поеме повикването.</span><span class="tags">' + q("QR 1") + newCore() + '</span></div>' + counter("callManager", W.callManager, 2, 30, 1, "мин", "Към управителя след") + '</div></section>' +
  /* отворени въпроси */
  '<section class="sa-card card" id="s-open" data-edit-id="admin.settings.open" aria-labelledby="h-o"><header><span class="ill">' + ic("question",24) + '</span><div><h2 id="h-o">Отворени въпроси, които стават настройки</h2><p>Докато собственикът не реши, системата прави варианта по подразбиране.</p></div></header>' +
    '<div class="oq">' + [["2","Депозит за резервации и празници","Няма"],["7","Права на управителя","Като собственика без финанси, роли и дневник"],["16","Ваучери: валидност; комбинират ли се отстъпките","Не се комбинират; валидност " + A.missing("срок")],["17а","Горна граница на една онлайн поръчка","60 порции и 500 €"],["23","„Изчерпано днес“","Нулира се в полунощ по София"],["Кухня 15","Кой включва „Натоварено“","Всяка секция, с напомняне след 60 мин"]]
      .map(function(x){ return '<div><p><small>Въпрос ' + x[0] + '</small>' + x[1] + '</p><b>' + x[2] + '</b></div>'; }).join("") + '</div></section>' +
  '</div></div>';
  A.scroller.scrollTop = y; syncBar(); markNav(); }

/* ---------- лента за запис ---------- */
A.col.insertAdjacentHTML("beforeend", '<div class="st-savebar" role="region" aria-label="Незапазени промени"><span class="n" data-n aria-live="polite"></span><button class="pill pill-line" type="button" data-cancel>Откажи промените</button><button class="pill pill-red" type="button" data-save>' + ic("check",20) + 'Запази</button></div>');
var bar = A.col.querySelector(".st-savebar");
var LABEL = {"kitchen.busy":"„Натоварено“", "kitchen.etaMin":"обичайно време", "kitchen.etaBusyMin":"време при натоварване", resMinutes:"продължителност на резервацията", noShowLimit:"блокиране след", celebrationPrice:"цена на празник", earlyDays:"ранна резервация", callCooldown:"между повиквания", callManager:"към управителя"};
function fmtV(k, v){ if (k === "kitchen.busy") return v ? "включено" : "изключено"; if (k === "celebrationPrice") return v === "offer" ? "само оферта" : "ориентировъчна"; if (k === "earlyDays") return v == null ? "изключено" : v + " дни"; if (k === "noShowLimit") return v + " пъти"; return v + " мин"; }
function get(o, k){ return k.split(".").reduce(function(x, p){ return x[p]; }, o); }
function diffs(){ return Object.keys(LABEL).filter(function(k){ return !eq(get(saved, k), get(W, k)); }); }
function syncBar(){ var d = diffs(); bar.classList.toggle("on", d.length > 0 && st !== "error" && st !== "loading"); bar.querySelector("[data-n]").innerHTML = d.length ? (d.length === 1 ? "1 промяна" : d.length + " промени") + '<small>' + (st === "offline" ? "Ще се изпратят при връзка" : "Още не са запазени") + '</small>' : ''; }
function validate(){ errs = {}; var k = W.kitchen;
  if (!(k.etaMin >= 5 && k.etaMin <= 240)) errs.etaMin = "Минутите са цяло число от 5 до 240.";
  if (!(k.etaBusyMin >= 5 && k.etaBusyMin <= 240) || k.etaBusyMin < k.etaMin) errs.etaBusyMin = "Минутите при натоварване са поне колкото обичайните.";
  if (W.resMinutes < 30 || W.resMinutes > 360 || W.resMinutes % 30) errs.resMinutes = "Продължителността е от 30 до 360 минути, през 30.";
  if (W.earlyDays === 0) errs.earlyDays = "Напишете колко дни по-рано (от 1 до 365) или изключете -5%.";
  else if (W.earlyDays !== null && !(Number.isInteger(W.earlyDays) && W.earlyDays >= 1 && W.earlyDays <= 365)) errs.earlyDays = "Дните са цяло число от 1 до 365.";
  return !Object.keys(errs).length; }
draw();
/* лява навигация: текущата част по скрола */
function markNav(){ var secs = body.querySelectorAll(".stg-main > section"), cur = null; secs.forEach(function(sc){ if (sc.getBoundingClientRect().top < 200) cur = sc.id; }); if (!cur && secs[0]) cur = secs[0].id;
  body.querySelectorAll(".stg-nav a").forEach(function(a){ if (a.getAttribute("href") === "#" + cur) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); }); }
A.scroller.addEventListener("scroll", markNav, {passive:true}); markNav();
body.addEventListener("click", function(e){ var a = e.target.closest(".stg-nav a"); if (!a) return; e.preventDefault(); var t = body.querySelector(a.getAttribute("href")); t && t.scrollIntoView({behavior:SC.reduce ? "auto" : "smooth", block:"start"}); });

document.addEventListener("click", function(e){ var t;
  if ((t = e.target.closest("[data-inc]"))){ var key = t.dataset.inc, d = +t.dataset.d, map = {etaMin:["kitchen","etaMin",5,240], etaBusyMin:["kitchen","etaBusyMin",5,240], resMinutes:[null,"resMinutes",30,360], noShowLimit:[null,"noShowLimit",1,5], callCooldown:[null,"callCooldown",1,15], callManager:[null,"callManager",2,30]}[key];
    var o = map[0] ? W[map[0]] : W; o[map[1]] = Math.max(map[2], Math.min(map[3], o[map[1]] + d));
    if (key === "etaMin" && W.kitchen.etaBusyMin < W.kitchen.etaMin) W.kitchen.etaBusyMin = W.kitchen.etaMin; validate(); draw();
    var b = body.querySelector('[data-inc="' + key + '"][data-d="' + t.dataset.d + '"]'); b && !b.disabled && b.focus({preventScroll:true}); return; }
  if ((t = e.target.closest("[data-cp]"))){ W.celebrationPrice = t.dataset.cp; draw(); body.querySelector('[data-cp="' + W.celebrationPrice + '"]').focus({preventScroll:true}); return; }
  if (e.target.closest("[data-cancel]")){ W = clone(saved); errs = {}; draw(); A.toast("Промените са отменени"); return; }
  if (e.target.closest("[data-save]")){ if (!validate()){ draw(); var el = body.querySelector(".err"); el && el.scrollIntoView({block:"center"}); return; }
    var d = diffs(), text = d.map(function(k){ return LABEL[k] + ": " + fmtV(k, get(saved, k)) + " → " + fmtV(k, get(W, k)); }).join("; "), prev = clone(saved);
    saved = clone(W); A.data.set("settings", saved); draw(); A.audit("settings.update", text.charAt(0).toUpperCase() + text.slice(1), "main");
    A.toast("Настройките са запазени. В системата сайтът и кухнята ще ги четат оттук.", {undo:function(){ saved = prev; W = clone(prev); A.data.set("settings", prev); draw(); A.audit("settings.update", "Върнати предишните настройки", "main"); }}); return; }
});
document.addEventListener("change", function(e){ var t = e.target;
  if (t.matches("[data-busy]")){ W.kitchen.busy = t.checked; W.kitchen.busyAt = t.checked ? now().toISOString() : null; draw(); body.querySelector("[data-busy]").focus({preventScroll:true}); return; }
  if (t.matches("[data-early]")){ W.earlyDays = t.checked ? (saved.earlyDays || 0) : null; validate(); /* 0 = включено, но без число: не измисляме дни */ draw(); var ed = body.querySelector("#ed"); if (ed){ ed.value = W.earlyDays || ""; ed.focus(); } return; }
  if (t.id === "ed"){ W.earlyDays = t.value === "" ? 0 : +t.value; validate(); draw(); }
});
window.addEventListener("beforeunload", function(e){ if (diffs().length){ e.preventDefault(); e.returnValue = ""; } });
})();
</script>
</body>
</html>
