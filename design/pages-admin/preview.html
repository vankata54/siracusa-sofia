<style>
.sa-app.immersive .sa-page{padding-bottom:0}
.pv{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:1000px){ .pv{grid-template-columns:320px minmax(0,1fr)} }
/* tools */
.pv-tools{display:flex; flex-wrap:wrap; gap:12px 10px; align-items:flex-end; padding:14px; border-radius:var(--r-shell); background:var(--surface); box-shadow:var(--hi), var(--shadow); min-width:0}

.pv-lb{font-size:14px; font-weight:700; color:var(--muted)}
.pv-tools .input{min-height:48px}
.pv-tools .seg{padding:4px; gap:4px; border-radius:999px}
.pv-tools .seg button, .pv-sh .seg button{min-height:44px; border-radius:999px; font-size:15px; padding:0 6px; white-space:nowrap; min-width:0}
.pv-steps{display:flex; gap:6px}
.pv-steps .pill{flex:1; padding:0 12px; font-size:15px}
.pv-acts{display:flex; flex-wrap:wrap; gap:6px}
.pv-acts .pill{padding:0 14px; font-size:15px}
.pv-hint{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:18px; background:var(--surface-2); font-size:15px; color:var(--muted); line-height:1.4}
.pv-hint .ic{color:var(--red); margin-top:1px}
.pv-hint b{color:var(--ink)}
@container page (min-width:1000px){
  .pv-tools{flex-direction:column; flex-wrap:nowrap; align-items:stretch; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; gap:16px; padding:18px 18px 28px}
  .pv-tools > *{flex:none}
  .pv-tools .seg{display:grid}
}
@container page (min-width:1000px){ .pv-tools .grp.nw{display:none} }
@container page (max-width:999px){ .pv-tools .grp.ww{display:none} .pv-tools .grp.scr, .pv-tools .grp.dv{display:flex; flex-wrap:wrap; gap:6px; align-items:center} .pv-tools .grp .pv-lb{flex:1 1 100%} .pv-tools .grp.scr{flex:2 1 360px} .pv-tools .grp.scr select{flex:1 1 150px; width:auto} .pv-steps{flex:none} .pv-tools .grp.mod{flex:1 1 180px} .pv-hint{display:none} }

  background:radial-gradient(var(--line-strong) 1px, transparent 1.4px) 0 0 / 22px 22px, var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}
.pv-stage.z100{overflow:auto; place-items:start center; overscroll-behavior:contain}
.pv-fit{position:relative; flex:none; margin:16px}
.pv-dev{position:absolute; left:0; top:0; transform-origin:0 0; transition:transform var(--t-slow) var(--ease)}
.pv-dev iframe{display:block; border:0; background:var(--bg)}
.pv-dev.phone{padding:12px; border-radius:58px; background:var(--chip-dark); box-shadow:0 0 0 1px var(--line-strong), var(--shadow-lg)}
.pv-dev.phone iframe{border-radius:46px}
.pv-dev.tablet{padding:18px; border-radius:42px; background:var(--chip-dark); box-shadow:0 0 0 1px var(--line-strong), var(--shadow-lg)}
.pv-dev.tablet iframe{border-radius:24px}
.pv-dev.desktop{border-radius:16px; background:var(--surface); box-shadow:0 0 0 1px var(--line-strong), var(--shadow-lg); overflow:hidden}
.pv-chrome{height:44px; display:flex; align-items:center; gap:14px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--line)}
.pv-chrome .dots{display:flex; gap:7px} .pv-chrome .dots i{width:12px; height:12px; border-radius:50%; background:var(--line-strong)}

.pv-dev.bare{padding:0; border-radius:0; background:var(--bg); box-shadow:none}
.pv-load{position:absolute; inset:0; display:grid; place-items:center; background:var(--bg); transition:opacity var(--t-slow) var(--ease); pointer-events:none}
.pv-load.off{opacity:0}
.pv-load span{display:inline-flex; align-items:center; gap:10px; font-weight:700; color:var(--muted); font-size:18px}

.pv-nb .ic{color:var(--red); flex:none}
.pv-nb .tx{flex:1; min-width:0}
.pv-nb .pill{flex:none; min-height:44px; padding:0 14px; font-size:15px}
.pv-nb.warn .ic{color:var(--warn)}

.pv-fbar{display:none}

  .sa-app.immersive .sa-page{padding:0}

  .pv-tools{display:none}

  .pv-fit{margin:0}
  .pv-cap{display:none}
  .pv-fbar{display:grid; position:absolute; z-index:30; left:8px; right:8px; bottom:10px; height:68px; grid-template-columns:repeat(4,1fr); padding:0 4px; border-radius:999px; background:var(--glass); -webkit-backdrop-filter:blur(18px) saturate(160%); backdrop-filter:blur(18px) saturate(160%); box-shadow:inset 0 0 0 1px var(--glass-line), var(--shadow)}
  .pv-fbar a, .pv-fbar button{display:grid; justify-items:center; align-content:center; gap:2px; min-height:48px; border:0; background:transparent; border-radius:999px; font-size:14px; font-weight:700; color:var(--ink); text-decoration:none; cursor:pointer; padding:0}
  .pv-fbar .ic{color:var(--muted)}
  .pv-fbar [aria-pressed="true"]{background:var(--ember); color:var(--on-ember)}
  .pv-fbar [aria-pressed="true"] .ic{color:var(--on-ember)}
  .pv-nb{top:8px; left:8px; right:8px; flex-wrap:wrap} .pv-nb .tx{flex:1 1 calc(100% - 40px)} .pv-nb .pill{flex:1 1 auto}
}
.pv-list{display:grid; gap:4px; margin:6px 0 0}
.pv-list button{display:flex; align-items:center; gap:12px; min-height:52px; padding:0 14px; border:0; border-radius:18px; background:transparent; color:var(--ink); font-weight:700; font-size:16px; text-align:left; cursor:pointer}
.pv-list button:hover{background:var(--surface-2)}
.pv-list button[aria-current="true"]{background:var(--ink); color:var(--bg)}
.pv-list button small{margin-left:auto; font-size:14px; color:var(--muted); font-weight:700}
.pv-list button[aria-current="true"] small{color:var(--bg); opacity:.7}
.pv-sh{display:grid; gap:16px}

  try{ doc = frame.contentDocument; }catch(e){ return; }
  /* a link inside the frame: arm just before the next page of the frame reads its prefs, never while the preview itself is leaving */
  try{ win.addEventListener("pagehide", function(){ if (leaving) return; arm(); if (loadEl) loadEl.classList.remove("off"); setTimeout(disarm, 4000); }); }catch(e){}
  try{ doc.head.insertAdjacentHTML("beforeend", '<style>.pv-bar{display:none!important}</style>'); doc.documentElement.classList.remove("pv-phone");
    if (st.th !== "system") doc.documentElement.setAttribute("data-theme", st.th); }catch(e){}
  loadEl && loadEl.classList.add("off");
  var u = box.querySelector("[data-url]"); if (u) u.textContent = addr();
  /* sync the screen picker with where the frame is now */
  try{ var path = win.location.pathname, i = path.indexOf("/pages"), rel = (i > -1 ? path.slice(i) : path) + win.location.hash, f = A.screenOf(rel);
    if (f && f.m === mod){ st.p = f.s.k; } else if (!(NOTE && st.p === "")) st.p = "";
    var sel = tools.querySelector("[data-scr]"); sel.innerHTML = optList(); saveHash(); }catch(e){}
  var nt = tools.querySelector("[data-newtab]"); try{ nt.href = frame.contentWindow.location.href; }catch(e){}
  if (pen) pen.retarget(win);
  if (NOTE && showNote){ showNote = false; setTimeout(function(){ var ok = SAPen.show(win, NOTE.selector, NOTE.text); noteBanner(ok); }, 350); } }

/* the note this preview was opened for */
function noteBanner(ok){ var old = stage.querySelector(".pv-nb"); old && old.remove();
  stage.insertAdjacentHTML("beforeend", '<div class="pv-nb' + (ok ? '' : ' warn') + '" role="status">' + ic(ok ? "pencil-simple" : "warning", 22) + '<span class="tx">' + (ok ? '<b>Бележка:</b> ' + esc(NOTE.text) : '<b>Елементът го няма на страницата.</b> Може да е променен или да е в друго състояние. Бележката: „' + esc(NOTE.text) + '“') + '</span><a class="pill pill-soft" href="notes.html">Бележките</a><button class="pill pill-line" type="button" data-hide-note>Скрий</button></div>'); }
stage.addEventListener("click", function(e){ if (e.target.closest("[data-hide-note]")){ stage.querySelector(".pv-nb").remove(); try{ SAPen.hide(frame.contentWindow); }catch(x){} } });

function saveHash(){ var h = {m:mod.id, p:st.p, d:st.d}; if (st.d === "tablet") h.o = st.land ? "land" : "port"; if (mod.time && st.t !== A.protoTime) h.t = st.t; if (st.th !== "system") h.th = st.th; if (st.z === "100") h.z = "100"; if (NOTE && st.custom) h.n = NOTE.id; A.setHash(h); }
function go(p){ st.p = p; NOTE = NOTE && st.custom ? NOTE : null; showNote = false; var old = stage.querySelector(".pv-nb"); old && old.remove(); saveHash(); loadEl.classList.remove("off"); arm(); frame.src = frameSrc(); var x = scr(); frame.title = mod.n + ": " + (x ? x.n : "екран"); }
function rebuild(){ saveHash(); build(); }

/* ---------- pencil (targets the frame) ---------- */
var pen = A.mountPen({module:function(){ return mod.id; }, target:function(){ return frame.contentWindow; }, viewport:function(){ return {w:st.vp[0], h:st.vp[1]}; },
  url:function(){ try{ var w = frame.contentWindow, p = w.location.pathname, i = p.indexOf("/pages"); return (i > -1 ? p.slice(i) : p) + w.location.hash; }catch(e){ return frameSrc(); } }, toastBottom:96});
A.pen = pen;

/* ---------- controls ---------- */
function setDev(k){ st.d = k; st.custom = null; if (k === "tablet" && H.o == null) st.land = !!mod.land; rebuildTools(); rebuild(); }
function rebuildTools(){ var g = tools.querySelector("[data-dev]").closest(".grp"); g.innerHTML = '<span class="pv-lb">Устройство</span>' + devSeg() + (st.d === "tablet" ? '<button class="pill pill-soft" type="button" data-rot>' + ic("arrow-clockwise",18) + (st.land ? 'Вертикално' : 'Хоризонтално') + '</button>' : ''); }
function setTheme(t){ st.th = t; document.querySelectorAll("[data-th]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.th === t)); }); saveHash(); loadEl.classList.remove("off"); arm(); try{ frame.contentWindow.location.reload(); }catch(e){ frame.src = frameSrc(); } }
function setTime(t){ st.t = t; document.querySelectorAll("[data-time]").forEach(function(s){ s.value = t; }); saveHash(); loadEl.classList.remove("off"); arm(); try{ frame.contentWindow.location.reload(); }catch(e){ frame.src = frameSrc(); } }
function step(n){ var all = mod.screens.concat(mod.states || []), i = Math.max(0, all.map(function(x){ return x.k; }).indexOf(st.p)); go(all[(i + n + all.length) % all.length].k); }
document.addEventListener("click", function(e){ var t = e.target.closest("[data-dev],[data-th],[data-z],[data-reload],[data-rot],[data-step],[data-fb],[data-pick]"); if (!t) return;
  if (t.dataset.dev){ setDev(t.dataset.dev); document.querySelectorAll("[data-dev]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.dev === st.d)); }); return; }
  if (t.dataset.th){ setTheme(t.dataset.th); return; }
  if (t.dataset.z){ st.z = t.dataset.z; document.querySelectorAll("[data-z]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.z === st.z)); }); saveHash(); layout(); return; }
  if (t.hasAttribute("data-reload")){ loadEl.classList.remove("off"); arm(); try{ frame.contentWindow.location.reload(); }catch(x){ frame.src = frameSrc(); } return; }
  if (t.hasAttribute("data-rot")){ st.land = !st.land; H.o = st.land ? "land" : "port"; rebuildTools(); rebuild(); return; }
  if (t.dataset.step){ step(+t.dataset.step); return; }
  if (t.dataset.pick){ go(t.dataset.pick); var w = t.closest(".sheetwrap"); w && w.querySelector("[data-close]").click(); return; }
  if (t.dataset.fb === "screen"){ var s = A.sheet({title:mod.n + ": екран", html:'<div class="pv-sh"><div class="field"><label for="pv-m2">Модул</label><select class="input" id="pv-m2" data-mod>' + mods.map(function(m){ return '<option value="' + m.id + '"' + (m === mod ? ' selected' : '') + '>' + esc(m.n) + '</option>'; }).join("") + '</select></div>' +
      '<div><span class="label">Екрани</span><div class="pv-list">' + mod.screens.map(li).join("") + '</div></div>' + (mod.states ? '<div><span class="label">Състояния</span><div class="pv-list">' + mod.states.map(li).join("") + '</div></div>' : '') + '</div>'}); return; }
  if (t.dataset.fb === "device"){ A.sheet({title:"Устройство и изглед", html:'<div class="pv-sh"><div class="field"><span class="label">Устройство</span>' + devSeg() + '</div>' + (mod.time ? '<div class="field"><label for="pv-t2">Час на деня</label>' + timeSel("pv-t2") + '</div>' : '') +
      '<div class="field"><span class="label">Тема в рамката</span>' + themeSeg() + '</div><div class="field"><span class="label">Мащаб</span>' + zoomSeg() + '</div><div class="pv-acts"><button class="pill pill-line" type="button" data-reload>' + ic("arrow-clockwise",18) + 'Презареди</button><a class="pill pill-line" href="' + esc(tools.querySelector("[data-newtab]").href || frameSrc()) + '" data-newtab2 target="_blank" rel="noopener">' + ic("arrow-up-right",18) + 'Нов раздел</a></div></div>'}); layout(); return; }
});
function li(x){ return '<button type="button" data-pick="' + x.k + '"' + (x.k === st.p ? ' aria-current="true"' : '') + '>' + esc(x.n) + '<small>' + esc(x.f.split("#")[0]) + '</small></button>'; }
document.addEventListener("change", function(e){ var t = e.target;
  if (t.matches("[data-scr]")){ go(t.value); return; }
  if (t.matches("[data-time]")){ setTime(t.value); return; }
  if (t.matches("[data-mod]")){ var m = A.MOD[t.value]; location.hash = "m=" + m.id + "&p=" + m.screens[0].k + "&d=" + (m.dev || "phone"); location.reload(); } });
document.addEventListener("click", function(e){ var a = e.target.closest("[data-newtab], [data-newtab2]"); if (!a) return; arm(); setTimeout(disarm, 1500); });
var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(function(){ var was = phoneBare; if ((isPhoneUI() && st.d === "phone" && !st.custom) !== was) build(); else layout(); }, 120); });
build();
if (denied) A.toast("Нямате права за „" + denied.n + "“; показваме „" + mod.n + "“.");
})();
</script>
</body>
