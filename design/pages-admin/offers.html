<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Оферти и ваучери | Siracusa · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_admin.css">
<style>
/* Оферти и ваучери (автор 2). Само токени; ширини само с @container page. */
.of-policy{display:flex; gap:14px; align-items:flex-start; padding:16px 18px; border-radius:var(--r-core); background:var(--chip-dark); color:var(--on-chip-dark); box-shadow:var(--shadow)}
.of-policy > .ic{color:var(--ember); margin-top:2px}
.of-policy b{display:block; font-size:18px; letter-spacing:-.02em; margin-bottom:2px}
.of-policy p{margin:0; opacity:.9}
.of-tabs{margin:24px 0 16px}
@container page (max-width:560px){ .of-sh-p{flex:1 1 100%} }
@container page (min-width:700px){ .of-tabs .sa-tabs{display:inline-flex} }

/* offer cards */
.of-list{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:980px){ .of-list{grid-template-columns:repeat(2,minmax(0,1fr))} }
.of{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px 16px; padding:18px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); align-content:start}
.of.off{background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}
.of-num{width:76px; min-height:76px; border-radius:22px; display:grid; place-items:center; align-content:center; gap:0; padding:6px; background:var(--ember); color:var(--on-ember); text-align:center}
.of-num b{font-size:24px; letter-spacing:-.04em; line-height:1.05}
.of-num small{font-size:14px; font-weight:700; line-height:1.15}
.of-num .ic{color:var(--on-ember)}
.of.off .of-num{background:var(--surface-3); color:var(--ink)}
.of.off .of-num .ic{color:var(--ink)}
.of-h h3{margin:0; font-size:20px; letter-spacing:-.02em; line-height:1.2}
.of-h p{margin:4px 0 0; color:var(--muted)}
.of-rules{grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:6px}
.of-rules span{display:inline-flex; align-items:center; gap:6px; min-height:34px; padding:0 12px 0 10px; border-radius:999px; background:var(--surface-2); font-size:14px; font-weight:700; line-height:1.2}
.of.off .of-rules span{background:var(--surface)}
.of-rules .ic{color:var(--muted)}
.of-rules .warn{color:var(--warn); background:transparent; box-shadow:inset 0 0 0 1.5px currentColor}
.of-rules .warn .ic{color:var(--warn)}
.of-f{grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding-top:12px; border-top:1px solid var(--line)}
.of-f .sp{flex:1}
.of-sw{display:inline-flex; align-items:center; gap:2px; min-height:48px; padding:0 0 0 14px; border-radius:999px; background:var(--surface-2); font-weight:700; font-size:15px; cursor:pointer}
.of.off .of-sw{background:var(--surface)}
.of-sw input:disabled{cursor:not-allowed}

/* celebration settings */
.of-set{display:grid; gap:14px; padding:18px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); margin-top:12px}
.of-set h3{margin:0; font-size:20px; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.of-set h3 .ic{color:var(--red)}
.of-set .grid{display:grid; gap:14px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:820px){ .of-set .grid{grid-template-columns:minmax(0,3fr) minmax(0,2fr)} }
.of-set .seg button{font-size:15px; min-height:52px; padding:0 8px; white-space:normal; line-height:1.15}
.of-days{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.of-days .input{width:120px; font-weight:800}

/* codes */
.of-cols{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:900px){ .of-cols{grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start} }
.of-box{display:grid; gap:12px; padding:18px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); align-content:start}
.of-box h3{margin:0; font-size:20px; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.of-box h3 .ic{color:var(--red)}
.of-box p{margin:0}
.of-chk{display:flex; gap:8px; flex-wrap:wrap}
.of-chk .input{flex:1 1 220px; font-weight:800; letter-spacing:.02em; font-variant-numeric:tabular-nums; text-transform:uppercase}
.of-chk .input::placeholder{text-transform:none; font-weight:600; letter-spacing:0}
.of-res .sa-banner{min-height:0}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-weight:700; letter-spacing:.01em; font-size:15px}
.of-st{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:15px}
.of-st.ok{color:var(--ok)} .of-st.used{color:var(--muted)}
.of-codes{margin-top:12px}
.of-codes .pill{min-height:48px; padding:0 14px; font-size:15px}

/* inquiries */
.of-iq{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:900px){ .of-iq{grid-template-columns:repeat(2,minmax(0,1fr))} }
.iq{display:grid; gap:10px; padding:18px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); align-content:start}
.iq.done{background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}
.iq-t{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.iq-t .when{margin-left:auto; font-size:15px; color:var(--muted); font-weight:600}
.iq h3{margin:0; font-size:20px; letter-spacing:-.02em}
.iq .who{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; font-weight:600}
.iq .tel{font-variant-numeric:tabular-nums; font-weight:800}
.iq blockquote{margin:0; padding:10px 14px; border-radius:16px; background:var(--surface-2); box-shadow:inset 3px 0 0 var(--ember)}
.iq.done blockquote{background:var(--surface)}
.iq-f{display:flex; flex-wrap:wrap; gap:8px; padding-top:10px; border-top:1px solid var(--line)}
.st-new{background:var(--ink); color:var(--bg)}
.st-call{background:var(--ember); color:var(--on-ember)}

/* sheet form */
.of-form{display:grid; gap:18px; padding:4px 0 8px}
.of-form .two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.of-form .grp{display:grid; gap:8px}
.of-cx{display:flex; flex-wrap:wrap; gap:6px}
.of-cx .chip{min-height:48px; padding:0 14px}
.of-pct{position:relative}
.of-pct .input{padding-right:40px; font-weight:800}
.of-pct .u{position:absolute; right:16px; top:15px; font-weight:800; color:var(--muted); pointer-events:none}
.of-new{display:grid; gap:8px; padding:12px 14px; border-radius:18px; background:var(--surface-2)}
.of-new .mono{font-size:16px}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_admin.js"></script>
<script src="_seed-orders.js"></script><script src="_seed-res.js"></script>
<script src="_pencil.js"></script>
<script>
(function(){
var ic = A.ic, esc = A.esc, st = A.st;
A.liveHash = true;

var body = A.mount({section:"offers", title:"Оферти и ваучери", docTitle:"Оферти и ваучери",
  sub:"Офертите в сайта с правилата им (час, ден, канал, ястия), кодовете за отстъпка и запитванията за ваучер и рожден ден.",
  actions:'<button class="pill pill-red pill-lg" type="button" data-newoffer>' + ic("plus",22) + 'Нова оферта</button>',
  states:[["","Обичайно"],["loading","Зареждане"],["empty","Празно"],["error","Грешка"],["offline","Без връзка"]]});
if (!body) return;

/* ---------- данни ---------- */
var DAYS = [[1,"пн"],[2,"вт"],[3,"ср"],[4,"чт"],[5,"пт"],[6,"сб"],[0,"нд"]];
var CH = [["delivery","Доставка","moped"],["pickup","Вземане","storefront"],["table","Маса","chair"],["office","Офис","briefcase"]];
var ALLD = [1,2,3,4,5,6,0], ALLC = ["delivery","pickup","table","office"];
var ls = SC.lastSaturday().d;
/* офертите от сайта (design/pages/offers.html) с правилата от решенията; несигурното е [ЛИПСВА] */
function seedOffers(){ return [
  {id:"lunch30", kind:"pct", pct:30, ic:"bowl-food", title:"Обедното меню след 15:00", sub:"при вземане от място", text:"Отстъпката се смята сама в количката. След 15:00 обедното меню не се доставя.", on:true, r:{days:[1,2,3,4,5], from:"15:00", to:"22:30", ch:["pickup"], dish:"lunch"}, rule:"Правило от решенията (19)", lock:true},
  {id:"signup", kind:"pct", pct:10, ic:"user", title:"Направете профил", sub:"от следващата поръчка", text:"Веднъж на телефонен номер, дори след изтриване на профила. Прилага се сам на следващата поръчка.", on:true, r:{days:ALLD, from:"10:00", to:"22:30", ch:["delivery","pickup"], dish:"all"}, rule:"Решение 27"},
  {id:"rating", kind:"pct", pct:10, ic:"chat-circle-dots", title:"Кажете ни как беше", sub:"за кратка оценка", text:"Еднакво при „Да“ и при „Не“. Код SC10- с 10 цифри, веднъж, на ястията (не на таксата), не се комбинира с -30%.", on:true, r:{days:ALLD, from:"10:00", to:"22:30", ch:["delivery","pickup","table"], dish:"all"}, rule:"Решение 30"},
  {id:"birthday", kind:"gift", pct:10, gift:"или малка торта", ic:"cake", title:"Рожден ден при нас", sub:"или малка торта", text:"Само с отделно съгласие „Искам подарък за рождения си ден“. Пишем седмица по-рано.", on:true, r:{days:ALLD, from:"10:00", to:"23:00", ch:["table"], dish:"all"}},
  {id:"celebration", kind:"pct", pct:5, ic:"confetti", title:"Ранна резервация на празник", sub:"от крайната цена", text:"Само за празник (не за тематични вечери). Показва се, щом зададете колко дни по-рано.", on:false, needs:"earlyDays", r:{days:ALLD, from:"10:00", to:"23:00", ch:["table"], dish:"all"}},
  {id:"loyalty", kind:"gift", ic:"seal-check", title:"Карта с печати", sub:"на 10-ия печат", text:"За какво се дава печат и каква е наградата: " + A.missing("правило и награда") + ".", on:false, needs:"loyalty", r:{days:ALLD, from:"10:00", to:"22:30", ch:ALLC, dish:"all"}},
  {id:"voucher", kind:"gift", ic:"gift", title:"Ваучер за подарък", sub:"сума по избор", text:"Запитване от сайта, плащане на място. Валидност: " + A.missing("от собственика") + ".", on:true, r:{days:ALLD, from:"10:00", to:"23:00", ch:["table","pickup"], dish:"all"}}]; }
var O = A.data.get("offers", null); if (!O){ O = seedOffers(); A.data.set("offers", O); }
function saveO(){ A.data.set("offers", O); }
/* настройки, общи с „Настройки“ (автор 3): полетата са като в ядрото (celebrationPrice, earlyDays) */
function S(){ return A.data.get("settings", {}); }
function setS(p){ A.data.update("settings", {}, function(s){ Object.keys(p).forEach(function(k){ s[k] = p[k]; }); }); }
function earlyDays(){ var v = S().earlyDays; return v == null ? null : v; }

var now = (A.now ? A.now() : new Date()).getTime(), H = 3600e3;
function seedCodes(){ return [
  {code:"SC10-4829163057", kind:"rating", pct:10, from:"№ 1046", at:new Date(now - 26 * H).toISOString(), used:null},
  {code:"SC10-7051938264", kind:"rating", pct:10, from:"№ 1044", at:new Date(now - 50 * H).toISOString(), used:{no:"№ 1049", at:new Date(now - 4 * H).toISOString()}},
  {code:"SC10-1386402975", kind:"rating", pct:10, from:"№ 1042", at:new Date(now - 74 * H).toISOString(), used:null},
  {code:"SC10-9917250468", kind:"rating", pct:10, from:"Маса 7", at:new Date(now - 98 * H).toISOString(), used:{no:"№ 1047", at:new Date(now - 30 * H).toISOString()}}]; }
var C = A.data.get("codes", null); if (!C){ C = seedCodes(); A.data.set("codes", C); }
function saveC(){ A.data.set("codes", C); }
var Q = (A.seed && A.seed.inquiries) ? A.seed.inquiries() : A.data.get("feedback-iq", []); /* примерните са в _seed-orders.js */
function saveQ(){ A.data.set("feedback-iq", Q); }

var tab = ["offers","codes","iq"].indexOf(A.hash.t) > -1 ? A.hash.t : "offers";
var check = {v:"", res:null};

/* ---------- части ---------- */
function daysTxt(d){ if (d.length === 7) return "Всеки ден"; var s = d.slice().sort(function(a, b){ return ((a || 7) - (b || 7)); }), n = s.map(function(x){ return x || 7; });
  var run = n.every(function(x, i){ return !i || x === n[i - 1] + 1; }); var nm = function(x){ return DAYS.filter(function(z){ return z[0] === x % 7; })[0][1]; };
  return run && n.length > 2 ? nm(n[0]) + " - " + nm(n[n.length - 1]) : n.map(nm).join(", "); }
function dishTxt(k){ return k === "lunch" ? "Обедно меню" : k === "all" ? "Всички ястия" : (SC.catById[k] ? SC.catById[k].n : k); }
function blocked(o){ if (o.needs === "earlyDays" && earlyDays() == null) return "Ранна резервация: " + A.missing("колко дни"); if (o.needs === "loyalty") return "Печат и награда: " + A.missing("правило"); return ""; }
function numHTML(o){ return o.kind === "pct" ? '<b>-' + o.pct + '%</b>' : o.pct ? '<b>-' + o.pct + '%</b><small>или торта</small>' : ic(o.ic, 36); }
function offerHTML(o){ var b = blocked(o), on = o.on && !b;
  return '<article class="of' + (on ? '' : ' off') + '" data-id="' + o.id + '" data-edit-id="admin.offers.offer"><div class="of-num" aria-hidden="true">' + numHTML(o) + '</div>' +
    '<div class="of-h"><h3>' + esc(o.title) + '</h3><p>' + esc(o.sub) + '</p></div>' +
    '<p style="grid-column:1 / -1; margin:0">' + o.text + '</p>' +
    '<div class="of-rules" aria-label="Правила">' + (b ? '<span class="warn">' + ic("warning-circle",16) + b + '</span>' : '') +
      '<span>' + ic("calendar-blank",16) + daysTxt(o.r.days) + '</span><span>' + ic("clock",16) + o.r.from + ' - ' + o.r.to + '</span>' +
      '<span>' + ic("storefront",16) + o.r.ch.map(function(c){ return CH.filter(function(z){ return z[0] === c; })[0][1]; }).join(", ") + '</span><span>' + ic("fork-knife",16) + dishTxt(o.r.dish) + '</span>' +
      (o.mine ? '<span>' + ic("pencil-simple",16) + 'Добавена от вас</span>' : '') + '</div>' +
    '<div class="of-f"><label class="of-sw">В сайта<span class="sa-switch"><input type="checkbox" role="switch" data-on aria-label="В сайта: ' + esc(o.title) + '"' + (on ? ' checked' : '') + (b ? ' disabled' : '') + '><span class="tr"></span></span></label><span class="sp"></span>' +
      '<button class="pill pill-line" type="button" data-rules aria-label="Правила: ' + esc(o.title) + '">' + ic("sliders-horizontal",20) + 'Правила</button></div></article>'; }

function policy(){ return '<div class="of-policy" data-edit-id="admin.offers.policy">' + ic("shield-check",26) + '<div><b>Никаква отстъпка срещу отзив в Google.</b><p>Отстъпката -10% е само за вътрешната оценка, еднаква при „Да“ и при „Не“. Линкът за отзив в Google се показва и при двата отговора и не е свързан с код. Такава оферта не може да се добави.</p></div></div>'; }
function celebration(){ var s = S(), cp = s.celebrationPrice || "offer", ed = earlyDays();
  return '<section class="of-set" aria-labelledby="h-cel" data-edit-id="admin.offers.celebration"><h3 id="h-cel">' + ic("confetti",22) + 'Празник при нас</h3><div class="grid">' +
    '<div class="grp" style="display:grid; gap:8px"><span class="label">Цена в калкулатора на празник</span><div class="seg" role="group" aria-label="Цена в калкулатора"><button type="button" data-cp="estimate" aria-pressed="' + (cp === "estimate") + '">Ориентировъчна цена</button><button type="button" data-cp="offer" aria-pressed="' + (cp === "offer") + '">Само оферта</button></div>' +
      '<span class="help" style="font-size:14px; color:var(--muted)">' + (cp === "estimate" ? "Клиентът вижда ориентировъчна сума, преди да изпрати запитването." : "Клиентът изпраща запитване; управителят се обажда с оферта.") + ' Логиката на цените: ' + A.missing("торти, украса, пакети") + '.</span></div>' +
    '<div class="field"><label for="of-ed">Ранна резервация: колко дни по-рано</label><div class="of-days"><input class="input" id="of-ed" inputmode="numeric" maxlength="3" autocomplete="off" value="' + (ed == null ? '' : ed) + '" placeholder="дни" aria-describedby="of-ed-h of-ed-e"><button class="pill pill-line" type="button" data-saveed>' + ic("check",20) + 'Запази</button></div>' +
      '<span class="help" id="of-ed-h">' + (ed == null ? 'Сега: ' + A.missing("колко дни") + '. Без него -5% не се показва никъде.' : 'Сега: -5% при резервация поне ' + A.plural(ed, "ден", "дни") + ' по-рано.') + '</span><span class="err" id="of-ed-e" hidden></span></div></div></section>'; }

function tabsHTML(){ var nNew = Q.filter(function(q){ return q.st === "new"; }).length;
  return '<div class="of-tabs" data-edit-id="admin.offers.tabs"><div class="sa-tabs" role="tablist" aria-label="Оферти и ваучери">' +
    [["offers","Оферти", st === "empty" ? 0 : O.length],["codes","Кодове", st === "empty" ? 0 : C.length],["iq","Запитвания", st === "empty" ? 0 : nNew]].map(function(t){ return '<button type="button" role="tab" id="tb-' + t[0] + '" aria-controls="tp" aria-selected="' + (tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + '<span class="c">' + t[2] + '</span></button>'; }).join("") + '</div></div>'; }

function offersTab(){ if (st === "empty") return '<div class="sa-card">' + A.empty({icon:"seal-percent", title:"Още няма оферти.", text:"Добавете първата: правила по час, ден, канал и ястия. Включва се в сайта, когато решите.", action:'<button class="pill pill-red pill-lg" type="button" data-newoffer>' + ic("plus",22) + 'Нова оферта</button>'}) + '</div>';
  var on = O.filter(function(o){ return o.on && !blocked(o); }), off = O.filter(function(o){ return !(o.on && !blocked(o)); });
  return '<div class="sa-sh" style="margin-top:8px"><h2>В сайта · ' + on.length + '</h2><p class="of-sh-p">Гръцката вечер е в „Събития“.</p></div><div class="of-list">' + on.map(offerHTML).join("") + '</div>' +
    (off.length ? '<div class="sa-sh"><h2>Изключени · ' + off.length + '</h2><p>Не се виждат в сайта.</p></div><div class="of-list">' + off.map(offerHTML).join("") + '</div>' : '') + celebration(); }

function normCode(c){ var s = String(c || "").toUpperCase().replace(/[\s-]/g, ""); if (/^SCV/.test(s)) return "SCV-" + s.slice(3); return s.indexOf("SC10") === 0 ? "SC10-" + s.slice(4) : "SC10-" + s; }
function codeRes(){ var r = check.res; if (!r) return "";
  if (r.k === "bad") return A.banner({tone:"danger", icon:"warning", title:"Няма такъв код.", text:"Проверете цифрите, например SC10-4829163057."});
  if (r.k === "used") return A.banner({tone:"warn", icon:"warning-circle", title:"Този код вече е използван.", text:esc("На " + r.c.used.no + ", " + A.ago(r.c.used.at) + ".")});
  return A.banner({tone:"ok", icon:"check-circle", title:"Валиден код · " + (r.c.sum ? SC.fmt(r.c.sum) + " ваучер" : "-" + r.c.pct + "% на ястията"), text:esc((r.c.kind === "rating" ? "От оценката на " + r.c.from : "Генериран" + (r.c.note ? ": " + r.c.note : "")) + ", " + A.ago(r.c.at) + ". Още не е използван." + (r.c.kind === "rating" ? " Не се комбинира с -30% на обедното." : ""))}); }
function codesTab(){ var list = st === "empty" ? [] : C;
  return '<div class="of-cols"><section class="of-box" aria-labelledby="h-chk" data-edit-id="admin.offers.check"><h3 id="h-chk">' + ic("magnifying-glass",22) + 'Проверка на код</h3><p class="muted">Кодът от оценката е SC10- и 10 цифри. Еднократен е; отбелязва се като използван от записаната поръчка.</p>' +
      '<form class="of-chk" data-chk novalidate><label class="vh" for="of-code">Код</label><input class="input" id="of-code" autocomplete="off" spellcheck="false" placeholder="SC10-4829163057" value="' + esc(check.v) + '"><button class="pill pill-ink" type="submit">' + ic("check",20) + 'Провери</button></form><div class="of-res" data-res aria-live="polite">' + codeRes() + '</div></section>' +
