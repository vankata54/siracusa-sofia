<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Дневник | Siracusa · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_admin.css">
<style>
.au-bar{display:grid; gap:10px; grid-template-columns:minmax(0,1fr); margin-bottom:16px}
@container page (min-width:820px){ .au-bar{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)} }
.au-bar .chips{grid-column:1 / -1; margin:0; padding:2px 0; flex-wrap:wrap; overflow:visible}
@container page (max-width:560px){ .au-bar .chips{flex-wrap:nowrap; overflow-x:auto; margin:0 -16px; padding:2px 16px} }
.au-sum{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin:0 0 14px; color:var(--muted); font-weight:600; font-size:15px}
.au-sum b{color:var(--ink)}
.au-day{margin:0 0 18px}
.au-day h2{position:sticky; top:76px; z-index:2; display:inline-flex; align-items:center; gap:8px; margin:0 0 10px; padding:8px 14px; border-radius:999px; background:var(--glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); box-shadow:inset 0 0 0 1px var(--glass-line); font-size:16px; font-weight:800}
@container app (min-width:700px){ .au-day h2{top:88px} }
.au-day h2 small{font-size:14px; color:var(--muted); font-weight:700}
.au-list{border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); overflow:hidden}
.au-e{display:grid; grid-template-columns:64px 44px minmax(0,1fr); gap:12px; align-items:start; padding:14px 16px; border-bottom:1px solid var(--line); position:relative}
.au-e:last-child{border-bottom:0}
.au-e .t{font-weight:800; font-variant-numeric:tabular-nums; padding-top:10px}
.au-e .dot{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--ink)}
.au-e.g-login .dot{color:var(--ok)}
.au-e.g-fail .dot{background:var(--red); color:var(--on-red)}
.au-e.g-roles .dot, .au-e.g-staff .dot{background:var(--ink); color:var(--bg)}
.au-e.g-menu .dot, .au-e.g-lunch .dot{background:var(--ember); color:var(--on-ember)}
.au-e .tx{min-width:0}
.au-e .tx p{margin:0; font-weight:700; font-size:16px; overflow-wrap:anywhere; line-height:1.4}
.au-e .meta{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:4px; font-size:15px; color:var(--muted); font-weight:600}
.au-e .meta code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:14px; padding:1px 8px; border-radius:8px; background:var(--surface-2); color:var(--ink)}
.au-e.smpl .dot{outline:2px dashed var(--line-strong); outline-offset:3px}
.au-e .smp{font-size:14px; font-weight:700; color:var(--muted); box-shadow:inset 0 0 0 1px var(--line-strong); border-radius:999px; padding:0 8px}
@container page (max-width:520px){ .au-e{grid-template-columns:44px minmax(0,1fr)} .au-e .t{grid-column:2; grid-row:1; padding:0; font-size:15px; color:var(--muted)} .au-e .dot{grid-row:1 / span 2} .au-e .tx{grid-column:2} }
.au-more{display:flex; justify-content:center; margin-top:16px}
.au-note{display:flex; gap:10px; align-items:flex-start; padding:14px 16px; border-radius:22px; background:var(--surface); box-shadow:var(--hi), var(--shadow); margin-bottom:16px; font-size:15px; color:var(--muted)}
.au-note .ic{flex:none; margin-top:2px; color:var(--ink)}
.au-note b{color:var(--ink)}
/* листове: дългите думи в долните бутони се пренасят, не излизат извън листа */
.sa-sfoot .pill{white-space:normal; text-align:center; line-height:1.15; padding:0 14px}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_admin.js"></script>
<script src="_seed-orders.js"></script>
<script src="_res-lib.js"></script>
<script src="_seed-res.js"></script>
<script src="_pencil.js"></script>
<script>
(function(){
var ic = A.ic, esc = A.esc, st = A.st;
A.liveHash = true;
var body = A.mount({section:"audit", title:"Дневник",
  sub:"Кой, кога и какво е променил: входове, роли и права, меню, обедно меню, бележки, резервации, клиенти, залата и настройките.",
  actions:'<button class="pill pill-line" type="button" data-csv>' + ic("export",20) + 'Изтегли CSV</button>',
  states:[["","Обичайно"],["loading","Зареждане"],["empty","Празно"],["error","Грешка"],["offline","Без връзка"]]});
if (!body) return;

/* ---------- групи по ключа на действието (като в ядрото: staff.login, role.update, menu.soldout ...) ---------- */
var now = A.now || function(){ return new Date(); };
var G = [["login","Вход","sign-in"],["fail","Грешен вход","warning"],["roles","Роли","shield-check"],["staff","Персонал","users-three"],["menu","Меню","fork-knife"],["lunch","Обедно","bowl-food"],["orders","Поръчки","receipt"],["sales","Продажби","seal-percent"],["notes","Бележки","pencil-simple"],["res","Резервации и клиенти","calendar-check"],["hall","Залата и QR","chair"],["settings","Настройки","sliders-horizontal"],["other","Друго","list-bullets"]];
function group(a){ a = String(a || "");
  if (a === "staff.login_failed") return "fail"; if (a === "staff.login" || a === "staff.logout") return "login"; if (/^role\./.test(a)) return "roles"; if (/^staff\./.test(a)) return "staff";
  if (/^menu\./.test(a)) return "menu"; if (/^lunch\./.test(a)) return "lunch"; if (/^order\./.test(a)) return "orders"; if (/^(offer|event|zone|code|voucher)\./.test(a)) return "sales";
  if (/^note\./.test(a)) return "notes"; if (/^(reservation|customer|feedback)\./.test(a)) return "res";
  if (/^(hall|qr)\./.test(a)) return "hall"; if (/^settings\./.test(a)) return "settings"; return "other"; }
function gOf(id){ return G.filter(function(g){ return g[0] === id; })[0]; }

/* ---------- примерни записи (отбелязани) + истинските от този прототип (sa-audit) ---------- */
/* примерите са в работно време по часа на прототипа A.now(): E(дни назад, "ЧЧ:ММ", …); днешните само до часа на прототипа */
function sample(){ var out = [], dishes = SC.items.filter(function(x){ return x.cat === "skara-bertha" || x.cat === "pitsi"; }), L = SC.lunch, T = A.rl.today(), NM = A.rl.nowMin();
  function day(d){ var p = T.split("-").map(Number), k = new Date(Date.UTC(p[0], p[1] - 1, p[2] - d, 10)); return k.getUTCFullYear() + "-" + String(k.getUTCMonth() + 1).padStart(2, "0") + "-" + String(k.getUTCDate()).padStart(2, "0"); }
  function E(d, t, who, role, action, text, target){ var m = +t.slice(0, 2) * 60 + +t.slice(3); if (!d && m > NM) return; out.push({id:"s" + out.length, at:A.rl.isoAt(day(d), m), who:who, role:role, action:action, text:text, target:target || null, sample:true}); }
  /* съгласувано с другите екрани: „Натоварено“ е изключено преди 19:42 (Настройки: обичаен режим), изчерпаното е това от A.soldOutToday() */
  var KS = (A.rl && A.rl.settings ? A.rl.settings().kitchen : null) || {}, nMin = +KS.etaMin || 35, bMin = +KS.etaBusyMin || nMin + 20;
  E(0, "19:30", "Управител 1", "manager", "settings.update", "„Натоварено“: изключено, около " + nMin + " мин");
  E(0, "18:55", "Управител 1", "manager", "settings.update", "„Натоварено“: включено, около " + bMin + " мин");
  /* само ястие, изчерпано днес с ключа (sa-soldout), не изчерпаното в данните на менюто */
  var SO = A.data.get("soldout", null), outId = SO && SO.date === A.todayKey() ? (SO.ids || []).filter(function(id){ return (SO.back || []).indexOf(id) < 0; })[0] : null;
  if (outId && SC.byId[outId]) E(0, "18:40", "Кухня · Скара", "kitchen", "menu.sold_out", "Изчерпано днес: „" + SC.byId[outId].n + "“", outId);
  E(0, "16:10", "Поли", "admin", "note.create", "Нова бележка: Заглавието да е на два реда на телефон.");
  E(0, "15:02", "?", "", "staff.login_failed", "Грешен вход: потребител „waiter2“");
  E(0, "13:05", "Управител 1", "manager", "reservation.status", "Резервация Клиент 14, 13:00: Потвърдена → Дошли");
  E(0, "10:12", "Управител 1", "manager", "staff.login", "Вход");
  E(1, "21:40", "Собственик 1", "owner", "customer.export", "Изтеглени данните на Клиент 22 (GDPR)");
  E(1, "21:31", "Собственик 1", "owner", "staff.login", "Вход");
  E(1, "10:20", "Управител 1", "manager", "lunch.update", "Обедно меню за сряда: добавено „" + (L[0] ? L[0].n : "ястие") + "“");
  E(1, "10:24", "Управител 1", "manager", "lunch.publish", "Обедното меню е публикувано в сайта");
  E(2, "11:15", "Поли", "admin", "role.update", "Права на „Маркетинг“: + Събития");
  E(2, "20:12", "Управител 1", "manager", "order.status", "№ 1031: Готви се → Готова");
  E(3, "12:05", "Маркетинг 1", "marketing", "offer.update", "Оферта „Рожден ден при нас“: включена");
  E(6, "21:02", "Управител 1", "manager", "customer.block", "Блокиран номер 0889 ** ** 93 (Клиент 9)");
  E(6, "11:40", "Поли", "admin", "staff.create", "Нов потребител: Шофьор 2 (driver2), роля „Шофьор“");
  E(6, "11:43", "Поли", "admin", "staff.pin", "Зададен ПИН: Сервитьор 2");
  E(8, "10:30", "Управител 1", "manager", "hall.update", "План на залата: маса 6: само с резервация");
  E(8, "10:41", "Управител 1", "manager", "qr.print", "Печат на QR етикети: 8 маси (13, 14, 15, 16, 17, 18, 19, 20)");
  E(9, "14:20", "Поли", "admin", "menu.update", "Етикети на „" + dishes[0].n + "“: + Хит");
  E(10, "16:05", "Поли", "admin", "note.status", "Бележка в работа: Заглавието на екрана да е по-голямо.");
  E(12, "11:00", "Управител 1", "manager", "staff.deactivate", "Деактивиран: Сервитьор 3 (waiter3)");
  E(13, "10:50", "Собственик 1", "owner", "settings.update", "Колко време е масата на гостите: 120 мин");
  return out; }
var REAL = A.data.get("audit", []), ALLE = st === "empty" ? [] : REAL.map(function(e){ return Object.assign({}, e); }).concat(sample()).sort(function(a, b){ return a.at < b.at ? 1 : -1; });
var f = {g:A.hash.g || "", who:A.hash.who || "", p:A.hash.p || "7", q:""}, shown = 60;
var PER = [["1","Днес"],["7","7 дни"],["30","30 дни"],["all","Всичко"]];
function inPeriod(e){ if (f.p === "all") return true; var d = A.sofia(new Date(e.at)), n = A.sofia(now()), a = Date.UTC(d.y, d.mo, d.d), b = Date.UTC(n.y, n.mo, n.d); return (b - a) / 864e5 < +f.p; }
function list(){ return ALLE.filter(function(e){ return inPeriod(e) && (!f.g || group(e.action) === f.g) && (!f.who || e.who === f.who) && (!f.q || A.norm(e.text + " " + e.who + " " + e.action).indexOf(A.norm(f.q)) > -1); }); }
function dayKey(iso){ var s = A.sofia(new Date(iso)); return s.y + "-" + s.mo + "-" + s.d; }
function dayTitle(iso){ var s = A.sofia(new Date(iso)), n = A.sofia(now()), dd = Math.round((Date.UTC(n.y, n.mo, n.d) - Date.UTC(s.y, s.mo, s.d)) / 864e5); return (dd === 0 ? "Днес · " : dd === 1 ? "Вчера · " : "") + A.fmtDate(new Date(iso)); }

function draw(){ var y = A.scroller.scrollTop;
  if (st === "loading"){ body.innerHTML = A.skel(6, "Зареждаме дневника …"); return; }
  if (st === "error"){ body.innerHTML = A.error("Не успяхме да заредим дневника. Записите се пазят; опитайте пак."); return; }
  var L = list(), who = ALLE.map(function(e){ return e.who; }).filter(function(w, i, a){ return w && w !== "?" && a.indexOf(w) === i; }).sort(function(a, b){ return a.localeCompare(b, "bg"); });
  var days = [], cur = null; L.slice(0, shown).forEach(function(e){ var k = dayKey(e.at); if (!cur || cur.k !== k){ cur = {k:k, at:e.at, items:[]}; days.push(cur); } cur.items.push(e); });
  body.innerHTML = (st === "offline" ? A.offline("Показваме последно заредените записи. Новите се появяват, щом връзката се върне.") + '<div style="height:16px"></div>' : '') +
    '<div class="au-note" data-edit-id="admin.audit.note">' + ic("lock",20) + '<span><b>Само за четене.</b> Записите не се трият и не се променят; пазят се ' + A.missing("срок на пазене") + '. Паролите и ПИН кодовете никога не влизат в дневника, само че са сменени.</span></div>' +
    '<div class="au-bar"><div class="sa-field-s"><label class="vh" for="au-q">Търси в дневника</label>' + ic("magnifying-glass",20) + '<input class="input" id="au-q" type="search" placeholder="Търси: ястие, маса, човек" autocomplete="off" value="' + esc(f.q) + '"></div>' +
      '<div><label class="vh" for="au-w">Кой</label><select class="input" id="au-w" data-who><option value="">Всички хора</option>' + who.map(function(w){ return '<option' + (f.who === w ? ' selected' : '') + '>' + esc(w) + '</option>'; }).join("") + '</select></div>' +
      '<div><label class="vh" for="au-p">Период</label><select class="input" id="au-p" data-per>' + PER.map(function(p){ return '<option value="' + p[0] + '"' + (f.p === p[0] ? ' selected' : '') + '>' + p[1] + '</option>'; }).join("") + '</select></div>' +
      '<div class="chips" role="group" aria-label="Вид"><button class="chip" type="button" data-g="" aria-pressed="' + (!f.g) + '">Всичко</button>' + G.filter(function(g){ return ALLE.some(function(e){ return group(e.action) === g[0]; }); }).map(function(g){ return '<button class="chip" type="button" data-g="' + g[0] + '" aria-pressed="' + (f.g === g[0]) + '">' + ic(g[2],16) + g[1] + '</button>'; }).join("") + '</div></div>' +
    '<p class="au-sum"><span><b>' + A.plural(L.length, "запис", "записа") + '</b> · ' + PER.filter(function(p){ return p[0] === f.p; })[0][1].toLowerCase() + '</span>' + A.sample("Примерните записи са с пунктирен кръг") + '</p>' +
    (!L.length ? '<div class="sa-card">' + (st === "empty" ? A.empty({icon:"list-bullets", title:"Дневникът е празен.", text:"Всеки вход и всяка промяна в панела се записва тук: кой, кога и какво."}) : A.empty({icon:"funnel", title:"Нищо за този филтър.", text:"Изберете по-дълъг период или „Всичко“.", action:'<button class="pill pill-line pill-lg" type="button" data-clear>' + ic("x",20) + 'Махни филтрите</button>'})) + '</div>' :
    days.map(function(d){ return '<section class="au-day" aria-label="' + esc(dayTitle(d.at)) + '"><h2>' + esc(dayTitle(d.at)) + '<small>' + d.items.length + '</small></h2><div class="au-list" role="list">' + d.items.map(function(e){ var g = gOf(group(e.action));
      return '<div class="au-e g-' + g[0] + (e.sample ? ' smpl' : '') + '" role="listitem"><span class="t">' + A.hm(new Date(e.at)) + '</span><span class="dot" aria-hidden="true">' + ic(g[2],22) + '</span><div class="tx"><p>' + esc(e.text) + '</p><div class="meta"><span>' + (e.who && e.who !== "?" ? esc(e.who) + (e.role ? ' · ' + esc(A.roleName(e.role)) : '') : 'Непознат') + '</span>' + (A.me.role === "admin" ? '<code title="Ключ в ядрото">' + esc(e.action) + '</code>' : '') + (e.sample ? '<span class="vh">Примерен запис.</span>' : '') + '</div></div></div>'; }).join("") + '</div></section>'; }).join("") +
    (L.length > shown ? '<div class="au-more"><button class="pill pill-line pill-lg" type="button" data-more>Покажи още ' + Math.min(60, L.length - shown) + '</button></div>' : ''));
  A.scroller.scrollTop = y; }
draw();
function hashSync(){ A.setHash(Object.assign({}, A.hash, {g:f.g, who:f.who, p:f.p === "7" ? "" : f.p})); }
document.addEventListener("click", function(e){ var t;
  if ((t = e.target.closest("[data-g]")) && t.closest(".au-bar")){ f.g = t.dataset.g; shown = 60; hashSync(); draw(); return; }
  if (e.target.closest("[data-more]")){ shown += 60; draw(); return; }
  if (e.target.closest("[data-clear]")){ f = {g:"", who:"", p:"all", q:""}; hashSync(); draw(); return; }
  if (e.target.closest("[data-csv]")){ var rows = [["Кога","Кой","Роля","Действие","Какво","Примерен"]].concat(list().map(function(x){ return [x.at, x.who, A.roleName(x.role || ""), x.action, x.text, x.sample ? "да" : "не"]; }));
    A.download("siracusa-dnevnik.csv", "﻿" + rows.map(function(r){ return r.map(function(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }).join(";"); }).join("\n"), "text/csv"); A.toast("Изтеглени " + A.plural(list().length, "запис", "записа")); return; }
});
document.addEventListener("change", function(e){ if (e.target.matches("[data-who]")){ f.who = e.target.value; hashSync(); draw(); } if (e.target.matches("[data-per]")){ f.p = e.target.value; hashSync(); draw(); } });
body.addEventListener("input", function(e){ if (e.target.id !== "au-q") return; f.q = e.target.value; var pos = e.target.selectionStart; draw(); var i = body.querySelector("#au-q"); i.focus(); try{ i.setSelectionRange(pos, pos); }catch(x){} });
})();
</script>
</body>
</html>
