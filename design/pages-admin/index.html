html,body{overflow:auto}
.ix{max-width:1180px; margin:0 auto; padding:40px 16px 72px; container-type:inline-size; container-name:page}
.ix header{display:grid; gap:10px}
.ix .brand{display:flex; align-items:center; gap:10px}
