<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Зони за доставка | Siracusa · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_admin.css">
<style>
/* Зони за доставка (автор 2). Картата е същата схема като /dostavka/ (design/pages/delivery.html). Само токени. */
.zn{--z-free:color-mix(in srgb, var(--ok) 22%, var(--surface)); --z-free-2:color-mix(in srgb, var(--ok) 36%, var(--surface));
  --z-paid:color-mix(in srgb, var(--ember) 26%, var(--surface)); --z-hatch:color-mix(in srgb, var(--ember) 75%, var(--surface))}
.zn-sum{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px}
@container page (min-width:760px){ .zn-sum{grid-template-columns:repeat(4,minmax(0,1fr))} }
.zn-k{display:grid; gap:2px; align-content:start; min-height:96px; padding:16px 18px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow)}
.zn-k .lb{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--muted)}
.zn-k .lb .ic{color:var(--red)}
.zn-k .v{font-size:28px; font-weight:800; letter-spacing:-.04em; line-height:1.15; font-variant-numeric:tabular-nums}
@container page (max-width:520px){ .zn-k .v{font-size:24px} .zn-k{padding:14px} }
.zn-k .ft{font-size:14px; color:var(--muted); font-weight:600}
.zn-note{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:14px 0 0; padding:12px 12px 12px 16px; border-radius:22px; background:var(--surface-2)}
.zn-note > span{flex:1 1 300px; display:flex; gap:10px; align-items:flex-start}
.zn-note > span .ic{color:var(--muted); margin-top:2px}

.zn-lay{display:grid; gap:16px; grid-template-columns:minmax(0,1fr); margin-top:24px}
@container page (min-width:980px){ .zn-mapc{display:grid; grid-template-columns:minmax(0,1fr) 300px; grid-template-areas:"h h" "m l" "m n"; align-items:start} .zn-mh{grid-area:h} .zn-mapc .map{grid-area:m; max-height:560px} .zn-mapc .legend{grid-area:l; flex-direction:column; padding:16px 18px} .zn-mapnote{grid-area:n; border-top:0} }
.zn-mapc{border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); overflow:hidden}
.zn-mh{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px 6px}
.zn-mh h2{margin:0; font-size:22px; letter-spacing:-.03em; font-weight:800}
.zn-draw{display:inline-flex; align-items:center; gap:8px}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; margin:0; padding:6px 18px 10px; list-style:none; font-size:14px; font-weight:700; color:var(--muted)}
.legend li{display:inline-flex; align-items:center; gap:8px}
.sw{width:18px; height:18px; border-radius:6px; flex:none}
.sw.free{background:var(--z-free-2); box-shadow:inset 0 0 0 1.5px var(--ok)}
.sw.paid{background:repeating-linear-gradient(45deg, var(--z-hatch) 0 2px, var(--z-paid) 2px 6px); box-shadow:inset 0 0 0 1.5px var(--z-hatch)}
.sw.off{background:var(--surface-2); box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.map{display:block; width:100%; height:auto; touch-action:manipulation; user-select:none; -webkit-user-select:none}
.map .grid-dot{fill:var(--line-strong); opacity:.45}
.map .edge{fill:none; stroke:var(--line-strong); stroke-width:1.5; stroke-dasharray:2 6; stroke-linecap:round}
.map .z{cursor:pointer; transform-box:fill-box; transform-origin:center; transition:transform var(--t-slow) var(--ease); outline:none}
.map .z path{stroke:var(--surface); stroke-width:6; stroke-linejoin:round; transition:opacity var(--t-base) var(--ease)}
.map .z.free path.f{fill:var(--z-free)}
.map .z.paid path.f{fill:var(--z-paid)}
.map .z.paid path.h{fill:url(#zn-hatch); stroke:none; pointer-events:none}
.map .z.off path.f{fill:var(--surface-2)}
.map .z.off path.h{opacity:0}
.map .z path.sel{fill:var(--ok); stroke:none; opacity:0; pointer-events:none}
.map .z.paid path.sel{fill:var(--ember)}
.map .z.off path.sel{fill:var(--ink)}
.map .z.on{transform:scale(1.035)}
.map .z.on path.sel{opacity:1}
.map .z:hover path.f, .map .z:focus-visible path.f{fill:var(--z-free-2)}
.map .z.paid:hover path.f, .map .z.paid:focus-visible path.f{fill:color-mix(in srgb, var(--ember) 40%, var(--surface))}
.map .z:focus-visible path.f{stroke:var(--red)}
@container page (max-width:600px){ .map .zs{display:none} .map .zl{font-size:21px !important} .map .air text{font-size:17px} }
.map .zl{font:800 17px var(--font); letter-spacing:-.02em; fill:var(--ink); stroke:var(--surface); stroke-width:4px; stroke-linejoin:round; paint-order:stroke; pointer-events:none; text-anchor:middle}
.map .zs{font:700 14px var(--font); fill:var(--muted); stroke:var(--surface); stroke-width:4px; paint-order:stroke; pointer-events:none; text-anchor:middle}
.map .z.on .zl{fill:var(--on-ok); stroke:none}
.map .z.on .zs{fill:var(--on-ok); stroke:none}
.map .z.paid.on .zl, .map .z.paid.on .zs{fill:var(--on-ember)}
.map .z.off.on .zl, .map .z.off.on .zs{fill:var(--bg)}
.map .air path{fill:var(--surface-2); stroke:var(--surface); stroke-width:6; stroke-linejoin:round}
.map .air text{font:700 14px var(--font); fill:var(--muted); text-anchor:middle}
.map .pin .dotp{fill:var(--ink); stroke:var(--surface); stroke-width:3}
.map .pin .tag rect{fill:var(--ink)}
.map .pin .tag text{font:800 14px var(--font); fill:var(--bg); text-anchor:middle}
.zn-mapnote{display:flex; gap:8px; align-items:flex-start; padding:10px 18px 14px; font-size:14px; color:var(--muted); font-weight:600; border-top:1px solid var(--line)}

/* zone list */
.zn-list{display:grid; gap:10px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:700px){ .zn-list{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container page (min-width:1060px){ .zn-list{grid-template-columns:repeat(3,minmax(0,1fr))} }
.zn-z{padding:16px 16px 14px 18px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); display:grid; gap:12px; scroll-margin-top:100px; transition:box-shadow var(--t-base) var(--ease)}
.zn-z.on{box-shadow:inset 0 0 0 2px var(--ink), var(--shadow)}
.zn-z.off{background:var(--surface-2)}
.zn-zh{display:flex; align-items:center; gap:10px}
.zn-zh h3{margin:0; flex:1; min-width:0; font-size:21px; letter-spacing:-.03em; line-height:1.15}
.zn-zh h3 button{border:0; background:transparent; padding:0; font:inherit; color:inherit; cursor:pointer; text-align:left; min-height:48px}
.ztag{display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 12px 0 10px; border-radius:999px; font-size:14px; font-weight:800; white-space:nowrap}
.ztag.free{background:var(--ok); color:var(--on-ok)}
.ztag.paid{background:var(--ember); color:var(--on-ember)}
.ztag.off{background:var(--surface-3); color:var(--ink)}
.zn-facts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin:0}
.zn-facts div{display:grid; gap:0; padding:10px 12px; border-radius:16px; background:var(--surface-2); min-width:0}
.zn-z.off .zn-facts div{background:var(--surface)}
.zn-facts dt{font-size:14px; font-weight:700; color:var(--muted)}
.zn-facts dd{margin:0; font-weight:800; font-size:16px; line-height:1.3; overflow-wrap:anywhere}
.zn-facts dd .missing{font-weight:600; font-size:15px}
.zn-zf{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
.zn-on{display:inline-flex; align-items:center; gap:2px; min-height:48px; padding:0 0 0 14px; border-radius:999px; background:var(--surface-2); font-weight:700; font-size:15px; cursor:pointer}
.zn-z.off .zn-on{background:var(--surface)}

/* sheet */
.zn-form{display:grid; gap:18px; padding:4px 0 8px}
.zn-form .two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.zn-sw{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:60px; padding:6px 4px 6px 16px; border-radius:20px; background:var(--surface-2)}
.zn-sw small{display:block; font-size:14px; color:var(--muted); font-weight:600}
.zn-eu{position:relative}
.zn-eu .input{padding-right:44px; font-weight:800; font-variant-numeric:tabular-nums}
.zn-eu .u{position:absolute; right:16px; top:15px; font-weight:800; color:var(--muted); pointer-events:none}
.zn-prev{display:grid; gap:10px; padding:16px; border-radius:22px; background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--line)}
.zn-prev .t{display:flex; align-items:center; justify-content:space-between; gap:10px}
.zn-prev .t b{font-size:22px; letter-spacing:-.03em}
.zn-prev .kv dt{color:var(--muted); font-weight:600}
.zn-prev .kv dd{margin:0; font-weight:800; text-align:right}
.zn-prevh{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--muted); margin:0}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_admin.js"></script>
<script src="_seed-orders.js"></script><script src="_res-lib.js"></script><script src="_seed-res.js"></script>
<script src="_pencil.js"></script>
<script>
(function(){
var ic = A.ic, esc = A.esc, st = A.st;
A.liveHash = true;

var body = A.mount({section:"zones", title:"Зони за доставка", docTitle:"Зони за доставка",
  sub:"Кварталите, в които доставяме, с такса, минимална поръчка, време и часове. Клиентът вижда същата карта на страницата „Доставка“.",
  actions:'<a class="pill pill-ink pill-lg" href="preview.html#m=site&p=delivery&d=phone">' + ic("eye",22) + 'Виж в сайта</a>',
  states:[["","Обичайно"],["loading","Зареждане"],["empty","Празно"],["error","Грешка"],["offline","Без връзка"]]});
if (!body) return;

/* ---------- данни: SC.ZONES (истинските) + редакциите (sa-zones) ---------- */
var SHAPES = {
  "Гара Искър": {slug:"gara-iskar", d:"M24 92 L112 100 L124 156 L110 214 L44 206 L16 150 Z", lx:66, ly:146, two:["Гара","Искър"]},
  "НПЗ Искър":  {slug:"npz-iskar",  d:"M114 34 L212 26 L236 66 L226 110 L156 114 L112 100 Z", lx:172, ly:72},
  "Дружба 1":   {slug:"druzhba-1",  d:"M112 100 L156 114 L226 110 L236 166 L214 214 L110 214 L124 156 Z", lx:172, ly:164},
  "Дружба 2":   {slug:"druzhba-2",  d:"M236 66 L304 72 L330 116 L314 206 L214 214 L236 166 L226 110 Z", lx:274, ly:112},
  "Бусманци":   {slug:"busmantsi",  d:"M330 116 L398 132 L404 196 L362 232 L314 206 Z", lx:362, ly:172},
  "Горубляне":  {slug:"gorublyane", d:"M150 236 L304 226 L330 266 L290 294 L176 294 L140 266 Z", lx:236, ly:262}
};
var PIN = {x:272, y:168}; /* Siracusa: Дружба 2, срещу бл. 311 (мястото на схемата е приблизително) */
var OPEN = SC.RESTAURANT.open, LAST = SC.RESTAURANT.delivery; /* 10:00 и 21:00 */
function edits(){ return A.data.get("zones", {}); }
function zones(){ var e = edits(); return SC.ZONES.map(function(z){ var s = SHAPES[z.n], x = e[s.slug] || {};
  return {n:z.n, slug:s.slug, shape:s, free:x.free != null ? x.free : z.free, fee:x.fee != null ? x.fee : (z.fee == null ? null : z.fee), min:x.min != null ? x.min : null, eta:x.eta || z.etaMin, from:x.from || OPEN, to:x.to || LAST, on:x.on !== false, changed:!!e[s.slug]}; }); }
function bySlug(s){ return zones().filter(function(z){ return z.slug === s; })[0]; }
var sel = A.hash.z || null;

function feeHTML(z){ return z.free ? "Безплатно" : z.fee != null ? SC.fmt(z.fee) : A.missing("в €"); }
function minHTML(z){ return z.min != null ? SC.fmt(z.min) : A.missing("в €"); }
function kind(z){ return !z.on ? "off" : z.free ? "free" : "paid"; }
function tagHTML(z){ var k = kind(z); return '<span class="ztag ' + k + '">' + (k === "off" ? ic("x",16) + 'Не доставяме' : k === "free" ? ic("check",16) + 'Безплатна' : ic("money",16) + 'Платена') + '</span>'; }

/* ---------- карта ---------- */
function mapSVG(){ var dots = ""; for (var y = 14; y < 300; y += 22) for (var x = 12; x < 420; x += 22) dots += '<circle class="grid-dot" cx="' + x + '" cy="' + y + '" r="1.3"/>';
  var zs = zones(), list = st === "empty" ? [] : zs;
  var g = list.map(function(z){ var s = z.shape, k = kind(z), sub = k === "off" ? "изключена" : z.eta + " мин";
    var label = s.two ? '<text class="zl" x="' + s.lx + '" y="' + (s.ly - 8) + '">' + s.two[0] + '</text><text class="zl" x="' + s.lx + '" y="' + (s.ly + 11) + '">' + s.two[1] + '</text><text class="zs" x="' + s.lx + '" y="' + (s.ly + 30) + '">' + sub + '</text>'
                      : '<text class="zl" x="' + s.lx + '" y="' + (s.ly + 2) + '">' + z.n + '</text><text class="zs" x="' + s.lx + '" y="' + (s.ly + 21) + '">' + sub + '</text>';
    return '<g class="z ' + k + (z.on ? '' : ' off') + (sel === z.slug ? ' on' : '') + '" data-zone="' + z.slug + '" tabindex="0" role="button" aria-label="' + esc(z.n) + ': ' + (k === "off" ? "не доставяме" : (z.free ? "безплатна доставка" : "платена доставка") + ", около " + z.eta + " мин") + '"><path class="f" d="' + s.d + '"/>' + (z.free ? '' : '<path class="h" d="' + s.d + '"/>') + '<path class="sel" d="' + s.d + '"/>' + label + '</g>'; }).join("");
  return '<svg class="map" viewBox="0 0 420 304" role="group" aria-labelledby="zn-mt">' +
    '<title id="zn-mt">Схема на зоните за доставка</title>' +
    '<defs><pattern id="zn-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.2" height="7" style="fill:var(--z-hatch)"/></pattern></defs>' + dots +
    '<g class="air" aria-hidden="true"><path d="M246 6 L414 6 L414 112 L344 110 L314 60 L248 52 Z"/><text x="352" y="44">Летище</text><text x="352" y="62">София</text></g>' +
    '<path class="edge" d="M10 86 L108 26 L240 18 L310 64 L340 106 L410 124 L414 202 L366 244 L336 270 L296 302 L170 302 L132 270 L144 228 L104 222 L38 214 L8 150 Z"/>' + g +
    '<g class="pin" aria-hidden="true"><circle class="dotp" cx="' + PIN.x + '" cy="' + PIN.y + '" r="9"/><g class="tag"><rect x="' + (PIN.x - 40) + '" y="' + (PIN.y + 16) + '" width="80" height="26" rx="13"/><text x="' + PIN.x + '" y="' + (PIN.y + 33.5) + '">Siracusa</text></g></g></svg>'; }

function summary(){ var zs = zones().filter(function(z){ return z.on; }), fr = zs.filter(function(z){ return z.free; }).length, mins = zs.map(function(z){ return z.eta; });
  return '<div class="sa-shell" data-edit-id="admin.zones.summary"><div class="zn-sum">' +
    '<div class="zn-k"><span class="lb">' + ic("check-circle",20) + 'Безплатна доставка</span><span class="v">' + fr + '</span><span class="ft">' + (fr === 1 ? 'квартал' : 'квартала') + '</span></div>' +
    '<div class="zn-k"><span class="lb">' + ic("money",20) + 'Платена доставка</span><span class="v">' + (zs.length - fr) + '</span><span class="ft">такса: ' + (zs.some(function(z){ return !z.free && z.fee == null; }) ? A.missing("в €") : "въведена") + '</span></div>' +
    '<div class="zn-k"><span class="lb">' + ic("clock",20) + 'Време</span><span class="v">' + (mins.length ? Math.min.apply(null, mins) + ' - ' + Math.max.apply(null, mins) : '0') + '</span><span class="ft">минути, по квартали</span></div>' +
    '<div class="zn-k"><span class="lb">' + ic("moped",20) + 'Доставка</span><span class="v">до ' + LAST + '</span><span class="ft">от ' + OPEN + ', всеки ден</span></div></div></div>' +
    '<div class="zn-note" data-edit-id="admin.zones.busy"><span>' + ic("info",20) + '<span>„Натоварено“ и минутите при натоварване (+20 мин) са в „Настройки“. Те важат за всички квартали.</span></span>' + (A.can("settings") ? '<a class="pill pill-line" href="settings.html">' + ic("sliders-horizontal",20) + 'Към настройките</a>' : '') + '</div>'; }

function zoneHTML(z){ var k = kind(z);
  return '<article class="zn-z' + (sel === z.slug ? ' on' : '') + (z.on ? '' : ' off') + '" id="z-' + z.slug + '" data-slug="' + z.slug + '" data-edit-id="admin.zones.zone">' +
    '<div class="zn-zh"><h3><button type="button" data-pick="' + z.slug + '">' + esc(z.n) + '</button></h3>' + tagHTML(z) + '</div>' +
    '<dl class="zn-facts"><div><dt>Такса</dt><dd>' + feeHTML(z) + '</dd></div><div><dt>Минимална поръчка</dt><dd>' + minHTML(z) + '</dd></div><div><dt>Време</dt><dd>около ' + z.eta + ' мин</dd></div><div><dt>Часове</dt><dd>' + z.from + ' - ' + z.to + '</dd></div></dl>' +
    '<div class="zn-zf"><label class="zn-on">Доставяме<span class="sa-switch"><input type="checkbox" role="switch" data-on aria-label="Доставяме в ' + esc(z.n) + '"' + (z.on ? ' checked' : '') + '><span class="tr"></span></span></label>' +
    (z.changed ? '<span class="sa-tag">' + ic("pencil-simple",16) + 'Променено</span>' : '') +
    '<button class="pill pill-line" type="button" data-edit aria-label="Промени ' + esc(z.n) + '">' + ic("pencil-simple",20) + 'Промени</button></div></article>'; }

function draw(keep){
  if (st === "loading"){ body.innerHTML = A.skel(5, "Зареждаме зоните …"); return; }
  if (st === "error"){ body.innerHTML = A.error("Не успяхме да заредим зоните. Сайтът проверява адресите по последните запазени зони."); return; }
  var y = A.scroller.scrollTop, zs = zones();
  var mapCard = '<section class="zn-mapc" aria-labelledby="zn-mh" data-edit-id="admin.zones.map"><div class="zn-mh"><h2 id="zn-mh">Картата</h2><button class="pill pill-line zn-draw" type="button" disabled>' + ic("pencil-simple",20) + 'Нарисувай зона · Скоро</button></div>' +
    '<ul class="legend"><li><span class="sw free"></span>Безплатна</li><li><span class="sw paid"></span>Платена</li><li><span class="sw off"></span>Не доставяме</li></ul>' + mapSVG() +
    '<p class="zn-mapnote">' + ic("info",18) + '<span>Схема без мащаб, като на страницата „Доставка“. Изберете квартал на картата или в списъка.</span></p></section>';
  var list = st === "empty" ? '<div class="sa-card">' + A.empty({icon:"map-trifold", title:"Още няма зони за доставка.", text:"Без зона сайтът приема само „Вземи от място“. Рисуването на зона на картата идва скоро; дотогава зоните се добавят от главния админ."}) + '</div>'
    : '<div class="zn-list">' + zs.map(zoneHTML).join("") + '</div>';
  body.innerHTML = '<div class="zn">' + (st === "offline" ? A.offline("Показваме последно заредените зони. Промените се пазят тук и се изпращат, щом има връзка.") + '<div style="height:16px"></div>' : '') +
    summary() + '<div class="zn-lay">' + mapCard + list + '</div></div>';
  if (keep) A.scroller.scrollTop = y; }
draw();

function pick(slug, scroll){ sel = sel === slug && !scroll ? null : slug; A.setHash(Object.assign({}, A.st ? {st:A.st} : {}, sel ? {z:sel} : {}));
  body.querySelectorAll(".map .z").forEach(function(g){ g.classList.toggle("on", g.dataset.zone === sel); });
  body.querySelectorAll(".zn-z").forEach(function(c){ c.classList.toggle("on", c.dataset.slug === sel); });
  if (sel && scroll){ var c = body.querySelector("#z-" + sel); c && c.scrollIntoView({block:"nearest", behavior:SC.reduce ? "auto" : "smooth"}); } }
function offlineNote(){ return st === "offline" ? " Ще се изпрати, щом има връзка." : ""; }
function setZone(slug, patch){ A.data.update("zones", {}, function(e){ e[slug] = Object.assign({}, e[slug] || {}, patch); }); }

body.addEventListener("click", function(e){ var t;
  if ((t = e.target.closest(".map .z"))){ pick(t.dataset.zone, true); return; }
  if ((t = e.target.closest("[data-pick]"))){ pick(t.dataset.pick, false); return; }
  if ((t = e.target.closest("[data-edit]"))){ edit(t.closest("[data-slug]").dataset.slug); return; } });
body.addEventListener("keydown", function(e){ var g = e.target.closest && e.target.closest(".map .z"); if (g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); pick(g.dataset.zone, true); } });
body.addEventListener("change", function(e){ var t = e.target; if (!t.matches("[data-on]")) return; var slug = t.closest("[data-slug]").dataset.slug, z = bySlug(slug), on = t.checked, prev = A.data.get("zones", {})[slug];
  setZone(slug, {on:on}); draw(true); var nt = body.querySelector("#z-" + slug + " [data-on]"); nt && nt.focus({preventScroll:true});
  var txt = (on ? "Доставяме отново в " : "Спряна доставка в ") + z.n; A.audit("zones.update", txt, slug);
  A.toast(txt + offlineNote(), {undo:function(){ A.data.update("zones", {}, function(x){ if (prev) x[slug] = prev; else delete x[slug]; }); draw(true); A.audit("zones.update", "Отменено: " + txt, slug); }}); });

/* ---------- лист: промяна на зона ---------- */
function times(from, to){ var o = []; for (var m = 600; m <= 1260; m += 30){ var t = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); if (m >= from && m <= to) o.push(t); } return o; }
function mins(t){ var p = t.split(":"); return +p[0] * 60 + +p[1]; }
function num(p){ return p == null ? "" : (Math.round(p * 100) / 100).toFixed(2).replace(".", ","); }
function eur(s){ var v = String(s || "").replace(/\s/g, "").replace(",", "."); if (!v) return null; return /^\d{1,3}(\.\d{1,2})?$/.test(v) ? +v : NaN; }
function edit(slug){ var z = bySlug(slug); pick(slug, false); if (sel !== slug) pick(slug, false);
  var etas = []; for (var m = 15; m <= 90; m += 5) etas.push(m);
  var html = '<form class="zn-form" novalidate data-edit-id="admin.zones.sheet">' +
    '<div class="zn-sw"><span><b>Доставяме в квартала</b><small>Изключено: адресът се отказва с „Изберете „Вземи от място““</small></span><span class="sa-switch"><input type="checkbox" role="switch" name="on" aria-label="Доставяме в квартала"' + (z.on ? ' checked' : '') + '><span class="tr"></span></span></div>' +
    '<div class="zn-sw"><span><b>Безплатна доставка</b><small>По решение: Дружба 1 и 2, НПЗ Искър, Бусманци</small></span><span class="sa-switch"><input type="checkbox" role="switch" name="free" aria-label="Безплатна доставка"' + (z.free ? ' checked' : '') + '><span class="tr"></span></span></div>' +
    '<div class="two"><div class="field" data-feef><label for="zf-fee">Такса</label><div class="zn-eu"><input class="input" id="zf-fee" name="fee" inputmode="decimal" autocomplete="off" value="' + num(z.fee) + '" placeholder="[ЛИПСВА]" aria-describedby="zf-fee-e"><span class="u" aria-hidden="true">€</span></div><span class="err" id="zf-fee-e" hidden></span></div>' +
      '<div class="field"><label for="zf-min">Минимална поръчка</label><div class="zn-eu"><input class="input" id="zf-min" name="min" inputmode="decimal" autocomplete="off" value="' + num(z.min) + '" placeholder="[ЛИПСВА]" aria-describedby="zf-min-e"><span class="u" aria-hidden="true">€</span></div><span class="err" id="zf-min-e" hidden></span></div></div>' +
    '<p class="help" style="margin:-8px 0 0; font-size:14px; color:var(--muted)">Празно поле остава ' + A.missing("от собственика") + ' в сайта и в количката.</p>' +
    '<div class="field"><label for="zf-eta">Време за доставка</label><select class="input" id="zf-eta" name="eta">' + etas.map(function(m){ return '<option value="' + m + '"' + (m === z.eta ? ' selected' : '') + '>около ' + m + ' мин</option>'; }).join("") + '</select><span class="help">Клиентът вижда „около ' + z.eta + ' мин“; при „Натоварено“ +20 мин.</span></div>' +
    '<div class="two"><div class="field"><label for="zf-from">От</label><select class="input" id="zf-from" name="from">' + times(600, 1230).map(function(t){ return '<option' + (t === z.from ? ' selected' : '') + '>' + t + '</option>'; }).join("") + '</select></div>' +
      '<div class="field"><label for="zf-to">До</label><select class="input" id="zf-to" name="to" aria-describedby="zf-to-e">' + times(630, 1260).map(function(t){ return '<option' + (t === z.to ? ' selected' : '') + '>' + t + '</option>'; }).join("") + '</select><span class="err" id="zf-to-e" hidden></span></div></div>' +
    '<span class="help" style="margin-top:-10px; font-size:14px; color:var(--muted)">Доставката е до ' + LAST + ' (кухнята приема до ' + SC.RESTAURANT.kitchen + ').</span>' +
    '<p class="zn-prevh">' + ic("eye",18) + 'Така го вижда клиентът</p><div class="zn-prev" data-prev aria-live="polite"></div></form>';
  var s = A.sheet({title:z.n, html:html, foot:'<button class="pill pill-line pill-lg" type="button" data-x>Откажи</button><button class="pill pill-red pill-lg" type="button" data-ok>' + ic("check",22) + 'Запази</button>'});
  var f = s.body.querySelector("form");
  function read(){ return {on:f.on.checked, free:f.free.checked, fee:eur(f.fee.value), min:eur(f.min.value), eta:+f.eta.value, from:f.from.value, to:f.to.value}; }
  function prev(){ var v = read(), d = {n:z.n, on:v.on, free:v.free, fee:isNaN(v.fee) ? null : v.fee, min:isNaN(v.min) ? null : v.min, eta:v.eta, from:v.from, to:v.to};
    f.querySelector("[data-feef]").hidden = v.free;
    f.querySelector("[data-prev]").innerHTML = '<div class="t"><b>' + esc(z.n) + '</b>' + tagHTML(d) + '</div>' + (v.on ? '<dl style="margin:0"><div class="kv"><dt>Доставка</dt><dd>' + feeHTML(d) + '</dd></div><div class="kv"><dt>Минимална поръчка</dt><dd>' + minHTML(d) + '</dd></div><div class="kv"><dt>Време</dt><dd>около ' + d.eta + ' мин</dd></div><div class="kv"><dt>Часове</dt><dd>' + d.from + ' - ' + d.to + '</dd></div></dl>'
      : '<p style="margin:0">Адресът е извън зоната ни. Изберете „Вземи от място“.</p>'); }
  prev(); f.addEventListener("input", prev); f.addEventListener("change", prev);
  function er(name, m){ var i = f[name], e = s.body.querySelector("#zf-" + name + "-e"); if (m){ i.setAttribute("aria-invalid", "true"); e.hidden = false; e.textContent = m; } else { i.removeAttribute("aria-invalid"); e.hidden = true; } return !m; }
  s.foot.querySelector("[data-x]").onclick = s.close;
  s.foot.querySelector("[data-ok]").onclick = function(){ var v = read();
    var ok = [er("fee", !v.free && isNaN(v.fee) ? "Напишете таксата като 2,50 или оставете празно." : ""), er("min", isNaN(v.min) ? "Напишете сумата като 15,00 или оставете празно." : ""), er("to", mins(v.to) <= mins(v.from) ? "Краят е след началото." : mins(v.to) > mins(LAST) ? "Доставката е до " + LAST + "." : "")];
    var bad = ["fee","min","to"].filter(function(n, i){ return !ok[i]; }); if (bad.length){ f[bad[0]].focus(); return; }
    var prevE = A.data.get("zones", {})[slug], patch = {on:v.on, free:v.free, fee:v.free ? null : v.fee, min:v.min, eta:v.eta, from:v.from, to:v.to};
    var chg = []; if (v.on !== z.on) chg.push(v.on ? "доставяме" : "спряна"); if (v.free !== z.free) chg.push(v.free ? "безплатна" : "платена");
    if (!v.free && v.fee !== z.fee) chg.push("такса " + (v.fee == null ? "[ЛИПСВА]" : SC.fmt(v.fee))); if (v.min !== z.min) chg.push("мин. поръчка " + (v.min == null ? "[ЛИПСВА]" : SC.fmt(v.min)));
    if (v.eta !== z.eta) chg.push("около " + v.eta + " мин"); if (v.from !== z.from || v.to !== z.to) chg.push(v.from + " - " + v.to);
    s.close(); if (!chg.length){ A.toast("Нищо не е променено."); return; }
    setZone(slug, patch); draw(true); var txt = z.n + ": " + chg.join(", "); A.audit("zones.update", txt, slug);
    A.toast(txt + offlineNote(), {undo:function(){ A.data.update("zones", {}, function(x){ if (prevE) x[slug] = prevE; else delete x[slug]; }); draw(true); A.audit("zones.update", "Отменено: " + txt, slug); }}); };
}
if (sel && bySlug(sel)) setTimeout(function(){ pick(sel, true); }, 200);
})();
</script>
