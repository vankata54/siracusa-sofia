<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Поръчки | Siracusa · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_admin.css">
<style>
/* Поръчки (автор 2). Само токени; ширини само с @container page. */
.or-live{display:inline-flex; align-items:center; gap:10px; min-height:44px; padding:0 16px 0 14px; border-radius:999px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); font-weight:700; font-size:15px}
.or-live .pulse{position:relative; width:10px; height:10px; border-radius:50%; background:var(--ok)}
.or-live .pulse::after{content:""; position:absolute; inset:0; border-radius:50%; background:var(--ok); animation:or-pulse 2s var(--ease) infinite}
@keyframes or-pulse{0%{transform:scale(1); opacity:.6}100%{transform:scale(2.6); opacity:0}}
.or-live.lost .pulse, .or-live.lost .pulse::after{background:var(--warn)}
.or-sm{display:flex; gap:8px; align-items:flex-start; margin:0 0 14px; font-size:15px; font-weight:600; color:var(--muted)}
.or-sm .ic{margin-top:2px}
.or-sel{display:none}
@container page (max-width:1099px){ .or-bar .sa-tabs{display:none} .or-sel{display:block; flex:1 1 100%} }
.or-new{margin:0 0 16px; animation:or-in var(--t-slow) var(--ease)}
@keyframes or-in{from{transform:translateY(-10px); opacity:0} to{transform:none; opacity:1}}
.or-new .pill{background:var(--on-ember); color:var(--ember)}

.or-bar{display:grid; gap:10px; margin:0 0 16px; grid-template-columns:minmax(0,1fr)}
.or-bar .row1{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.or-bar .sa-tabs{flex:1 1 auto; min-width:0}
@container page (min-width:1100px){ .or-bar .sa-tabs{flex:0 1 auto} }
.or-bar .row2{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.or-ch{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px; margin:0 -2px; flex:1 1 360px; min-width:0}
.or-ch::-webkit-scrollbar{display:none}
.or-ch .chip .ic{color:var(--muted)}
.or-ch .chip[aria-pressed="true"] .ic{color:var(--ember)}
.or-bar .sa-field-s{flex:0 1 300px; min-width:220px}
@container page (max-width:1099px){ .or-bar .sa-field-s{flex:1 1 100%; order:-1} }

/* board (wide, „В работа“) */
.or-board{display:grid; gap:12px; grid-template-columns:repeat(4,minmax(0,1fr)); align-items:start}
.or-colm{display:grid; gap:8px; padding:8px; border-radius:var(--r-shell); background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line); min-height:220px; align-content:start}
.or-colh{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 8px 4px}
.or-colh h2{margin:0; font-size:17px; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.or-colh .n{min-width:28px; height:28px; padding:0 8px; border-radius:14px; display:inline-grid; place-items:center; background:var(--surface); font-size:14px; font-weight:800; font-variant-numeric:tabular-nums}
.or-colh .dot{width:10px; height:10px; border-radius:50%}
.or-none{padding:16px 10px; text-align:center; color:var(--muted); font-size:15px; font-weight:600}
.or-grid{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
@container page (min-width:760px){ .or-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container page (min-width:1100px){ .or-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }

.oc{display:grid; gap:10px; padding:14px 14px 12px 16px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); align-content:start; transition:transform var(--t-base) var(--ease), opacity var(--t-base) var(--ease)}
.oc.fresh{box-shadow:inset 0 0 0 2px var(--ember), var(--shadow)}
.oc.late{box-shadow:inset 0 0 0 2px var(--warn), var(--shadow)}
.oc.done{background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}
.oc-t{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.oc-t b{font-size:21px; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.oc-t .ago{margin-left:auto; font-size:14px; font-weight:700; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
.oc-tags{display:flex; flex-wrap:wrap; gap:6px}
.oc-tags .ic{color:var(--muted)}
.oc-items{margin:0; padding:0; list-style:none; display:grid; gap:2px; font-size:15px; line-height:1.35}
.oc-items li{display:flex; gap:8px} .oc-items .q{font-weight:800; font-variant-numeric:tabular-nums; flex:none; min-width:28px}
.oc-items .more{color:var(--muted); font-weight:600}
.oc-sum{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; padding-top:8px; border-top:1px solid var(--line)}
.oc-sum .price{font-size:19px}
.oc-sum small{font-size:14px; color:var(--muted); font-weight:700}
.oc-f{display:flex; flex-wrap:wrap; gap:8px}
.oc-f .pill{flex:1 1 auto; padding:0 14px}
.oc-f .nx{flex:2 1 auto}
.stt{display:inline-flex; align-items:center; gap:6px; min-height:28px; padding:0 10px; border-radius:999px; font-size:14px; font-weight:800; white-space:nowrap}
.stt .dot, .or-colh .dot{background:currentColor}
.s-accepted{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line-strong)} .s-cooking{background:var(--ember); color:var(--on-ember)} .s-ready{background:var(--ok); color:var(--on-ok)}
.s-on_way{background:var(--ink); color:var(--bg)} .s-done{background:var(--surface-3); color:var(--ink)} .s-cancelled{background:transparent; color:var(--danger); box-shadow:inset 0 0 0 1.5px currentColor}
.c-accepted{color:var(--muted)} .c-cooking{color:var(--ember)} .c-ready{color:var(--ok)} .c-on_way{color:var(--ink)}
.late-t{color:var(--warn); background:transparent; box-shadow:inset 0 0 0 1.5px currentColor}
.late-t .ic{color:var(--warn) !important}

/* detail sheet */
.od{display:grid; gap:18px; padding:4px 0 8px}
.od-steps{margin:0; padding:0; list-style:none; display:grid; gap:0}
.od-steps li{display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:10px; align-items:center; min-height:40px; position:relative; color:var(--muted); font-weight:700}
.od-steps li::before{content:""; width:14px; height:14px; border-radius:50%; justify-self:center; box-shadow:inset 0 0 0 2px var(--line-strong); background:var(--surface)}
.od-steps li:not(:last-child)::after{content:""; position:absolute; left:13px; top:28px; height:calc(100% - 16px); width:2px; background:var(--line)}
.od-steps li.done{color:var(--ink)}
.od-steps li.done::before{background:var(--ok); box-shadow:none}
.od-steps li.cur::before{background:var(--red); box-shadow:0 0 0 4px color-mix(in srgb, var(--red) 22%, transparent)}
.od-steps li.cur{color:var(--ink); font-weight:800}
.od-steps time{font-variant-numeric:tabular-nums; font-size:15px}
.od-box{display:grid; gap:4px; padding:12px 14px; border-radius:18px; background:var(--surface-2)}
.od-box .lb{font-size:14px; font-weight:700; color:var(--muted)}
.od-who{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px}
.od-who .tel{font-weight:800; font-variant-numeric:tabular-nums}
.od-lines{display:grid}
.od-line{display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:10px; align-items:start; padding:10px 0; border-top:1px solid var(--line)}
.od-line:first-child{border-top:0}
.od-line .q{font-weight:800; font-variant-numeric:tabular-nums}
.od-line small{display:block; font-size:14px; color:var(--muted); font-weight:600}
.od-tot .kv{padding:6px 0}
.od-tot .kv.big{font-size:19px; font-weight:800; border-top:1px solid var(--line-strong); padding-top:10px}
.od-tot dd{margin:0; font-weight:800; text-align:right}
.od-tot dt{color:var(--muted); font-weight:600}
.od-tot .big dt{color:var(--ink); font-weight:800}
.od-reason{display:grid; gap:6px}
/* поръчка по телефон */
.po{display:grid; gap:18px; padding:4px 0 8px}
.po .two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
@container app (max-width:420px){ .po .two{grid-template-columns:minmax(0,1fr)} }
.po-sec{border:0; margin:0; padding:0; display:grid; gap:10px; min-width:0}
.po-sec legend{padding:0; margin:0 0 8px; font-weight:800; font-size:17px}
.po .seg button{font-size:15px; min-height:48px; padding:0 6px; white-space:normal; line-height:1.15}
.po-note{display:flex; gap:8px; align-items:flex-start; margin:0; font-size:15px; color:var(--muted); font-weight:600}
.po-note .ic{margin-top:2px}
.po-s{position:relative}
.po-s .input{padding-right:118px}
.po-clr{position:absolute; right:4px; top:2px; min-height:48px; padding:0 12px; border:0; border-radius:999px; background:var(--surface-2); color:var(--ink); font-weight:700; font-size:15px; display:inline-flex; align-items:center; gap:6px; cursor:pointer}
.po-clr[hidden]{display:none}
.po-clr .ic{position:static !important; transform:none !important; color:inherit !important}
.po-res{display:grid; gap:2px; max-height:340px; overflow-y:auto; overscroll-behavior:contain}
.po-it{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; min-height:56px; padding:4px 0; border-top:1px solid var(--line)}
.po-it .nm{font-weight:700; line-height:1.3}
.po-it .nm small{display:block; font-size:14px; color:var(--muted); font-weight:600}
.po-it .pill{min-height:48px; padding:0 14px; font-size:15px}
.po-out{color:var(--warn)}
.po-band{margin:10px 0 2px; font-size:14px; font-weight:800; color:var(--muted)}
.po-more{margin:4px 0; font-size:14px; color:var(--muted); font-weight:600}
.po-chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 6px}
.po-lines{display:grid; gap:0; padding:12px 14px; border-radius:18px; background:var(--surface-2)}
.po-lines h3{margin:0 0 6px; font-size:15px; font-weight:800; color:var(--muted)}
.po-line{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; min-height:56px; border-top:1px solid var(--line)}
.po-line:first-of-type{border-top:0}
.po-line .nm{font-weight:700; line-height:1.3}
.po-line .nm small{display:block; font-size:14px; color:var(--ok); font-weight:700}
.po-line .counter{background:var(--surface)}
.po-sum .po-tot{font-size:19px; font-weight:800; border-top:1px solid var(--line-strong); padding-top:10px}
.po-sum .po-tot dt{color:var(--ink); font-weight:800}
@container app (max-width:420px){ .po-pay{grid-auto-flow:row} }
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="../ds/search.js"></script>
<script src="_admin.js"></script>
<script src="_seed-orders.js"></script><script src="_res-lib.js"></script><script src="_seed-res.js"></script>
<script src="_pencil.js"></script>
<script>
(function(){
var ic = A.ic, esc = A.esc, st = A.st;
A.liveHash = true;

var body = A.mount({section:"orders", title:"Поръчки", docTitle:"Поръчки", wide:true,
  sub:'<span class="or-live' + (st === "offline" ? ' lost' : '') + '" data-live><span class="pulse" aria-hidden="true"></span><span>' + (st === "offline" ? 'Свързваме се отново …' : 'На живо · обновява се само') + '</span></span>',
  actions:(["admin","owner","manager"].indexOf(A.me && A.me.role) > -1 ? '<button class="pill pill-red pill-lg" type="button" data-phone>' + ic("phone",22) + 'Нова поръчка по телефон</button>' : '') + '<a class="pill pill-line pill-lg" href="preview.html#m=kitchen&p=queue&d=tablet&o=land">' + ic("chef-hat",22) + 'Екранът на кухнята</a>',
  states:[["","Обичайно"],["new","Нова поръчка"],["phone","Поръчка по телефон"],["loading","Зареждане"],["empty","Празно"],["error","Грешка"],["offline","Без връзка"]]});
if (!body) return;

/* ---------- правила (src/core/orders.ts) ---------- */
var FLOW = (A.seed && A.seed.FLOW) || {delivery:["accepted","cooking","ready","on_way","delivered"], pickup:["accepted","cooking","ready","picked_up"], table:["accepted","cooking","ready","served"]};
var LABEL = {accepted:"Приета", cooking:"Готви се", ready:"Готова", on_way:"На път", delivered:"Доставена", picked_up:"Взета", served:"Сервирана", cancelled:"Отказана"};
var NEXT = {cooking:"Готви се", ready:"Готова", on_way:"Даден на шофьор", delivered:"Доставена", picked_up:"Взета", served:"Сервирана"};
var FIN = ["delivered","picked_up","served"];
var CH = {delivery:["Доставка","moped"], pickup:["Вземане","storefront"], table:["Маса","chair"], office:["Офис","briefcase"], phone:["Телефон","phone"]};
var PAY = {cash:"В брой", card:"Карта при получаване", voucher:"Ваучер"};
var ZONE = {}; SC.ZONES.forEach(function(z){ ZONE[z.n] = z; });
function flowOf(o){ return o.channel === "table" ? FLOW.table : o.mode === "pickup" ? FLOW.pickup : FLOW.delivery; }
function fin(o){ return FIN.indexOf(o.status) > -1; }

/* ---------- примерните поръчки са в _seed-orders.js (един източник за таблото и лентата), по часа на прототипа ---------- */
var MIN = 60000;
function now(){ return A.now ? A.now() : new Date(); }
function L(id, q, mods){ return {id:id, q:q || 1, mods:mods || []}; }
var D = A.seed && A.seed.orders ? A.seed.orders() : A.data.get("orders", {list:[]});
function save(){ A.data.set("orders", D); }
function byNo(no){ return D.list.filter(function(o){ return o.no === no; })[0]; }

/* суми: цените са от менюто; добавките от „Добавки“; таксата на платените квартали е [ЛИПСВА] */
var ADD = {}; SC.inCat("dobavki").forEach(function(a){ ADD["+ " + a.n] = a.p; });
function lineP(l){ var x = SC.byId[l.id]; return (x.p + l.mods.reduce(function(s, m){ return s + (ADD[m] || 0); }, 0)) * l.q; }
function sums(o){ if (o.total != null && o.sub != null) return {sub:o.sub, disc:o.disc || 0, fee:o.fee, total:o.total, free:o.fee === 0 && o.mode === "delivery"}; var sub = o.lines.reduce(function(s, l){ return s + lineP(l); }, 0), disc = o.code ? Math.round(sub * 10) / 100 : 0, z = o.mode === "delivery" ? ZONE[o.zone] : null;
  var fee = o.mode !== "delivery" ? 0 : z && z.free ? 0 : null; return {sub:sub, disc:disc, fee:fee, total:sub - disc + (fee || 0), free:!!(z && z.free)}; }
function ago(o){ var m = Math.max(0, Math.round((now().getTime() - o.ts) / MIN)); return m < 1 ? "току-що" : m < 60 ? "преди " + m + " мин" : "преди " + Math.floor(m / 60) + " ч " + (m % 60 ? m % 60 + " мин" : ""); }
/* „Закъснява“: доставка след времето на квартала, вземане след 20 мин (ORDER_RULES.pickupLeadMin), маса след 20 мин */
function late(o){ if (fin(o) || o.status === "cancelled") return false; var m = (now().getTime() - o.ts) / MIN; if (o.mode === "delivery"){ var z = ZONE[o.zone]; return m > (z ? z.etaMin : 35); } return o.status !== "ready" && m > 20; }
function chTag(o){ var c = CH[o.channel] || CH.delivery; return '<span class="sa-tag">' + ic(c[1],16) + c[0] + (o.channel === "table" ? " " + esc(o.table) : o.mode === "delivery" ? " · " + esc(o.zone) : "") + '</span>'; }
function stTag(o){ var k = fin(o) ? "done" : o.status; return '<span class="stt s-' + k + '">' + (o.status === "cancelled" ? ic("x",14) : '') + LABEL[o.status] + '</span>'; }
function nextOf(o){ if (o.status === "cancelled" || fin(o)) return null; var f = flowOf(o); return f[f.indexOf(o.status) + 1]; }

/* ---------- изглед ---------- */
var TABS = [["work","В работа", function(o){ return !fin(o) && o.status !== "cancelled"; }], ["accepted","Приета"], ["cooking","Готви се"], ["ready","Готова"], ["on_way","На път"], ["done","Доставена", fin], ["cancelled","Отказана"]];
function tabTest(k){ var t = TABS.filter(function(x){ return x[0] === k; })[0]; return t[2] || function(o){ return o.status === k; }; }
var view = {t:A.hash.s || "work", ch:A.hash.ch || "", q:""};
if (!TABS.some(function(x){ return x[0] === view.t; })) view.t = "work";
var fresh = {};
function all(){ return st === "empty" ? [] : D.list; }
function match(o){ if (view.ch && o.channel !== view.ch) return false; var q = view.q.trim().toLowerCase().replace(/[№\s]/g, ""); if (!q) return true;
  return o.no.indexOf(q) > -1 || o.phone.replace(/\s/g, "").indexOf(q) > -1 || A.norm(o.name + " " + (o.addr || "") + " " + (o.table ? "маса " + o.table : "")).indexOf(A.norm(view.q)) > -1; }
function shown(){ var f = tabTest(view.t); return all().filter(function(o){ return f(o) && match(o); }).sort(function(a, b){ return view.t === "done" || view.t === "cancelled" ? b.ts - a.ts : a.ts - b.ts; }); }

function cardHTML(o){ var s = sums(o), nx = nextOf(o), lt = late(o), items = o.lines.slice(0, 3);
  return '<article class="oc' + (fresh[o.no] ? ' fresh' : '') + (lt ? ' late' : '') + (fin(o) || o.status === "cancelled" ? ' done' : '') + '" data-no="' + o.no + '" data-edit-id="admin.orders.card">' +
    '<div class="oc-t"><b>№ ' + o.no + '</b>' + stTag(o) + '<span class="ago">' + A.hm(new Date(o.ts)) + ' · ' + ago(o) + '</span></div>' +
    '<div class="oc-tags">' + chTag(o) + (lt ? '<span class="sa-tag late-t">' + ic("warning-circle",16) + 'Закъснява</span>' : '') + (o.qr ? '<span class="sa-tag">' + ic("qr-code",16) + 'QR</span>' : '') + (o.note ? '<span class="sa-tag">' + ic("note",16) + 'Бележка</span>' : '') + '</div>' +
    '<ul class="oc-items">' + items.map(function(l){ return '<li><span class="q">' + l.q + ' ×</span><span>' + esc(SC.byId[l.id].n) + (l.mods.length ? ' <span class="muted">(' + esc(l.mods.join(", ")) + ')</span>' : '') + '</span></li>'; }).join("") + (o.lines.length > 3 ? '<li class="more">и още ' + (o.lines.length - 3) + '</li>' : '') + '</ul>' +
    '<div class="oc-sum"><span class="price">' + SC.fmt(s.total) + (s.fee == null ? ' <small>+ такса ' + A.missing("в €") + '</small>' : '') + '</span><small>' + PAY[o.pay] + (s.disc ? ' · код -10%' : '') + '</small></div>' +
    '<div class="oc-f">' + (nx ? '<button class="pill ' + (lt ? 'pill-red' : 'pill-ink') + ' nx" type="button" data-next aria-label="' + esc(NEXT[nx]) + ': № ' + o.no + '">' + ic(nx === "on_way" ? "moped" : "check",20) + NEXT[nx] + '</button>' : '') +
      '<button class="pill pill-line" type="button" data-open aria-label="Детайли: № ' + o.no + '">' + ic("receipt",20) + 'Детайли</button></div></article>'; }

function barHTML(){ var a = all();
  return '<div class="or-bar" data-edit-id="admin.orders.filters"><div class="row1"><div class="sa-tabs" role="tablist" aria-label="Статус">' + TABS.map(function(t){ var n = a.filter(tabTest(t[0])).length;
      return '<button type="button" role="tab" aria-selected="' + (view.t === t[0]) + '" data-tab="' + t[0] + '" aria-controls="or-list">' + t[1] + '<span class="c">' + n + '</span></button>'; }).join("") + '</div><div class="or-sel"><label class="vh" for="or-st">Статус</label><select class="input" id="or-st">' + TABS.map(function(t){ return '<option value="' + t[0] + '"' + (view.t === t[0] ? ' selected' : '') + '>' + t[1] + ' (' + a.filter(tabTest(t[0])).length + ')</option>'; }).join("") + '</select></div></div>' +
    '<div class="row2"><div class="or-ch" role="group" aria-label="Канал"><button class="chip" type="button" data-ch="" aria-pressed="' + (!view.ch) + '">Всички канали</button>' + Object.keys(CH).map(function(k){ var n = a.filter(function(o){ return o.channel === k && tabTest(view.t)(o); }).length;
      return '<button class="chip" type="button" data-ch="' + k + '" aria-pressed="' + (view.ch === k) + '">' + ic(CH[k][1],18) + CH[k][0] + ' <span class="n">' + n + '</span></button>'; }).join("") + '</div>' +
    '<div class="sa-field-s"><label class="vh" for="or-q">Търси поръчка</label>' + ic("magnifying-glass",20) + '<input class="input" id="or-q" type="search" placeholder="№, телефон или адрес" autocomplete="off" value="' + esc(view.q) + '"></div></div></div>'; }

var wide = function(){ return body.getBoundingClientRect().width >= 1080; };
function listHTML(){ var l = shown();

  function sumHTML(){ var s = sums();

      '<div class="kv po-tot"><dt>Общо</dt><dd>' + SC.fmt(s.total) + (s.fee == null ? ' + такса' : '') + '</dd></div>'; }
  function formHTML(){ var sl = slots(), dlOk = mnow() < 1260;
    return '<form class="po" novalidate data-edit-id="admin.orders.phone">' +
      (closed ? A.banner({tone:"warn", icon:"clock", title:"Кухнята е затворена", text:esc(closed)}) : '') +
      '<fieldset class="po-sec"><legend>Клиент</legend><div class="two"><div class="field"><label for="po-tel">Телефон</label><input class="input" id="po-tel" type="tel" inputmode="tel" autocomplete="off" placeholder="0888 12 34 56" value="' + esc(F.tel) + '" aria-describedby="po-tel-e"><span class="err" id="po-tel-e" hidden></span></div>' +
        '<div class="field"><label for="po-name">Име</label><input class="input" id="po-name" autocomplete="off" value="' + esc(F.name) + '" aria-describedby="po-name-e"><span class="err" id="po-name-e" hidden></span></div></div></fieldset>' +
      '<fieldset class="po-sec"><legend>Как</legend><div class="seg" role="group" aria-label="Доставка или вземане"><button type="button" data-pmode="delivery" aria-pressed="' + (F.mode === "delivery") + '"' + (dlOk ? '' : ' disabled') + '>' + ic("moped",20) + 'Доставка</button><button type="button" data-pmode="pickup" aria-pressed="' + (F.mode === "pickup") + '">' + ic("storefront",20) + 'Вземане</button></div>' +
        (dlOk ? '' : '<p class="po-note">' + ic("info",18) + '<span>Доставката приключи за днес в 21:00. Поръчки за вземане до 22:30.</span></p>') +
        (F.mode === "delivery" ? '<div class="field"><label for="po-addr">Адрес</label><input class="input" id="po-addr" autocomplete="off" placeholder="Например: Дружба 2, бл. 311, вх. А" value="' + esc(F.addr) + '" aria-describedby="po-addr-e"><span class="err" id="po-addr-e" hidden></span></div>' +
          '<div class="field"><label for="po-zone">Зона</label><select class="input" id="po-zone" aria-describedby="po-zone-e"><option value="">Изберете квартал</option>' + SC.ZONES.map(function(z){ return '<option value="' + esc(z.n) + '"' + (F.zone === z.n ? ' selected' : '') + '>' + esc(z.n) + ' · ' + (z.free ? 'безплатна' : 'такса [ЛИПСВА]') + ' · ' + esc(z.eta) + '</option>'; }).join("") + '</select><span class="err" id="po-zone-e" hidden></span></div>' : '<p class="po-note">' + ic("map-pin",18) + '<span>От ресторанта: ' + esc(SC.RESTAURANT.address) + '</span></p>') + '</fieldset>' +
      '<fieldset class="po-sec"><legend>Час</legend><div class="seg" role="group" aria-label="Кога"><button type="button" data-pwhen="asap" aria-pressed="' + (F.when === "asap") + '">Възможно най-скоро</button><button type="button" data-pwhen="later" aria-pressed="' + (F.when === "later") + '"' + (sl.length ? '' : ' disabled') + '>По-късно днес</button></div>' +
        (F.when === "later" ? '<div class="field"><label for="po-slot">Час</label><select class="input" id="po-slot">' + sl.map(function(t){ return '<option' + (F.slot === t ? ' selected' : '') + '>' + t + '</option>'; }).join("") + '</select><span class="help">' + (F.mode === "delivery" ? 'Доставка до 21:00.' : 'Вземане до 22:30, готово най-късно в 23:00.') + '</span></div>' : '') + '</fieldset>' +
      '<fieldset class="po-sec"><legend>Ястия</legend><div class="po-s sa-field-s"><label class="vh" for="po-q">Търси ястие</label>' + ic("magnifying-glass",20) + '<input class="input" id="po-q" type="search" autocomplete="off" placeholder="Име или съставка, и на латиница" value="' + esc(F.q) + '"><button class="po-clr" type="button" data-pclr' + (F.q ? '' : ' hidden') + '>' + ic("x",18) + 'Изчисти</button></div>' +
        '<div class="po-res" data-pres aria-live="polite">' + resultsHTML() + '</div><div class="po-lines" data-plines><h3>Поръчката</h3>' + linesHTML() + '</div><span class="err" id="po-lines-e" hidden></span></fieldset>' +
      '<div class="field"><label for="po-note">Бележка към кухнята <span class="muted" style="font-weight:600">(по желание)</span></label><textarea class="input" id="po-note" rows="2" placeholder="Например: без лук на пицата, звънецът не работи">' + esc(F.note) + '</textarea></div>' +
      '<fieldset class="po-sec"><legend>Плащане</legend><div class="seg po-pay" role="group" aria-label="Плащане">' + [["cash","В брой"],["card","Карта при получаване"],["voucher","Ваучер"]].map(function(p){ return '<button type="button" data-ppay="' + p[0] + '" aria-pressed="' + (F.pay === p[0]) + '">' + p[1] + '</button>'; }).join("") + '</div></fieldset>' +
      '<dl class="od-tot po-sum" data-psum style="margin:0">' + sumHTML() + '</dl></form>'; }
  var s = A.sheet({title:"Нова поръчка по телефон", focus:"#po-tel", html:formHTML(), foot:'<button class="pill pill-line pill-lg" type="button" data-x>Откажи</button><button class="pill pill-red pill-lg" type="button" data-ok' + (closed ? ' disabled' : '') + '>' + ic("chef-hat",22) + '<span data-plabel>Към кухнята</span></button>'});
  var b = s.body;
  function label(){ var t = sums(); s.foot.querySelector("[data-plabel]").textContent = F.lines.length ? "Към кухнята · " + SC.fmt(t.total) + (t.fee == null ? " + такса" : "") : "Към кухнята"; }
  function refresh(part){ if (part === "res"){ b.querySelector("[data-pres]").innerHTML = resultsHTML(); }
    else if (part === "lines"){ b.querySelector("[data-plines]").innerHTML = '<h3>Поръчката</h3>' + linesHTML(); b.querySelector("[data-psum]").innerHTML = sumHTML(); b.querySelector("[data-pres]").innerHTML = resultsHTML(); }
    else { var y = b.scrollTop, a = document.activeElement && document.activeElement.id; b.innerHTML = formHTML(); b.scrollTop = y; if (a){ var n = b.querySelector("#" + a); n && n.focus({preventScroll:true}); } }
    label(); }
  function read(){ var g = function(id){ var e = b.querySelector(id); return e ? e.value : ""; }; F.tel = g("#po-tel"); F.name = g("#po-name"); F.addr = g("#po-addr") || F.addr; F.zone = b.querySelector("#po-zone") ? g("#po-zone") : F.zone; F.slot = g("#po-slot") || F.slot; F.note = g("#po-note"); }
  label();
  b.addEventListener("input", function(e){ var t = e.target; if (t.id === "po-q"){ F.q = t.value; b.querySelector("[data-pclr]").hidden = !F.q; refresh("res"); } else read(); });
  b.addEventListener("change", function(e){ read(); if (e.target.id === "po-zone") refresh("lines"); });
  b.addEventListener("click", function(e){ var t;
    if ((t = e.target.closest("[data-pmode]"))){ read(); F.mode = t.dataset.pmode; if (F.when === "later" && slots().indexOf(F.slot) < 0) F.slot = ""; refresh(); return; }
    if ((t = e.target.closest("[data-pwhen]"))){ read(); F.when = t.dataset.pwhen; if (F.when === "later" && !F.slot) F.slot = slots()[0] || ""; refresh(); return; }
    if ((t = e.target.closest("[data-ppay]"))){ F.pay = t.dataset.ppay; b.querySelectorAll("[data-ppay]").forEach(function(z){ z.setAttribute("aria-pressed", String(z === t)); }); return; }
    if (e.target.closest("[data-pclr]")){ F.q = ""; var q = b.querySelector("#po-q"); q.value = ""; e.target.closest("[data-pclr]").hidden = true; refresh("res"); q.focus(); return; }
    if ((t = e.target.closest("[data-ptog]"))){ F.q = window.SCSearch.toggle(F.q, t.dataset.ptog); b.querySelector("#po-q").value = F.q; refresh("res"); var n = b.querySelector('[data-ptog="' + t.dataset.ptog + '"]'); n && n.focus(); return; }
    if ((t = e.target.closest("[data-padd]"))){ var id = t.dataset.padd, l = F.lines.filter(function(z){ return z.id === id; })[0]; if (l) l.q = Math.min(50, l.q + 1); else F.lines.push({id:id, q:1, mods:[]});
      refresh("lines"); var nb = b.querySelector('[data-padd="' + id + '"]'); nb && nb.focus(); var le = b.querySelector("#po-lines-e"); le.hidden = true; return; }
    if ((t = e.target.closest("[data-pq]"))){ var i = +t.dataset.pq, ln = F.lines[i]; ln.q += +t.dataset.d; if (ln.q < 1) F.lines.splice(i, 1); else if (ln.q > 50) ln.q = 50; refresh("lines"); return; } });
  s.foot.querySelector("[data-x]").onclick = s.close;
  s.foot.querySelector("[data-ok]").onclick = function(){ read(); var errs = [];

    er("#po-name", F.name.trim().length >= 2 ? "" : "Напишете името, за да знае шофьорът или кухнята кого търси.");
    if (F.mode === "delivery"){ er("#po-addr", !F.addr.trim() ? "Напишете адреса за доставка." : !/(бл\.?|блок|ул\.?|улица|ж\.к\.|№|\d)/i.test(F.addr) ? "Добавете улица или блок, например „Дружба 2, бл. 311“." : ""); er("#po-zone", F.zone ? "" : "Изберете квартала."); }
    var lunchDl = F.mode === "delivery" && after15() && F.lines.some(function(l){ return isLunch(SC.byId[l.id]); });
    er("#po-lines", !F.lines.length ? "Добавете поне едно ястие." : lunchDl ? "Обедното меню след 15:00 е само за вземане от място." : "");
    if (errs.length){ var f = b.querySelector(errs[0] === "#po-lines" ? "#po-q" : errs[0]); f && f.focus(); return; }
    var t = sums(), no = String(D.list.reduce(function(a, o){ return Math.max(a, +o.no); }, 1041) + 1), ts = now();
    var o = {no:no, ts:ts.getTime(), placedAt:A.hm(ts), channel:"phone", mode:F.mode, status:"accepted", lines:F.lines.map(function(l){ return {id:l.id, q:l.q, mods:[]}; }), pay:F.pay,
      name:F.name.trim(), phone:F.tel.trim(), note:F.note.trim(), slot:F.when === "asap" ? "asap" : F.slot, times:{accepted:ts.toISOString()}, by:A.me.name, marketing:false,
      sub:t.sub, disc:t.disc, fee:t.fee, total:t.total};
    if (F.mode === "delivery"){ o.zone = F.zone; o.addr = F.addr.trim(); }
    D.list.push(o); save(); s.close(); fresh[no] = 1; view.t = "work"; draw(true);
    A.audit("order.create", "Поръчка по телефон № " + no + ": " + (F.mode === "delivery" ? "доставка, " + F.zone : "вземане") + ", " + SC.fmt(t.total) + (t.fee == null ? " + такса" : ""), no);
    A.toast("№ " + no + " е в кухнята" + (o.slot !== "asap" ? " за " + o.slot : ""), {undo:function(){ D.list = D.list.filter(function(z){ return z.no !== no; }); save(); draw(true); A.audit("order.status", "Отменена поръчка по телефон № " + no, no); }}); }; }
document.addEventListener("click", function(e){ if (e.target.closest("[data-phone]")) phoneOrder(); });
if (A.hash.phone || st === "phone") setTimeout(phoneOrder, 300);
