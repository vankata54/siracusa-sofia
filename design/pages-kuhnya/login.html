<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Вход | Кухня · Siracusa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_kitchen.css">
<style>
.lg{position:fixed; inset:0; overflow:auto; background:var(--bg); container-type:inline-size; container-name:app}
.lg-in{min-height:100%; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(360px,.9fr); gap:28px; padding:28px; max-width:1280px; margin:0 auto; align-content:center}
.lg-top{grid-column:1 / -1; display:flex; align-items:center; gap:14px}
.lg-top .word{font-size:26px}
.lg-top .muted{font-size:18px; font-weight:700}
.lg-top .kproto{margin-left:auto}
.lg h1{font-size:34px; letter-spacing:-.04em; line-height:1.05; margin:0 0 6px; font-weight:800}
.lg .lead{font-size:18px}
.secs{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px}
.sct{position:relative; display:grid; grid-template-columns:auto 1fr; gap:4px 16px; align-items:center; min-height:120px; padding:18px 20px; border:0; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow), inset 0 0 0 2px var(--line); color:var(--ink); text-align:left; cursor:pointer; transition:transform var(--t-fast) var(--ease)}
.sct:active{transform:scale(.98)}
.sct .si{grid-row:1 / span 2; width:64px; height:64px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--red)}
.sct b{font-size:26px; letter-spacing:-.03em; line-height:1.1}
.sct span.d{font-size:16px; color:var(--muted); font-weight:600; line-height:1.3}
.sct[aria-pressed="true"]{box-shadow:var(--hi), var(--shadow), inset 0 0 0 4px var(--red)}
.sct[aria-pressed="true"]::after{content:""; position:absolute; top:14px; right:14px; width:14px; height:14px; border-radius:50%; background:var(--red)}
.sct.wide{grid-column:1 / -1; min-height:96px}
.sct.wide .si{color:var(--ink)}
.lg .note{margin-top:14px; font-size:15px; color:var(--muted); display:flex; gap:8px; align-items:flex-start}
.pin{align-self:center; padding:22px; display:grid; gap:16px}
.pin h2{margin:0; font-size:26px; letter-spacing:-.03em; font-weight:800}
.pin h2 small{display:block; font-size:16px; color:var(--muted); font-weight:700; letter-spacing:0; margin-top:2px}
.dots{display:flex; justify-content:center; gap:18px; padding:6px 0}
.dots i{width:22px; height:22px; border-radius:50%; box-shadow:inset 0 0 0 2.5px var(--line-strong)}
.dots i.on{background:var(--ink); box-shadow:none}
.dots.err i{box-shadow:inset 0 0 0 2.5px var(--danger)}
.pinpad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.pinpad button{min-height:72px; border:0; border-radius:22px; background:var(--surface-2); color:var(--ink); font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; cursor:pointer; display:grid; place-items:center}
.pinpad button:active{transform:scale(.96); background:var(--surface-3)}
.pinpad .fn{font-size:17px}
.perr{min-height:24px; margin:0; text-align:center; font-size:16px; font-weight:700; color:var(--danger)}
@container app (max-width:1100px){ .lg-in{grid-template-columns:minmax(0,1fr) 340px; gap:20px; padding:22px} .sct{padding:16px} .sct b{font-size:22px} .sct .si{width:52px; height:52px} .sct span.d{font-size:15px} .pinpad button{min-height:64px} }
@container app (max-width:899px){
  .lg-in{grid-template-columns:1fr; align-content:start; padding:20px 16px}
  .pin{max-width:520px; width:100%; justify-self:center}
  .lg h1{font-size:28px} .secs{margin-top:12px; gap:8px} .sct{min-height:76px; padding:12px 16px} .sct span.d{display:none} .sct .si{grid-row:auto; width:48px; height:48px} .sct.wide{min-height:76px}
  .pin{padding:16px; gap:10px} .pinpad button{min-height:56px} .lg-top .word{font-size:22px}
}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_kitchen.js"></script>
<script>
(function(){
var ic = SC.ic, esc = SC.esc, chosen = K.secId, pin = "";
var DESC = {topla:"Супи, топли предястия, основни, паста, бургери, гарнитури", skara:"Скара на дървени въглища", pesht:"Пици и пърленки", studeni:"Салати, студени предястия, сосове, десерти"};
var el = document.createElement("div"); el.className = "lg";
el.innerHTML = '<div class="lg-in">' +
  '<div class="lg-top"><span class="word">Siracusa</span><span class="muted">Кухня</span>' + K.proto("login") + '</div>' +
  '<section aria-labelledby="h-sec"><h1 id="h-sec">Коя е секцията на този таблет?</h1><p class="lead">Таблетът ще показва само ястията на секцията. Изборът се помни.</p>' +
  '<div class="secs" role="group" aria-label="Секции">' + K.SECTIONS.map(function(s){
    return '<button class="sct" type="button" data-sec="' + s.id + '" aria-pressed="' + (s.id === chosen) + '"><span class="si">' + ic(s.ic,32) + '</span><b>' + esc(s.n) + '</b><span class="d">' + DESC[s.id] + '</span></button>'; }).join("") +
  '<button class="sct wide" type="button" data-sec="all" aria-pressed="false"><span class="si">' + ic("chef-hat",32) + '</span><b>Общ изглед</b><span class="d">За главния готвач: всички секции, колко чакат, закъснения</span></button></div>' +
  '<p class="note">' + ic("info",20) + '<span>Секциите и кое ястие къде се готви са условни: <span class="miss">[ЛИПСВА: секциите на кухнята и брой таблети]</span></span></p></section>' +
  '<section class="pin kcard" aria-labelledby="h-pin"><h2 id="h-pin">Личен ПИН<small data-for></small></h2>' +
  '<div class="dots" data-dots aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="perr" data-err role="alert"></p>' +
  '<div class="pinpad">' + [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button type="button" data-k="' + n + '">' + n + '</button>'; }).join("") +
  '<button type="button" class="fn" data-k="c">Изчисти</button><button type="button" data-k="0">0</button><button type="button" class="fn" data-k="b" aria-label="Изтрий една цифра">' + ic("arrow-left",28) + '</button></div>' +
  '<button class="kb red" type="button" data-go style="width:100%">' + ic("sign-in",24) + '<span data-golbl></span></button></section></div>';
document.body.appendChild(el); K.protoBind(el);

function name(){ return chosen === "all" ? "Общ изглед" : K.secById[chosen].n; }
function upd(){
  el.querySelectorAll("[data-sec]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-sec") === chosen)); });
  el.querySelector("[data-for]").textContent = "за вход в " + name();
  el.querySelector("[data-golbl]").textContent = "Влез · " + name();
  el.querySelectorAll("[data-dots] i").forEach(function(d, i){ d.classList.toggle("on", i < pin.length); });
}
el.querySelectorAll("[data-sec]").forEach(function(b){ b.addEventListener("click", function(){ chosen = b.getAttribute("data-sec"); upd(); }); });
el.querySelectorAll("[data-k]").forEach(function(b){ b.addEventListener("click", function(){ var k = b.getAttribute("data-k");
  el.querySelector("[data-err]").textContent = ""; el.querySelector("[data-dots]").classList.remove("err");
  if (k === "c") pin = ""; else if (k === "b") pin = pin.slice(0,-1); else if (pin.length < 4) pin += k; upd(); }); });
el.querySelector("[data-go]").addEventListener("click", function(){
  if (pin.length < 4){ el.querySelector("[data-err]").textContent = "Въведете 4 цифри."; el.querySelector("[data-dots]").classList.add("err"); return; }
  if (pin === "0000"){ pin = ""; upd(); el.querySelector("[data-err]").textContent = "ПИН не е верен. Опитайте пак."; el.querySelector("[data-dots]").classList.add("err"); return; } /* прототип: 0000 показва грешка */
  if (chosen !== "all") K.store("sec", chosen);
  location.href = (chosen === "all" ? "summary.html#s=all" : "queue.html#s=" + chosen) + (K.hash.t ? "&t=" + K.hash.t : "");
});
upd();
})();
</script>
</body>
</html>
