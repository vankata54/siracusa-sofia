<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Шофьор | Siracusa · Шофьор</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_driver.css">
<style>
.scr{display:grid; gap:10px}
.scr a.it{display:grid; grid-template-columns:52px 1fr auto; gap:14px; align-items:center; padding:14px 14px 14px 12px; border-radius:24px; background:var(--surface); box-shadow:var(--hi), var(--shadow); text-decoration:none; color:var(--ink)}
.scr .ico{width:52px; height:52px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; color:var(--red)}
.scr b{display:block; font-size:18px; letter-spacing:-.01em}
.scr span.d{display:block; font-size:15px; color:var(--muted); line-height:1.35; margin-top:2px}
.states{display:flex; flex-wrap:wrap; gap:8px}
.states a{text-decoration:none}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_driver.js"></script>
<script>
var main = DR.mount({page:"index", title:"Шофьор", sub:"Етап D · жив прототип · 6 екрана", nav:null});
var ic = SC.ic;
var S = [
  ["login.html","sign-in","Вход и начало на смяната","Потребител и парола, избор на автомобил (най-често ползваният е отбелязан), начален километраж и ресто. 3 стъпки."],
  ["list.html","moped","Моите доставки","Следващата доставка най-отгоре с „Навигация“ и „Обади се“, после останалите по реда на маршрута; сума, плащане, срок."],
  ["delivery.html#1042","receipt","Една доставка","Адрес, клиент (име и телефон), бележка, артикули, сума и плащане, ресто; Взех → На път → Доставена; „Проблем“."],
  ["route.html","path","Маршрут","Схема (не карта) и списък; Път А и Път Б се предлагат, шофьорът избира или подрежда сам."],
  ["fuel.html","drop","Гориво","Зареждане: литри, сума, километраж, снимка на бележката, „пълен резервоар“, платено в брой; смяна на колата."],
  ["shift.html","wallet","Край на смяната","Доставени, пари в брой и ваучери за предаване, километри."]
];
main.innerHTML = '<section class="st-sec"><p class="lead" style="color:var(--ink)">Приложението на шофьора е на телефона (PWA). Данните са условни за макета: адресите са примерни, ястията и цените са истинските от менюто.</p></section>'+
  '<section class="st-sec"><div class="scr">'+S.map(function(s){ return '<a class="it" href="'+s[0]+'"><span class="ico">'+ic(s[1],26)+'</span><span><b>'+s[2]+'</b><span class="d">'+s[3]+'</span></span>'+ic("caret-right",22)+'</a>'; }).join("")+'</div></section>'+
  '<section class="st-sec"><div class="st-h"><h2>Състояния</h2></div><div class="states">'+
  '<a class="chip" href="list.html#s=empty">'+ic("check-circle",18)+'Няма доставки</a>'+
  '<a class="chip" href="list.html#s=offline">'+ic("warning-circle",18)+'Няма връзка</a>'+
  '<a class="chip" href="delivery.html#1042&call">'+ic("phone",18)+'Обаждане до клиента</a>'+
  '<a class="chip" href="delivery.html#1046&s=outzone">'+ic("map-pin-line",18)+'Извън зоните</a>'+
  '<a class="chip" href="delivery.html#1042&s=road">'+ic("timer",18)+'Закъснява</a>'+
  '<a class="chip" href="list.html#s=moving">'+ic("car",18)+'В движение</a>'+
  '<a class="chip" href="login.html#err">'+ic("lock",18)+'Грешна парола</a>'+
  '<a class="chip" href="list.html#s=road">'+ic("map-pin",18)+'Пристигнах (SMS)</a>'+
  '<a class="chip" href="fuel.html">'+ic("car",18)+'Смяна на колата</a>'+
  '<a class="chip" href="shift.html#s=empty">'+ic("wallet",18)+'Край без активни</a>'+
  '</div><p class="small muted" style="margin:12px 0 0">Тъмната тема: панелът „Само в прототипа“ най-долу на всеки екран или „Смяна“ горе вдясно.</p></section>';
</script>
</body>
</html>
