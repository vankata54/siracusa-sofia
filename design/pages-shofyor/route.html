<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Маршрут | Siracusa · Шофьор</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_driver.css">
<style>
.stops{border-radius:24px; background:var(--surface); box-shadow:var(--hi), var(--shadow); padding:4px 16px}
.stop.home .no{background:var(--red); color:var(--on-red)}
.mv .pill[disabled]{opacity:.5}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_driver.js"></script>
<script>
var main = DR.mount({page:"route", title:"Маршрут", nav:"route"});
var ic = SC.ic, esc = SC.esc;
function km1(k){ return k.toFixed(1).replace(".", ","); }
var P0 = DR.POS.home;

var L = {"Дружба 1":[0,-38], "Дружба 2":[34,44], "НПЗ Искър":[0,-38], "Бусманци":[0,46], "Горубляне":[-62,44], "Гара Искър":[0,-38]};
function scheme(r){ var zones = ["Дружба 1","Дружба 2","НПЗ Искър","Бусманци","Горубляне","Гара Искър"];
  function pt(d){ var p = DR.POS[d.zone || "out"]; return [p[0]+(d.dx||0), p[1]+(d.dy||0)]; }
  var nx = DR.next(), pts = r.order.map(pt), path = "M"+P0.join(","), prev = P0;
  pts.forEach(function(p){ var mx = (prev[0]+p[0])/2 + (p[1]-prev[1])*0.12, my = (prev[1]+p[1])/2 - (p[0]-prev[0])*0.12; path += " Q"+mx.toFixed(1)+","+my.toFixed(1)+" "+p.join(","); prev = p; });
  var last = pts[pts.length-1];
  var svg = '<svg viewBox="0 0 360 272" role="img" aria-label="Схема на маршрута: ресторантът и '+SC.plural(r.order.length,"адрес","адреса")+' по ред. Не е карта; списъкът отдолу е същият.">'+
    zones.map(function(z){ var p = DR.POS[z]; return '<ellipse class="sv-zone" cx="'+p[0]+'" cy="'+p[1]+'" rx="52" ry="30"/><text class="sv-zl" x="'+p[0]+'" y="'+(p[1]+(p[1]>150?46:-38))+'" text-anchor="middle">'+z+'</text>'; }).join("")+
    (r.order.some(function(d){ return !d.zone; }) ? '<text class="sv-zl" x="'+DR.POS.out[0]+'" y="'+(DR.POS.out[1]-26)+'">извън</text>' : '')+
    '<path class="sv-ret" d="M'+last.join(",")+' L'+P0.join(",")+'"/>'+
    '<path class="sv-path" d="'+path+'"/>'+
    '<rect class="sv-home" x="'+(P0[0]-17)+'" y="'+(P0[1]-17)+'" width="34" height="34" rx="10"/><text class="sv-stop-t sv-home-t" x="'+P0[0]+'" y="'+P0[1]+'">S</text>'+
    r.order.map(function(d, i){ var p = pts[i], c = d === nx ? "next" : ""; return '<circle class="sv-stop '+c+'" cx="'+p[0]+'" cy="'+p[1]+'" r="16"/><text class="sv-stop-t '+c+'" x="'+p[0]+'" y="'+p[1]+'">'+(i+1)+'</text>'; }).join("")+'</svg>';
  return '<div class="scheme"><div class="in">'+svg+'</div><div class="cap">'+ic("info",16)+'Схема, не е карта. S е ресторантът, червено е следващият адрес.</div></div>'; }

function card(k, r, title, sub){ var pick = DR.db.route.pick;
  return '<button class="rc" type="button" data-pick="'+k+'" aria-pressed="'+(pick===k)+'"><span class="t">'+title+(pick===k?DR.stt("done","Избран","check"):'')+'</span><span class="ord">'+esc(sub)+'</span>'+
    '<span class="nums"><span><b>'+r.min+'</b> мин</span><span><b>'+km1(r.km)+'</b> км</span><span class="muted">гориво <span class="missing">[ЛИПСВА]</span></span></span>'+
    '<span class="ord">'+r.order.map(function(d, i){ return (i+1)+'. '+(d.zone||"извън зоните"); }).join(" → ")+' → S</span></button>'; }

function render(){
  var P = DR.plan();
  if (!P){ main.innerHTML = '<section class="st-sec"><div class="st-empty"><div class="ill">'+ic("path",48)+'</div><h2>Няма маршрут</h2><p>Маршрутът се предлага сам, щом имате поръчки за доставяне.</p><a class="pill pill-line pill-lg" href="list.html" style="margin-top:8px">Към доставките</a></div></section>'; return; }
  var r = DR.current(), etas = DR.etas(), same = P.A.order.every(function(d,i){ return d === P.B.order[i]; });
  var h = '<section class="st-sec">'+scheme(r)+'</section>';
  h += '<section class="st-sec"><div class="st-h"><h2>Предложение</h2><span class="muted">вие решавате</span></div><div class="rchoice">'+
    card("A", P.A, "Път А · по срока", "Първо поръчките, които трябва да стигнат по-рано")+
    (same ? '<p class="small muted" style="margin:0">Най-краткият път съвпада с Път А за този курс.</p>' : card("B", P.B, "Път Б · по-кратък", "Най-малко километри за целия курс"))+
    (P.own ? card("own", P.own, "Моят ред", "Подредихте адресите сами") : '')+'</div>'+
    '<p class="small muted" style="margin:10px 4px 0">Редът се смята с VROOM върху OSRM (без такса на заявка, без трафик). Числата тук са примерни. Литрите и еврото се смятат от реалния разход на автомобила, щом има зареждания <span class="missing">[ЛИПСВА: разход л/100 км, цена на горивото]</span>.</p></section>';
  h += '<section class="st-sec"><div class="st-h"><h2>Адресите по ред</h2><span class="muted">пристигане</span></div><div class="stops">'+
    r.order.map(function(d, i){ return '<div class="stop"><span class="no">'+(i+1)+'</span><a href="delivery.html#'+d.id+'" style="color:inherit;text-decoration:none"><span class="a" style="display:block">'+(d.zone?esc(d.zone)+', ':'')+esc(d.addr)+'</span><span class="s" style="display:block">№ '+d.id+' · '+DR.ST[d.st][0]+'</span></a><span class="eta"><b>~'+DR.clock(etas[d.id])+'</b>срок '+DR.clock(DR.due(d))+'</span>'+
      '<span class="mv"><button class="pill pill-soft" type="button" data-up="'+i+'"'+(i===0?' disabled':'')+' aria-label="По-рано: '+esc(d.zone||"извън зоните")+'">'+ic("caret-up",20)+'По-рано</button><button class="pill pill-soft" type="button" data-down="'+i+'"'+(i===r.order.length-1?' disabled':'')+' aria-label="По-късно: '+esc(d.zone||"извън зоните")+'">'+ic("caret-down",20)+'По-късно</button></span></div>'; }).join("")+
    '<div class="stop home"><span class="no">S</span><span><span class="a" style="display:block">Обратно в ресторанта</span><span class="s" style="display:block">'+km1(r.back.k)+' км</span></span><span class="eta"><b>~'+DR.clock(Date.now() + r.min*60000 + 2*(r.order.length-1)*60000)+'</b></span></div></div>'+
    '<p class="small muted" style="margin:10px 4px 0">Пристигане = времето по пътя + 2 мин за всеки предишен адрес. Клиентът вижда приблизително време, известие 10 мин преди пристигане.</p></section>';
  main.innerHTML = h;
}
render(); DR.on(render);
main.addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.pick){ DR.db.route.pick = b.dataset.pick; DR.save(); DR.toast(b.dataset.pick==="own" ? "Карате по вашия ред" : "Избран Път "+b.dataset.pick+". Записваме избора за отчета."); return; }
  var up = b.dataset.up, dn = b.dataset.down; if (up === undefined && dn === undefined) return;
  var o = DR.current().order.map(function(d){ return d.id; }), i = +(up !== undefined ? up : dn), j = up !== undefined ? i-1 : i+1;
  var t = o[i]; o[i] = o[j]; o[j] = t; DR.db.route.own = o; DR.db.route.pick = "own"; DR.save();
});
</script>
</body>
</html>
