<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Доставка | Siracusa · Шофьор</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_driver.css">
<style>
.acard{border-radius:28px; padding:16px; background:var(--surface); box-shadow:var(--hi), var(--shadow)}
.acard .acts{grid-template-columns:1fr}
.callbig{display:grid; justify-items:center; gap:6px; padding:8px 0 4px; text-align:center}
.callbig b{font-size:34px; font-weight:800; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
.callbig span{color:var(--muted); font-weight:700}
.st-bar .pill-line{flex:0 0 auto; background:var(--surface)}
.notice.bad{background:var(--surface); box-shadow:inset 0 0 0 2px var(--danger)}
.notice.bad > .ic{color:var(--danger)}
.notice .pill{margin-top:10px}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_driver.js"></script>
<script>
var d = DR.byId(DR.hash.id) || DR.next() || DR.db.dels[DR.db.dels.length-1];
var main = DR.mount({page:"delivery", title:"№ "+d.id, sub:(d.zone||"Извън зоните")+" · "+DR.PAY[d.pay][0], back:{href:"list.html", label:"Доставки"}, nav:"list", bar:true});
var ic = SC.ic, esc = SC.esc, given = 0;
var bar = document.createElement("div"); bar.className = "st-bar"; document.body.appendChild(bar);
var tel = d.phone.replace(/\s/g,""), RT = SC.RESTAURANT.phone, RTtel = RT.replace(/\s/g,"");

function flow(){ var order = ["picked","road","done"], i = d.st==="wait" ? -1 : d.st==="prob" ? 1 : order.indexOf(d.st);
  return '<ol class="flow" aria-label="Етапи">'+[["Взета","picked"],["На път","road"],["Доставена","done"]].map(function(s, k){ return '<li class="'+(k<=i?"on":"")+(k===i&&d.st==="road"?" now":"")+'">'+s[0]+'</li>'; }).join("")+'</ol>'; }

function render(){
  var etas = DR.etas(), eta = etas[d.id], l = DR.lvl(d), total = DR.total(d), fee = DR.fee(d), app = DR.prefs.nav || "google";
  var h = '<section class="st-sec">'+flow()+'</section>';
  if (d.st === "prob") h += '<section class="st-sec"><div class="notice bad">'+ic("warning",22)+'<span><b>Проблем: '+DR.PROB[d.prob.k][0]+'.</b> Ресторантът е уведомен в '+DR.clock(d.prob.at)+'. Върнете поръчката в ресторанта'+(d.pay==="cash"?"; сумата не се събира":"")+'.</span></div></section>';
  if (!d.zone) h += '<section class="st-sec"><div class="notice bad">'+ic("map-pin-line",22)+'<span><b>Адресът е извън зоните за доставка.</b> Преди да тръгнете, уточнете с ресторанта дали да я карате.<br><a class="pill pill-line" href="tel:'+RTtel+'">'+ic("phone",20)+'Обади се в ресторанта</a></span></div></section>';
  if (l === "late") h += '<section class="st-sec"><div class="notice bad">'+ic("timer",22)+'<span><b>Закъснява '+(-DR.mins(DR.due(d)-Date.now()))+' мин.</b> Обадете се на клиента и кажете кога пристигате. Ресторантът също вижда закъснението.</span></div></section>';
  h += '<section class="st-sec"><div class="acard"><div class="addr"><b>'+(d.zone?esc(d.zone)+', ':'')+esc(d.addr)+'</b><span>'+esc(d.sub)+'</span>'+DR.exTag+'</div>'+
    '<div class="meta">'+DR.dueStt(d, eta)+(eta&&d.st!=="done"&&d.st!=="prob"?DR.stt("picked","Пристигане ~"+DR.clock(eta),"car"):"")+(d.zone && !DR.zone(d.zone).free ? DR.stt("picked","Платена зона","tag") : "")+'</div>'+
    '<div class="acts"><a class="pill pill-red pill-lg" href="'+DR.navUrl(d, app)+'" target="_blank" rel="noopener">'+ic("path",22)+'Навигация · '+DR.NAVAPP[app]+'</a></div></div></section>';
  h += '<section class="st-sec"><p class="st-cap">Клиент</p><div class="client"><span class="nm"><b>'+esc(d.client)+'</b><span>'+esc(d.phone)+' · примерен</span></span><button class="pill pill-line" type="button" data-call>'+ic("phone",22)+'Обади се</button></div>'+
    '<p class="small muted" style="margin:8px 4px 0">Виждате само името и телефона от поръчката, докато трае доставката.</p></section>';
  if (d.note) h += '<section class="st-sec"><p class="st-cap">Бележка от клиента</p><div class="notebox">'+ic("note",22)+'<span>'+esc(d.note)+'</span></div></section>';
  h += '<section class="st-sec"><div class="st-h"><h2>В торбата</h2><span class="muted">'+SC.plural(d.items.reduce(function(s,x){ return s+x[1]; },0),"артикул","артикула")+'</span></div><div class="icard">'+
    d.items.map(function(x){ var it = SC.byId[x[0]]; return '<div class="il"><span class="q">'+x[1]+'×</span><span class="nm">'+esc(it.n)+'</span><span class="price">'+SC.fmt(it.p*x[1])+'</span></div>'; }).join("")+
    '<div class="kv" style="border-top:1px solid var(--line)"><span class="muted">Доставка</span><b>'+(!d.zone?'<span class="missing">[ЛИПСВА: извън зоните]</span>':fee===0?'Безплатна':fee===null?'<span class="missing">[ЛИПСВА: такса за '+esc(d.zone)+']</span>':SC.fmt(fee))+'</b></div>'+
    '<div class="kv tot"><span>Общо</span><span class="price">'+DR.money(d)+'</span></div></div></section>';
  h += '<section class="st-sec"><div class="st-h"><h2>Плащане</h2></div><div class="paygrid">'+["cash","card","voucher"].map(function(k){ return '<div class="'+(d.pay===k?"on":"")+'"'+(d.pay===k?' aria-current="true"':'')+'>'+ic(DR.PAY[k][1],24)+DR.PAY[k][0]+'</div>'; }).join("")+'</div>';
  if (d.pay === "cash" && d.st !== "done" && d.st !== "prob"){
    var notes = [20,50,100].filter(function(n){ return n >= total; });
    h += '<div class="notice" style="margin-top:12px;display:block"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px"><b>Ресто</b><span class="prop">'+ic("sparkle",14)+'Предложение</span></div><p class="small muted" style="margin:4px 0 10px">Клиентът дава:</p><div class="change">'+notes.map(function(n){ return '<button class="chip" type="button" data-give="'+n+'" aria-pressed="'+(given===n)+'">'+n+' €</button>'; }).join("")+'</div>'+
      (given ? '<div class="chg">Върнете '+SC.fmt(given-total)+'</div>' : '')+(DR.feeKnown(d)?'':'<p class="small muted" style="margin:8px 0 0">Таксата за зоната не е въведена в системата <span class="missing">[ЛИПСВА]</span>; сумата е без нея.</p>')+'</div>';
  }
  if (d.pay === "card" && d.st !== "done") h += '<div class="notice" style="margin-top:12px">'+ic("credit-card",22)+'<span>Вземете терминала за карти. <span class="missing">[ЛИПСВА: мобилен POS терминал, модел]</span></span></div>';
  if (d.pay === "voucher" && d.st !== "done") h += '<div class="notice" style="margin-top:12px">'+ic("ticket",22)+'<span>Вземете ваучерите за '+DR.money(d)+'. Предават се в края на смяната.</span></div>';
  h += '</section>';
  if (d.st !== "done" && d.st !== "prob") h += '<section class="st-sec"><button class="pill pill-line pill-lg pill-block" type="button" data-problem>'+ic("warning",22)+'Проблем с доставката</button></section>';
  main.innerHTML = h; renderBar();
  if (DR.hash.call !== undefined && !render.called){ render.called = true; callSheet(); }
}
function renderBar(){ var money = d.pay==="cash" ? "взех "+DR.money(d) : d.pay==="card" ? "платено с карта" : "взех ваучера";
  var nx = DR.ordered().filter(function(x){ return x !== d; })[0];
  if (d.st === "wait") bar.innerHTML = '<button class="pill pill-red" type="button" data-st="picked">'+ic("shopping-bag",22)+'Взех от ресторанта</button>';
  else if (d.st === "picked") bar.innerHTML = '<button class="pill pill-red" type="button" data-st="road">'+ic("car",22)+'Тръгвам · На път</button>';
  else if (d.st === "road") bar.innerHTML = '<button class="pill pill-ok pill-red" type="button" data-st="done" style="background:var(--ok);color:var(--on-ok)">'+ic("check-circle",22)+'Доставена · '+money+'</button>';
  else bar.innerHTML = nx ? '<a class="pill pill-red" href="delivery.html#'+nx.id+'" data-go>Следваща · № '+nx.id+ic("caret-right",22)+'</a>' : '<a class="pill pill-red" href="list.html">'+ic("check-circle",22)+'Всичко е доставено</a>';
}
function callSheet(){ DR.sheet({title:"Обаждане до клиента", html:
  '<div class="callbig"><span>'+esc(d.client)+'</span><b>'+esc(d.phone)+'</b><span>примерен номер от поръчката</span></div>'+
  '<p class="st-cap" style="margin-top:14px">Какво да кажете</p><div class="notechips">'+["Пристигам след 5 минути","Пред входа съм","Не намирам входа"].map(function(t){ return '<a class="chip" href="sms:'+tel+'?body='+encodeURIComponent(t+". Siracusa")+'">'+ic("chat-circle-dots",18)+t+'</a>'; }).join("")+'</div>'+
  '<p class="small muted" style="margin:10px 0 0">Бутоните изпращат кратко SMS от вашия телефон. Номерът се вижда само по време на доставката.</p>',
  foot:'<a class="pill pill-red pill-lg pill-block" href="tel:'+tel+'">'+ic("phone",22)+'Обади се · '+esc(d.phone)+'</a>'}); }
function problemSheet(){ var pick = null;
  var s = DR.sheet({title:"Какво се случи?", html:'<div class="ptiles">'+Object.keys(DR.PROB).map(function(k){ return '<button class="ptile" type="button" data-p="'+k+'" aria-pressed="false"><span class="ii">'+ic(DR.PROB[k][1],24)+'</span><span>'+DR.PROB[k][0]+'<small>'+DR.PROB[k][2]+'</small></span></button>'; }).join("")+'</div><div id="pmore"></div>',
    foot:'<button class="pill pill-red pill-lg pill-block" type="button" data-psend disabled>Изпрати на ресторанта</button>'});
  var more = s.el.querySelector("#pmore"), send = s.el.querySelector("[data-psend]");
  var TIP = {nobody:'<div class="notice" style="margin-top:12px">'+ic("phone",22)+'<span>Първо се обадете на клиента. Ако не вдига, изчакайте <span class="missing">[ЛИПСВА: колко минути]</span> и изпратете.</span></div><button class="pill pill-line pill-block" type="button" data-callnow style="margin-top:10px">'+ic("phone",20)+'Обади се на клиента</button>',
    addr:'<div class="field" style="margin-top:12px"><label for="na">Верният адрес, ако клиентът го каже</label><input class="input" id="na" placeholder="например бл. 3xx, вх. В"></div>',
    refuse:'<div class="field" style="margin-top:12px"><label for="nr">Причина (по желание)</label><input class="input" id="nr" placeholder="например студена храна"></div><p class="small muted" style="margin:8px 0 0">Не спорете с клиента. Върнете поръчката в ресторанта.</p>'};
  s.el.addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.p){ pick = b.dataset.p; s.el.querySelectorAll("[data-p]").forEach(function(x){ x.setAttribute("aria-pressed", x===b); }); more.innerHTML = TIP[pick]; send.disabled = false; send.textContent = "Изпрати: "+DR.PROB[pick][0]; return; }
    if (b.hasAttribute("data-callnow")){ location.href = "tel:"+tel; return; }
    if (b.hasAttribute("data-psend") && pick){ var inp = more.querySelector("input"), prev = DR.problem(d.id, pick, inp ? inp.value : ""); s.close(); DR.haptic([30,60,30]);
      DR.toast((DR.offline?"Записано на телефона. ":"")+"Ресторантът е уведомен: "+DR.PROB[pick][0], function(){ DR.restore(d.id, prev); }); }
  }); }

render(); DR.on(render);
document.addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b || b.closest(".st-sheetwrap")) return;
  if (b.hasAttribute("data-call")){ callSheet(); return; }
  if (b.hasAttribute("data-problem")){ problemSheet(); return; }
  if (b.dataset.give){ given = +b.dataset.give === given ? 0 : +b.dataset.give; render(); return; }
  if (b.dataset.st){ var st = b.dataset.st, prev = DR.setSt(d.id, st); DR.haptic(st==="done"?[20,40,20]:12);
    var w = st==="picked" ? "взета от ресторанта" : st==="road" ? "е на път. Клиентът вижда приблизително време" : "е доставена";
    DR.toast((DR.offline?"Записано на телефона: ":"")+"№ "+d.id+" "+w+".", function(){ DR.restore(d.id, prev); }); window.scrollTo({top:0}); return; }
});
window.addEventListener("hashchange", function(){ location.reload(); });
</script>
</body>
</html>
