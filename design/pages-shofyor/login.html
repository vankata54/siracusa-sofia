<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вход | Siracusa · Шофьор</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<link rel="stylesheet" href="_driver.css">
<style>
.pw{position:relative}
.pw .input{padding-right:120px}
.pw .show{position:absolute; right:4px; top:2px; min-height:48px; padding:0 14px; border:0; border-radius:999px; background:transparent; color:var(--ink); font-weight:800; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.lg .h1{font-size:32px}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script src="_driver.js"></script>
<script>
var main = DR.mount({page:"login", title:"Вход", bare:true, nav:null});
var ic = SC.ic, esc = SC.esc;
var view = DR.hash.car!==undefined ? "car" : DR.hash.km!==undefined ? "km" : DR.hash.err!==undefined ? "err" : "login";
var car = DR.db.car, kmv = "", kmErr = "";
var DEF = "a1"; /* the car marked as "most used" in the driver's profile */
function stepper(i){ var names = ["Вход","Автомобил","Километраж"];
  return '<div class="stepper" style="--n:3"><div class="bar">'+names.map(function(n,k){ return '<span class="'+(k<=i?"on":"")+'"></span>'; }).join("")+'</div><div class="t"><b>Стъпка '+(i+1)+' от 3</b><span>'+names[i]+'</span></div></div>'; }
function render(){ var h = '<div class="lg">';
  if (view==="login" || view==="err"){
    h += stepper(0)+'<div><h1 class="h1">Вход за шофьора</h1><p class="lead" style="margin-top:6px">Влезте със своя потребител. Паролата ви дава управителят.</p></div>'+
      '<form class="stack" style="gap:16px" novalidate><div class="field"><label for="u">Потребител</label><input class="input" id="u" autocomplete="username" autocapitalize="none" value="'+(view==="err"?"shofyor1":"")+'" placeholder="например shofyor1"></div>'+
      '<div class="field"><label for="p">Парола</label><div class="pw"><input class="input" id="p" type="password" autocomplete="current-password"'+(view==="err"?' aria-invalid="true" aria-describedby="perr" value="1234567"':'')+'><button class="show" type="button" data-show>'+ic("eye",20)+'Покажи</button></div>'+
      (view==="err"?'<span class="err" id="perr">Грешна парола. Опитайте пак или попитайте управителя.</span>':'')+'</div>'+
      '<button class="pill pill-red pill-lg pill-block" type="submit">'+ic("sign-in",22)+'Влез</button></form>'+
      '<p class="small muted" style="margin:0;text-align:center">Забравена парола? Управителят я сменя от админ панела.</p>';
  } else if (view==="car"){
    h += stepper(1)+'<div><h1 class="h2">С коя кола карате днес?</h1><p class="lead" style="margin-top:6px">Отбелязаната стои по подразбиране. Сменете само ако днес карате друга.</p></div>'+
      '<div class="cars" role="group" aria-label="Автомобил">'+DR.CARS.map(function(c){ return '<button class="car" type="button" data-car="'+c.id+'" aria-pressed="'+(car===c.id)+'"><span class="ii">'+ic("car",24)+'</span><span><b>'+c.n+'</b><span>'+(c.id===DEF?"Най-често ползвана · ":"")+'рег. № <span class="missing">[ЛИПСВА]</span></span></span></button>'; }).join("")+'</div>'+
      '<p class="small muted" style="margin:0">Автомобилите се въвеждат в админ панела <span class="missing">[ЛИПСВА: брой автомобили, марка, гориво]</span>.</p>'+
      '<button class="pill pill-red pill-lg pill-block" type="button" data-go="km">Продължи с '+DR.CARS.filter(function(c){ return c.id===car; })[0].n+'</button>';
  } else if (view==="km"){
    var c = DR.CARS.filter(function(x){ return x.id===car; })[0];
    h += stepper(2)+'<div><h1 class="h2">Начален километраж</h1><p class="lead" style="margin-top:6px">Препишете числото от таблото на '+c.n+'. По него се смятат изминатите километри и разходът.</p></div>'+
      '<div class="field bigf"><label for="km">Километраж сега</label><div class="wrapi"><input class="input" id="km" inputmode="numeric" autocomplete="off" placeholder="0" value="'+esc(kmv)+'"'+(kmErr?' aria-invalid="true" aria-describedby="kerr"':' aria-describedby="khelp"')+'><span class="u">км</span></div>'+
      (kmErr?'<span class="err" id="kerr">'+kmErr+'</span>':'<span class="help" id="khelp">Последно записан за тази кола: '+DR.db.kmStart.toLocaleString("bg-BG")+' км (условно за макета).</span>')+'</div>'+
      '<div class="park">'+ic("car",22)+'<span>Ползвайте приложението само когато колата е паркирана. Навигацията работи в Google Maps или Waze.</span></div>'+
      '<button class="pill pill-red pill-lg pill-block" type="button" data-start>'+ic("moped",22)+'Започни смяната</button>'+
      '<button class="pill pill-line pill-lg pill-block" type="button" data-go="car">'+ic("caret-left",22)+'Назад: автомобил</button>';
  }
  main.innerHTML = h + '</div>';
}
render();
main.addEventListener("submit", function(e){ e.preventDefault(); var u = main.querySelector("#u"), p = main.querySelector("#p");
  if (!u.value.trim() || !p.value){ view = "err"; render(); return; } view = "car"; render(); window.scrollTo(0,0); });
main.addEventListener("input", function(e){ if (e.target.id==="km") kmv = e.target.value; });
main.addEventListener("click", function(e){ var b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-show")){ var p = main.querySelector("#p"), sh = p.type==="password"; p.type = sh ? "text" : "password"; b.innerHTML = ic("eye",20)+(sh?"Скрий":"Покажи"); return; }
  if (b.dataset.car){ car = b.dataset.car; render(); return; }
  if (b.dataset.go){ view = b.dataset.go; render(); window.scrollTo(0,0); return; }
  if (b.hasAttribute("data-start")){ var v = parseInt(kmv.replace(/\s/g,""),10);
    kmErr = !v ? "Въведете километража от таблото." : v < DR.db.kmStart ? "По-малко е от последно записания ("+DR.db.kmStart.toLocaleString("bg-BG")+" км). Проверете пак." : "";
    if (kmErr){ render(); main.querySelector("#km").focus(); return; }
    DR.db.car = car; DR.db.kmStart = v; DR.db.shiftStart = Date.now(); DR.db.parkSeen = false; DR.save(); location.href = "list.html"; }
});
</script>
</body>
</html>
