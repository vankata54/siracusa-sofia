<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Страницата я няма | Siracusa Bar & Grill</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<style>
/* ---------- hero: "4 [empty plate] 4" ---------- */
.nf{padding-top:36px; display:grid; justify-items:center; text-align:center}
.nf-art{display:flex; align-items:center; justify-content:center; gap:10px; margin:4px 0 26px}
.nf-art .d4{font-size:118px; line-height:.9; font-weight:800; letter-spacing:-.07em; color:var(--ink); font-variant-numeric:tabular-nums}
.nf-plate{width:150px; height:150px; flex:none; border-radius:50%; box-shadow:var(--shadow-lg)}
.nf-plate svg{display:block; width:100%; height:100%; overflow:visible}
.nf-plate .cut{fill:var(--off)}
.nf .h1{max-width:13ch}
.nf .lead{margin-top:12px; max-width:32ch}
.nf-acts{display:grid; gap:10px; width:100%; margin-top:28px}
.nf-call{margin-top:14px; text-wrap:balance; font-size:15px; color:var(--muted); font-weight:600; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; column-gap:6px}
.nf-call .link{min-height:48px}

/* entrance: the plate is "served", then the cutlery lands in the "finished" position */
@keyframes serve{from{transform:translateY(-28px) rotate(-70deg) scale(.86); opacity:0} to{transform:none; opacity:1}}
@keyframes side{from{transform:translateX(var(--dx)); opacity:0} to{transform:none; opacity:1}}
@keyframes lay{from{transform:translate(18px,18px); opacity:0} to{transform:none; opacity:1}}
@keyframes fade{from{opacity:0} to{opacity:1}}
.nf-plate{animation:serve 900ms var(--ease) both}
.nf-art .d4:first-child{--dx:18px; animation:side 700ms var(--ease) 80ms both}
.nf-art .d4:last-child{--dx:-18px; animation:side 700ms var(--ease) 80ms both}
.nf-plate .cutlery{animation:lay 600ms var(--ease) 620ms both}
.nf-plate .crumbs{animation:fade 500ms ease-out 760ms both}

/* ---------- suggestions ---------- */
.sug-list{display:grid}
.sug{display:grid; grid-template-columns:48px 1fr 22px; gap:14px; align-items:center; min-height:72px; padding:12px 18px; text-decoration:none; color:inherit}
.sug + .sug{border-top:1px solid var(--line)}
.sug .ico{width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--ink)}
.sug b{display:block; font-size:17px; line-height:1.25; letter-spacing:-.01em}
.sug small{display:block; font-size:14px; color:var(--muted); font-weight:600; margin-top:2px}
.sug > .ic{color:var(--muted)}
.sug:active{background:var(--surface-2)}

/* ---------- desktop ---------- */
@container app (min-width:900px){
  .nf{padding-top:72px}
  .nf-art{gap:18px; margin-bottom:36px}
  .nf-art .d4{font-size:210px}
  .nf-plate{width:248px; height:248px}
  .nf .h1{max-width:none}
  .nf .lead{font-size:19px; max-width:44ch}
  .nf-acts{grid-auto-flow:column; width:auto; justify-content:center}
  .nf-acts .pill{padding:0 32px}
  .sug-wrap .core{background:transparent; box-shadow:none; overflow:visible}
  .sug-wrap.shell{padding:0; background:transparent; box-shadow:none}
  .sug-list{grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px}
  .sug{border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); min-height:96px; padding:18px 20px; transition:transform var(--t-base) var(--ease)}
  .sug + .sug{border-top:0}
  .sug:hover{transform:translateY(-3px)}
}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script>
(function(){
"use strict";
var main = SC.mount({page:"404", nav:null, title:"Страницата я няма"});
var ic = SC.ic, R = SC.RESTAURANT;

/* the joke illustration: SC.art's own plate, emptied. A pizza's crust colour gives the last crumbs and a faint trace of where it stood. */
function emptyPlate(){
  var soup = SC.art({id:"prazna-chinia", n:"", comp:"", cat:"supi", t:[]});
  var plate = (soup.match(/<circle cx="100" cy="100" r="94"[^>]*\/><circle cx="100" cy="100" r="78"[^>]*\/>/) || [""])[0];
  var pz = SC.art("pitsa-margarita");
  var crust = (pz.match(/r="92" fill="(#[0-9A-Fa-f]{6})"/) || [0,"#D9A262"])[1];
  var sauce = (pz.match(/r="76" fill="(#[0-9A-Fa-f]{6})"/) || [0,"#C23A22"])[1];
  var char = (pz.match(/fill="(#[0-9A-Fa-f]{6})" opacity/) || [0,"#7E4618"])[1];
  var crumbs = [[78,92,3.2,crust],[86,118,2.2,crust],[70,108,1.6,char],[112,82,2.4,crust],[121,96,1.4,char],[94,76,1.8,crust],[64,90,1.2,crust],[104,124,1.5,char]]
    .map(function(c){ return '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+c[2]+'" fill="'+c[3]+'"/>'; }).join("");
  var knife = '<g transform="translate(86 74) rotate(-45)"><path class="cut" d="M-1 0Q10 10 10 58L-1 58Z"/><rect class="cut" x="-3.5" y="58" width="11" height="62" rx="5.5"/></g>';
  var fork = '<g transform="translate(103 57) rotate(-45)"><rect class="cut" x="-7.6" y="0" width="2.6" height="22" rx="1.3"/><rect class="cut" x="-3.2" y="0" width="2.6" height="22" rx="1.3"/><rect class="cut" x="1.2" y="0" width="2.6" height="22" rx="1.3"/><rect class="cut" x="5.6" y="0" width="2.6" height="22" rx="1.3"/><rect class="cut" x="-8" y="18" width="16.2" height="12" rx="6"/><rect class="cut" x="-2" y="26" width="4.2" height="34" rx="2"/><rect class="cut" x="-4.4" y="58" width="9" height="62" rx="4.5"/></g>';
  return '<svg viewBox="0 0 200 200" aria-hidden="true">'+plate+
    '<g class="crumbs"><circle cx="100" cy="100" r="58" fill="none" stroke="'+sauce+'" stroke-width="2.5" opacity=".16"/>'+crumbs+'</g>'+
    '<g class="cutlery">'+knife+fork+'</g></svg>'; }

/* the phone line only promises an answer while we are open (time comes from SC.state, so the preview clock works) */
function callLine(){ var st = SC.state(), tel = '<a class="link" href="tel:+359894365577">'+ic("phone",18);
  if (st.open) return 'Търсите нещо конкретно? '+tel+'Обадете се: '+R.phone+'</a>';
  return 'Търсите нещо конкретно? Обадете ни се '+(st.m < 600 ? 'след 10:00' : 'утре след 10:00')+': '+tel+R.phone+'</a>'; }

var pizzas = SC.inCat("pitsi").filter(function(x){ return !SC.isOut(x); })
  .sort(function(a,b){ return (b.t.indexOf("hit")>-1) - (a.t.indexOf("hit")>-1) || (b.t.indexOf("new")>-1) - (a.t.indexOf("new")>-1); }).slice(0,4);

var SUG = [
  ["lunch.html","Обедно меню","Днешните ястия и цени","bowl-food"],
  ["reservation.html","Резервирай маса","Салон или отоплена градина","calendar-blank"],
  ["delivery.html","Доставка","Зони, часове и такси","moped"],
  ["events.html","Събития и поводи","Гръцка вечер и празници при нас","confetti"],
  ["offers.html","Оферти","Всички отстъпки на едно място","seal-percent"],
  ["contacts.html","Контакти","Дружба 2, срещу бл. 311","map-pin"]];

main.innerHTML =
  '<section class="sec nf">'+
    '<div class="nf-art" role="img" aria-label="Празна чиния с прибори, оставени като след хубаво ядене"><span class="d4" aria-hidden="true">4</span><span class="nf-plate">'+emptyPlate()+'</span><span class="d4" aria-hidden="true">4</span></div>'+
    '<h1 class="h1">Тази страница я няма в&nbsp;менюто</h1>'+
    '<p class="lead">Явно някой я е изял до последната троха. Възможно е адресът да е сгрешен или страницата да е преместена.</p>'+
    '<div class="nf-acts"><a class="pill pill-red pill-lg pill-block" href="menu.html">'+ic("fork-knife",20)+'Към менюто</a><a class="pill pill-line pill-lg pill-block" href="home.html">'+ic("house",20)+'Начало</a></div>'+
    '<p class="nf-call">'+callLine()+'</p>'+
  '</section>'+
  '<section class="sec"><h2 class="h2" style="margin-bottom:14px">Може би търсите</h2>'+
    '<div class="shell sug-wrap"><div class="core"><nav class="sug-list" aria-label="Често отваряни страници">'+SUG.map(function(s){
      return '<a class="sug" href="'+s[0]+'"><span class="ico">'+ic(s[3],22)+'</span><span><b>'+s[1]+'</b><small>'+s[2]+'</small></span>'+ic("caret-right",20)+'</a>'; }).join("")+'</nav></div></div>'+
  '</section>'+
  '<section class="sec"><div class="sec-h"><h2 class="h2">Пици на пещ</h2><a class="link" href="category.html#pitsi">Всички'+ic("caret-right",18)+'</a></div>'+
    '<div class="grid-dishes">'+pizzas.map(function(x){ return SC.dishCard(x); }).join("")+'</div>'+
  '</section>';
})();
</script>
</body>
</html>
