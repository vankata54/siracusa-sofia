<style>
/* Home page only. Tokens from ds/sc.css; translucency via color-mix() of tokens, no new colours. */
.eyebrow{margin:0 0 10px; font-size:14px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

/* ---------- hero: simulated 8 - 15 s clip under the floating header ---------- */
.hero{display:grid; grid-template-columns:minmax(0,1fr); grid-template-areas:"stage" "acts"}
.stage{grid-area:stage; position:relative; isolation:isolate; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end;
  margin-top:calc(var(--pull,130px) * -1); min-height:calc(var(--pull,130px) + 300px); padding:calc(var(--pull,130px) + 24px) 20px 24px;
  border-radius:0 0 36px 36px; color:var(--on-chip-dark)}
.film{position:absolute; inset:0; z-index:-1; overflow:hidden; background:var(--chip-dark); border-radius:inherit}
.film .cam{position:absolute; inset:0; animation:cam 16s var(--ease-std) infinite alternate; transform-origin:70% 35%}
.film .glow{position:absolute; width:520px; height:520px; right:-170px; top:calc(var(--pull,130px) - 150px); border-radius:50%;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--ember) 62%, transparent), color-mix(in srgb, var(--ember) 18%, transparent) 55%, transparent);
  animation:flicker 3.4s ease-in-out infinite alternate}
.film .spin{position:absolute; width:370px; height:370px; right:-96px; top:calc(var(--pull,130px) - 74px); animation:spin 60s linear infinite}

.film .shade{position:absolute; width:340px; height:340px; right:-78px; top:calc(var(--pull,130px) - 40px); border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.55), transparent)}
.film .spark{position:absolute; left:var(--x); bottom:var(--b,40%); width:var(--s,5px); height:var(--s,5px); border-radius:50%; background:var(--ember); opacity:0;
  animation:rise var(--d,4.6s) linear var(--w,0s) infinite}
.film .veil{position:absolute; inset:0; background:linear-gradient(to top, var(--chip-dark) 18%, color-mix(in srgb, var(--chip-dark) 72%, transparent) 46%, transparent 74%)}
.film.paused *, .film.offscreen *{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes flicker{0%{opacity:.7; transform:scale(.97)}45%{opacity:1; transform:scale(1.02)}70%{opacity:.82; transform:scale(.99)}100%{opacity:.96; transform:scale(1.04)}}
@keyframes rise{0%{opacity:0; transform:translate(0,0) scale(1)}12%{opacity:.95}70%{opacity:.5}100%{opacity:0; transform:translate(var(--dx,-18px),-230px) scale(.4)}}
.htxt{position:relative; z-index:1}
.htxt .h1{font-size:40px; line-height:1.02; letter-spacing:-.05em; color:var(--on-chip-dark); max-width:12ch}

.vctl{position:relative; z-index:2; display:flex; align-items:center; gap:12px; margin-top:22px}
.vbtn{display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:0 18px 0 14px; border:0; border-radius:999px; cursor:pointer; font-weight:700; font-size:16px;
  color:var(--on-chip-dark); background:color-mix(in srgb, var(--on-chip-dark) 14%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--on-chip-dark) 18%, transparent); transition:transform var(--t-fast) var(--ease)}

/* hero actions */
.acts{grid-area:acts; min-width:0; display:grid; grid-template-columns:minmax(0,1fr); gap:10px; padding:16px 16px 0}
.go .gol{display:grid; min-width:0; text-align:left; line-height:1.15; white-space:normal}

.eta .dot{width:10px; height:10px; border-radius:50%; flex:none; background:var(--off)}

.eta .tx{display:grid}

/* ---------- promo banner (ember) ---------- */

.dots .d i{position:absolute; inset:0; background:var(--on-ember); transform:scaleX(0); transform-origin:left}

@keyframes fill{to{transform:scaleX(1)}}
.pp{display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:0 16px 0 12px; border:0; border-radius:999px; background:color-mix(in srgb, var(--on-ember) 10%, transparent); color:inherit; font-weight:700; font-size:16px; cursor:pointer}

/* ---------- popular ---------- */
.sec-note{margin:-6px 0 14px}

/* ---------- Bertha ---------- */
.bcore{background:var(--chip-dark); color:var(--on-chip-dark); padding:26px 22px 24px; display:grid; gap:26px; position:relative; isolation:isolate}
.bcore::before{content:""; position:absolute; z-index:-1; width:420px; height:420px; right:-200px; top:-190px; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--ember) 28%, transparent), transparent)}
.bcore .eyebrow{color:var(--ember)}

.scale .mk{position:absolute; left:87.5%; top:-7px; width:4px; height:24px; margin-left:-2px; border-radius:2px; background:var(--on-chip-dark); opacity:0; transition:opacity 400ms var(--ease) 1200ms}

.scale-l span{position:absolute; transform:translateX(-50%)} .scale-l span:first-child{transform:none}

.facts{list-style:none; margin:0; padding:0; display:grid; gap:14px}

.bact{display:grid; gap:10px}

/* ---------- come visit ---------- */
.vslot{position:relative; aspect-ratio:4/3; display:grid; place-items:center; align-content:center; gap:12px; text-align:center; padding:20px;

/* ---------- office ---------- */
.office{padding:20px; display:grid; gap:16px}

/* ---------- how to get here ---------- */
.where{display:grid; gap:16px}
.map{position:relative; aspect-ratio:4/3; background:var(--surface-2)}
.map > svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.map .blk{fill:var(--surface-3)} .map .road{stroke:var(--surface); fill:none; stroke-linecap:round} .map .park{fill:color-mix(in srgb, var(--ok) 22%, var(--surface-2))}
.map .road.big{stroke-width:22} .map .road.mid{stroke-width:12} .map .road.sm{stroke-width:7}

.info .kv{font-size:16px} .info .kv span:first-child{color:var(--muted)} .info .kv b{font-variant-numeric:tabular-nums; text-align:right}

  ppb.innerHTML = p ? ic("pause",20)+'<span>Пауза</span>' : ic("play",20)+'<span>Пусни</span>';
  if (p){ arm(); } else { clearTimeout(timer); left = Math.max(400, left - (Date.now() - started)); } }
if (slides.length < 2){ pr.querySelector(".pctl").hidden = true; }
if (SC.reduce) pr.classList.add("stopped");
setPlay(playing);
ppb.addEventListener("click", function(){ pr.classList.remove("stopped"); setPlay(!playing); });
dots.forEach(function(d){ d.addEventListener("click", function(){ if (playing) setPlay(false); show(+d.dataset.dot); }); });
var sx = null;
pr.addEventListener("pointerdown", function(e){ sx = e.clientX; if (playing && !e.target.closest("[data-pp]")) setPlay(false); });
pr.addEventListener("pointerup", function(e){ if (sx === null) return; var dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); });
pr.addEventListener("focusin", function(e){ if (playing && !e.target.closest("[data-pp]")) setPlay(false); });

/* ---------- Bertha scale fills when it comes into view ---------- */
var temp = main.querySelector("[data-temp]");
if (SC.reduce || !("IntersectionObserver" in window)) temp.classList.add("in");
else { var tio = new IntersectionObserver(function(es){ if (es[0].isIntersecting){ temp.classList.add("in"); tio.disconnect(); } }, {root:SC.scroller, threshold:.5}); tio.observe(temp); }

/* ---------- address check (prototype: districts by name, Latin too) ---------- */
var LAT = [[/druzh?ba|drujba/g,"дружба"],[/busmant?s?i|busmanci/g,"бусманци"],[/gorubl[yji]?a?ne|gorubliane/g,"горубляне"],[/is[ku][ae]?r|iskyr/g,"искър"],[/\bnpz\b/g,"нпз"],[/\bgara\b/g,"гара"],[/mladost/g,"младост"],[/lyulin|ljulin/g,"люлин"]];
var OUT = /младост|люлин|център|лозенец|надежда|овча купел|студентски|обеля|слатина|гео милев|изток|изгрев|редута|сухата река|красно село|банишора|борово|витоша|бояна|дианабад|подуяне|левски|сердика|връбница|кремиковци|ботунец|казичене|кривина|мусагеница|павлово|хаджи димитър|кръстова вада|симеоново|полигона|яворов|стрелбище|манастирски|зона б|света троица|илинден|разсадника|западен парк|орландовци|малашевци|бенковски|требич|филиповци|гевгелийски|хиподрума|княжево|горна баня|бъкстон|драгалевци|бистрица|панчарево|герман|лозен|кладница/;
function zoneOf(v){ v = " " + v.toLowerCase() + " "; LAT.forEach(function(r){ v = v.replace(r[0], r[1]); });
  if (/гара\s*искър/.test(v)) return SC.ZONES[5];
  if (/нпз|искър/.test(v)) return SC.ZONES[2];
  if (/дружба\s*(1|i)\b/.test(v)) return SC.ZONES[0];
  if (/дружба\s*(2|ii)\b/.test(v)) return SC.ZONES[1];
  if (/дружба/.test(v)) return {n:"Дружба 1 и 2", free:true, eta:"около 25 - 30 мин"};
  if (/бусманци/.test(v)) return SC.ZONES[3];
  if (/горубляне/.test(v)) return SC.ZONES[4];
  if (OUT.test(v)) return "out";
  return null; }
var chk = main.querySelector("[data-chk]"), inp = chk.querySelector("#addr"), err = chk.querySelector("#addr-err"), res = chk.querySelector("[data-res]");
inp.addEventListener("input", function(){ if (!err.hidden){ err.hidden = true; inp.removeAttribute("aria-invalid"); } });
chk.addEventListener("submit", function(e){ e.preventDefault(); var v = inp.value.trim();
  if (v.length < 3){ err.textContent = "Напишете квартал, улица или блок, например „Дружба 1, бл. 12“."; err.hidden = false; inp.setAttribute("aria-invalid","true"); res.hidden = true; inp.focus(); return; }
  var z = zoneOf(v), when = st.delivery ? (eta.busy ? "Възможни са закъснения · около " + eta.min + " мин" : z && z.eta ? z.eta[0].toUpperCase() + z.eta.slice(1) : "") : (st.kitchen ? "Днес доставката приключи. Утре доставяме от 10:00." : "Доставяме от 10:00 до 21:00."), h;
  if (z === "out") h = {c:"no", i:"warning-circle", t:"Не доставяме до този адрес.", p:"Можете да вземете поръчката от ресторанта в Дружба 2.", a:'<a class="pill pill-line" href="pickup.html">'+ic("storefront",20)+'Вземи от място</a>'};
  else if (!z) h = {c:"q", i:"question", t:"Не разпознахме квартала.", p:"Напишете го към адреса, например „Дружба 1, бл. 12“. Безплатно доставяме в Дружба 1 и 2, НПЗ Искър и Бусманци.", a:""};
  else if (z.free) h = {c:"ok", i:"check-circle", t:z.n+": безплатна доставка", p:when, a:st.delivery ? '<a class="pill pill-red" href="menu.html">Поръчай'+ic("arrow-right",20)+'</a>' : '<a class="pill pill-line" href="pickup.html">'+ic("storefront",20)+'Вземи от място</a>'};
  else h = {c:"paid", i:"map-pin", t:z.n+": доставка по тарифа", p:'Таксата се вижда в количката. <span class="missing">[ЛИПСВА: такса в €]</span>'+(when ? '<br>'+when : ''), a:st.delivery ? '<a class="pill pill-red" href="menu.html">Поръчай'+ic("arrow-right",20)+'</a>' : ''};
  res.className = "res " + h.c; res.innerHTML = ic(h.i,24) + '<div><b>'+h.t+'</b>'+(h.p ? '<p>'+h.p+'</p>' : '')+h.a+'</div>'; res.hidden = false; });

/* ---------- misc ---------- */
main.querySelector("[data-maplive]").addEventListener("click", function(){ SC.toast("В сайта тук се отваря Google Maps."); });
main.querySelector("[data-vslot]").addEventListener("click", function(){ SC.toast("Видеото идва след новата фотосесия."); });
main.querySelectorAll("[data-retry]").forEach(function(b){ b.addEventListener("click", function(){ location.hash = ""; location.reload(); }); });
window.addEventListener("offline", function(){ SC.toast("Няма връзка. Менюто остава, поръчката ще изпратите по-късно."); });
window.addEventListener("online", function(){ SC.toast("Връзката се върна."); });
SC.reveal();
})();
</script>
