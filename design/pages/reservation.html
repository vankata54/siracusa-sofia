<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Резервирай маса | Siracusa Bar & Grill</title>
<meta name="description" content="Резервирайте маса в Siracusa Bar & Grill, ж.к. Дружба 2: изберете ден, час и маса в салона или в отопляваната градина. Без депозит, потвърждение по SMS или Viber.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<style>
/* reservation.html - page-only styles, tokens from sc.css only */

/* ---------- hero ---------- */
.rhero{padding-top:20px}
.rhero .lead{margin-top:10px; max-width:34em}
.facts{display:none; flex-wrap:wrap; gap:8px; margin:20px 0 0; padding:0; list-style:none}
.facts li{display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 14px 0 10px; border-radius:999px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); font-size:15px; font-weight:700}
.facts .ic{color:var(--muted)}

/* ---------- flow layout ---------- */
.flowsec{padding-top:24px}
.fgrid{display:grid; gap:0}
.aside{display:none}
.enter{animation:rIn var(--t-slow) var(--ease-std) both}
@keyframes rIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

/* ---------- stepper (3 labelled bars, done steps are buttons) ---------- */
.steps{display:grid; gap:10px; margin-bottom:22px}
.steps-t{margin:0; font-size:14px; font-weight:700; color:var(--muted)}
.steps-t b{color:var(--ink)}
.steps ol{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.steps li{position:relative; display:grid; gap:8px; align-content:start; min-height:44px; font-size:14px; font-weight:700; color:var(--muted); line-height:1.25}
.steps .sl{display:block; padding:0; border:0; background:none; font:inherit; color:inherit; text-align:left}
.steps button.sl{cursor:pointer; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; text-decoration-color:var(--line-strong)}
.steps button.sl::after{content:""; position:absolute; inset:-6px 0 -4px}
.steps .bar{position:relative; display:block; height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden}
.steps .bar::after{content:""; position:absolute; inset:0; background:var(--red); border-radius:3px; transform:scaleX(0); transform-origin:left}
.steps .done .bar::after, .steps .on .bar::after{transform:none}
.steps.anim .on .bar::after{animation:rFill 520ms var(--ease) both}
.steps .on{color:var(--ink)}
@keyframes rFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- step 1 ---------- */
.qh{font-size:20px; line-height:1.2; font-weight:800; letter-spacing:-.02em; margin:0 0 12px}
.q + .q, .qcol{margin-top:30px}
.qcol{display:grid; gap:30px}
.qcol .q + .q{margin-top:0}
.cal{padding:12px 8px 10px}
.cal-h{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 4px 6px 10px}
.cal-m{margin:0; font-size:20px; font-weight:800; letter-spacing:-.025em}
.cal-nav{display:flex; gap:6px}
.mbtn{min-height:48px; padding:0 14px 0 10px; gap:4px; font-size:15px}
.mbtn.nx{padding:0 10px 0 14px}
.mbtn[disabled]{opacity:.45}
.cal-g{display:grid; grid-template-columns:repeat(7,minmax(0,1fr))}
.wd{font-size:14px; font-weight:700; color:var(--muted); text-align:center; padding:4px 0 6px}
.day{position:relative; height:50px; padding:0; border:0; background:transparent; color:var(--ink); cursor:pointer; display:grid; place-items:center; font:inherit; font-weight:700; font-size:17px; font-variant-numeric:tabular-nums}
.day > span{width:46px; height:46px; display:grid; place-items:center; border-radius:50%; transition:transform var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease)}
.day:active > span{transform:scale(.92)}
.day.today > span{box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.day[aria-pressed="true"] > span{background:var(--ink); color:var(--bg); box-shadow:none}
.day:disabled{cursor:default; color:var(--muted); opacity:.42}
.day .ev{position:absolute; left:50%; bottom:5px; width:6px; height:6px; margin-left:-3px; border-radius:50%; background:var(--ember)}
.cal-lg{display:flex; flex-wrap:wrap; gap:6px 18px; margin:6px 10px 0; padding-top:10px; border-top:1px solid var(--line); font-size:14px; font-weight:600; color:var(--muted)}
.cal-lg span{display:inline-flex; align-items:center; gap:8px}
.cal-lg .o{width:14px; height:14px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.cal-lg .e{width:8px; height:8px; border-radius:50%; background:var(--ember); margin:0 3px}
.evnote{display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:start; margin-top:12px; padding:14px 16px; border-radius:var(--r-core); background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--ember)}
.evnote .evic{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--ember); color:var(--on-ember)}
.evnote b{display:block; font-size:17px; line-height:1.3}
.evnote p{margin:4px 0 0; color:var(--muted); font-size:15px}
.evnote .link{min-height:44px}
.note{display:flex; gap:10px; align-items:flex-start; margin:12px 0 0; padding:12px 14px; border-radius:18px; background:var(--surface-2); font-size:15px; font-weight:600}
.note .ic{flex:none; margin-top:1px; color:var(--muted)}
.slots{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:12px}
.slot{min-height:52px; padding:4px 0; border:0; border-radius:999px; background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line-strong); font:inherit; font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; cursor:pointer; display:grid; place-content:center; line-height:1.1; transition:transform var(--t-fast) var(--ease)}
.slot:active{transform:scale(.95)}
.slot[aria-pressed="true"]{background:var(--ink); color:var(--bg); box-shadow:none}
.slot.full{background:var(--surface-2); color:var(--muted); box-shadow:none; font-size:16px}
.slot.full small{font-size:14px; font-weight:700}
.hint{margin:10px 2px 0; font-size:14px; color:var(--muted); font-weight:600}
.ppl{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 14px 14px 18px}
.ppl .qh{margin:0}
.ppl p{margin:4px 0 0; font-size:15px; color:var(--muted)}
.ppl .counter output{min-width:40px; font-size:22px}
.ppl .counter button[disabled]{opacity:.35; cursor:not-allowed}
.ppl-more{margin:10px 2px 0; font-size:15px; color:var(--muted)}

/* ---------- step 2 ---------- */
.recap{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:56px; padding:4px 4px 4px 16px; border-radius:999px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); font-weight:700; margin-bottom:16px}
.recap span{min-width:0; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.recap .ic{color:var(--muted)}
.recap .pill{min-height:48px; padding:0 16px; flex:none}
.zseg button{flex-direction:row; gap:10px; min-height:60px; text-align:left}
.zseg button span{display:grid; line-height:1.2}
.zseg button small{font-size:14px; font-weight:700; color:var(--muted)}
.zseg button[aria-pressed="true"] small{color:var(--ok)}
.znote{display:flex; gap:8px; align-items:center; margin:10px 4px 0; font-size:15px; color:var(--muted); font-weight:600}
.lgd{display:flex; flex-wrap:wrap; gap:6px 16px; margin:16px 4px 10px; padding:0; list-style:none; font-size:14px; font-weight:700; color:var(--muted)}
.lgd li{display:inline-flex; align-items:center; gap:7px}
.sw{width:18px; height:18px; border-radius:6px; flex:none}
.sw.free{background:var(--surface); box-shadow:inset 0 0 0 2.5px var(--red)}
.sw.sel{background:var(--red)}
.sw.taken{background:repeating-linear-gradient(45deg, var(--surface-3) 0 3px, var(--line-strong) 3px 4.5px)}
.sw.unfit{background:var(--surface); border:2px dashed var(--line-strong)}
.sw.win{height:7px; border-radius:2px; background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--muted)}
.mapbox .core{padding:8px 6px 6px}
.fp{display:block; width:100%; height:auto; margin:0 auto; overflow:visible}
.fp .floor{fill:var(--surface)}
.fp .lawn{fill:var(--ok); opacity:.07}
.fp .wall{fill:none; stroke:var(--line-strong); stroke-width:3}
.fp .gap{stroke:var(--surface); stroke-width:7}
.fp .win{fill:var(--surface); stroke:var(--muted); stroke-width:1.5}
.fp .bush{fill:var(--ok); opacity:.3}
.fp .lbl{fill:var(--muted); font-size:14px; font-weight:700; font-family:var(--font)}
.fp .door{fill:none; stroke:var(--muted); stroke-width:1.5; stroke-dasharray:3 3}
.tbl{cursor:pointer; outline:none}
.tbl .hit{fill:transparent}
.tbl .ring{fill:none; stroke:var(--red); stroke-width:3; opacity:0}
.tbl:focus-visible .ring{opacity:1}
.tbl .shp{transform-box:fill-box; transform-origin:center; transition:transform var(--t-slow) var(--ease)}
.tbl .top{stroke-width:2.5}
.tbl .no{font-family:var(--font); font-size:19px; font-weight:800; text-anchor:middle}
.tbl .lb{font-family:var(--font); font-size:14px; font-weight:700; text-anchor:middle; fill:var(--muted)}
.tbl.free .top{fill:var(--surface); stroke:var(--red)}
.tbl.free .ch{fill:var(--red); opacity:.32}
.tbl.free .no{fill:var(--red)}
.tbl.free .lb{fill:var(--ink)}
.tbl.free:hover .shp{transform:scale(1.05)}
.tbl.sel .top{fill:var(--red); stroke:var(--red)}
.tbl.sel .ch{fill:var(--red)}
.tbl.sel .no{fill:var(--on-red)}
.tbl.sel .lb{fill:var(--red); font-weight:800}
.tbl.sel .shp{transform:scale(1.1)}
.tbl.taken .top{fill:var(--surface-3); stroke:none}
.tbl.taken .ch{fill:var(--surface-3)}
.tbl.taken .no{fill:var(--muted)}
.tbl.unfit .top{fill:var(--surface); stroke:var(--line-strong); stroke-dasharray:5 4; stroke-width:2}
.tbl.unfit .ch{fill:var(--surface-2)}
.tbl.unfit .no{fill:var(--muted)}
.tbl.unfit .no, .tbl.unfit .lb{opacity:.8}
.fp .hatch line{stroke:var(--line-strong); stroke-width:1.5}
.below{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 16px; margin-top:8px}
.needs{margin-top:18px}
.needs .label{display:block; margin:0 0 8px 2px}
.needs .chips{flex-wrap:wrap; overflow:visible; margin:0; padding:0}
.needs .chip{min-height:48px}
.needs .chip .ic{color:var(--muted)}
.needs .chip[aria-pressed="true"] .ic{color:inherit}
.selc{margin-top:20px}
.selc .core{display:grid; gap:14px; padding:16px}
.selrow{display:grid; grid-template-columns:52px 1fr; gap:14px; align-items:center}
.tno{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-weight:800; font-size:20px; background:var(--surface-2); color:var(--ink); font-variant-numeric:tabular-nums}
.tno.on{background:var(--red); color:var(--on-red)}
.selrow b{display:block; font-size:17px; line-height:1.3}
.selrow p{margin:2px 0 0; font-size:15px; color:var(--muted)}
.hold{display:inline-flex; align-items:center; gap:8px; justify-self:start; min-height:44px; padding:0 16px 0 12px; border-radius:999px; background:var(--surface-2); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums}
.hold .ic{color:var(--ok)}
.hold.urgent{box-shadow:inset 0 0 0 1.5px var(--warn)}
.hold.urgent .ic{color:var(--warn)}
.alert{display:grid; grid-template-columns:24px 1fr; gap:12px; align-items:start; padding:16px; border-radius:var(--r-core); background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.alert.bad{box-shadow:inset 0 0 0 2px var(--danger)}
.alert.bad > .ic{color:var(--danger)}
.alert.warn{box-shadow:inset 0 0 0 2px var(--warn)}
.alert.warn > .ic{color:var(--warn)}
.alert > .ic{margin-top:1px; color:var(--muted)}
.alert b{display:block; font-size:17px; line-height:1.3}
.alert p{margin:4px 0 0; color:var(--muted); font-size:15px}
.alert .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.zempty{margin-bottom:14px}
.grp .core{display:grid; gap:14px; padding:18px}
.grp .gic{width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); flex:none}
.grp p{margin:4px 0 0; color:var(--muted)}
.grp .opts{display:grid; gap:8px}
.gopt{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:64px; padding:8px 8px 8px 16px; border-radius:20px; background:var(--surface-2)}
.gopt b{display:block}
.gopt small{display:block; font-size:14px; color:var(--muted); font-weight:600}
.gopt.on{background:var(--surface); box-shadow:inset 0 0 0 2px var(--red)}
.tlist{list-style:none; margin:0; padding:0}
.tlist h3{margin:18px 2px 6px; font-size:15px; font-weight:800; color:var(--muted)}
.trow{display:grid; grid-template-columns:52px 1fr auto; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
.trow b{display:block; line-height:1.3}
.trow .ft{display:block; font-size:14px; color:var(--muted); font-weight:600}
.trow .pill{min-height:48px; padding:0 18px}
.trow.taken .tno, .trow.unfit .tno{background:transparent; box-shadow:inset 0 0 0 1.5px var(--line-strong); color:var(--muted)}
.trow .st{font-size:14px; font-weight:700; color:var(--muted); text-align:right; max-width:9em}
.trow .st.sel{color:var(--red); display:inline-flex; align-items:center; gap:4px}
.skmap{height:300px; border-radius:var(--r-core)}

/* ---------- step 3 ---------- */
.rc{display:grid; gap:10px}
.rc .core{padding:14px 16px; display:grid; gap:4px}
.rc .li{display:flex; align-items:center; gap:10px; font-weight:700; min-height:32px}
.rc .li .ic{color:var(--muted)}
.rc .acts{display:flex; flex-wrap:wrap; gap:4px 18px; margin-top:4px}
.rc .acts .link{min-height:44px}
.form{display:grid; gap:20px; margin-top:22px}
.form .two{display:grid; gap:20px}
.opt{font-weight:600; color:var(--muted)}
.occ .chips{flex-wrap:wrap; overflow:visible; margin:0; padding:0}
.occ .chip{min-height:48px}
.consent{padding:14px 16px; border-radius:20px; background:var(--surface-2)}
.consent .check{padding:0; min-height:0}
.consent b{display:block; line-height:1.35}
.consent .muted{display:block; font-size:14px; margin-top:2px}
.rules{display:flex; gap:10px; align-items:flex-start; margin:0; font-size:14px; color:var(--muted); font-weight:600}
.rules .ic{flex:none; margin-top:1px}
.spin{width:18px; height:18px; border-radius:50%; border:2.5px solid currentColor; border-right-color:transparent; animation:rSpin 800ms linear infinite; flex:none}
@keyframes rSpin{to{transform:rotate(360deg)}}

/* ---------- action bar (phone) + summary (desktop) ---------- */
.rabar .back{flex:none; padding:0 16px 0 12px; gap:6px; min-height:56px}
.rabar[hidden]{display:none}
.device.rfocus .nav{display:none}
.cta{justify-content:space-between; gap:10px; min-height:56px; padding:0 6px 0 22px; text-align:left}
.cta.solo{padding-right:6px}
.cta .ct{display:grid; gap:1px; min-width:0}
.cta .ct b{font-size:17px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cta .ct small{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums}
.cta .knob{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; background:color-mix(in srgb, var(--on-red) 20%, transparent); transition:transform var(--t-slow) var(--ease)}
.cta:hover .knob{transform:translateX(2px)}
.rabar .cta{padding-right:18px}
.rabar .cta.solo{padding-right:6px}
.sum .core{padding:20px; display:grid; gap:4px}
.sum h2{margin:0 0 6px; font-size:20px; letter-spacing:-.02em}
.sum .kv{align-items:center}
.sum .kv span{color:var(--muted)}
.sum .kv b{text-align:right}
.sum .kv b.no{color:var(--muted); font-weight:600}
.sum .hold{margin:8px 0 2px}
.sum .cta{width:100%; margin-top:12px; min-height:64px}
.sum .back{margin-top:4px; justify-self:center}
.trust{list-style:none; margin:16px 0 0; padding:0 8px; display:grid; gap:10px; font-size:15px; font-weight:600; color:var(--muted)}
.trust li{display:flex; gap:10px; align-items:center}

/* ---------- success / manage ---------- */
.rdone{padding-top:24px}
.dhero{display:grid; justify-items:center; text-align:center; gap:10px}
.okm{position:relative; width:96px; height:96px; margin-bottom:8px; border-radius:50%; display:grid; place-items:center; background:var(--ok); color:var(--surface); animation:rPop 560ms var(--ease) both}
.okm::before{content:""; position:absolute; inset:0; border-radius:50%; background:var(--ok); opacity:0; animation:rRing 1100ms 200ms var(--ease) both}
.okm.off{background:var(--surface-3); color:var(--ink)}
.okm.off::before{display:none}
@keyframes rPop{0%{transform:scale(.5); opacity:0}60%{transform:scale(1.06); opacity:1}100%{transform:none}}
@keyframes rRing{0%{transform:scale(1); opacity:.35}100%{transform:scale(1.7); opacity:0}}
.dhero .lead{max-width:30em; text-wrap:balance; color:var(--ink); font-size:18px; font-weight:600}
.dgrid{display:grid; gap:16px; margin-top:28px}
.dcard .core{padding:6px 18px}
.dcard .kv{padding:12px 0}
.dcard .kv span{color:var(--muted)}
.dcard .kv b{text-align:right}
.dside{display:grid; gap:10px; align-content:start; order:-1}
.sms{display:flex; gap:12px; align-items:flex-start; padding:16px; border-radius:var(--r-core); background:var(--surface-2); font-weight:600}
.sms .ic{flex:none; color:var(--ok); margin-top:1px}
.dside .two{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.dside .two .pill{padding:0 12px}
.gcal{justify-self:center}
.nexts{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:2px}
.nexts li{display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:start; padding:12px 0}
.nexts li + li{border-top:1px solid var(--line)}
.nexts .ni{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2)}
.nexts b{display:block}
.nexts p{margin:2px 0 0; color:var(--muted); font-size:15px}
.mng .core{padding:18px; display:grid; gap:14px}
.mng .acts{display:grid; gap:8px}
.confirm{padding:18px; border-radius:var(--r-core); background:var(--surface); box-shadow:inset 0 0 0 2px var(--danger)}
.confirm b{display:block; font-size:18px}
.confirm p{margin:6px 0 14px; color:var(--muted)}
.confirm .acts{display:grid; gap:8px}

/* ---------- info + prototype ---------- */
.infog{display:grid; gap:12px; margin-top:16px}
.ic-card{display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:start; padding:18px}
.ic-card .ni{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2)}
.ic-card b{display:block; font-size:17px; line-height:1.3}
.ic-card p{margin:4px 0 0; color:var(--muted); font-size:15px}
.ic-card .link{min-height:44px}
.proto{border-radius:var(--r-core); border:1.5px dashed var(--line-strong); padding:0 16px}
.proto summary{min-height:56px; display:flex; align-items:center; gap:10px; font-weight:800; cursor:pointer; list-style:none}
.proto summary::-webkit-details-marker{display:none}
.proto summary .ic:last-child{margin-left:auto; transition:transform var(--t-base) var(--ease)}
.proto[open] summary .ic:last-child{transform:rotate(180deg)}
.proto .pg{display:flex; flex-wrap:wrap; gap:8px; padding:0 0 16px}
.proto .pg .pill{min-height:48px; font-size:15px; white-space:normal; text-align:left; line-height:1.25; padding:6px 16px}
.proto .pg .pill[aria-pressed="true"]{background:var(--ink); color:var(--bg); box-shadow:none}
.proto p{margin:0 0 12px; font-size:14px; color:var(--muted)}

/* ---------- sheets ---------- */
.ts{display:grid; gap:14px; padding:4px 2px 2px}
.ts-top{display:grid; grid-template-columns:72px 1fr; gap:14px; align-items:center}
.ts-top .tno{width:72px; height:72px; border-radius:22px; font-size:28px}
.ts-top b{display:block; font-size:20px; letter-spacing:-.02em}
.ts-top p{margin:2px 0 0; color:var(--muted)}
.feats{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.feats li{display:flex; align-items:center; gap:12px; min-height:44px; font-weight:700}
.feats .ic{color:var(--ok)}
.phs{display:flex; align-items:center; gap:12px; padding:16px; border-radius:var(--r-img); background:var(--surface-2)}
.phs .ic{color:var(--muted)}
.center{text-align:center}
.wl{display:grid; gap:16px; padding:4px 2px 2px}
.wl p{margin:0}
.wl .chips{flex-wrap:wrap; overflow:visible; margin:0; padding:0}
.wl .okm{width:72px; height:72px; margin:4px auto 0}

/* ---------- small phones ---------- */
@container app (max-width:370px){
  .cta .ct b{font-size:16px}
  .rabar .back{padding:0 12px 0 10px}
  .slot{font-size:16px}
  .recap span{font-size:14px}
}

/* ---------- tablet / desktop ---------- */
@container app (min-width:700px){
  .infog{grid-template-columns:1fr 1fr}
  .form .two{grid-template-columns:1fr 1fr}
  .dgrid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); align-items:start}
  .dside{order:0}
}
@container app (min-width:900px){
  .rhero{padding-top:44px}
  .facts{display:flex}
  .flowsec{padding-top:36px}
  .fgrid{grid-template-columns:minmax(0,1fr) 360px; gap:40px; align-items:start}
  .aside{display:block; position:sticky; top:164px}
  .rabar{display:none}
  .recap, .rc{display:none}
  .mapbox{max-width:500px}
  .rdone{padding-top:56px}

  .infog{grid-template-columns:repeat(4,1fr)}

}
@container app (min-width:1100px){
  .s1{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:32px; align-items:start}
  .s1 .q + .q{margin-top:0}
  .s1 .qcol{margin-top:0; align-content:start}
  .s2{display:grid; grid-template-columns:minmax(0,1fr) 210px; gap:28px; align-items:start}
  .s2 .side .needs{margin-top:0}
  .s2 .side .lgd{flex-direction:column; margin:0 0 22px}
  .s2 .side .chips{flex-direction:column; align-items:stretch}
}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script>
(function(){
"use strict";
var main = SC.mount({page:"reservation", nav:"reserve", title:"Резервирай маса", ai:false, actionBar:true});
var ic = SC.ic, esc = SC.esc, R = SC.RESTAURANT;

/* ---------- dates & slots ---------- */
var DS = ["нд","пн","вт","ср","чт","пт","сб"], WD = ["пн","вт","ср","чт","пт","сб","нд"];
var TODAY = new Date(); TODAY.setHours(0,0,0,0);
var MIN_M = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1), MAX_M = new Date(TODAY.getFullYear(), TODAY.getMonth()+2, 1);
var LAST_DAY = new Date(TODAY.getFullYear(), TODAY.getMonth()+3, 0);
/* reservation hours: prototype assumption 11:00 - 21:30 every 30 min (kitchen takes orders until 22:30). Real hours: [ЛИПСВА] */
var PERIODS = [{id:"lunch", n:"Обед", from:660, to:870}, {id:"aft", n:"Следобед", from:900, to:1050}, {id:"eve", n:"Вечер", from:1080, to:1290}];
var SLOTS = []; for (var m0=660; m0<=1290; m0+=30) SLOTS.push(m0);
var EVENING = 1020; /* after 17:00: change or cancel up to 2 h before, during the day up to 1 h */
var EV = SC.events()[0];

function pad(n){ return (n<10?"0":"")+n; }
function hm(m){ return Math.floor(m/60)+":"+pad(m%60); }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYmd(s){ var x = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); if (!x) return null; var d = new Date(+x[1], +x[2]-1, +x[3]); return d.getMonth()===+x[2]-1 ? d : null; }
function same(a,b){ return a && b && a.getTime()===b.getTime(); }
function addDays(d,n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fLong(d){ return SC.DAYS[d.getDay()]+", "+d.getDate()+" "+SC.MONTHS[d.getMonth()]; }
function fShort(d){ return DS[d.getDay()]+" "+d.getDate()+" "+SC.MONTHS[d.getMonth()]; }
function fWhen(d){ var w = SC.DAYS[d.getDay()]; return (/^[вф]/.test(w)?"във ":"в ")+w+", "+d.getDate()+" "+SC.MONTHS[d.getMonth()]; }
function ppl(n){ return n===1 ? "1 човек" : n+" души"; }
function lastSat(y,mo){ var d = new Date(y,mo+1,0); while (d.getDay()!==6) d.setDate(d.getDate()-1); return d; }
function isEvent(d){ return !!d && same(d, lastSat(d.getFullYear(), d.getMonth())); }
function slotOpen(d,m){ return !same(d,TODAY) || m >= SC.minutes()+30; }
function openSlots(d){ return SLOTS.filter(function(m){ return slotOpen(d,m); }); }
function bookable(d){ return d >= TODAY && d <= LAST_DAY && openSlots(d).length > 0; }
function periodOf(m){ return PERIODS.filter(function(p){ return m>=p.from && m<=p.to; })[0]; }

/* ---------- simulated occupancy (deterministic per day + hour, so the plan and the time buttons agree) ---------- */
function rnd(s){ var h = 2166136261; for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } h ^= h>>>13; h = Math.imul(h,0x5bd1e995); h ^= h>>>15; return (h>>>0)/4294967296; }
function busy(d,m){ var w = d.getDay(); if (m>=1080) return (w===5||w===6) ? .6 : .42; if (m>=900) return .22; return (w===0||w===6) ? .4 : .3; }
function isTaken(t,d,m){ if (isEvent(d) && m>=1140 && m<=1230) return true; /* demo: the Greek night is fully booked 19:00 - 20:30 */
  return rnd(ymd(d)+"|"+Math.floor((m-600)/60)+"|"+t.id) < busy(d,m); }
function suits(t,n){ return n<=6 && t.seats>=n && t.seats<=n+2; }
function zoneTables(z){ return SC.TABLES.filter(function(t){ return t.zone===z; }); }
function freeSeats(z,d,m){ return zoneTables(z).filter(function(t){ return !isTaken(t,d,m); }).reduce(function(a,t){ return a+t.seats; },0); }
function freeTables(z,d,m,n){ return zoneTables(z).filter(function(t){ return !isTaken(t,d,m) && suits(t,n); }); }
function slotFull(d,m,n){ if (n>6) return freeSeats("salon",d,m) < n+2 && freeSeats("garden",d,m) < n+2;
  return !freeTables("salon",d,m,n).length && !freeTables("garden",d,m,n).length; }
function sizesFor(n){ return [2,4,6].filter(function(s){ return s>=n && s<=n+2; }); }

/* ---------- state ---------- */
var st = {view:"flow", step:1, date:null, month:null, slot:null, period:null, n:2, zone:"salon", sel:null, hold:0, expired:false,
  list:false, need:{}, f:{name:"", phone:"", email:"", occ:"", note:"", consent:false}, err:{}, busy:false, fail:null, blocked:false,
  loading:false, msg:null, released:null, anim:true, changing:false, booking:null, manage:null, confirmCancel:false,
  proto:{offline:false, fail:false}};

function pickDefaultPeriod(){ if (!st.date) return;
  if (st.slot){ st.period = periodOf(st.slot).id; return; }
  var open = openSlots(st.date);
  var eve = PERIODS[2]; if (open.some(function(m){ return m>=eve.from; })) { st.period = "eve"; return; }
  st.period = open.length ? periodOf(open[0]).id : "eve"; }
function setDate(d, quiet){ if (st.date && same(d, st.date)) return; releaseIfNeeded(); st.date = d; st.month = new Date(d.getFullYear(), d.getMonth(), 1);
  if (st.slot && (!slotOpen(d, st.slot))) st.slot = null; pickDefaultPeriod();
  if (!quiet){ try{ history.replaceState(null, "", "#"+ymd(d)); }catch(e){} } }
function fromHash(){ var h = decodeURIComponent((location.hash||"").slice(1));
  if (h==="manage" || h==="manage-late"){ openManage(h==="manage-late"); return true; }
  var d = parseYmd(h); if (!h) return false;
  if (!d){ st.msg = "Не разпознахме датата в адреса. Изберете ден от календара."; return false; }
  if (d < TODAY){ st.msg = "Датата "+d.getDate()+" "+SC.MONTHS[d.getMonth()]+" вече мина. Изберете друг ден."; return false; }
  if (d > LAST_DAY){ st.msg = "Онлайн приемаме резервации до "+LAST_DAY.getDate()+" "+SC.MONTHS[LAST_DAY.getMonth()]+". За по-късна дата се обадете на "+R.phone+"."; return false; }
  if (!bookable(d)){ st.msg = "За днес часовете за резервация свършиха. Изберете друг ден."; return false; }
  st.view = "flow"; st.step = 1; setDate(d, true); return true; }

/* ---------- selection & hold (10 min) ---------- */
function tById(id){ return SC.TABLES.filter(function(t){ return t.id===id; })[0]; }
function selInfo(){ if (!st.sel) return null;
  if (st.sel.indexOf("J-")===0){ var z = st.sel.slice(2); return {joined:true, zone:z, label:"Съединени маси", short:"Съединени маси", seats:st.n, feats:[]}; }
  var t = tById(st.sel); return {t:t, zone:t.zone, label:"Маса "+t.n, short:"Маса "+t.n, seats:t.seats, feats:feats(t)}; }
function zoneName(z, form){ return z==="salon" ? (form==="in" ? "в салона" : "Салон") : (form==="in" ? "в градината" : "Градина"); }
function feats(t){ var f = [];
  f.push(t.zone==="garden" ? {i:"tree", n:"В отоплявана градина"} : {i:"chair", n:"В салона"});
  if (t.window) f.push({i:"sun", n:"До прозореца"});
  if (t.stroller) f.push({i:"baby", n:"Място за детска количка"});
  if (t.access) f.push({i:"wheelchair", n:"Достъпна с инвалидна количка"});
  return f; }
function featShort(t){ var f = []; if (t.window) f.push("до прозореца"); if (t.stroller) f.push("детска количка"); if (t.access) f.push("достъпна"); return f; }
function pick(id){ st.sel = id; st.hold = Date.now()+600000; st.expired = false; st.released = null;
  var s = selInfo(); SC.haptic(); SC.toast(s.label+" е задържана за вас за 10 минути"); render(); }
function releaseIfNeeded(){ if (st.sel){ var s = selInfo(); st.released = s.label+" е освободена, защото сменихте "+(st.step===1?"деня, часа или броя хора":"избора")+"."; st.sel = null; st.hold = 0; st.expired = false; } }
function holdLeft(){ return Math.max(0, Math.ceil((st.hold - Date.now())/1000)); }
function holdTxt(){ var s = holdLeft(); return Math.floor(s/60)+":"+pad(s%60); }
function holdChip(){ if (!st.sel) return "";
  if (st.expired) return "";
  return '<p class="hold'+(holdLeft()<60?" urgent":"")+'" data-holdchip>'+ic("timer",20)+'<span>Масата е задържана за <b data-hold>'+holdTxt()+'</b> мин</span></p>'; }
setInterval(function(){ if (!st.sel || st.expired || st.view!=="flow") return;
  if (holdLeft()<=0){ st.expired = true; render(); return; }
  var t = holdTxt(); document.querySelectorAll("[data-hold]").forEach(function(el){ el.textContent = t; });
  document.querySelectorAll("[data-holdchip]").forEach(function(el){ el.classList.toggle("urgent", holdLeft()<60); }); }, 1000);

/* ---------- validation ---------- */
function normPhone(p){ var d = (p||"").replace(/[\s\-().\/]/g,""); if (/^00359/.test(d)) d = "+"+d.slice(2); if (/^\+359\d{8,9}$/.test(d)) return "0"+d.slice(4); if (/^0\d{8,9}$/.test(d)) return d; return null; }
function validate(){ var f = st.f, e = {};
  if (!f.name.trim()) e.name = "Напишете името си, за да знаем на кого е масата.";
  if (!f.phone.trim()) e.phone = "Напишете телефон. На него идва потвърждението.";
  else if (!normPhone(f.phone)) e.phone = "Проверете номера. Например: 0888 123 456";
  if (f.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) e.email = "Проверете имейла. Например: ime@primer.bg";
  return e; }
function isBlocked(p){ return normPhone(p)==="0888000000"; }

/* ---------- pieces ---------- */
var STEP_N = ["Кога и колко","Маса","Данни"];
function stepper(){ return '<nav class="steps'+(st.anim?" anim":"")+'" aria-label="Стъпки на резервацията"><p class="steps-t"><b>Стъпка '+st.step+' от 3</b> · '+STEP_N[st.step-1]+'</p><ol>'+
  STEP_N.map(function(n,i){ var k = i+1;
    if (k<st.step) return '<li class="done"><span class="bar"></span><button class="sl" type="button" data-go="'+k+'" data-fk="st'+k+'" aria-label="Назад към стъпка '+k+': '+n+'">'+n+'</button></li>';
    return '<li class="'+(k===st.step?"on":"")+'"'+(k===st.step?' aria-current="step"':'')+'><span class="bar"></span><span class="sl">'+n+'</span></li>'; }).join("")+'</ol></nav>'; }

function hero(){ return '<section class="sec rhero"><h1 class="h1">Резервирай маса</h1><p class="lead">Изберете ден, час и маса в салона или в отопляваната градина. Без депозит, потвърждение по SMS или Viber.</p>'+
  '<ul class="facts"><li>'+ic("wallet",20)+'Без депозит</li><li>'+ic("chat-circle-dots",20)+'Потвърждение по SMS или Viber</li><li>'+ic("bell",20)+'Напомняне ден преди и 3 часа преди</li><li>'+ic("clock",20)+'Промяна до 2 ч преди</li></ul></section>'; }

/* step 1: calendar */
function cal(){ var y = st.month.getFullYear(), mo = st.month.getMonth(), first = new Date(y,mo,1), off = (first.getDay()+6)%7, dim = new Date(y,mo+1,0).getDate();
  var pm = new Date(y,mo-1,1), nm = new Date(y,mo+1,1), canP = st.month > MIN_M, canN = st.month < MAX_M, h = "";
  h += '<div class="card cal"><div class="cal-h"><h3 class="cal-m" id="calm" aria-live="polite">'+cap(SC.MONTHS[mo])+' '+y+'</h3><div class="cal-nav">'+
    '<button class="pill pill-soft mbtn" type="button" data-mon="-1" data-fk="mp"'+(canP?'':' disabled')+' aria-label="Предишен месец, '+SC.MONTHS[pm.getMonth()]+'">'+ic("caret-left",18)+SC.MON[pm.getMonth()]+'</button>'+
    '<button class="pill pill-soft mbtn nx" type="button" data-mon="1" data-fk="mn"'+(canN?'':' disabled')+' aria-label="Следващ месец, '+SC.MONTHS[nm.getMonth()]+'">'+SC.MON[nm.getMonth()]+ic("caret-right",18)+'</button></div></div>';
  h += '<div class="cal-g" role="group" aria-labelledby="calm">'+WD.map(function(w){ return '<span class="wd" aria-hidden="true">'+w+'</span>'; }).join("");
  for (var i=0;i<off;i++) h += '<span></span>';
  for (var dd=1; dd<=dim; dd++){ var d = new Date(y,mo,dd), ok = bookable(d), ev = isEvent(d), td = same(d,TODAY), on = same(d,st.date);
    var lab = fLong(d)+(td?", днес":"")+(ev?", "+EV.n:"")+(!ok && d>=TODAY && d<=LAST_DAY?", няма свободни часове":"");
    h += '<button type="button" class="day'+(td?" today":"")+'" data-day="'+ymd(d)+'" data-fk="d'+ymd(d)+'" aria-pressed="'+on+'" aria-label="'+lab+'"'+(ok?"":" disabled")+'><span>'+dd+'</span>'+(ev?'<i class="ev" aria-hidden="true"></i>':'')+'</button>'; }
  h += '</div><div class="cal-lg" aria-hidden="true">'+(same(st.month,MIN_M)?'<span><i class="o"></i>днес</span>':'')+'<span><i class="e"></i>'+EV.n+' (събитие)</span></div></div>';
  if (same(st.month,MIN_M) && !bookable(TODAY)) h += '<p class="note">'+ic("info",20)+'<span>За днес часовете за резервация свършиха. Изберете друг ден.</span></p>';
  if (isEvent(st.date)) h += '<div class="evnote" role="note"><span class="evic">'+ic("mask-happy",22)+'</span><div><b>'+EV.n+' · от '+EV.time+'</b><p>'+esc(EV.text)+'</p><p class="missing small">[ЛИПСВА: програма, меню и цена]</p><a class="link" href="event.html#'+EV.id+'">За събитието'+ic("caret-right",18)+'</a></div></div>';
  return h; }

/* step 1: time */
function times(){ if (!st.date) return '<p class="muted">Първо изберете ден.</p>';
  var per = PERIODS.filter(function(p){ return p.id===st.period; })[0] || PERIODS[2];
  var h = '<div class="seg" role="group" aria-label="Част от деня">'+PERIODS.map(function(p){ var any = SLOTS.some(function(m){ return m>=p.from && m<=p.to && slotOpen(st.date,m); });
      return '<button type="button" data-period="'+p.id+'" data-fk="p'+p.id+'" aria-pressed="'+(p.id===per.id)+'"'+(any?'':' disabled')+'>'+p.n+'</button>'; }).join("")+'</div>';
  var list = SLOTS.filter(function(m){ return m>=per.from && m<=per.to && slotOpen(st.date,m); });
  if (!list.length) return h+'<p class="note">'+ic("clock",20)+'<span>За днес часовете за '+per.n.toLowerCase()+' минаха. Изберете по-късна част от деня или друг ден.</span></p>';
  var anyFull = false;
  h += '<div class="slots" role="group" aria-label="Часове, '+per.n.toLowerCase()+'">'+list.map(function(m){ var full = slotFull(st.date,m,st.n); if (full) anyFull = true;
    if (full) return '<button type="button" class="slot full" data-full="'+m+'" data-fk="s'+m+'" aria-label="'+hm(m)+', няма свободни маси. Запиши ме в списъка на чакащите"><span>'+hm(m)+'</span><small>пълно</small></button>';
    return '<button type="button" class="slot" data-slot="'+m+'" data-fk="s'+m+'" aria-pressed="'+(st.slot===m)+'">'+hm(m)+'</button>'; }).join("")+'</div>';
  if (anyFull) h += '<p class="hint">Пълно? Докоснете часа и ще ви запишем в списъка на чакащите.</p>';
  return h; }

/* step 1: people */
function people(){ return '<div class="card ppl"><div><h3 class="qh" id="pplh">Колко души?</h3><p>Масите са за 2, 4 и 6. За повече съединяваме маси.</p></div>'+
  '<div class="counter" role="group" aria-labelledby="pplh"><button type="button" data-ppl="-1" data-fk="pm" aria-label="Един човек по-малко"'+(st.n<=1?" disabled":"")+'>'+ic("minus",20)+'</button><output aria-live="polite" aria-label="'+ppl(st.n)+'">'+st.n+'</output><button type="button" data-ppl="1" data-fk="pp" aria-label="Още един човек"'+(st.n>=12?" disabled":"")+'>'+ic("plus",20)+'</button></div></div>'+
  (st.n>=12 ? '<p class="ppl-more">Повече от 12 души? Направете <a class="link" href="celebration.html" style="min-height:0;display:inline">празник при нас</a>.</p>' : ''); }

function step1(){ return '<div class="s1"><div class="q" id="q-day"><h2 class="qh" tabindex="-1" data-h>Кой ден?</h2>'+(st.msg?'<p class="note" role="alert" style="margin:0 0 12px">'+ic("info",20)+'<span>'+esc(st.msg)+'</span></p>':'')+cal()+'</div>'+
  '<div class="qcol"><div class="q" id="q-time"><h2 class="qh">В колко часа?</h2>'+times()+(st.err.slot?'<p class="err" role="alert" style="color:var(--danger);font-weight:700;margin:10px 2px 0">'+st.err.slot+'</p>':'')+'</div><div class="q">'+people()+'</div></div></div>'; }

/* step 2: floor plan (SVG). Mock layout from SC.TABLES, 4 columns. */
function tState(t){ if (st.sel===t.id) return "sel"; if (isTaken(t,st.date,st.slot)) return "taken"; if (!suits(t,st.n) || !needOk(t)) return "unfit"; return "free"; }
function needOk(t){ var n = st.need; return (!n.access||t.access) && (!n.stroller||t.stroller) && (!n.window||t.window); }
function tLabel(t,s){ return s==="taken" ? "заета" : s==="sel" ? "избрана" : t.seats+" места"; }
function tAria(t,s){ return "Маса "+t.n+", "+t.seats+" места, "+(s==="free"?"свободна":s==="sel"?"избрана":s==="taken"?"заета":"не е подходяща за "+ppl(st.n))+(featShort(t).length?", "+featShort(t).join(", "):""); }
function shape(t,cx,cy){ var s = "", i;
  if (t.shape==="round"){ s += '<rect class="ch" x="'+(cx-40)+'" y="'+(cy-11)+'" width="10" height="22" rx="4"/><rect class="ch" x="'+(cx+30)+'" y="'+(cy-11)+'" width="10" height="22" rx="4"/><circle class="top" cx="'+cx+'" cy="'+cy+'" r="25"/>'; }
  else if (t.shape==="square"){ s += '<rect class="ch" x="'+(cx-12)+'" y="'+(cy-38)+'" width="24" height="9" rx="4"/><rect class="ch" x="'+(cx-12)+'" y="'+(cy+29)+'" width="24" height="9" rx="4"/><rect class="ch" x="'+(cx-38)+'" y="'+(cy-12)+'" width="9" height="24" rx="4"/><rect class="ch" x="'+(cx+29)+'" y="'+(cy-12)+'" width="9" height="24" rx="4"/><rect class="top" x="'+(cx-25)+'" y="'+(cy-25)+'" width="50" height="50" rx="11"/>'; }
  else { for (i=0;i<3;i++){ var x = cx-28+i*20; s += '<rect class="ch" x="'+x+'" y="'+(cy-35)+'" width="16" height="9" rx="4"/><rect class="ch" x="'+x+'" y="'+(cy+26)+'" width="16" height="9" rx="4"/>'; } s += '<rect class="top" x="'+(cx-35)+'" y="'+(cy-22)+'" width="70" height="44" rx="11"/>'; }
  return s; }
function hatch(t,cx,cy){ var f = 'fill="url(#hatch-'+t.zone+')"';
  if (t.shape==="round") return '<circle cx="'+cx+'" cy="'+cy+'" r="25" '+f+'/>';
  if (t.shape==="square") return '<rect x="'+(cx-25)+'" y="'+(cy-25)+'" width="50" height="50" rx="11" '+f+'/>';
  return '<rect x="'+(cx-35)+'" y="'+(cy-22)+'" width="70" height="44" rx="11" '+f+'/>'; }
function plan(z){ var T = zoneTables(z), rows = z==="salon" ? 3 : 2, RH = 104, top = 34, W = 360;
  var wallB = top + (rows-1)*RH + 38 + 72, H = wallB + 32, h = "";

  h += '<defs><pattern id="hatch-'+z+'" class="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7"/></pattern></defs>';
  h += '<rect class="floor" x="6" y="6" width="'+(W-12)+'" height="'+(wallB-6)+'" rx="20"/>';
  if (z==="garden"){ h += '<rect class="lawn" x="6" y="6" width="'+(W-12)+'" height="'+(wallB-6)+'" rx="20"/>'; for (var b=0;b<14;b++) h += '<circle class="bush" cx="'+(24+b*24)+'" cy="17" r="'+(b%2?5:6.5)+'"/>'; }
  h += '<rect class="wall" x="6" y="6" width="'+(W-12)+'" height="'+(wallB-6)+'" rx="20"/>';
  if (z==="salon"){ for (var c=0;c<4;c++){ var wx = 60+c*80; h += '<rect class="win" x="'+(wx-26)+'" y="2" width="52" height="8" rx="2"/>'; }
    h += '<line class="gap" x1="34" y1="'+wallB+'" x2="96" y2="'+wallB+'"/><line class="gap" x1="266" y1="'+wallB+'" x2="326" y2="'+wallB+'"/>'+
      '<path class="door" d="M34 '+wallB+' A 30 30 0 0 0 64 '+(wallB-30)+'"/>'+
      '<text class="lbl" x="65" y="'+(wallB+24)+'" text-anchor="middle">Вход</text><text class="lbl" x="296" y="'+(wallB+24)+'" text-anchor="middle">Градина</text>'; }
  else { h += '<line class="gap" x1="34" y1="'+wallB+'" x2="96" y2="'+wallB+'"/><text class="lbl" x="65" y="'+(wallB+24)+'" text-anchor="middle">Салон</text>'; }
  T.forEach(function(t){ var cx = 60+t.x*80, cy = top+38+t.y*RH, s = tState(t);
    h += '<g class="tbl '+s+'" data-t="'+t.id+'" data-fk="t'+t.id+'" role="button" tabindex="0" aria-pressed="'+(s==="sel")+'" aria-label="'+tAria(t,s)+'">'+
      '<rect class="hit" x="'+(cx-40)+'" y="'+(cy-46)+'" width="80" height="104" rx="16"/><rect class="ring" x="'+(cx-38)+'" y="'+(cy-44)+'" width="76" height="100" rx="16"/>'+
      '<g class="shp">'+shape(t,cx,cy)+(s==="taken"?hatch(t,cx,cy):'')+'<text class="no" x="'+cx+'" y="'+(cy+7)+'">'+t.n+'</text></g>'+
      '<text class="lb" x="'+cx+'" y="'+(cy+59)+'">'+tLabel(t,s)+'</text></g>'; });
  return h+'</svg>'; }
function tList(z){ var T = zoneTables(z).map(function(t){ return {t:t, s:tState(t)}; });
  var free = T.filter(function(x){ return x.s==="free"||x.s==="sel"; }), rest = T.filter(function(x){ return x.s==="taken"||x.s==="unfit"; });
  function row(x){ var t = x.t, s = x.s, fs = featShort(t);
    var right = s==="free" ? '<button class="pill pill-line" type="button" data-pick="'+t.id+'" data-fk="l'+t.id+'" aria-label="Избери маса '+t.n+'">Избери</button>'
      : s==="sel" ? '<span class="st sel">'+ic("check",18)+'Избрана</span>'
      : '<span class="st">'+(s==="taken"?"Заета в "+hm(st.slot):"Не е за "+ppl(st.n))+'</span>';
    return '<li class="trow '+s+'"><span class="tno'+(s==="sel"?" on":"")+'" aria-hidden="true">'+t.n+'</span><span><b>Маса '+t.n+' · '+t.seats+' места</b><span class="ft">'+(fs.length?cap(fs.join(" · ")):"Без особености")+'</span></span>'+right+'</li>'; }

    (cnt[other]?'<button class="pill pill-red" type="button" data-zone="'+other+'" data-fk="zo">Виж '+(other==="garden"?"градината":"салона")+' · '+cnt[other]+' '+(cnt[other]===1?"свободна":"свободни")+'</button>':'')+

  var legend = '<ul class="lgd" aria-label="Легенда"><li><i class="sw free"></i>Свободна</li><li><i class="sw sel"></i>Избрана</li><li><i class="sw taken"></i>Заета</li><li><i class="sw unfit"></i>Не е за '+ppl(n)+'</li>'+(st.zone==="salon"?'<li><i class="sw win"></i>Прозорец</li>':'')+'</ul>';
  var needs = '<div class="needs"><span class="label">Нужно ви е:</span><div class="chips">'+

      return '<button class="chip" type="button" data-need="'+x[0]+'" data-fk="n'+x[0]+'" aria-pressed="'+!!st.need[x[0]]+'">'+ic(x[1],20)+x[2]+'</button>'; }).join("")+'</div></div>';
  var view = st.list ? tList(st.zone) : '<div class="shell mapbox"><div class="core">'+plan(st.zone)+'</div></div>';

  h += '<div class="s2" style="margin-top:4px"><div>'+(st.list?'':legend)+view+toggle+'</div><div class="side">'+(st.list?'':'')+needs+'</div></div>';

    if (!st.slot) return {t:"Изберете час", s:fShort(st.date)+" · "+ppl(st.n)};
    return {t:"Избери маса", s:fShort(st.date)+" · "+hm(st.slot)+" · "+ppl(st.n)}; }
  if (st.step===2){ if (!s) return {t:st.n>6?"Изберете зона":"Изберете маса", s:st.n>6?"Салон или градина":"Докоснете свободна маса"};
    if (st.expired) return {t:"Задръж "+s.label.toLowerCase()+" пак", s:"Задържането изтече", rehold:true};
    return {t:"Попълни данните", s:s.short+' · задържана <span data-hold>'+holdTxt()+'</span> мин'}; }
  if (st.expired) return {t:"Задръж "+s.label.toLowerCase()+" пак", s:"Задържането изтече", rehold:true};
  return {t:"Резервирай маса за "+(st.n===1?"един":st.n), s:fShort(st.date)+" · "+hm(st.slot)}; }

    if (nm) st.f.name = nm; st.f.phone = ph;
    if (isBlocked(ph)){ box.innerHTML = '<div class="alert" role="alert">'+ic("phone",22)+'<div><b>Ще ви помогнем по телефона</b><p>За този номер не можем да запишем онлайн. Обадете ни се и ще намерим решение.</p><div class="acts"><a class="pill pill-red" href="tel:+359894365577">'+ic("phone",20)+'Обади се · '+R.phone+'</a></div></div></div>'; return; }
    box.innerHTML = '<div class="okm" aria-hidden="true">'+ic("check",36)+'</div><p class="center" style="font-size:20px;font-weight:800;letter-spacing:-.02em" tabindex="-1" data-wlok>Записахме ви в списъка на чакащите</p><p class="center muted">Ако се освободи маса за '+ppl(st.n)+' в '+hm(+ds.wlgo)+' на '+fShort(st.date)+', ще ви пишем на '+esc(ph)+'. Без да е нужно да правите нищо друго.</p>';
    var ok = box.querySelector("[data-wlok]"); ok && ok.focus({preventScroll:true}); return; }
  if (ds.proto){ var k = ds.proto; st.protoOpen = true;
    if (k==="offline"){ st.proto.offline = !st.proto.offline; render(); SC.toast(st.proto.offline?"Симулация: няма интернет":"Връзката е възстановена"); return; }
    if (k==="fail"){ st.proto.fail = !st.proto.fail; render(); SC.toast(st.proto.fail?"Следващото запазване ще даде грешка":"Запазването работи нормално"); return; }
    if (k==="event"){ st.view = "flow"; st.step = 1; releaseIfNeeded(); var ls = lastSat(TODAY.getFullYear(), TODAY.getMonth()); if (ls < TODAY || !bookable(ls)) ls = lastSat(TODAY.getFullYear(), TODAY.getMonth()+1); setDate(ls); st.slot = null; st.period = "eve"; st.n = 4; st.released = null; st.anim = true; render(); toTop(); return; }
    if (k==="group"){ st.view = "flow"; releaseIfNeeded(); st.released = null; st.n = 8; st.step = 1; ready(false); st.sel = null; st.hold = 0; st.loading = false; go(2); return; }
    if (k==="expire"){ st.view = "flow"; ready(false); if (st.step<2) st.step = 2; st.hold = Date.now()+5000; st.expired = false; st.anim = true; render(); toTop(); SC.toast("Задържането ще изтече след 5 секунди"); return; }
    if (k==="blocked"){ st.view = "flow"; ready(true); st.f.phone = "0888 000 000"; st.blocked = false; st.err = {}; st.step = 3; st.anim = true; render(); toTop(); SC.toast("Натиснете „Резервирай“, за да видите съобщението"); return; }
    if (k==="done"){ st.view = "flow"; ready(true); st.step = 3; st.proto.fail = false; st.proto.offline = false; var s2 = selInfo(); st.booking = {date:st.date, slot:st.slot, n:st.n, selLabel:s2.label+" · "+zoneName(s2.zone), name:st.f.name, phone:st.f.phone, occ:st.f.occ, note:st.f.note}; st.view = "done"; st.sel = null; st.anim = true; render(); toTop(); return; }
    if (k==="manage" || k==="late"){ openManage(k==="late"); render(); toTop(); return; }
  }
});
document.addEventListener("keydown", function(e){ var t = e.target.closest && e.target.closest("[data-t]"); if (t && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); t.dispatchEvent(new MouseEvent("click", {bubbles:true})); } });
document.addEventListener("input", function(e){ var k = e.target.dataset && e.target.dataset.f; if (!k) return; st.f[k] = e.target.value;
  if (st.err[k]){ var test = validate(); if (!test[k]){ delete st.err[k]; var fe = e.target.parentNode.querySelector(".err"); if (fe) fe.remove(); e.target.removeAttribute("aria-invalid"); } } });
document.addEventListener("change", function(e){ if (e.target.hasAttribute && e.target.hasAttribute("data-consent")) st.f.consent = e.target.checked; });
document.addEventListener("submit", function(e){ if (e.target.closest("[data-form]")){ e.preventDefault(); next(); } });
document.addEventListener("toggle", function(e){ if (e.target.matches && e.target.matches("[data-protod]")) st.protoOpen = e.target.open; }, true);
window.addEventListener("offline", function(){ SC.toast("Няма връзка. Данните ви са запазени тук."); });
window.addEventListener("hashchange", function(){ if (fromHash()){ st.anim = true; render(); toTop(); } });

/* ---------- start ---------- */
if (!fromHash() && st.view==="flow"){ setDate(bookable(TODAY) ? TODAY : addDays(TODAY,1), true); }
render();
})();
</script>
</body>
