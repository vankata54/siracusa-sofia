<head>

<style>
/* about.html: page-only styles, tokens from ds/sc.css only */
.ab-eyebrow{display:inline-flex; align-items:center; gap:8px; margin:0 0 14px; font-size:14px; font-weight:800; letter-spacing:.02em; color:var(--muted)}
.ab-eyebrow .ic{color:var(--muted)}

/* hero */
.ab-hero{padding-top:28px}
.ab-hero .lead{margin-top:14px; max-width:34em}
.ab-cta{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px}
.ab-cta .pill{flex:1 1 auto}
.ab-facts{display:flex; flex-wrap:wrap; gap:6px 16px; margin:20px 0 0; padding:0; list-style:none}
.ab-facts li{display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:700}
.ab-facts .ic{color:var(--muted)}
.ab-vis{position:relative; margin:32px 0 0}
.ab-plate{position:absolute; right:4%; bottom:5%; width:42%; aspect-ratio:1; z-index:2; pointer-events:none;
  animation:abRoll 1100ms var(--ease) 180ms both}
.ab-plate svg{width:100%; height:100%; display:block; filter:drop-shadow(0 22px 26px rgba(0,0,0,.30))}
@keyframes abRoll{from{transform:translate(38%,6%) rotate(-150deg) scale(.86); opacity:0} to{transform:none; opacity:1}}

/* photo slot: designed placeholder until the new photo shoot */
.slot{position:relative; overflow:hidden; border-radius:var(--r-img); aspect-ratio:4/3; background:radial-gradient(120% 95% at 28% 18%, var(--plate-1), var(--plate-2)); color:var(--muted)}
.slot::before{content:""; position:absolute; inset:14px; border:2px solid var(--line-strong); border-radius:12px;
  -webkit-mask:linear-gradient(#000 0 0) top left/26px 26px no-repeat, linear-gradient(#000 0 0) top right/26px 26px no-repeat, linear-gradient(#000 0 0) bottom left/26px 26px no-repeat, linear-gradient(#000 0 0) bottom right/26px 26px no-repeat;
          mask:linear-gradient(#000 0 0) top left/26px 26px no-repeat, linear-gradient(#000 0 0) top right/26px 26px no-repeat, linear-gradient(#000 0 0) bottom left/26px 26px no-repeat, linear-gradient(#000 0 0) bottom right/26px 26px no-repeat}
.slot .big{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); opacity:.38}
.slot .tag{position:absolute; left:22px; top:22px; right:22px; display:flex; align-items:flex-start; gap:8px; font-size:14px; line-height:1.35}
.slot .tag span{padding:7px 12px; border-radius:16px; background:var(--glass); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:inset 0 0 0 1px var(--glass-line)}
.slot.ab-hero-slot{aspect-ratio:5/4}
.slot.ab-hero-slot .big{left:42%}
.slot.tall{aspect-ratio:3/4}

/* values */
.ab-vals{display:grid; gap:14px}
.ab-val{display:grid}
.ab-val > .core{display:grid; grid-template-rows:auto 1fr}
.ab-val .art{position:relative; height:172px; border-radius:var(--r-core) var(--r-core) 0 0; overflow:hidden; background:radial-gradient(120% 100% at 50% 0%, var(--plate-1), var(--plate-2))}
.ab-val .art svg{position:absolute; width:150px; height:150px; left:50%; top:50%; margin:-75px 0 0 -75px; filter:drop-shadow(0 14px 18px rgba(0,0,0,.24))}
.ab-val .num{position:absolute; left:16px; top:14px; z-index:1; font-size:14px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums}
.ab-val .txt{padding:18px 18px 6px; display:grid; gap:8px; align-content:start}
.ab-val .txt p{margin:0; color:var(--muted)}
.ab-val .link{margin-top:2px}

/* story + numbers */
.ab-story{display:grid; gap:18px}
.ab-year{display:flex; align-items:flex-end; gap:14px}
.ab-year b{font-size:104px; line-height:.82; font-weight:800; letter-spacing:-.07em; font-variant-numeric:tabular-nums}
.ab-year > span{padding-bottom:4px; font-size:15px; font-weight:600; color:var(--muted); line-height:1.35}
.ab-year .missing{display:block; margin-top:4px}
.ab-year > span em{display:block; font-style:normal; font-weight:800; color:var(--ink)}
.ab-note{display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:start; padding:18px}
.ab-note .ico{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--ink)}
.ab-note p{margin:0}
.ab-nums{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:28px}
.ab-n{position:relative; display:grid; align-content:space-between; gap:18px; min-height:150px; padding:18px 16px 16px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); text-decoration:none; color:var(--ink); transition:transform var(--t-fast) var(--ease)}
.ab-n:active{transform:scale(.98)}
.ab-n b{display:block; font-size:52px; line-height:.9; font-weight:800; letter-spacing:-.06em; font-variant-numeric:tabular-nums}
.ab-n .l{font-size:16px; font-weight:700; line-height:1.3}
.ab-n .go-ic{position:absolute; right:12px; top:12px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--ink)}
.ab-n.ink{background:var(--ink); color:var(--bg); box-shadow:var(--shadow)}
.ab-n.ink .go-ic{background:var(--red); color:var(--on-red)}
.ab-src{margin:14px 0 0; font-size:14px; color:var(--muted)}

/* spaces */
.ab-spaces{display:grid; gap:14px}
.ab-space{display:grid}
.ab-space .core{display:grid; grid-template-rows:auto 1fr}
.ab-space .txt{align-content:start}
.ab-space .slot{border-radius:var(--r-core) var(--r-core) 0 0}
.ab-space .txt{padding:18px; display:grid; gap:8px}
.ab-space .txt p{margin:0; color:var(--muted)}
.ab-space .feat{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
.ab-space .feat .badge{font-size:14px}
.ab-space .feat .badge .ic{color:var(--ok)}
.ab-go{margin-top:18px}
.ab-go span:first-child{white-space:normal; text-align:left}
.ab-go .knob{background:var(--red); color:var(--on-red)}

/* team */
.ab-teamw{display:grid}
.ab-team{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.ab-team figure{margin:0; display:grid; gap:10px}
.ab-team-miss{margin:0 0 18px}
.ab-team .slot{aspect-ratio:3/4}
.ab-team .slot .big{opacity:.32}
.ab-team figcaption{font-weight:800; font-size:16px; letter-spacing:-.01em}
.ab-team figcaption span{display:block; font-weight:600; font-size:14px; color:var(--muted)}

/* visit + faq */
.ab-visit{display:grid; gap:56px}
.ab-live{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); font-size:15px; color:var(--muted); font-weight:600}
.ab-live b{color:var(--ink)}
.ab-live .dot{width:10px; height:10px; border-radius:50%; flex:none; background:var(--off)}
.ab-live .dot.ok{background:var(--ok)} .ab-live .dot.warn{background:var(--warn)}
.ab-info{list-style:none; margin:0; padding:6px 18px}
.ab-info li{display:grid; grid-template-columns:40px 1fr; gap:12px; align-items:start; padding:12px 0}
.ab-info li + li{border-top:1px solid var(--line)}
.ab-info .ico{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2)}
.ab-info small{display:block; font-size:14px; color:var(--muted); font-weight:600}
.ab-info b{display:block; font-size:17px; line-height:1.35; letter-spacing:-.01em}
.ab-info a{text-decoration:none}
.ab-info .sub{display:block; font-size:15px; color:var(--muted); margin-top:2px}
.ab-acts{display:grid; gap:8px; padding:6px 18px 18px}

.faq{display:grid; gap:8px}
.faq details{border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow)}
.faq summary{list-style:none; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:60px; padding:12px 14px 12px 18px; font-weight:800; font-size:17px; line-height:1.3; letter-spacing:-.01em; cursor:pointer; border-radius:var(--r-core)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .tw{width:36px; height:36px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); transition:transform var(--t-base) var(--ease)}
.faq details[open] summary .tw{transform:rotate(180deg)}
.faq .a{padding:0 18px 18px; color:var(--muted)}
.faq .a p{margin:0}
.faq .a .link{margin-top:4px}

/* closing call to action */
.ab-end{position:relative; overflow:hidden; padding:32px 22px 22px; border-radius:var(--r-core); background:var(--ink); color:var(--bg); display:grid; gap:12px}
.ab-end p{margin:0; opacity:.78; font-size:17px}
.ab-end .btns{display:grid; gap:8px; margin-top:10px}
.ab-end .pill-ghost{background:transparent; color:var(--bg); box-shadow:inset 0 0 0 1.5px currentColor}
.ab-end .ab-end-art{position:absolute; right:-50px; top:-68px; width:164px; height:164px; opacity:.95; pointer-events:none}
.ab-end .ab-end-art svg{width:100%; height:100%; display:block}
.ab-end h2{position:relative; max-width:9.5em}
.ab-end p{position:relative}

@container app (max-width:380px){
  .ab-year b{font-size:88px}
  .ab-n b{font-size:46px}
}
@container app (min-width:700px){
  .ab-nums{grid-template-columns:repeat(3,1fr)}
  .ab-vals{grid-template-columns:1fr 1fr}
  .ab-spaces{grid-template-columns:1fr 1fr}
  .ab-end .btns{grid-template-columns:auto auto; justify-content:start}
}
@container app (min-width:900px){
  .ab-hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:64px; align-items:center; padding-top:56px}
  .ab-hero .lead{font-size:19px}
  .ab-cta{margin-top:30px} .ab-cta .pill{flex:0 0 auto}
  .ab-vis{margin:0}
  .ab-plate{right:5%; bottom:6%; width:40%}
  .ab-vals{grid-template-columns:repeat(4,1fr); gap:16px}
  .ab-val .art{height:180px}
  .ab-story{grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:56px; align-items:end}
  .ab-year b{font-size:168px}
  .ab-nums{gap:16px; margin-top:44px}
  .ab-n{min-height:190px; padding:24px 22px 22px}
  .ab-n b{font-size:72px}
  .ab-n .l{font-size:17px}
  .ab-spaces{gap:20px}
  .ab-space .slot{aspect-ratio:16/10}
  .ab-go{width:auto; min-width:380px; margin-top:24px; gap:28px}
  .ab-teamw{grid-template-columns:minmax(0,4fr) minmax(0,8fr); gap:56px; align-items:center}
  .ab-teamw .lead{margin:0 0 18px!important}
  .ab-team{gap:20px}
  .ab-visit{grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:40px; align-items:start}
  .ab-end{padding:64px 420px 60px 64px; gap:14px}
  .ab-end .btns{margin-top:16px}
  .ab-end .ab-end-art{right:-30px; top:50%; width:380px; height:380px; transform:translateY(-50%)}
  .ab-end h2{max-width:none}
}
@container app (min-width:1100px){
  .ab-nums{grid-template-columns:repeat(6,1fr)}
  .ab-n b{font-size:64px}
}
</style>
</head>

<script src="../ds/icons.js"></script>

<script>
(function(){
var main = SC.mount({page:"about", nav:"about", title:"За нас", docTitle:"За нас: ресторант с градина в Дружба 2"});
var R = SC.RESTAURANT, st = SC.state(), status = SC.status(), ic = SC.ic, esc = SC.esc;

/* numbers come only from the data: the main menu is the 14 categories (breakfast is a separate menu) */
var mainCats = SC.cats.filter(function(c){ return c.id !== "zakuski"; });
var mainItems = SC.items.filter(function(x){ return x.cat !== "zakuski"; });
var freeZones = SC.ZONES.filter(function(z){ return z.free; });

function slot(icon, label, cls){
  return '<div class="slot '+(cls||"")+'" role="img" aria-label="Място за снимка: '+esc(label)+'">'+
    '<span class="big">'+ic(icon,72)+'</span><span class="tag"><span class="missing">[ЛИПСВА: '+esc(label)+']</span></span></div>'; }
function art(id){ return SC.art(id); }

/* 1. hero */
var hero =
  '<section class="sec ab-hero">'+
    '<div>'+
      '<p class="ab-eyebrow">'+ic("map-pin",18)+'За нас · ж.к. Дружба 2</p>'+
      '<h1 class="h1">Вашият ресторант в Дружба 2</h1>'+
      '<p class="lead">Пица на пещ, меса и риба на дървени въглища във фурна Bertha и обедно меню с доставка. Салон и отоплявана градина, за всеки ден и за семейните празници.</p>'+
      '<div class="ab-cta"><a class="pill pill-red pill-lg" href="reservation.html">'+ic("calendar-blank",20)+'Резервирай маса</a><a class="pill pill-line pill-lg" href="menu.html">'+ic("fork-knife",20)+'Виж менюто</a></div>'+
      '<ul class="ab-facts"><li>'+ic("clock",20)+'Всеки ден 10:00 - 23:00</li><li>'+ic("tree",20)+'Салон и градина</li><li>'+ic("truck",20)+'Доставка до 21:00</li></ul>'+
    '</div>'+
    '<div class="ab-vis">'+slot("storefront","снимка на ресторанта","ab-hero-slot")+
      '<div class="ab-plate" aria-hidden="true">'+art("svinski-rebra")+'</div></div>'+
  '</section>';

/* 2. what matters to us (four real pillars from the pack) */
var vals = [
  {art:"pitsa-margarita", h:"Пещта", p:"Пиците се пекат на пещ. В менюто има "+SC.inCat("pitsi").length+" вида, от Маргарита до сладката Нутела.", a:"Пиците на пещ", href:"category.html#pitsi"},
  {art:"t-bon-stek-ot-blek-angas", h:"Дървените въглища", p:"Месата и рибата се пекат във Bertha, затворена фурна на дървени въглища. Огънят нагрява стените и тавана, затова топлината е равномерна, а вкусът е опушен.", a:"Как работи фурната", href:"bertha.html"},
  {art:SC.lunch[0] ? SC.lunch[0].id : "kebapcheta", h:"Кварталът", p:"Готвим за съседите от Дружба 1 и 2 и за офисите наоколо: обедно меню всеки ден и безплатна доставка до "+freeZones.map(function(z){ return z.n; }).join(", ").replace(/, ([^,]*)$/," и $1")+".", a:(SC.lunchIsToday()?"Обедното меню днес":"Обедното меню"), href:"lunch.html"},
  {art:"tiramisu", h:"Семейните празници", p:"Рожден ден, кръщене, юбилей или фирмено парти, в салона или в градината. При ранна резервация -5%.", a:"Празник при нас", href:"celebration.html"}
];
var valsHTML =
  '<section class="sec" aria-labelledby="ab-vals-h"><div class="sec-h"><h2 class="h2" id="ab-vals-h">Какво ни е важно</h2></div>'+
  '<div class="ab-vals">'+vals.map(function(v,i){

      '<div class="art" aria-hidden="true"><span class="num">0'+(i+1)+'</span>'+art(v.art)+'</div>'+
      '<div class="txt"><h3 class="h3">'+v.h+'</h3><p>'+v.p+'</p><a class="link" href="'+v.href+'">'+v.a+ic("caret-right",18)+'</a></div></div></article>'; }).join("")+
  '</div></section>';

/* 3. story (owner text missing) + numbers from the data */
var nums = [
  {n:mainItems.length, l:"ястия в основното меню", href:"menu.html", ink:true},
  {n:mainCats.length, l:"категории, от супите до десертите", href:"menu.html"},
  {n:SC.inCat("pitsi").length, l:"пици на пещ", href:"category.html#pitsi"},
  {n:SC.inCat("skara-bertha").length, l:"ястия от фурната Bertha", href:"category.html#skara-bertha"},
  {n:7, l:"дни в седмицата, 10:00 - 23:00", href:"contacts.html"},
  {n:freeZones.length, l:"квартала с безплатна доставка", href:"delivery.html"}
];
var storyHTML =
  '<section class="sec" aria-labelledby="ab-story-h"><div class="sec-h"><h2 class="h2" id="ab-story-h">Нашата история</h2></div>'+
  '<div class="ab-story">'+
    '<div class="ab-year rv"><b>'+(R.est||2013)+'</b><span><em>Siracusa est. '+(R.est||2013)+'</em>както пише на логото на менюто <span class="missing">[ЛИПСВА: потвърждение от собственика]</span></span></div>'+
    '<div class="card ab-note rv"><span class="ico">'+ic("pencil-simple",22)+'</span><div><p class="missing">[ЛИПСВА: историята от собственика. Как започна Siracusa, кой стои зад ресторанта и защо в Дружба 2.]</p></div></div>'+

  '<h3 class="h3" style="margin-top:44px">Siracusa в числа</h3>'+

  '</div><p class="ab-src">Числата са от менюто ни.</p></section>';

/* 4. hall + heated garden */
var spacesHTML =
  '<section class="sec" aria-labelledby="ab-sp-h"><div class="sec-h"><h2 class="h2" id="ab-sp-h">Салон и градина</h2><a class="link" href="gallery.html">Галерия'+ic("caret-right",18)+'</a></div>'+

  '<div class="ab-spaces">'+
    '<article class="shell ab-space rv"><div class="core">'+slot("chair","снимка на салона")+

    '<article class="shell ab-space rv"><div class="core">'+slot("tree","снимка на градината")+
      '<div class="txt"><h3 class="h3">Градината</h3><p>Затворена и отоплявана, работи целогодишно.</p><div class="feat"><span class="badge">'+ic("thermometer",16)+'Отоплява се</span><span class="badge">'+ic("calendar-check",16)+'Цяла година</span></div><p class="missing">[ЛИПСВА: брой места]</p></div></div></article>'+
  '</div>'+
  '<a class="pill pill-ink go ab-go" href="reservation.html"><span>Избери маса по карта</span><span class="knob">'+ic("arrow-right",22)+'</span></a>'+
  '</section>';

/* 5. team (only with consent) */
var teamHTML =
  '<section class="sec" aria-labelledby="ab-team-h"><div class="ab-teamw"><div><div class="sec-h"><h2 class="h2" id="ab-team-h">Екипът</h2></div>'+
  '<p class="lead" style="margin:-4px 0 18px">Хората в кухнята, в салона и по пътя до вас. Показваме ги само със съгласието им.</p>'+
  '<p class="missing ab-team-miss">[ЛИПСВА: снимки и имена на екипа, ако се съгласят]</p></div>'+
  '<div class="ab-team">'+[["chef-hat","Кухнята","готвачите"],["users","Салонът","сервитьорите"],["truck","Доставките","шофьорите"]].map(function(t){
    return '<figure class="rv"><div class="slot tall" role="img" aria-label="Място за снимка: '+t[1]+'"><span class="big">'+ic(t[0],56)+'</span></div><figcaption>'+t[1]+'<span>'+t[2]+'</span></figcaption></figure>'; }).join("")+
  '</div></div></section>';

/* 6. visit + FAQ */
