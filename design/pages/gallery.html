<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Галерия | Siracusa Bar & Grill</title>
<meta name="description" content="Галерия на Siracusa Bar & Grill в Дружба 2: ястия от пещта и скарата Bertha, салонът, отоплената градина и празниците при нас.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<style>
/* ---------- hero ---------- */
.g-hero{padding-top:28px}
.g-hero .lead{margin-top:10px; max-width:36ch}
.g-tools{margin-top:22px; display:grid; gap:12px}
.g-chips .chip{min-height:48px}
.g-chips .chip .ic{opacity:.85}
.g-meta{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:14px; color:var(--muted); font-weight:600}
.g-meta b{color:var(--ink); font-variant-numeric:tabular-nums}
.g-note{margin:28px 0 0; display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:20px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); font-size:14px; color:var(--muted); line-height:1.45}
.g-note .ic{color:var(--ink); margin-top:1px}

/* ---------- masonry (explicit placement keeps DOM order = reading order) ---------- */
.mason{position:relative; display:grid; grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); grid-auto-rows:2px; column-gap:12px; margin-top:18px}
.mason.pending .gi{visibility:hidden}
.gi{align-self:start; display:grid; gap:10px; width:100%; padding:0; border:0; background:transparent; color:inherit; text-align:left; cursor:zoom-in; border-radius:var(--r-img); font:inherit}
.gi:focus-visible{outline-offset:4px}
.tile{position:relative; display:block; aspect-ratio:var(--ar); border-radius:var(--r-img); overflow:hidden; isolation:isolate; transition:transform var(--t-fast) var(--ease)}
.gi:active .tile{transform:scale(.98)}
.gi.feat .tile{aspect-ratio:1.6}
.gi.feat .gcap b{font-size:20px; letter-spacing:-.02em}
.gi.feat .slot .ring{width:88px; height:88px}
.tile .pic{position:absolute; inset:0}
.tile .pic > svg{transition:transform 600ms var(--ease)}
.gcap{display:grid; gap:2px; padding:0 4px; min-width:0}
.gcap b{font-size:16px; line-height:1.25; letter-spacing:-.01em; font-weight:700}
.gcap small{font-size:14px; color:var(--muted); font-weight:600; line-height:1.3}
.gcap .price{color:var(--ink)}

/* empty photo slot: same plate light as the dish illustrations, a dashed "mat" and a subject icon */
.slot{position:absolute; inset:0; display:grid; place-items:center; background:radial-gradient(120% 90% at 50% 25%, var(--plate-1), var(--plate-2))}
.slot::before{content:""; position:absolute; inset:10px; border-radius:15px; border:1.5px dashed var(--line-strong); opacity:.75}
.slot .ring{position:relative; width:58px; height:58px; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--ink); box-shadow:var(--hi), var(--shadow); transition:transform 600ms var(--ease)}
.slot .tag{position:absolute; top:18px; left:18px; display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:700; color:var(--muted); line-height:1}
.slot .tag .ic{opacity:.8}
@media (hover:hover){
  .gi:hover .tile .pic > svg{transform:scale(1.05) rotate(-4deg)}
  .gi:hover .slot .ring{transform:scale(1.08)}
}

/* skeleton + states */
.skel-it{display:grid; gap:10px; align-self:start}
.skel-it .skel{border-radius:var(--r-img)}
.skel-line{height:14px; border-radius:7px}
.g-state{margin-top:18px}
.g-state .ill{color:var(--ink)}
.g-state .lead{max-width:34ch}

/* ---------- visit CTA ---------- */
.visit{display:grid; gap:18px}
.visit .core{padding:22px 20px; display:grid; gap:14px}
.visit .acts{display:grid; gap:10px}
.visit .facts{display:flex; flex-wrap:wrap; gap:8px}
.fact{display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 12px; border-radius:999px; background:var(--surface-2); font-size:14px; font-weight:700}

/* prototype-only state switcher */
.proto{margin-top:40px}
.proto .core{padding:16px 18px; display:grid; gap:10px}
.proto .chips{margin:0; padding:2px 0; flex-wrap:wrap; overflow:visible}
.proto .k{font-size:14px; font-weight:800; color:var(--muted); display:flex; align-items:center; gap:6px}

/* ---------- lightbox ---------- */
.lb{position:absolute; inset:0; z-index:70; display:grid; grid-template-rows:auto minmax(0,1fr) auto; color:var(--on-chip-dark); pointer-events:auto; outline:none}
.lb-bg{position:absolute; inset:0; z-index:-1; background:var(--chip-dark)}
.lb-top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 12px 6px 20px}
.lb-where{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; min-width:0}
.lb-where .ic{color:var(--ember)}
.lb-btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 18px; border:0; border-radius:999px; font:inherit; font-weight:700; font-size:16px; color:var(--on-chip-dark); background:color-mix(in srgb, var(--on-chip-dark) 12%, transparent); cursor:pointer; text-decoration:none; white-space:nowrap; transition:transform var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease)}
.lb-btn:active{transform:scale(.96)}
.lb-btn[disabled]{opacity:.35; cursor:default; transform:none}
.lb-btn.red{background:var(--red); color:var(--on-red)}
.lb-btn.done{background:var(--ok); color:#fff}
.lb :focus-visible{outline-color:var(--ember)}
.lb-stage{position:relative; overflow:hidden; touch-action:pan-y; cursor:grab; user-select:none; -webkit-user-select:none}
.lb-stage.drag{cursor:grabbing}
.lb-track{display:flex; height:100%; will-change:transform}
.lb-slide{flex:0 0 100%; height:100%; padding:8px 16px; display:grid; place-items:center; container-type:size}
.lb-media{position:relative; width:min(100cqw, calc(100cqh * var(--ar))); aspect-ratio:var(--ar); border-radius:24px; overflow:hidden; box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.lb-media .pic, .lb-media .slot{position:absolute; inset:0}
.lb-media::after{content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--on-chip-dark) 10%, transparent); pointer-events:none}
.lb-media .slot::before{inset:14px; border-radius:18px}
.lb-media .slot .ring{width:96px; height:96px}
.lb-media .slot .tag{top:26px; left:26px; font-size:14px}
.lb-bot{display:grid; gap:14px; padding:10px 16px 18px}
.lb-info{display:grid; gap:14px}
.lb-cap{display:grid; gap:4px; min-height:56px}
.lb-cap h2{margin:0; font-size:22px; line-height:1.2; letter-spacing:-.025em; font-weight:800; text-wrap:balance}
.lb-cap p{margin:0; font-size:15px; color:color-mix(in srgb, var(--on-chip-dark) 70%, transparent); font-weight:600}
.lb-cap .missing{color:color-mix(in srgb, var(--on-chip-dark) 70%, transparent)}
.lb-acts{display:grid; grid-template-columns:1fr auto; gap:8px}
.lb-acts .lb-btn{min-height:56px; font-size:17px}
.lb-acts .solo{grid-column:1 / -1}
.lb-nav{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px}
.lb-nav .lb-btn{background:transparent; box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--on-chip-dark) 28%, transparent)}
.lb-nav [data-next]{justify-self:end}
.lb-nav [data-prev]{justify-self:start}
.lb-count{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; color:color-mix(in srgb, var(--on-chip-dark) 70%, transparent); white-space:nowrap}
.lb-hint{display:block; text-align:center; font-size:14px; color:color-mix(in srgb, var(--on-chip-dark) 60%, transparent); margin-top:-6px}

/* ---------- desktop ---------- */
@container app (min-width:700px){
  .mason{column-gap:16px}
}
@container app (min-width:900px){
  .g-hero{padding-top:56px; display:grid; grid-template-columns:1fr auto; align-items:end; column-gap:40px}
  .g-hero .g-tools{grid-column:1 / -1; margin-top:32px}
  .g-hero .lead{font-size:19px}
  .mason{column-gap:20px; margin-top:24px}
  .visit .core{grid-template-columns:1fr auto; align-items:center; padding:32px 36px}
  .visit .acts{grid-auto-flow:column}
  .lb-top{padding:20px 24px 8px 32px}
  .lb-slide{padding:12px 120px}
  .lb-bot{width:min(820px, 100%); margin:0 auto; padding:16px 24px 80px}
  .lb-info{grid-template-columns:minmax(0,1fr) auto; align-items:center; column-gap:28px}
  .lb-acts{grid-auto-flow:column; grid-template-columns:none}
  .lb-acts .solo{grid-column:auto}
  .lb-nav{position:absolute; inset:50% 24px auto 24px; transform:translateY(-50%); grid-template-columns:auto 1fr auto; pointer-events:none}
  .lb-nav .lb-btn{pointer-events:auto; background:color-mix(in srgb, var(--on-chip-dark) 10%, transparent); box-shadow:none}
  .lb-nav .lb-count{display:none}
  .lb-hint{display:none}
}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script>
(function(){
"use strict";
var main = SC.mount({page:"gallery", nav:null, title:"Галерия"});
var E = SC.esc, ic = SC.ic;

/* ---------- data ---------- */
var CATS = [
  {id:"all",     n:"Всички",  icon:"squares-four"},
  {id:"yastia",  n:"Ястия",   icon:"bowl-food"},
  {id:"salon",   n:"Салон",   icon:"chair"},
  {id:"gradina", n:"Градина", icon:"tree"},
  {id:"sabitia", n:"Събития", icon:"confetti"}];
var CAT = {}; CATS.forEach(function(c){ CAT[c.id] = c; });

/* real dishes (illustrations stand in for the new photo shoot); aspect ratios give the masonry its rhythm */
var DISHES = [
  ["pitsa-s-burata-i-proshuto-krudo",.8], ["svinski-rebra",1], ["kapreze-s-burata-i-avokado",1], ["pitsa-s-proshuto-koto-i-tryufel",1],
  ["ribay-stek-ot-blek-angas",.8], ["pitsa-dyavolo",1], ["kebapcheta",1.25], ["spageti-karbonara",1],
  ["plato-frenski-sirena",1.25], ["pitsa-margarita",.8], ["chiyzburger-s-teleshko-kyufte-blek-angas-s-parzh",1], ["tiramisu",1]
].filter(function(d){ return SC.byId[d[0]] && !SC.isOut(SC.byId[d[0]]); }).map(function(d){
  var x = SC.byId[d[0]]; return {k:"dish", cat:"yastia", id:x.id, x:x, ar:d[1], title:x.n, sub:(SC.catById[x.cat]||{}).n||""}; });

/* empty slots: the shot list for the new photo shoot. Subjects only, no invented facts. */
var RES = {href:"reservation.html", label:"Резервирай маса", icon:"calendar-blank"};
var SLOTS = [
  {cat:"salon",   title:"Салонът, общ план",           ic:"chair",       ar:1.25, go:RES},
  {cat:"gradina", title:"Градината през деня",          ic:"sun",         ar:.8,   go:RES},
  {cat:"sabitia", title:"Гръцка вечер",                ic:"calendar-dots", ar:1,  go:{href:"event.html#gratska-vecher", label:"Виж Гръцка вечер", icon:"arrow-right"}},
  {cat:"salon",   title:"Маса до прозореца",           ic:"fork-knife",  ar:.8,   go:RES},
  {cat:"gradina", title:"Градината вечер",             ic:"moon",        ar:1.25, go:RES},
  {cat:"sabitia", title:"Рожден ден при нас",          ic:"cake",        ar:.8,   go:{href:"celebration.html", label:"Планирай празник", icon:"arrow-right"}},
  {cat:"salon",   title:"Барът",                       ic:"wine",        ar:1,    go:RES},
  {cat:"gradina", title:"Отоплената градина зимата",   ic:"thermometer", ar:1,    go:RES},
  {cat:"sabitia", title:"Жива музика",                 ic:"music-notes", ar:1.25, go:{href:"events.html", label:"Виж събитията", icon:"arrow-right"}},
  {cat:"salon",   title:"Подредена маса за празник",   ic:"confetti",    ar:1,    go:{href:"celebration.html", label:"Планирай празник", icon:"arrow-right"}},
  {cat:"gradina", title:"Маса в градината",            ic:"tree",        ar:.8,   go:RES},
  {cat:"sabitia", title:"Фирмено парти",               ic:"briefcase",   ar:1,    go:{href:"celebration.html", label:"Планирай празник", icon:"arrow-right"}}
].map(function(s){ s.k = "slot"; return s; });

/* "Всички": dishes and places interleaved, so the page reads as a mix and not as a menu */
var ALL = (function(){ var d = DISHES.slice(), s = SLOTS.slice(), out = [], i = 0;
  while (d.length || s.length){ var takeDish = (i % 2) === 0; if (takeDish && d.length) out.push(d.shift()); else if (s.length) out.push(s.shift()); else out.push(d.shift()); i++; }
  return out; })();
ALL.forEach(function(it, i){ it.key = "g" + i; });
function listFor(cat){ return cat === "all" ? ALL : ALL.filter(function(it){ return it.cat === cat; }); }

/* ---------- render ---------- */
var cur = "all", items = [], state = "ok";
function hashCat(){ var h = (location.hash || "").replace("#", ""); return CAT[h] ? h : "all"; }

function slotHTML(it, big){
  return '<span class="slot">'+(big ? '' : '<span class="tag">'+ic(CAT[it.cat].icon,16)+CAT[it.cat].n+'</span>')+'<span class="ring">'+ic(it.ic, big?44:28)+'</span>'+'</span>'; }

function tileHTML(it, i){
  var media = it.k === "dish" ? SC.pic(it.x) : slotHTML(it, false);
  var cap = it.k === "dish"
    ? '<b>'+E(it.title)+'</b><small>'+E(it.sub)+' · <span class="price">'+SC.fmt(it.x.p)+'</span></small>'
    : '<b>'+E(it.title)+'</b><small class="missing">[ЛИПСВА: снимка]</small>';
  var label = (it.k === "dish" ? it.title : it.title + ", място за снимка") + ". Отвори на цял екран";
  return '<button class="gi" type="button" data-i="'+i+'" aria-label="'+E(label)+'"><span class="tile" style="--ar:'+it.ar+'">'+media+'</span><span class="gcap" aria-hidden="true">'+cap+'</span></button>'; }

main.innerHTML =
  '<section class="sec g-hero">'+
    '<div><h1 class="h1">Галерия</h1><p class="lead">Ястията от пещта и скарата Bertha, салонът, отоплената градина и празниците при нас.</p></div>'+
    '<div class="g-tools">'+
      '<div class="chips g-chips" role="group" aria-label="Покажи">'+CATS.map(function(c){ var n = listFor(c.id).length; if (!n) return "";
        return '<button class="chip" type="button" data-cat="'+c.id+'" aria-pressed="false">'+ic(c.icon,18)+c.n+' <span class="n">'+n+'</span></button>'; }).join("")+'</div>'+
    '</div>'+
  '</section>'+
  '<section class="wrap" aria-label="Снимки">'+
    '<p class="vh" data-count aria-live="polite"></p>'+
    '<div class="mason pending" data-mason></div>'+
    '<div data-state></div>'+
    '<p class="g-note">'+ic("images",18)+'<span>Новата фотосесия предстои. Дотогава ястията са показани с илюстрации, а за салона, градината и събитията сме запазили място. <span class="missing">[ЛИПСВА: снимки от новата фотосесия]</span></span></p>'+
  '</section>'+
  '<section class="sec visit">'+
    '<div class="shell"><div class="core">'+
      '<div style="display:grid;gap:10px"><h2 class="h2">Елате при нас</h2><p class="lead">Салон и отоплена градина в Дружба&nbsp;2. Всеки ден от 10:00 до&nbsp;23:00.</p></div>'+
      '<div class="acts"><a class="pill pill-red pill-lg" href="reservation.html">'+ic("calendar-blank",20)+'Резервирай маса</a><a class="pill pill-line pill-lg" href="menu.html">'+ic("fork-knife",20)+'Към менюто</a></div>'+
    '</div></div>'+
  '</section>'+
  '<section class="wrap proto" aria-label="Само в прототипа">'+
    '<div class="shell"><div class="core"><span class="k">'+ic("eye",16)+'Само в прототипа: други състояния</span>'+
      '<div class="chips" role="group" aria-label="Състояние"><button class="chip" type="button" data-sim="ok" aria-pressed="true">Галерията</button><button class="chip" type="button" data-sim="loading" aria-pressed="false">Зарежда се</button><button class="chip" type="button" data-sim="offline" aria-pressed="false">Няма връзка</button></div>'+
    '</div></div>'+
  '</section>';

var mason = main.querySelector("[data-mason]"), stateBox = main.querySelector("[data-state]"), countEl = main.querySelector("[data-count]");

function colsFor(w){ return w < 560 ? 2 : w < 860 ? 3 : 4; }
function layout(){ /* shortest-column placement; rows are 2px, so spans follow the real height */
  var w = mason.clientWidth; if (!w) return; var cols = colsFor(w); mason.style.setProperty("--cols", cols);
  var kids = [].slice.call(mason.children); kids.forEach(function(k){ k.style.gridColumn = ""; k.style.gridRow = ""; });
  var gap = cols > 2 ? (w > 900 ? 28 : 22) : 18, heights = []; for (var c = 0; c < cols; c++) heights.push(0);
  kids.forEach(function(k, i){ var f = i === 0 && cols >= 3; k.classList.toggle("feat", f); if (f) k.style.gridColumn = "1 / span 2"; });
  kids.forEach(function(k, i){ var h = k.getBoundingClientRect().height;
    if (i === 0 && cols >= 3){ var sp = Math.ceil((h + gap) / 2); k.style.gridColumn = "1 / span 2"; k.style.gridRow = "1 / span " + sp; heights[0] = heights[1] = sp * 2; return; }
    var span = Math.ceil((h + gap) / 2), col = heights.indexOf(Math.min.apply(null, heights));
    k.style.gridColumn = (col + 1); k.style.gridRow = (heights[col] / 2 + 1) + " / span " + span; heights[col] += span * 2; });
  mason.classList.remove("pending"); }

function render(animate){
  items = listFor(cur);
  main.querySelectorAll("[data-cat]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.cat === cur)); });
  stateBox.innerHTML = "";
  if (state === "loading"){ countEl.textContent = "Снимките се зареждат…"; mason.classList.remove("pending"); mason.style.setProperty("--cols", colsFor(mason.clientWidth||360));
    var ars = [.8,1,1.25,1,1,.8,1.25,1]; mason.innerHTML = ars.map(function(a){ return '<div class="skel-it" aria-hidden="true"><span class="skel" style="aspect-ratio:'+a+'"></span><span class="skel skel-line" style="width:70%"></span><span class="skel skel-line" style="width:45%"></span></div>'; }).join("");
    [].forEach.call(mason.children, function(k){ k.style.gridRow = "auto / span 1"; }); mason.style.gridAutoRows = "auto"; mason.style.rowGap = "18px"; return; }
  mason.style.gridAutoRows = ""; mason.style.rowGap = "";
  if (state === "offline"){ mason.innerHTML = ""; countEl.textContent = "";
    stateBox.innerHTML = '<div class="empty g-state" role="alert"><span class="ill">'+ic("warning-circle",44)+'</span><h2 class="h3">Снимките не се заредиха</h2><p class="lead">Изглежда няма връзка с интернет. Проверете я и опитайте пак.</p><button class="pill pill-red pill-lg" type="button" data-sim="ok">Опитай пак</button></div>'; return; }
  if (!items.length){ mason.innerHTML = ""; countEl.textContent = "";
    stateBox.innerHTML = '<div class="empty g-state"><span class="ill">'+ic("images",44)+'</span><h2 class="h3">Тук още няма снимки</h2><p class="lead">Скоро ще добавим. Междувременно разгледайте останалите.</p><button class="pill pill-red pill-lg" type="button" data-cat="all">Виж всички</button></div>'; return; }
  var nd = items.filter(function(it){ return it.k === "dish"; }).length, ns = items.length - nd;
  countEl.textContent = (CAT[cur].n)+": "+items.length+" "+(items.length === 1 ? "кадър" : "кадъра")+(cur === "all" ? ", "+nd+" ястия и "+ns+" места за снимки" : "");
  mason.classList.add("pending"); mason.innerHTML = items.map(tileHTML).join("");
  layout();
  if (animate && !SC.reduce){ [].forEach.call(mason.children, function(k, i){
    k.animate([{opacity:0, transform:"translateY(14px) scale(.98)"},{opacity:1, transform:"none"}], {duration:420, delay:Math.min(i, 10)*28, easing:"cubic-bezier(.32,.72,0,1)", fill:"backwards"}); }); }
}

function setCat(c, push){ if (!CAT[c]) c = "all"; cur = c; state = "ok";
  main.querySelectorAll("[data-sim]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.sim === "ok")); });
  if (push){ try{ history.replaceState(history.state, "", c === "all" ? location.pathname : "#" + c); }catch(e){ location.hash = c === "all" ? "" : c; } }
  render(true); }

cur = hashCat(); render(false);
if ("ResizeObserver" in window){ var lastW = 0; new ResizeObserver(function(){ var w = mason.clientWidth; if (Math.abs(w - lastW) > 1){ lastW = w; if (state === "ok") layout(); } }).observe(mason); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (state === "ok") layout(); });
window.addEventListener("hashchange", function(){ var c = hashCat(); if (c !== cur) setCat(c, false); });

main.addEventListener("click", function(e){
  var b = e.target.closest("[data-cat]"); if (b){ setCat(b.dataset.cat, true); return; }
  var s = e.target.closest("[data-sim]"); if (s){ state = s.dataset.sim; main.querySelectorAll(".proto [data-sim]").forEach(function(x){ x.setAttribute("aria-pressed", String(x.dataset.sim === state)); }); render(state === "ok");
    if (s.closest(".proto")){ var sc = SC.scroller, y = mason.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 150; sc.scrollTo({top:Math.max(0, y), behavior:SC.reduce ? "auto" : "smooth"}); } return; }
  var g = e.target.closest(".gi"); if (g) openLB(+g.dataset.i, g);
});

/* ---------- lightbox: "Затвори", arrows, swipe left/right, swipe down to close, keyboard ---------- */
var lb = null, idx = 0, opener = null, track, stage;
function slideHTML(it){
  var media = it.k === "dish" ? SC.pic(it.x) : slotHTML(it, true);
  return '<div class="lb-slide" aria-hidden="true"><div class="lb-media" style="--ar:'+it.ar+'">'+media+'</div></div>'; }
function capHTML(it){
  if (it.k === "dish") return '<div class="lb-cap"><h2 id="lbt">'+E(it.title)+'</h2><p>'+E(it.sub)+' · '+E(it.x.g)+'</p></div>'+
    '<div class="lb-acts"><button class="lb-btn red" type="button" data-lbadd="'+it.id+'">'+ic("plus",20)+'<span>Добави · <span class="price">'+SC.fmt(it.x.p)+'</span></span></button><a class="lb-btn" href="dish.html#'+it.id+'">За ястието</a></div>';
  return '<div class="lb-cap"><h2 id="lbt">'+E(it.title)+'</h2><p>'+CAT[it.cat].n+' · <span class="missing">[ЛИПСВА: снимка от новата фотосесия]</span></p></div>'+
    '<div class="lb-acts"><a class="lb-btn red solo" href="'+it.go.href+'">'+ic(it.go.icon,20)+E(it.go.label)+'</a></div>'; }

function openLB(i, from){
  if (lb) return; idx = i; opener = from;
  lb = document.createElement("div"); lb.className = "lb"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true"); lb.setAttribute("aria-labelledby","lbt"); lb.tabIndex = -1;
  lb.innerHTML = '<div class="lb-bg"></div>'+
    '<div class="lb-top"><span class="lb-where" data-where></span><button class="lb-btn" type="button" data-lbclose>'+ic("x",20)+'Затвори</button></div>'+
    '<div class="lb-stage" data-stage><div class="lb-track" data-track>'+items.map(slideHTML).join("")+'</div></div>'+
    '<div class="lb-bot"><div class="lb-info" data-info></div>'+
      '<div class="lb-nav"><button class="lb-btn" type="button" data-prev>'+ic("arrow-left",20)+'Предишна</button><span class="lb-count" data-count2></span><button class="lb-btn" type="button" data-next>Следваща'+ic("arrow-right",20)+'</button></div>'+
      '<span class="lb-hint">Плъзнете наляво или надясно</span>'+
      '<p class="vh" aria-live="polite" data-live></p></div>';
  SC.ov.appendChild(lb); track = lb.querySelector("[data-track]"); stage = lb.querySelector("[data-stage]");
  SC.scroller.inert = true; [].forEach.call(SC.ov.children, function(c){ if (c !== lb) c.inert = true; });
  go(idx, false);
  try{ history.pushState({lb:1}, "", location.href); }catch(e){}
  lb.addEventListener("click", onLBClick); lb.addEventListener("keydown", onKey);
  stage.addEventListener("pointerdown", onDown);
  lb.querySelector("[data-lbclose]").focus({preventScroll:true});
  zoom(true);
}
function closeLB(fromPop){
  if (!lb) return; var el = lb, t = opener && mason.querySelector('.gi[data-i="'+idx+'"]');
  if (t){ var r = t.getBoundingClientRect(), sr = SC.scroller.getBoundingClientRect(); if (r.top < sr.top + 90 || r.bottom > sr.bottom - 90) t.scrollIntoView({block:"center"}); opener = t; }
  SC.scroller.inert = false; [].forEach.call(SC.ov.children, function(c){ c.inert = false; });
  zoom(false, function(){ el.remove(); });
  lb = null; opener && opener.focus({preventScroll:true});
  if (!fromPop){ try{ if (history.state && history.state.lb) history.back(); }catch(e){} }
}
window.addEventListener("popstate", function(){ if (lb) closeLB(true); });

/* the one strong movement on the page: the tile grows into the viewer, and shrinks back on close */
function zoom(opening, done){
  var el = lb || track.closest(".lb"), bg = el.querySelector(".lb-bg"), chrome = el.querySelectorAll(".lb-top,.lb-bot"), m = track.children[idx] && track.children[idx].querySelector(".lb-media");
  var t = mason.querySelector('.gi[data-i="'+idx+'"] .tile'); var D = 420, ease = "cubic-bezier(.32,.72,0,1)";
  if (SC.reduce || !m){ if (!opening){ el.style.opacity = 0; setTimeout(done, 10); } return; }
  var a = m.getBoundingClientRect(), b = t ? t.getBoundingClientRect() : null;
  var from = b && b.width ? "translate("+(b.left - a.left + (b.width - a.width)/2)+"px,"+(b.top - a.top + (b.height - a.height)/2)+"px) scale("+(b.width / a.width)+")" : "translateY(24px) scale(.94)";
  /* closing uses implicit start keyframes, so a half-done swipe-down continues smoothly from where the finger left it */
  var kf = opening ? [{transform:from, borderRadius:"22px"},{transform:"none", borderRadius:"24px"}] : [{transform:from, borderRadius:"22px"}];
  var o = opening ? [{opacity:0},{opacity:1}] : [{opacity:0}];
  var anims = [], anim = m.animate(kf, {duration:D, easing:ease, fill:"both"}); anims.push(anim);
  anims.push(bg.animate(o, {duration:opening ? 300 : 360, easing:"ease-out", fill:"both"}));
  chrome.forEach(function(c){ anims.push(c.animate(opening ? [{opacity:0, transform:"translateY(10px)"},{opacity:1, transform:"none"}] : [{opacity:0}], {duration:opening ? 360 : 200, delay:opening ? 120 : 0, easing:ease, fill:"both"})); });
  /* once open, drop the filled animations so the swipe-down gesture can move the photo with inline styles */
  if (opening) Promise.all(anims.map(function(a){ return a.finished; })).then(function(){ anims.forEach(function(a){ a.cancel(); }); }).catch(function(){});
  if (!opening){ var hide = t && t.closest(".gi"); if (hide) hide.style.opacity = 0; anim.onfinish = function(){ if (hide) hide.style.opacity = ""; done && done(); }; }
}

function go(i, animate){
  idx = Math.max(0, Math.min(items.length - 1, i)); var it = items[idx];
  track.style.transition = animate === false || SC.reduce ? "none" : "transform var(--t-slow) var(--ease)";
  track.style.transform = "translate3d(" + (-idx * 100) + "%,0,0)";
  [].forEach.call(track.children, function(s, k){ s.setAttribute("aria-hidden", String(k !== idx)); });
  lb.querySelector("[data-where]").innerHTML = ic(CAT[it.cat].icon, 18) + CAT[it.cat].n;
  lb.querySelector("[data-info]").innerHTML = capHTML(it);
  lb.querySelector("[data-count2]").textContent = (idx + 1) + " от " + items.length;
  lb.querySelector("[data-prev]").disabled = idx === 0; lb.querySelector("[data-next]").disabled = idx === items.length - 1;
  lb.querySelector("[data-live]").textContent = (idx + 1) + " от " + items.length + ": " + it.title;
}
function onLBClick(e){
  var b = e.target.closest("button, a"); if (!b) return;
  if (b.hasAttribute("data-lbclose")) return closeLB();
  if (b.hasAttribute("data-prev")) return go(idx - 1);
  if (b.hasAttribute("data-next")) return go(idx + 1);
  if (b.dataset.lbadd){ SC.cart.add(b.dataset.lbadd, 1); SC.haptic(); SC.flash(b, ic("check",20) + "Добавено", 1400); SC.toast("Добавено ✓"); }
}
function onKey(e){
  if (e.key === "Escape"){ e.preventDefault(); closeLB(); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); go(idx + 1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); go(idx - 1); }
  else if (e.key === "Tab"){ var f = [].filter.call(lb.querySelectorAll("button:not([disabled]), a[href]"), function(x){ return x.offsetParent !== null; }); if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); } }
}
/* swipe: horizontal changes the photo (rubber band at the ends), vertical down closes */
var sx, sy, st, dir, dx, dy;
function onDown(e){ if (e.button) return; sx = e.clientX; sy = e.clientY; st = performance.now(); dir = null; dx = dy = 0;
  stage.setPointerCapture(e.pointerId); stage.addEventListener("pointermove", onMove); stage.addEventListener("pointerup", onUp); stage.addEventListener("pointercancel", onUp); }
function onMove(e){ dx = e.clientX - sx; dy = e.clientY - sy;
  if (!dir){ if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) dir = "x"; else if (dy > 8 && dy > Math.abs(dx)) dir = "y"; else return; stage.classList.add("drag"); track.style.transition = "none"; }
  if (dir === "x"){ var edge = (idx === 0 && dx > 0) || (idx === items.length - 1 && dx < 0); var d = edge ? dx / 3 : dx;
    track.style.transform = "translate3d(calc(" + (-idx * 100) + "% + " + d + "px),0,0)"; }
  else { var m = track.children[idx].querySelector(".lb-media"), k = Math.max(0, dy); m.style.transform = "translateY(" + k + "px) scale(" + (1 - Math.min(k, 400) / 1600) + ")";
    lb.querySelector(".lb-bg").style.opacity = String(1 - Math.min(k, 300) / 450);
    lb.querySelectorAll(".lb-top,.lb-bot").forEach(function(c){ c.style.opacity = String(Math.max(0, 1 - k / 140)); }); }
}
function onUp(){ stage.removeEventListener("pointermove", onMove); stage.removeEventListener("pointerup", onUp); stage.removeEventListener("pointercancel", onUp); stage.classList.remove("drag");
  var v = Math.abs(dx) / Math.max(1, performance.now() - st);
  if (dir === "x"){ if ((dx < -60 || (dx < -20 && v > .5)) && idx < items.length - 1) go(idx + 1); else if ((dx > 60 || (dx > 20 && v > .5)) && idx > 0) go(idx - 1); else go(idx); }
  else if (dir === "y"){ var m = track.children[idx].querySelector(".lb-media"), bg = lb.querySelector(".lb-bg");
    if (dy > 110) closeLB();
    else { lb.querySelectorAll(".lb-top,.lb-bot").forEach(function(c){ c.style.opacity = ""; }); m.style.transition = "transform var(--t-slow) var(--ease)"; m.style.transform = ""; bg.style.opacity = ""; setTimeout(function(){ m.style.transition = ""; }, 340); } }
  dir = null; }
})();
</script>
</body>
