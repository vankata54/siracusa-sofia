<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Количка и поръчка | Siracusa Bar & Grill</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<style>
/* cart.html: page-only styles. Tokens from sc.css only. */

/* ---------- page frame ---------- */
.ck{padding:20px 16px 0}
.ck-grid{display:grid; gap:36px}
.ck-main{min-width:0}
.ck-side{min-width:0}
.blk + .blk{margin-top:36px}
.blk-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 12px}
.blk-h p{margin:0}
.ck-title{outline:none}
.ck-lead{margin-top:6px}
@container app (min-width:900px){
  .ck{padding:40px max(40px, calc((100% - 1200px)/2)) 0}
  .ck-grid{grid-template-columns:minmax(0,1fr) 384px; gap:56px; align-items:start}
  .ck-side{position:sticky; top:164px}
  .blk + .blk{margin-top:44px}
}

/* enter motion on step change (transform + opacity only) */
.enter{animation:ckIn var(--t-slow) var(--ease) both}
.enter.back{animation-name:ckBack}
@keyframes ckIn{from{transform:translateX(18px); opacity:0}to{transform:none; opacity:1}}
@keyframes ckBack{from{transform:translateX(-18px); opacity:0}to{transform:none; opacity:1}}

/* ---------- stepper (uses .stepper from the DS + labels) ---------- */
.steps{margin-bottom:22px}
.steps .bar span{transform-origin:left}
.steps .bar span.grow{animation:barGrow 520ms var(--ease) both}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:none}}
.steps ol{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.steps li{min-width:0}
.steps .sl{display:flex; align-items:center; gap:5px; min-height:40px; font-size:14px; font-weight:700; color:var(--muted); line-height:1.2; padding:0; border:0; background:transparent; text-align:left; width:100%}
.steps li.cur .sl{color:var(--ink); font-weight:800}
.steps button.sl{cursor:pointer; color:var(--ink); text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:4px; min-height:48px}
.steps button.sl .ic{color:var(--ok)}

/* ---------- notices ---------- */
.note{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 12px; padding:16px 18px; border-radius:var(--r-core); background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--line-strong); margin-bottom:16px}
.note > .ic{margin-top:1px}
.note.warn > .ic{color:var(--warn)}
.note.bad{box-shadow:inset 0 0 0 2px var(--danger)}
.note.bad > .ic{color:var(--danger)}
.note.ok > .ic{color:var(--ok)}
.note.promo{background:var(--ember-soft); box-shadow:inset 0 0 0 1.5px var(--ember)}
.note.promo > .ic{color:var(--ink)}
.note.info > .ic{color:var(--muted)}
.note b{display:block; font-size:17px; line-height:1.3; letter-spacing:-.01em; text-wrap:balance}
.note p{margin:2px 0 0; color:var(--muted)}
.note .acts{grid-column:2; display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.note .acts .pill{min-height:48px}

/* ---------- cart lines ---------- */
.lines{list-style:none; margin:0; padding:2px 18px}
.ln{display:grid; grid-template-columns:72px minmax(0,1fr); grid-template-areas:"pic info" "act act"; column-gap:14px; row-gap:12px; padding:16px 0}
.ln + .ln{border-top:1px solid var(--line)}
.ln-pic{grid-area:pic; display:block; text-decoration:none}
.ln-pic .pic{width:72px; height:72px; border-radius:18px}
.ln-info{grid-area:info; min-width:0; align-self:center}
.ln-name{display:block; font-weight:800; font-size:17px; line-height:1.25; letter-spacing:-.015em; text-decoration:none; color:inherit}
.ln-sub{display:block; font-size:15px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums}
.ln-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.tag{display:inline-flex; align-items:center; gap:4px; min-height:28px; padding:0 10px; border-radius:999px; background:var(--surface-2); font-size:14px; font-weight:700; line-height:1}
.tag.add{background:transparent; box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.tag.lunch .ic{color:var(--muted)}
.tag.promo{background:var(--ember); color:var(--on-ember)}
.ln-act{grid-area:act; display:flex; align-items:center; gap:6px; min-width:0}
.ln-rm{display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:0 12px; border:0; border-radius:999px; background:transparent; color:var(--ink); font-weight:700; font-size:15px; cursor:pointer}
.ln-rm .ic{color:var(--muted)}
.ln-rm:active{transform:scale(.96)}
.ln-tot{margin-left:auto; display:grid; justify-items:end; line-height:1.15}
.ln-tot .price{font-size:18px}
.ln-tot .old{font-size:14px}
.ln.out .ln-pic, .ln.out .ln-name{opacity:.55}
.ln-outmsg{grid-column:1 / -1; display:grid; grid-template-columns:auto minmax(0,1fr); align-items:start; gap:10px; padding:14px; border-radius:18px; background:var(--surface-2); font-size:15px}
.ln-outmsg > .ic{color:var(--warn); margin-top:2px}
.ln-outmsg b{color:var(--warn)}
.ln-outmsg .pill{grid-column:1 / -1; min-height:48px; white-space:normal; text-align:center; line-height:1.25; padding:8px 18px}
@container app (min-width:700px){ .ln-outmsg .pill{grid-column:2; justify-self:start} }
@container app (min-width:700px){
  .lines{padding:4px 24px}
  .ln{grid-template-columns:84px minmax(0,1fr) auto; grid-template-areas:"pic info act"; padding:18px 0}
  .ln-pic .pic{width:84px; height:84px; border-radius:20px}
  .ln-act{gap:10px}
  .ln-tot{min-width:96px}
}

details.allerg{margin-top:12px; border-radius:var(--r-core); background:transparent}
details.allerg summary{list-style:none; display:flex; align-items:center; gap:8px; min-height:48px; padding:0 4px; font-weight:700; cursor:pointer}
details.allerg summary::-webkit-details-marker{display:none}
details.allerg summary .ic:last-child{margin-left:auto; transition:transform var(--t-base) var(--ease)}
details.allerg[open] summary .ic:last-child{transform:rotate(180deg)}
.allerg ul{list-style:none; margin:0; padding:4px 4px 0; display:grid; gap:8px}
.allerg li{display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 12px; font-size:15px}
.allerg li span:last-child{color:var(--muted)}
.allerg .note-auto{margin:12px 4px 4px}

/* suggestions: reuses .drow */
.sugg .drow small{display:block; font-size:14px; font-weight:700; color:var(--muted); margin-bottom:2px}
.sugg .core{padding:4px 18px}
@container app (min-width:700px){ .sugg .core{padding:6px 24px} }

/* ---------- fulfillment toggle (extends .seg) ---------- */
.seg.ff button{min-height:84px; flex-direction:column; gap:2px; padding:10px 8px; line-height:1.2; color:var(--ink); transition:transform var(--t-fast) var(--ease)}
.seg.ff button:active{transform:scale(.98)}
.seg.ff button .ic{color:var(--muted); margin-bottom:2px}
.seg.ff button[aria-pressed="true"] .ic{color:var(--red)}
.seg.ff b{font-size:17px; font-weight:800}
.seg.ff small{font-size:14px; font-weight:600; color:var(--muted)}
.seg.ff button[aria-pressed="true"] b::after{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--red); margin-left:7px; vertical-align:middle; transform:translateY(-1px)}
.seg.ff button[disabled]{opacity:1}
.seg.ff button[disabled] b, .seg.ff button[disabled] .ic{opacity:.5}
.ff-note{margin-top:12px}

/* ---------- summary ---------- */
.sum .core{padding:20px 20px 18px}
.sum h2{margin:0 0 6px}
.sum .kv{align-items:flex-start; padding:11px 0}
.sum .kv > span:first-child{min-width:0}
.sum .kv small{display:block; font-size:14px; color:var(--muted); font-weight:500; line-height:1.35; margin-top:2px}
.sum .kv > :last-child{text-align:right; font-weight:700; white-space:nowrap}
.sum .kv.tot{border-top:1.5px solid var(--line-strong); margin-top:4px; padding-top:14px; align-items:baseline}
.sum .kv.tot > span:first-child{font-weight:800; font-size:18px}
.sum .kv.tot .price{font-size:26px; letter-spacing:-.03em}
.sum .kv.tot small{font-size:14px; font-weight:600}
.disc-b{display:inline-flex; align-items:center; min-height:26px; padding:0 9px; border-radius:999px; background:var(--ember); color:var(--on-ember); font-size:14px; font-weight:800; margin-right:6px}
.eta-row{display:flex; gap:12px; align-items:center; margin-top:12px; padding:14px 16px; border-radius:18px; background:var(--surface-2)}
.eta-row b{display:block; font-size:17px; letter-spacing:-.01em; line-height:1.25}
.eta-row span span{display:block; font-size:14px; color:var(--muted); font-weight:600; text-wrap:balance}
.sum .fine{margin:12px 0 0; font-size:14px; color:var(--muted)}
.sum details{margin:0 0 6px; border-bottom:1px solid var(--line)}
.sum details summary{list-style:none; display:flex; align-items:center; gap:8px; min-height:48px; font-weight:700; cursor:pointer}
.sum details summary::-webkit-details-marker{display:none}
.sum details summary .ic:last-child{margin-left:auto}
.sum details[open] summary .ic:last-child{transform:rotate(180deg)}
.sum details ul{list-style:none; margin:0 0 10px; padding:0; display:grid; gap:6px; font-size:15px}
.sum details li{display:flex; justify-content:space-between; gap:12px}
.sum details li span:first-child{min-width:0}
.sum-cta{display:none}
.sum-cta .pill-red{margin-top:16px}
.sum-cta .link{width:100%; justify-content:center; margin-top:4px; color:var(--ink)}
@container app (min-width:900px){ .sum-cta{display:block} }

/* ---------- step 2 ---------- */
.combo{position:relative}
.combo .input{padding-left:48px; padding-right:52px}
.combo > .ic{position:absolute; left:16px; top:15px; color:var(--muted); pointer-events:none}
.combo-x{position:absolute; right:2px; top:2px; width:48px; height:48px; border:0; border-radius:50%; background:transparent; display:grid; place-items:center; cursor:pointer; color:var(--muted)}
.combo-list{list-style:none; margin:6px 0 0; padding:6px; border-radius:22px; background:var(--surface); box-shadow:var(--hi), var(--shadow)}
.combo-list[hidden]{display:none}
.combo-list li{display:flex; align-items:center; gap:12px; min-height:56px; padding:6px 12px; border-radius:16px; cursor:pointer; line-height:1.25}
.combo-list li .ic{color:var(--muted)}
.combo-list li small{display:block; font-size:14px; color:var(--muted); font-weight:600}
.combo-list li[aria-selected="true"], .combo-list li:hover{background:var(--surface-2)}
.combo-list .none{cursor:default; color:var(--muted); font-size:15px}
.combo-list .none:hover{background:transparent}
.try{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:4px; padding:10px 12px; border-radius:22px; box-shadow:inset 0 0 0 1.5px var(--line); }
.try span{font-size:14px; font-weight:700; color:var(--muted); margin-right:2px}
.try .chip{min-height:44px; font-size:15px}
.res{margin-top:14px}
.res .note{margin:0}
.res .skel{height:76px; border-radius:var(--r-core)}
.when{display:flex; align-items:center; gap:14px; padding:16px 18px}
.when b{display:block; font-size:17px}
.when span span{display:block; color:var(--muted); font-size:15px}
.when > .ic{color:var(--red)}

.opts{display:grid; gap:10px}
.opt{position:relative; display:grid; grid-template-columns:auto auto minmax(0,1fr); align-items:center; gap:14px; min-height:68px; padding:10px 24px 10px 18px; border-radius:999px; background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--line-strong); cursor:pointer; transition:transform var(--t-fast) var(--ease)}
.opt:active{transform:scale(.985)}
.opt input{width:24px; height:24px; margin:0; accent-color:var(--red)}
.opt > .ic{color:var(--muted)}
.opt b{display:block; font-size:17px; line-height:1.25}
.opt small{display:block; font-size:14px; color:var(--muted); font-weight:600; line-height:1.3}
.opt:has(input:checked){box-shadow:inset 0 0 0 2.5px var(--ink); background:var(--surface)}
.opt:has(input:checked) > .ic{color:var(--red)}
.opt:has(input:focus-visible){outline:3px solid var(--red); outline-offset:2px}

.slots-h{margin:22px 0 10px; font-weight:800; font-size:17px}
.slots{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
@container app (min-width:700px){ .slots{grid-template-columns:repeat(4,1fr)} }
.slot{display:grid; place-items:center; align-content:center; gap:1px; min-height:56px; border:0; border-radius:999px; background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line-strong); font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; cursor:pointer; line-height:1.15; transition:transform var(--t-fast) var(--ease)}
.slot:active{transform:scale(.96)}
.slot small{font-size:14px; font-weight:600; color:var(--muted)}
.slot[aria-pressed="true"]{background:var(--ink); color:var(--bg); box-shadow:none}
.slot[aria-pressed="true"] small{color:var(--bg); opacity:.8}
.slot[disabled]{cursor:not-allowed; background:var(--surface-2); box-shadow:none; color:var(--muted); text-decoration:line-through; text-decoration-thickness:1.5px}
.slot[disabled] small{text-decoration:none}
.slot-why{margin:10px 0 0; font-size:14px; color:var(--muted)}
.more-slots{margin-top:10px}

.place{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 14px; padding:18px}
.place > .ic{color:var(--red); margin-top:2px}
.place b{font-size:17px}
.place p{margin:0; color:var(--muted)}
.place .link{grid-column:2; min-height:44px; margin-top:4px}

/* ---------- step 3 ---------- */
.form{display:grid; gap:18px}
@container app (min-width:900px){ .form, .opts, .consent-wrap{max-width:620px} }
.field .err{display:flex; gap:6px; align-items:flex-start; margin:0}
.field .err[hidden]{display:none}
.field .err .ic{margin-top:1px}
.opt-tag{font-weight:600; color:var(--muted); font-size:14px; margin-left:4px}
.recap{padding:6px 18px}
.recap .kv{align-items:center; min-height:64px}
.recap .kv > span:first-child{min-width:0}
.recap small{display:block; font-size:14px; color:var(--muted); font-weight:700}
.recap b{display:block; line-height:1.3; font-weight:700}
.recap .link{flex:none}
.consent{padding:8px 18px 8px}
.consent .check{padding:14px 0}
.consent .check span span{display:block; font-size:15px; color:var(--muted); margin-top:3px}
.legal{margin:14px 2px 0; font-size:14px; color:var(--muted)}
.legal a{color:var(--ink); font-weight:700}

/* busy button */
.pill[aria-busy="true"]{cursor:progress}
.dots{display:inline-flex; gap:4px; margin-left:2px}
.dots i{width:6px; height:6px; border-radius:50%; background:currentColor; animation:tdot 900ms ease-in-out infinite}
.dots i:nth-child(2){animation-delay:150ms} .dots i:nth-child(3){animation-delay:300ms}

/* ---------- action bar ---------- */
.ck-bar[hidden]{display:none}
.ck-bar .pill.back{flex:none; padding:0 16px 0 14px; gap:6px}
.ck-bar .pill-red{padding:0 14px}
@container app (min-width:900px){ .ck-bar{display:none} }
@container app (max-width:370px){ .ck-bar .pill{font-size:16px} .ck-bar .pill.back{padding:0 12px 0 10px} }

/* ---------- empty ---------- */
.emp{padding-top:24px}
.emp .empty{padding:24px 0 8px}
.emp .ill{width:120px; height:120px}
.emp .empty .h1{margin-top:6px}
.emp .btns{display:grid; gap:10px; width:100%; max-width:380px; margin-top:10px}
.emp .rail{margin-top:2px}
.emp-h{font-size:24px; letter-spacing:-.03em}
.blk-h .link{white-space:nowrap; flex:none}
@container app (min-width:900px){ .emp .rail{display:grid; grid-template-columns:repeat(4,1fr); gap:24px; overflow:visible} .emp .dcard{flex:auto} }

/* ---------- prototype panel ---------- */
.proto{margin-top:48px; padding:16px; border-radius:var(--r-shell); box-shadow:inset 0 0 0 2px var(--line-strong); background:repeating-linear-gradient(135deg, transparent 0 14px, var(--line) 14px 15px)}
.proto h2{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; margin:0 0 4px}
.proto p{margin:0 0 12px; font-size:14px; color:var(--muted)}
.proto .row{flex-wrap:wrap; gap:8px}
.proto .pill{min-height:48px; font-size:15px; padding:0 16px; background:var(--surface)}
.proto .pill[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.proto-pill{border:2px dashed var(--line-strong)!important; background:transparent!important}

/* ---------- loading ---------- */
.sk-line{display:grid; grid-template-columns:72px 1fr; gap:14px; padding:16px 0}
.sk-line + .sk-line{border-top:1px solid var(--line)}
.sk-line .skel:first-child{width:72px; height:72px; border-radius:18px}
.sk-line div{display:grid; gap:10px; align-content:center}

/* ---------- success ---------- */
.done-wrap{display:grid; gap:16px; max-width:640px; margin:0 auto; padding-top:20px}
.okhead{display:grid; justify-items:center; text-align:center; gap:10px; padding:12px 0 8px}
.okmark{position:relative; width:112px; height:112px; border-radius:50%; display:grid; place-items:center; background:var(--ok); color:var(--surface); animation:okPop 560ms var(--ease) both}
.okmark::before{content:""; position:absolute; inset:0; border-radius:50%; background:var(--ok); opacity:0; animation:okRing 1100ms 260ms var(--ease) both}
.okmark .ic{position:relative; animation:okTick 460ms 200ms var(--ease) both}
@keyframes okPop{from{transform:scale(.5); opacity:0}to{transform:none; opacity:1}}
@keyframes okTick{from{transform:scale(.2) rotate(-25deg); opacity:0}to{transform:none; opacity:1}}
@keyframes okRing{0%{transform:scale(1); opacity:.35}100%{transform:scale(1.7); opacity:0}}
.ono{font-size:14px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.ono b{color:var(--ink); font-variant-numeric:tabular-nums}
.big-eta{padding:22px 22px 20px}
.big-eta .lbl{font-size:15px; font-weight:700; color:var(--muted)}
.big-eta .t{font-size:44px; line-height:1.05; font-weight:800; letter-spacing:-.045em; font-variant-numeric:tabular-nums; margin:4px 0 8px}
.big-eta p{margin:0}
.big-eta .kvs{margin-top:14px; border-top:1px solid var(--line)}
.big-eta .kv span:first-child{color:var(--muted); white-space:nowrap}
.big-eta .kv span:last-child{text-align:right; font-weight:700; min-width:0}
.offer{padding:20px; border-radius:var(--r-shell); display:grid; gap:12px}
.offer b{font-size:20px; letter-spacing:-.02em; line-height:1.2; display:block; text-wrap:balance}
.offer p{margin:0}
.offer .pill{justify-self:start}
.swrow{display:flex; align-items:center; gap:16px; width:100%; min-height:72px; padding:16px 18px; border:0; background:transparent; text-align:left; cursor:pointer; color:inherit}
.swrow b{display:block; font-size:17px; line-height:1.3}
.swrow span span{display:block; color:var(--muted); font-size:15px; margin-top:3px}
.sw{position:relative; flex:none; width:60px; height:36px; border-radius:999px; background:var(--surface-3); box-shadow:inset 0 0 0 1.5px var(--line-strong); transition:background-color var(--t-base) var(--ease)}
.sw::after{content:""; position:absolute; top:4px; left:4px; width:28px; height:28px; border-radius:50%; background:var(--surface); box-shadow:0 2px 6px rgba(0,0,0,.2); transition:transform var(--t-base) var(--ease)}
.swrow[aria-checked="true"] .sw{background:var(--ok); box-shadow:none}
.swrow[aria-checked="true"] .sw::after{transform:translateX(24px)}
.sw-state{font-size:14px; font-weight:800; color:var(--muted); min-width:32px; text-align:right}
.bday{padding:0 18px 18px; display:grid; gap:10px}
.bday .row{gap:10px}
.bday select{flex:1}
.done-wrap .pill.go{margin-top:2px}
.after{display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; padding-top:4px}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script>
(function(){
"use strict";
var R = Object.assign({}, SC.RESTAURANT), esc = SC.esc, fmt = SC.fmt, ic = SC.ic;
R.phone = R.phone.replace(/ /g, "\u00a0"); /* keep the number on one line */
var main = SC.mount({page:"cart", nav:null, back:{href:"menu.html", label:"Меню"}, title:"Количка", docTitle:"Количка и поръчка", footer:false, ai:false, bottomNav:false, actionBar:true});
var dev = SC.device, scroller = SC.scroller;
var bar = document.createElement("div"); bar.className = "abar nonav ck-bar"; bar.hidden = true; SC.ov.appendChild(bar);
var hdrBack = dev.querySelector(".top.back > a.hb"), hdrTitle = dev.querySelector(".top.back .ttl");

/* ---------- draft (per-viewer convenience: "Назад" never loses what was typed) ---------- */
var DKEY = "sc-checkout", OKEY = "sc-last-order";
var D = Object.assign({addr:"", zone:"", zk:"", addrMore:"", slot:"", name:"", phone:"", email:"", note:"", pay:"cash", sched:""}, SC.load(DKEY, {}));
D.consent = false; /* marketing consent is never pre-ticked and never restored */
var U = SC.user ? SC.user() : null; /* signed-in client from login.html */

(function(){ /* time chosen on pickup.html: SC.store("sc-pickup", {kind, day, t}); t = "16:45" (or minutes), null = as soon as possible */
  var pk = SC.load("sc-pickup", null); if (!pk || typeof pk!=="object") return;
  if (pk.day && pk.day!=="today") return;
  var t = pk.t!==undefined ? pk.t : pk.slot!==undefined ? pk.slot : (pk.asap ? null : undefined); if (t===undefined) return;
  D.slot = t==null ? "asap" : typeof t==="number" ? t2(t) : /^\d{1,2}:\d{2}$/.test(t) ? (t.length===4 ? "0"+t : t) : "";
  SC.store("sc-pickup", null); })();

/* page-only UI state (prototype switches included) */
var P = {offline:false, loading:false, sending:false, err:"", placing:false, allSlots:false, bday:false, errs:{}, touched:{}};

/* ---------- helpers ---------- */
function t2(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; var h = Math.floor(m/60), mm = m % 60; return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm; }
function ceil15(m){ return Math.ceil(m/15)*15; }
function round5(m){ return Math.ceil(m/5)*5; }
function zoneOf(n){ return SC.ZONES.filter(function(z){ return z.n===n; })[0] || null; }
function zoneMin(z){ return parseInt(String(z.eta).replace(/\D/g,""),10) || 35; }
function tomorrowLabel(){ var d = new Date(); d.setDate(d.getDate()+1); return SC.DAYS[d.getDay()]+", "+d.getDate()+" "+SC.MONTHS[d.getMonth()]; }
function dishWord(n){ return SC.plural(n, "ястие", "ястия"); }
function lineHref(x){ return x.lunch ? "lunch.html" : "dish.html#"+x.id; }

  ["НПЗ Искър","НПЗ Искър"],["кв. Бусманци","Бусманци"],["кв. Горубляне","Горубляне"],["кв. Гара Искър","Гара Искър"],["ж.к. Младост 1, бл. 20",""],["ж.к. Младост 4, бл. 401",""]];
var LAT = [["sht","щ"],["zh","ж"],["sh","ш"],["ch","ч"],["ts","ц"],["yu","ю"],["ya","я"],["a","а"],["b","б"],["v","в"],["g","г"],["d","д"],["e","е"],["z","з"],["i","и"],["y","й"],["k","к"],["l","л"],["m","м"],["n","н"],["o","о"],["p","п"],["r","р"],["s","с"],["t","т"],["u","у"],["f","ф"],["h","х"],["c","ц"],["w","в"],["x","кс"],["q","к"],["j","й"]];
function norm(s){ s = String(s||"").toLowerCase().replace(/[.,„“"]/g," "); LAT.forEach(function(p){ s = s.split(p[0]).join(p[1]); }); return s.replace(/\s+/g," ").trim(); }
function findAddr(q){ var tk = norm(q).split(" ").filter(Boolean); if (!tk.length) return [];
  return ADDR.map(function(a,i){ return {a:a[0], z:a[1], i:i}; }).filter(function(a){ var h = norm(a.a+" "+a.z+" софия"); return tk.every(function(t){ return h.indexOf(t) > -1; }); }).slice(0,6); }

/* ---------- the whole order, computed from SC.state() each time ---------- */
function info(){
  var s = SC.state(), m = s.m, sched = D.sched, today = !sched;
  var delivOK = sched ? true : s.delivery;
  var mode = (SC.cart.mode()==="pickup" || !delivOK) ? "pickup" : "delivery";
  var rows = [], sub = 0, n = 0, hasLunch = false, hasTrad = false, outN = 0;
  SC.cart.lines().forEach(function(l){ var x = SC.byId[l.id]; if (!x) return;
    var unit = x.p + (l.extra||0), r = {l:l, x:x, unit:unit, tot:unit*l.q, out:SC.isOut(x), disc:0};
    rows.push(r); if (r.out){ outN++; return; }
    n += l.q; sub += r.tot; if (x.lunch) hasLunch = true; else hasTrad = true; });
  var lunchDisc = today && s.lunchDiscount && mode==="pickup", disc = 0;
  rows.forEach(function(r){ if (!r.out && r.x.lunch && lunchDisc){ r.disc = Math.round(r.tot*30)/100; disc += r.disc; } });
  var closed = today && !s.kitchen;
  var conflict = closed || !hasLunch ? "" : sched ? "sched" : (mode==="delivery" && !s.lunch ? "delivery" : "");
  var zone = mode==="delivery" && D.zk && D.zk!=="out" ? zoneOf(D.zone) : null;
  var eta = SC.eta();
  var dMin = zone ? zoneMin(zone) + (eta.busy ? 20 : 0) : eta.min;
  var earliest = m + (hasTrad ? 20 : 0);
  var I = {s:s, m:m, sched:sched, today:today, delivOK:delivOK, mode:mode, rows:rows, n:n, outN:outN, sub:sub, disc:disc, hasLunch:hasLunch, hasTrad:hasTrad,
    closed:closed, conflict:conflict, zone:zone, busy:eta.busy, dMin:dMin, earliest:earliest, feeUnknown: mode==="delivery" && D.zk==="paid"};
  I.total = Math.round((sub - disc)*100)/100;
  I.slots = slotList(I);
  I.ok1 = n>0 && !conflict && (!closed);
  I.ok2 = I.ok1 && (mode==="delivery" ? (D.zk==="free"||D.zk==="paid") && D.addr && (today || validSlot(I)) : validSlot(I));
  return I; }

/* pickup slots: every 15 min, up to 3 hours ahead, not after 22:30. Pre-orders: the whole day. */
function slotList(I){ var out = [], a, b, i;
  if (I.sched){ a = 630; b = I.mode==="delivery" ? 1245 : 1350; }
  else { if (I.mode==="delivery") return []; a = ceil15(I.earliest+1); b = Math.min(I.m+180, 1350); }
  for (i = a; i <= b; i += 15) out.push(i);
  /* prototype: the kitchen is full for some slots (more at rush hour) */
  /* same rule as pickup.html: at rush hour the next hour is full; one slot is always shown as full */
  return out.map(function(t, k){ return {t:t, v:t2(t), busy:(I.today && I.busy && t < I.m+60) || k===4}; }); }
function validSlot(I){ if (!D.slot) return false; if (D.slot==="asap") return I.today && I.mode==="pickup" && I.earliest <= 1350;
  return I.slots.some(function(s){ return s.v===D.slot && !s.busy; }); }

function etaText(I){ /* returns {big, small} for the summary and success */
  if (I.sched){ if (D.slot && D.slot!=="asap") return {big:(I.sched==="утре"?"Утре":"Днес")+" в "+D.slot, small:I.mode==="delivery"?"Доставка в този час":"Готова за вземане"}; return {big:"Изберете час", small:"В следващата стъпка"}; }
  if (I.mode==="delivery") return {big:"Пристига около "+t2(round5(I.m+I.dMin)), small:"около "+I.dMin+" мин"+(I.busy?", възможни са закъснения":"")};
  if (D.slot && D.slot!=="asap") return {big:"Готова в "+D.slot, small:"Вземане от ресторанта"};
  return I.hasTrad ? {big:"Готова около "+t2(round5(I.earliest)), small:"След около 20 мин"} : {big:"Готова веднага", small:"Обедното меню е приготвено"}; }

var STEPS = [["kolichka","Количка"],["adres","Къде и кога"],["danni","Данни"]];
function stepper(n, grow){
  return '<nav class="stepper steps" aria-label="Стъпки на поръчката"><div class="t"><b>Стъпка '+n+' от 3</b><span>'+(n<3?"Следва: "+STEPS[n][1]:"Последна стъпка")+'</span></div>'+
    '<div class="bar" style="--n:3">'+[1,2,3].map(function(k){ return '<span class="'+(k<=n?"on":"")+(k===n&&grow?" grow":"")+'"></span>'; }).join("")+'</div>'+
    '<ol>'+STEPS.map(function(s,k){ k++; return '<li class="'+(k===n?"cur":"")+'"'+(k===n?' aria-current="step"':'')+'>'+(k<n?'<button class="sl" type="button" data-act="go" data-n="'+k+'">'+ic("check",16)+s[1]+'<span class="vh"> (готово, върнете се)</span></button>':'<span class="sl">'+s[1]+'</span>')+'</li>'; }).join("")+'</ol></nav>'; }

function note(kind, icon, title, text, acts){ return '<div class="note '+kind+'" role="'+(kind==="bad"?"alert":"status")+'">'+ic(icon,24)+'<div><b>'+title+'</b>'+(text?'<p>'+text+'</p>':'')+'</div>'+(acts?'<div class="acts">'+acts+'</div>':'')+'</div>'; }

function topNotes(I, step){ var h = "";

  if (I.closed) h += I.m < 600
    ? note("info","clock","Кухнята отваря в 10:00","Можете да поръчате още сега за днес. Изберете час и ще я приготвим точно тогава.")
    : note("info","clock","Кухнята приема поръчки до 22:30","Поръчай за утре? Изберете час и ще я приготвим точно тогава.");
  else if (I.sched) h += note("info","calendar-blank","Поръчвате за "+(I.sched==="утре"?"утре, "+tomorrowLabel():"днес"),"Ще я приготвим за часа, който изберете.");
  if (I.conflict==="delivery") h += note("warn","warning-circle","Обедното меню след 15:00 е само за вземане от място (-30%)","Вземете я от ресторанта и отстъпката се смята сама. Или махнете обедните ястия и я доставяме.",

function lineHTML(r, I){ var x = r.x, l = r.l, out = r.out;
  var mods = (l.mods||[]).map(function(md){ var add = /^\+/.test(md); var txt = add ? md.replace(/^\+\s*/,"") : md; txt = txt.charAt(0).toUpperCase()+txt.slice(1); return '<span class="tag'+(add?" add":"")+'">'+(add?ic("plus",14):"")+esc(txt)+'</span>'; }).join("");
  var tags = (x.lunch ? '<span class="tag lunch">'+ic("bowl-food",16)+'Обедно меню</span>' : "") + (r.disc ? '<span class="tag promo">-30% след 15:00</span>' : "") + mods;

function similar(x){ return SC.items.filter(function(y){ return y.cat===x.cat && y.id!==x.id && !SC.isOut(y); }).sort(function(a,b){ return Math.abs(a.p-x.p)-Math.abs(b.p-x.p); })[0] || null; }

function suggestions(I){ var ids = SC.cart.lines().map(function(l){ return l.id; }), seenC = {}, seenI = {}, out = [];
  I.rows.filter(function(r){ return !r.out; }).sort(function(a,b){ return (a.x.lunch?1:0)-(b.x.lunch?1:0); }).forEach(function(r){

var STEP_OF = {"":1, kolichka:1, adres:2, danni:3, gotovo:4};
var lastView = "", lastStep = 0;
function hashStep(){ return STEP_OF[location.hash.slice(1)] || 1; }

function setHeader(view, step){
  if (!hdrBack) return;
  var toStep = (view==="cart" && step>1) ? step-1 : 0;
  hdrBack.innerHTML = ic("arrow-left",20) + (toStep ? "Назад" : "Меню");
  hdrBack.setAttribute("href", toStep ? "#"+STEPS[toStep-1][0] : "menu.html");
  hdrBack.dataset.back = toStep || "";
  if (hdrTitle) hdrTitle.textContent = view==="done" ? "Поръчката е приета" : view==="cart" && step>1 ? "Поръчка" : "Количка"; }

function render(opts){ opts = opts || {};
  if (P.placing) return;
  var fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
  var st = hashStep(), view, html, I = info();
  if (st===4){ var o = SC.load(OKEY, null); if (o){ view = "done"; html = viewDone(o); } else { replaceHash(""); st = 1; } }
  if (!view){
    if (P.loading){ view = "loading"; html = viewLoading(); }
    else if (!I.rows.length){ view = "empty"; html = viewEmpty(); if (st>1) replaceHash(""); st = 1; }
    else {
      if (st>=2 && !I.ok1){ st = 1; replaceHash(""); }
      if (st===3 && !I.ok2){ st = 2; replaceHash("adres"); }
      if (st===2 && I.mode==="pickup" && !D.slot && I.today && I.earliest<=1350){ D.slot = "asap"; }
      view = "cart"; html = st===1 ? viewStep1(I) : st===2 ? viewStep2(I) : viewStep3(I);
    }
  }
  var changed = view+st !== lastView+lastStep;
  var top = scroller.scrollTop;
  main.innerHTML = html;
  if (changed && view==="cart" && lastView==="cart"){ var mn = main.querySelector(".ck-main"); if (mn){ mn.classList.add("enter"); if (st<lastStep) mn.classList.add("back"); } }
  if (!changed || opts.keepScroll) scroller.scrollTop = top; else scroller.scrollTop = 0;
  if (!changed){ main.querySelectorAll(".bar .grow").forEach(function(b){ b.classList.remove("grow"); }); }
  renderBar(view, st, I);
  setHeader(view, st);
  if (changed && lastView){ var h1 = main.querySelector(".ck-title"); h1 && h1.focus({preventScroll:true}); }
  else if (fk){ var el = dev.querySelector('[data-fk="'+fk.replace(/"/g,'\\"')+'"]'); el && el.focus({preventScroll:true}); }
  lastView = view; lastStep = st;
  if (view==="cart" && st===2) wireAddr();
}
function renderBar(view, st, I){
  if (view!=="cart"){ bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  bar.innerHTML = (st>1 ? '<button class="pill pill-soft back" type="button" data-act="go" data-n="'+(st-1)+'">'+ic("arrow-left",20)+'Назад</button>' : '') + ctaBtn(I, st, false); }
/* refresh only the summary and bar (keeps the caret in text fields) */
function refreshSide(){ var I = info(), st = hashStep(), side = main.querySelector(".ck-side"); if (side && lastView==="cart") side.innerHTML = summaryHTML(I, st); renderBar(lastView, st, I); }

/* forward steps push a history entry; going back pops it, so the phone's own "back" and our "Назад" agree */
var pushed = [];
function go(n){ var h = STEPS[n-1][0], cur = hashStep();
  if (location.hash.slice(1)===h || (n===1 && !location.hash)){ render(); return; }
  if (n < cur && pushed.length && pushed[pushed.length-1]===cur && (pushed.length<2 ? n===1 : pushed[pushed.length-2]===n)){ pushed.pop(); history.back(); return; }
  if (n > cur) pushed.push(n); else pushed = [];
  location.hash = h; }

/* ---------- step 2: address combobox ---------- */
var aIdx = -1;
function wireAddr(){ var inp = main.querySelector("#addr"); if (!inp) return; var list = main.querySelector("#addr-list");
  function paint(){ var q = inp.value, r = findAddr(q);
    if (q.trim().length < 2 || D.zk){ list.hidden = true; inp.setAttribute("aria-expanded","false"); return; }
    list.innerHTML = r.length ? r.map(function(a,k){ return '<li role="option" id="ao-'+k+'" data-i="'+a.i+'" aria-selected="'+(k===aIdx)+'">'+ic("map-pin",20)+'<span>'+esc(a.a)+'<small>'+(function(z){ return z ? (z.free?"Безплатна доставка":"Доставка по тарифа") : "Извън зоната ни"; })(zoneOf(a.z))+'</small></span></li>'; }).join("")
      : '<li class="none" role="option" aria-disabled="true">Не намираме такъв адрес. Опитайте с квартал и блок, например „Дружба 2, бл. 311“.</li>';
    list.hidden = false; inp.setAttribute("aria-expanded","true");
    if (aIdx>-1 && r.length) inp.setAttribute("aria-activedescendant","ao-"+aIdx); else inp.removeAttribute("aria-activedescendant"); }
  inp.addEventListener("input", function(){ D.addr = inp.value; D.zone = ""; D.zk = ""; aIdx = -1; save(); var res = main.querySelector("#addr-res"); if (res) res.innerHTML = ""; paint(); refreshSide(); });
  inp.addEventListener("keydown", function(e){ var opts = list.querySelectorAll("li[data-i]");
    if (e.key==="ArrowDown" && opts.length){ e.preventDefault(); aIdx = (aIdx+1) % opts.length; paint(); }
    else if (e.key==="ArrowUp" && opts.length){ e.preventDefault(); aIdx = aIdx<=0 ? opts.length-1 : aIdx-1; paint(); }
    else if (e.key==="Enter"){ e.preventDefault(); var pick = aIdx>-1 ? opts[aIdx] : opts.length===1 ? opts[0] : null; if (pick) pickAddr(+pick.dataset.i); }
    else if (e.key==="Escape"){ list.hidden = true; inp.setAttribute("aria-expanded","false"); } });
  list.addEventListener("mousedown", function(e){ var li = e.target.closest("li[data-i]"); if (li){ e.preventDefault(); pickAddr(+li.dataset.i); } });
  if (D.addr && !D.zk) paint(); }
function pickAddr(i){ var a = ADDR[i]; if (!a) return; D.addr = a[0]+", София"; D.zone = a[1]; var z = zoneOf(a[1]); D.zk = z ? (z.free?"free":"paid") : "out"; aIdx = -1; save();
  if (document.activeElement) document.activeElement.blur();
  P.checking = true; render({keepScroll:true});
  setTimeout(function(){ P.checking = false; render({keepScroll:true}); var r = main.querySelector("#addr-res"); }, SC.reduce ? 0 : 450); }

/* ---------- step 3: validation ---------- */
function validate(){ var e = {}, ph = String(D.phone||"").replace(/[\s\-()\/]/g,"");
  if (!String(D.name||"").trim()) e.name = "Напишете име, за да знаем кого да търсим.";
  if (!ph) e.phone = "Напишете телефон, за да ви се обадим при нужда.";
  else if (!/^(\+359|00359|0)\d{8,9}$/.test(ph)) e.phone = "Проверете номера. Например: 0888 123 456.";
  if (D.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(D.email).trim())) e.email = "Проверете имейла. Например: ime@primer.bg.";
  return e; }
function showErr(id){ var e = P.errs[id], inp = main.querySelector("#f-"+id), p = main.querySelector("#e-"+id); if (!inp || !p) return;
  if (e){ inp.setAttribute("aria-invalid","true"); p.hidden = false; p.innerHTML = ic("warning-circle",18)+esc(e); } else { inp.removeAttribute("aria-invalid"); p.hidden = true; p.innerHTML = ""; } }

function submit(){ if (P.sending) return; var I = info();
  P.errs = validate(); var bad = Object.keys(P.errs);
  if (bad.length){ P.err = "form"; render({keepScroll:true}); var f = main.querySelector("#f-"+bad[0]); if (f){ f.focus({preventScroll:true}); f.scrollIntoView({block:"center", behavior:SC.reduce?"auto":"smooth"}); } return; }
  if (P.offline || navigator.onLine===false){ P.err = "offline"; render({keepScroll:true}); var n = main.querySelector("#topnotes .note.bad"); n && n.scrollIntoView({block:"center", behavior:SC.reduce?"auto":"smooth"}); SC.toast("Няма връзка. Опитайте пак."); return; }
  P.err = ""; P.sending = true; render({keepScroll:true});
  setTimeout(function(){ place(info()); }, 1100); }
function place(I){
  var deliv = I.mode==="delivery", e = etaText(I);
  var at = I.sched ? D.slot : deliv ? t2(round5(I.m+I.dMin)) : (D.slot==="asap" ? (I.hasTrad ? t2(round5(I.earliest)) : "веднага") : D.slot);
  var payName = {cash:"В брой", card:deliv?"Карта при доставка":"Карта в ресторанта", voucher:"Ваучер"}[D.pay] || "В брой";
  var o = {no:1042, mode:I.mode, addr:D.addr+(D.addrMore?", "+D.addrMore:""), zone:D.zone, mins:I.dMin, at:at, sched:I.sched, total:I.total, feeUnknown:I.feeUnknown, n:I.n, pay:payName, name:String(D.name||"").trim()};
  SC.store(OKEY, o);
  /* hand-off to tracking.html (it reads sc-order) */
  var ls = I.rows.filter(function(r){ return !r.out; });
  SC.store("sc-order", {no:String(o.no), mode:o.mode, lines:ls.map(function(r){ return {id:r.x.id, q:r.l.q, mods:r.l.mods||[], extra:r.l.extra||0}; }),
    lunchOnly:ls.every(function(r){ return r.x.lunch; }), zone:deliv ? o.zone : "", pay:D.pay||"cash", total:o.total,
    eta: deliv ? I.dMin : Math.max(0, (D.slot && D.slot!=="asap" ? (+D.slot.slice(0,2)*60 + +D.slot.slice(3)) : I.earliest) - I.m), ts:Date.now()});
  P.sending = false; P.placing = true; SC.cart.clear(); D.slot = ""; D.sched = ""; D.note = ""; save(); P.placing = false; P.bday = false;
  location.hash = "gotovo"; }

/* ---------- prototype: sample cart from the real menu ---------- */
function fillDemo(){ var c = SC.cart.get(); c.lines = [];
  SC.cart.add("pitsa-dyavolo", 1, {mods:["без лук","+ Кашкавал"], extra:SC.byId["kashkaval"] ? SC.byId["kashkaval"].p : 0});
  SC.cart.add("svinski-rebra", 1);
  if (SC.byId["l-lazanya-boloneze"]) SC.cart.add("l-lazanya-boloneze", 2);
  SC.cart.add("parzheni-kartofi", 1); }

/* ---------- events ---------- */
dev.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if (!b){ var hb = e.target.closest(".top.back > a.hb"); if (hb && hb.dataset.back){ e.preventDefault(); go(+hb.dataset.back); } return; }
  var a = b.dataset.act, key = b.dataset.key;
  if (a==="go"){ go(+b.dataset.n); return; }
  if (a==="next"){ var I = info(), n = +b.dataset.n;
    if (n===1){ if (I.closed){ D.sched = I.m<600 ? "днес" : "утре"; D.slot = ""; save(); go(2); return; }
      if (!I.ok1){ var w = main.querySelector(".note.warn"); if (w){ w.scrollIntoView({block:"center", behavior:SC.reduce?"auto":"smooth"}); var bb = w.querySelector("button"); bb && bb.focus({preventScroll:true}); } SC.toast(I.n ? "Първо изберете как да я получите" : "Добавете ястие от менюто"); return; }
      go(2); return; }
    if (n===2){ if (!I.ok2){ var msg = I.mode==="delivery" ? (D.zk==="out" ? "Този адрес е извън зоната ни" : "Изберете адрес от списъка") : "Изберете час за вземане";
        SC.toast(msg); var t = main.querySelector(I.mode==="delivery" ? (D.zk && D.zk!=="out" ? ".slots" : "#addr") : ".opts input, .slots .slot:not([disabled])"); if (t){ t.scrollIntoView({block:"center", behavior:SC.reduce?"auto":"smooth"}); if (t.focus) t.focus({preventScroll:true}); } return; }
      go(3); return; }
    if (n===3){ submit(); return; } return; }
  if (a==="mode"){ SC.cart.mode(b.dataset.v); if (b.dataset.v==="pickup" && !D.slot) D.slot = ""; save(); return; }
  if (a==="inc"){ var l = SC.cart.lines().filter(function(z){ return z.key===key; })[0]; if (l) SC.cart.setQty(key, l.q+1); return; }
  if (a==="dec"){ var l2 = SC.cart.lines().filter(function(z){ return z.key===key; })[0]; if (!l2) return; if (l2.q>1) SC.cart.setQty(key, l2.q-1); else removeLine(key); return; }
  if (a==="rm"){ removeLine(key); return; }
  if (a==="swap"){ var l3 = SC.cart.lines().filter(function(z){ return z.key===key; })[0], nx = SC.byId[b.dataset.id]; if (!l3 || !nx) return; SC.cart.remove(key); SC.cart.add(nx.id, l3.q); SC.toast("Готово, сменихме го"); return; }
  if (a==="rmlunch"){ var gone = SC.cart.lines().filter(function(z){ var x = SC.byId[z.id]; return x && x.lunch; }); var c = SC.cart.get(); var before = c.lines.slice();
    c.lines = c.lines.filter(function(z){ return gone.indexOf(z)<0; }); SC.cart.mode(c.mode);
    SC.toast("Махнахме обедните ястия", function(){ SC.cart.get().lines = before; SC.cart.mode(SC.cart.get().mode); }); return; }
  if (a==="slot"){ D.slot = b.dataset.v; save(); render({keepScroll:true}); return; }
  if (a==="allslots"){ P.allSlots = true; render({keepScroll:true}); return; }
  if (a==="addr-pick"){ pickAddr(+b.dataset.i); return; }
  if (a==="addr-clear"){ D.addr = ""; D.zone = ""; D.zk = ""; save(); render({keepScroll:true}); var i = main.querySelector("#addr"); i && i.focus(); return; }
  if (a==="bday"){ P.bday = !P.bday; render({keepScroll:true}); return; }
  /* prototype switches */
  if (a==="demo"){ fillDemo(); if (location.hash) location.hash = "kolichka"; SC.toast("Готово: примерна количка"); return; }
  if (a==="clear"){ SC.cart.clear(); return; }
  if (a==="addout"){ SC.cart.add("pleskavitsa", 1); SC.toast("Добавено: изчерпано ястие"); if (hashStep()!==1) go(1); setTimeout(function(){ var o = main.querySelector(".ln.out"); o && o.scrollIntoView({block:"center", behavior:SC.reduce?"auto":"smooth"}); }, 60); return; }
  if (a==="loading"){ P.loading = true; render(); setTimeout(function(){ P.loading = false; lastView = ""; render(); }, 1600); return; }
  if (a==="offline"){ P.offline = !P.offline; if (!P.offline && P.err==="offline") P.err = ""; render({keepScroll:true}); return; }
});
dev.addEventListener("change", function(e){ var t = e.target;
  if (t.dataset.actR==="asap"){ D.slot = "asap"; save(); render({keepScroll:true}); return; }
  var f = t.dataset.f; if (!f) return;
  if (f==="consent"){ D.consent = t.checked; return; }
  if (f==="pay"){ D.pay = t.value; save(); return; } });
dev.addEventListener("input", function(e){ var t = e.target, f = t.dataset.f; if (!f || f==="consent" || f==="pay") return; D[f] = t.value; save();
  if (P.errs[f]){ var v = validate(); P.errs[f] = v[f]; showErr(f); } });
dev.addEventListener("focusout", function(e){ var t = e.target, f = t.dataset && t.dataset.f; if (!f || !/^(name|phone|email)$/.test(f)) return;
  if (!String(t.value).trim() && f!=="email") return; /* do not scold an empty field the person only passed through */
  var v = validate(); P.errs[f] = v[f]; showErr(f); });

function removeLine(key){ var ls = SC.cart.lines(), idx = -1; ls.forEach(function(l,k){ if (l.key===key) idx = k; });
  var gone = SC.cart.remove(key); if (!gone) return; var x = SC.byId[gone.id];
  SC.toast(x && x.n.length<=22 ? "Махнахте: "+x.n : "Махнахте ястието", function(){ var c = SC.cart.get(); c.lines.splice(Math.min(idx, c.lines.length), 0, gone); SC.cart.mode(c.mode); }); }

SC.cart.on(function(){ render(); });
window.addEventListener("hashchange", function(){ render(); });
window.addEventListener("online", function(){ render({keepScroll:true}); });
window.addEventListener("offline", function(){ P.offline = true; render({keepScroll:true}); });
render();
})();
</script>
</body>
