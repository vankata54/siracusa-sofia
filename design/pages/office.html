<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Обща поръчка за офиса | Siracusa Bar & Grill</title>
<meta name="description" content="Обща поръчка за офиса от Siracusa в Дружба 2: един отваря поръчката, праща връзката в чата и всеки си избира от обедното меню до крайния час. Плаща един или всеки сам.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<style>
/* office.html - group lunch order. Page-only styles, tokens only. Prefix: o- */

/* ---------- shared bits ---------- */
.o-top{padding-top:28px}
.o-eyebrow{display:inline-flex; align-items:center; gap:8px; min-height:36px; padding:0 14px 0 10px; border-radius:999px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); font-weight:700; font-size:14px}
.o-eyebrow .ic{color:var(--muted)}
.o-sub{margin-top:10px}
.o-back{margin:-6px 0 6px; gap:8px}
.o-ava{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; font-weight:800; font-size:17px; letter-spacing:-.02em; background:var(--surface-3); color:var(--ink)}
.o-ava.a1{background:var(--chip-dark); color:var(--on-chip-dark); box-shadow:inset 0 0 0 1.5px var(--line)}
.o-ava.a2{background:transparent; box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.o-ava.a3{background:var(--surface-2); box-shadow:inset 0 0 0 1.5px var(--line)}
.o-ava.me{background:var(--ink); color:var(--bg)}
.o-avas{display:flex}
.o-avas .o-ava{width:34px; height:34px; font-size:14px; box-shadow:0 0 0 2.5px var(--surface)}
.o-avas .o-ava.a2{background:var(--surface); box-shadow:0 0 0 2.5px var(--surface), inset 0 0 0 1.5px var(--line-strong)}
.o-avas .o-ava + .o-ava{margin-left:-9px}
.o-card{padding:20px}
.o-note{display:flex; gap:10px; align-items:flex-start; padding:14px 16px; border-radius:var(--r-field); background:var(--surface-2); font-size:15px; font-weight:600; line-height:1.4}
.o-note .ic{margin-top:1px}
.o-note.ok .ic{color:var(--ok)} .o-note.warn .ic{color:var(--warn)} .o-note.bad{color:var(--danger)} .o-note.bad .ic{color:var(--danger)}
.o-note .pill{margin-top:10px}
.o-note p{margin:0}
.o-h3{font-size:20px; line-height:1.2; letter-spacing:-.02em; font-weight:800; margin:0}
.o-kv{display:grid; gap:0}
.o-kv .kv{align-items:baseline; padding:11px 0}
.o-kv .kv > span:first-child{color:var(--muted); font-weight:600}
.o-kv .kv > b{text-align:right; font-weight:700}
.o-tot{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding-top:14px; margin-top:4px; border-top:1.5px solid var(--ink)}
.o-tot b{font-size:18px}
.o-tot .price{font-size:26px; letter-spacing:-.03em}
.o-actions{display:grid; gap:10px}
.o-two{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.o-two .pill{padding:0 12px}
.o-onlydesk{display:none}
.o-lay{display:grid; grid-template-columns:minmax(0,1fr); gap:20px; align-items:start}
.o-col{display:grid; grid-template-columns:minmax(0,1fr); gap:20px; min-width:0}
.o-col > *{min-width:0}
@container app (min-width:900px){
  .o-top{padding-top:40px}
  .o-lay{grid-template-columns:minmax(0,1fr) 400px; gap:48px}
  .o-aside{position:sticky; top:156px}
  .o-onlydesk{display:block}
  .o-onlyphone{display:none}
}

/* ---------- step indicator ---------- */
.o-step{display:grid; gap:10px; margin:0 0 22px; max-width:560px}
.o-step-l{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; font-size:14px; font-weight:700; color:var(--muted)}
.o-step-l li{display:flex; align-items:center; gap:4px; min-width:0}
.o-step-l li.cur{color:var(--ink)}
.o-step-l li.done .ic{color:var(--ok)}
.o-step-top{display:flex; justify-content:space-between; gap:10px; font-size:14px; font-weight:800}

/* ---------- hero ---------- */
.o-hero{padding-top:28px}
.o-hero .h1{margin-top:18px; max-width:15ch}
.o-hero .lead{margin-top:14px; max-width:34ch}
.o-facts{list-style:none; margin:22px 0 0; padding:0; display:grid; gap:12px}
.o-facts li{display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:center; font-weight:600; line-height:1.35}
.o-fi{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line)}
.o-cta{margin-top:26px; display:grid; gap:6px; max-width:420px}
.o-cta .link{justify-self:center; white-space:nowrap}
.o-hero-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:36px}
.o-hero-grid > *{min-width:0}

/* demo: the link in the office chat, colleagues adding their lunch */
.o-demo{max-width:440px; width:100%; justify-self:center}
.o-demo .core{padding:18px 18px 8px}
.o-demo-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.o-demo-h b{font-size:16px}
.o-demo-h .small{display:block; color:var(--muted); font-weight:600}
.o-bubble{background:var(--surface-2); border-radius:22px 22px 22px 8px; padding:13px 16px 14px; font-weight:600; line-height:1.4}
.o-bubble .who{display:block; font-size:14px; font-weight:800; margin-bottom:2px}
.o-linkchip{display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:7px 12px 7px 10px; border-radius:999px; background:var(--surface); font-size:14px; font-weight:700; max-width:100%; box-shadow:inset 0 0 0 1px var(--line)}
.o-linkchip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.o-joins{margin-top:6px}
.o-join{display:grid; grid-template-columns:40px 1fr 56px; gap:12px; align-items:center; padding:12px 0}
.o-join + .o-join{border-top:1px solid var(--line)}
.o-join .o-ava{width:40px; height:40px; font-size:16px}
.o-join .t{min-width:0; line-height:1.3}
.o-join .t b{display:block; font-size:15px}
.o-join .t span{display:block; font-size:14px; color:var(--muted); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.o-join .pic{width:56px; height:56px; border-radius:16px}
.o-demo-f{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 4px 4px; font-weight:700; font-size:15px}
@keyframes oIn{from{opacity:0; transform:translateY(16px) scale(.98)} to{opacity:1; transform:none}}
.o-demo .o-join, .o-demo .o-demo-f{animation:oIn 560ms var(--ease) both}
@media (prefers-reduced-motion: reduce){ .o-demo .o-join, .o-demo .o-demo-f{animation:none} }

@container app (min-width:900px){
  .o-hero{padding-top:56px}
  .o-hero-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:64px; align-items:center}
  .o-hero .h1{font-size:60px}
  .o-hero .lead{font-size:19px}
  .o-facts{grid-template-columns:repeat(3,1fr); gap:16px}
  .o-facts li{grid-template-columns:1fr; align-items:start; align-content:start; font-size:15px; gap:10px}
  .o-cta{grid-template-columns:auto auto; justify-content:start; align-items:center; gap:18px; max-width:none}
  .o-cta .go{width:auto; min-width:340px}
  .o-demo{justify-self:end}
}

/* ---------- how it works ---------- */
.o-how{list-style:none; margin:0; padding:0; display:grid}
.o-how li{position:relative; display:grid; grid-template-columns:48px 1fr; gap:16px; padding-bottom:28px}
.o-how li:last-child{padding-bottom:0}
.o-how li:not(:last-child)::before{content:""; position:absolute; left:23px; top:56px; bottom:8px; width:2px; border-radius:1px; background:var(--line-strong)}
.o-num{width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:var(--ink); color:var(--bg); font-weight:800; font-size:19px; font-variant-numeric:tabular-nums}
.o-how h3{margin:10px 0 4px}
.o-how p{margin:0; color:var(--muted)}
@container app (min-width:900px){
  .o-how{grid-template-columns:repeat(3,1fr); gap:20px}
  .o-how li{grid-template-columns:1fr; padding:26px; border-radius:var(--r-core); background:var(--surface); box-shadow:var(--hi), var(--shadow); gap:6px}
  .o-how li:not(:last-child)::before{display:none}
  .o-how h3{margin-top:16px}
}

/* ---------- create form ---------- */
.o-form{display:grid; gap:26px}
.o-form .field{gap:8px}
.o-form .label{display:block}
.o-quick{display:flex; flex-wrap:wrap; gap:8px}
.o-quick .chip{min-height:48px; font-size:15px}
.o-quick-l{font-size:14px; font-weight:700; color:var(--muted); margin:2px 0 0}
.o-slots{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.o-slot{min-height:52px; border:0; border-radius:999px; background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line-strong); font-weight:800; font-size:16px; font-variant-numeric:tabular-nums; cursor:pointer; transition:transform var(--t-fast) var(--ease)}
.o-slot:active{transform:scale(.96)}
.o-slot[aria-pressed="true"]{background:var(--ink); color:var(--bg); box-shadow:none}
.o-slot[disabled]{background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1px var(--line); cursor:not-allowed; text-decoration:line-through; text-decoration-thickness:1.5px}
.o-slot .vh{position:absolute}
.o-res{display:flex; gap:10px; align-items:center; font-weight:700; font-size:15px; margin-top:2px}
.o-res .ic{color:var(--ok)}
.o-choice{border:0; margin:0; padding:0; display:grid; gap:10px}
.o-choice legend{padding:0; margin-bottom:8px}
.o-opt{position:relative; display:grid; grid-template-columns:44px 1fr 26px; gap:14px; align-items:center; min-height:76px; padding:14px 16px; border-radius:var(--r-core); background:var(--surface); box-shadow:inset 0 0 0 1.5px var(--line-strong); cursor:pointer; transition:transform var(--t-fast) var(--ease)}
.o-opt:active{transform:scale(.99)}
.o-opt input{position:absolute; opacity:0; width:1px; height:1px; pointer-events:none}
.o-opt .o-fi{background:var(--surface-2); box-shadow:none}
.o-opt b{display:block; line-height:1.25}
.o-opt .muted{display:block; font-size:15px; line-height:1.35; margin-top:2px}
.o-radio{width:26px; height:26px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--line-strong); display:grid; place-items:center; color:var(--bg)}
.o-radio .ic{opacity:0}
.o-opt:has(input:checked){box-shadow:inset 0 0 0 2.5px var(--ink)}
.o-opt:has(input:checked) .o-radio{background:var(--ink); box-shadow:none}
.o-opt:has(input:checked) .o-radio .ic{opacity:1}
.o-opt:has(input:focus-visible){outline:3px solid var(--red); outline-offset:2px}
.o-fine{display:flex; gap:8px; align-items:flex-start; font-size:14px; color:var(--muted); margin:0}
.o-fine .ic{margin-top:2px}
.o-pickup{display:grid; gap:4px}
.o-preview .core{padding:20px}
.o-preview .label{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; margin-bottom:14px}
.o-preview .o-bubble{margin-bottom:14px}

/* ---------- share ---------- */
.o-done-ic{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; background:var(--ok); color:var(--on-ok); margin-bottom:18px}
.o-linkwrap{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; margin-top:20px}
.o-link{display:flex; align-items:center; gap:10px; min-height:56px; padding:12px 18px; border-radius:20px; background:var(--surface-2); font-weight:700; font-size:16px}
.o-link .ic{color:var(--muted)}
.o-link output{flex:1; min-width:0; line-height:1.35}
.nw{white-space:nowrap}

/* ---------- shared list ---------- */
.o-timer{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:nowrap}
.o-timer > div:first-child{flex:1; min-width:0}
.o-until{flex:none}
.o-timer .lbl{display:block; font-weight:700; color:var(--muted); font-size:15px}
.o-time{display:block; font-size:48px; font-weight:800; letter-spacing:-.045em; line-height:1; margin-top:6px; font-variant-numeric:tabular-nums}
.o-time small{font-size:20px; letter-spacing:-.02em; margin-left:2px}
.o-until{text-align:right; font-weight:700; line-height:1.35}
.o-until > span:not(.o-live){display:block; color:var(--muted); font-weight:600; font-size:15px}
.o-closed{display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:center}
.o-closed .o-fi{background:var(--surface-2); box-shadow:none}
.o-closed b{display:block; font-size:19px; letter-spacing:-.02em; line-height:1.25}
.o-closed div span{display:block; color:var(--muted); font-weight:600; font-size:15px; margin-top:2px}
.o-until .o-live{margin-bottom:4px}
.o-track{height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-top:18px}
.o-track span{display:block; height:100%; border-radius:3px; background:var(--ink); transform-origin:left center; transition:transform 1s linear}
.o-live{display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--ok)}
.o-live i{width:8px; height:8px; border-radius:50%; background:currentColor; animation:oPulse 2s ease-in-out infinite}
@keyframes oPulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.8)}}
.o-people{display:grid}
.o-person{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:14px; align-items:start; padding:16px 0}
.o-person + .o-person{border-top:1px solid var(--line)}
.o-person .nm{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:800; font-size:17px; line-height:1.3; min-height:24px}
.o-tag{font-size:14px; font-weight:700; line-height:1; padding:5px 9px; border-radius:999px; background:var(--surface-2); color:var(--muted)}
.o-person ul{list-style:none; margin:6px 0 0; padding:0; display:grid; gap:4px}
.o-person li{display:flex; gap:8px; font-size:15px; line-height:1.35; color:var(--muted); font-weight:600}
.o-person li .q{color:var(--ink); font-weight:800; font-variant-numeric:tabular-nums; flex:none}
.o-person .sum{padding-top:1px; text-align:right}
.o-person .sum .price{font-size:18px}
.o-person .acts{display:flex; gap:4px; margin:6px 0 -10px -2px}
.o-person .acts .link{font-size:15px}
.o-person .acts .link.mutedl{color:var(--muted)}
.o-person.new{animation:oIn 560ms var(--ease) both}
.o-owe{display:grid; gap:0; margin-top:6px}
.o-owe .kv{padding:9px 0}
.o-owe .kv span{font-weight:600}
.o-sendinline{margin-top:6px}
.o-dots{display:inline-flex; gap:4px}
.o-dots i{width:6px; height:6px; border-radius:50%; background:currentColor; animation:tdot 900ms ease-in-out infinite}
.o-dots i:nth-child(2){animation-delay:150ms} .o-dots i:nth-child(3){animation-delay:300ms}

/* ---------- colleague picker ---------- */
.o-invite .core{padding:20px}
.o-invite-h{display:flex; gap:14px; align-items:center}
.o-invite-h .h2{font-size:26px}
.o-pill-time{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:8px 16px 8px 14px; line-height:1.3; border-radius:22px; background:var(--surface-2); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums}
.o-menu-h{display:grid; gap:12px; margin-bottom:6px}
.o-grp{scroll-margin-top:150px}
.o-grp h3{display:flex; align-items:baseline; gap:8px; margin:26px 0 2px}
.o-grp h3 .n{font-size:15px; color:var(--muted); font-weight:700}
.o-item{display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:14px; align-items:center; padding:12px 0}
.o-item + .o-item{border-top:1px solid var(--line)}
.o-item .pic{width:64px; height:64px; border-radius:18px}
.o-item .nm{display:block; font-weight:700; line-height:1.3}
.o-item .meta{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:4px}
.o-item.out .nm{color:var(--muted)}
.o-item.out .price{color:var(--muted)}
.o-item.on .nm{color:var(--ink)}
.o-item .counter output{min-width:24px}
.o-slotempty{width:48px}
.o-mine{display:grid; gap:2px}
.o-mine .kv{font-size:15px; padding:9px 0}
.o-mine .kv span{min-width:0}
@container app (min-width:900px){
  .o-menu .o-items{display:grid; grid-template-columns:1fr 1fr; column-gap:28px}
  .o-menu .o-item + .o-item{border-top:0}
  .o-menu .o-item{border-bottom:1px solid var(--line)}
}

/* ---------- states ---------- */
.o-state{display:grid; grid-template-columns:minmax(0,1fr); justify-items:center; text-align:center; gap:10px; padding:36px 20px 30px}
.o-state .ill{width:88px; height:88px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--ink); margin-bottom:6px}
.o-state .ill.ok{background:var(--ok); color:var(--on-ok)}
.o-state .ill.warn{color:var(--warn)}
.o-state p{margin:0; max-width:36ch}
.o-state .o-actions{width:100%; max-width:360px; margin-top:10px}
.o-sentmeta{display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; max-width:420px; margin:10px 0 4px}
.o-sentmeta div{padding:14px; border-radius:var(--r-field); background:var(--surface-2); text-align:left}
.o-sentmeta span{display:block; font-size:14px; color:var(--muted); font-weight:700}
.o-sentmeta b{display:block; font-size:20px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}

/* ---------- subscription, FAQ ---------- */
.o-sub-card .core{padding:22px; display:grid; gap:14px}
.o-sub-card .o-tag{justify-self:start}
.o-faq{display:grid}
.o-faq details{border-top:1px solid var(--line)}
.o-faq details:last-child{border-bottom:1px solid var(--line)}
.o-faq summary{list-style:none; display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:60px; padding:12px 0; font-weight:700; font-size:17px; cursor:pointer}
.o-faq summary::-webkit-details-marker{display:none}
.o-faq summary .ic{transition:transform var(--t-base) var(--ease); color:var(--muted)}
.o-faq details[open] summary .ic{transform:rotate(180deg)}
.o-faq p{margin:0 0 18px; color:var(--muted); max-width:62ch}
.o-split{display:grid; grid-template-columns:minmax(0,1fr); gap:56px}
.o-split > *{min-width:0}
@container app (min-width:900px){
  .o-split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px; align-items:start}
}

/* ---------- prototype panel ---------- */
.o-proto{border:1.5px dashed var(--line-strong); border-radius:var(--r-shell); padding:18px; display:grid; gap:12px}
.o-proto h2{display:flex; align-items:center; gap:8px; margin:0; font-size:16px; font-weight:800}
.o-proto p{margin:0; font-size:14px; color:var(--muted)}
.o-proto .o-quick .chip{min-height:48px; text-decoration:none}
.o-proto h3{margin:4px 0 0; font-size:14px; font-weight:700; color:var(--muted)}

/* ---------- action bar ---------- */
.pill[data-busy]{pointer-events:none}
.pill .o-dots{margin-left:2px}
@container app (min-width:900px){ .abar.o-bar{display:none} .aifab.up{bottom:24px} }
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script>
(function(){
"use strict";
var main = SC.mount({page:"office", nav:null, title:"Обща поръчка за офиса"});
var ic = SC.ic, esc = SC.esc, fmt = SC.fmt;
var R = SC.RESTAURANT;
var SITE = "siracusa-sofia.com/office#join-";

/* ---------- data ---------- */
/* Sold out today: same dish as lunch.html, for the mockup only (decision 2: stays visible, last in its group) */
var MOCK_OUT = ["l-teleshko-sas-spanak-i-oriz"];
MOCK_OUT.forEach(function(id){ var x = SC.byId[id]; if (x && x.t.indexOf("out") < 0) x.t.push("out"); });

var LUNCH = SC.lunch;
var GROUPS = [];
LUNCH.forEach(function(x){ var g = GROUPS.filter(function(z){ return z.n === x.group; })[0]; if (!g){ g = {n:x.group, id:"g"+GROUPS.length, items:[]}; GROUPS.push(g); } g.items.push(x); });
GROUPS.forEach(function(g){ g.items.sort(function(a,b){ return SC.isOut(a) - SC.isOut(b); }); });

/* Simulated colleagues (prototype only), real dishes from today's lunch menu */
var TEAM = [
  {n:"Иван", picks:{"l-kyufteta-s-parzheni-kartofi-zele-i-morkov-lyuten":1, "l-supa-topcheta":1}},

/* ---------- helpers ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function clock(m){ m = ((m % 1440) + 1440) % 1440; return Math.floor(m/60)+":"+pad(m%60); }
function sum(p){ var s = 0; Object.keys(p||{}).forEach(function(k){ var x = SC.byId[k]; if (x) s += x.p * p[k]; }); return Math.round(s*100)/100; }
function cnt(p){ var s = 0; Object.keys(p||{}).forEach(function(k){ s += p[k]; }); return s; }

function dateLabel(d){ return SC.DAYS[d.getDay()] + ", " + d.getDate() + " " + SC.MONTHS[d.getMonth()]; }
function tomorrowDate(){ var d = new Date(); d.setDate(d.getDate()+1); return d; }

/* Zones: free in Дружба 1 и 2, НПЗ Искър, Бусманци; by tariff in Горубляне, Гара Искър (hand-off 10.1, decision 7) */
function zone(name){ return SC.ZONES.filter(function(z){ return z.n === name; })[0]; }
function zoneOf(a){ var s = (a||"").toLowerCase().replace(/\s+/g," ").trim();
  if (s.length < 3) return null;
  if (/дружба\s*-?\s*(1|i)\b|дружба\s*-?\s*1/.test(s)) return {z:zone("Дружба 1")};
  if (/дружба\s*-?\s*(2|ii)\b|дружба\s*-?\s*2/.test(s)) return {z:zone("Дружба 2")};
  if (/нпз/.test(s)) return {z:zone("НПЗ Искър")};
  if (/бусманци/.test(s)) return {z:zone("Бусманци")};
  if (/горубляне/.test(s)) return {z:zone("Горубляне")};
  if (/гара\s*искър/.test(s)) return {z:zone("Гара Искър")};
  if (/дружба/.test(s)) return {ask:true};
  if (/младост|люлин|център|лозенец|надежда|овча|студентски|мусагеница|дървеница|слатина|изток|красно|гео милев|изгрев|банишора|витоша|бояна|обеля|сухата|кремиковци|подуяне|сердика|хаджи|редута|яворов|борово|стрелбище|гоце|овча купел|красна|манастирски|павлово|кръстова|лагера|хиподрума|княжево|симеоново|драгалевци|бенковски|орландовци|илиянци|враждебна/.test(s)) return {out:true};
  if (s.length >= 8) return {unknown:true};
  return null; }
function etaMin(z, day){ if (G.mode === "pickup") return 0; var e = z && z.eta ? parseInt(z.eta.replace(/\D/g,""),10) : 0; e = e || 35;
  if (day === "today" && SC.eta().busy) e += 20;  /* same rule as cart.html: busy kitchen adds 20 min */
  return e; }

/* Deadline slots: every 30 min from 10:30 to 14:00 (lunch is delivered until 15:00). Default 11:30. */
function plan(){ var m = SC.minutes(), first = Math.ceil(Math.max(m+30, 630)/30)*30, tom = first > 840, slots = [];
  for (var t=630; t<=840; t+=30) slots.push({t:t, off:!tom && t < first});
  return {tomorrow:tom, slots:slots, def:(tom || 690 >= first) ? 690 : first}; }
function syncPlan(){ var p = plan(), day = p.tomorrow ? "tomorrow" : "today";
  var ok = G.deadline && G.day === day && p.slots.some(function(s){ return s.t === G.deadline && !s.off; });
  if (!ok){ G.deadline = p.def; G.day = day; } return p; }
function ctx(){ var p = plan();
  var day = G.day || (p.tomorrow ? "tomorrow" : "today"), dl = G.deadline || p.def, nowM = SC.minutes();
  var fixed = SC.prefs.time && SC.prefs.time !== "now";
  var secNow = nowM*60 + (fixed ? Math.floor((Date.now()-t0)/1000) : new Date().getSeconds());
  var remain = day === "today" ? dl*60 - secNow : (1440*60 - secNow) + dl*60;
  var zr = zoneOf(G.addr), z = zr && zr.z;
  var late = day === "today" && nowM >= 900;
  return {day:day, dl:dl, remain:remain, closed:sim.closed || remain <= 0, late:late, z:z, eta:dl + etaMin(z, day),
    dayWord: day === "today" ? "днес" : "утре", dayFull: day === "today" ? dateLabel(new Date()) : dateLabel(tomorrowDate())}; }
function left(sec){ sec = Math.max(0, sec); var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if (h >= 1) return h + '<small> ч </small>' + pad(m) + '<small> мин</small>';
  return pad(m) + ":" + pad(s); }
function leftWords(sec){ var m = Math.max(0, Math.ceil(sec/60)); if (m >= 90){ var h = Math.floor(m/60), r = m%60; return h+" ч"+(r?" и "+r+" мин":""); } return m+" мин"; }
function whereText(c){ if (G.mode === "pickup") return "Вземане от ресторанта"; return c.z ? c.z.n : (G.addr.trim() ? G.addr.trim() : "ж.к. Дружба 2"); }
function feeText(c){ if (G.mode === "pickup") return "Без доставка"; if (!c.z) return "Безплатна"; return c.z.free ? "Безплатна" : '<span class="missing">[ЛИПСВА: такса в €]</span>'; }

function people(){ if (sim.empty) return [{n:orgName(), me:true, picks:{}}];
  var a = [{n:orgName(), me:true, picks:G.mine}];
  TEAM.forEach(function(t, i){ if (G.removed.indexOf(t.n) < 0) a.push({n:t.n, picks:t.picks, cls:"a"+((i%3)+1)}); });
  if (G.guest.done && G.guest.name.trim() && cnt(G.guest.picks)) a.push({n:G.guest.name.trim(), picks:G.guest.picks, cls:"a3", guest:true});
  return a; }
function total(){ return people().reduce(function(s, p){ return s + sum(p.picks); }, 0); }
function totalCount(){ return people().reduce(function(s, p){ return s + cnt(p.picks); }, 0); }
function eaters(){ return people().filter(function(p){ return cnt(p.picks) > 0; }); }

function copy(text){ try{ navigator.clipboard && navigator.clipboard.writeText(text).catch(function(){}); }catch(e){} }

function scrollToEl(el){ if (!el) return; var s = SC.scroller; var y = el.getBoundingClientRect().top - s.getBoundingClientRect().top + s.scrollTop - 150; s.scrollTo({top:Math.max(0,y), behavior:SC.reduce ? "auto" : "smooth"}); }

    '<ol class="o-step-l">'+names.map(function(t, i){ var st = i+1 < n ? "done" : i+1 === n ? "cur" : "";

  var acts = "";
  if (opts.edit && p.me) acts = '<div class="acts"><a class="link" href="#mine">'+ic(n ? "pencil-simple" : "plus",18)+(n ? "Промени моя избор" : "Избери своето")+'</a></div>';
  else if (opts.edit && !opts.closed) acts = '<div class="acts"><button class="link mutedl" type="button" data-act="drop" data-who="'+esc(p.n)+'" aria-label="Махни '+esc(p.n)+' от поръчката">'+ic("x",18)+'Махни</button></div>';
  return '<div class="o-person'+(opts.fresh && p.guest ? " new" : "")+'"><span class="o-ava '+(p.me ? "me" : (p.cls||"a3"))+'" aria-hidden="true">'+initial(p.me && !G.name.trim() && !opts.guestView ? "В" : p.n)+'</span>'+
    '<div><div class="nm">'+esc(p.n)+tag+'</div>'+(n ? '<ul>'+items+'</ul>' : '<p class="muted" style="margin:4px 0 0;font-size:15px">'+(p.me && !opts.guestView ? "Още не сте избрали" : "Още избира")+'</p>')+acts+'</div>'+
    '<div class="sum">'+(n ? '<span class="price">'+fmt(sum(p.picks))+'</span>' : '')+'</div></div>'; }

      '<div style="width:100%;text-align:left;margin-top:8px">'+minePicks(gp)+'<div class="o-tot"><b>'+(G.pays==="one" ? "Дължите на "+esc(org) : "Плащате при получаване")+'</b><span class="price">'+fmt(s)+'</span></div></div>'+
      '<div class="o-actions"><button class="pill pill-line pill-lg pill-block" type="button" data-act="guestedit">'+ic("pencil-simple",20)+'Промени избора</button></div></div></div>'+
      '</div><aside class="o-aside o-col"><div class="shell"><div class="core o-card" style="padding-bottom:6px"><h2 class="o-h3">Кой какво поръча</h2><div class="o-people">'+
        people().map(function(p){ return person(p.me ? {n:org, me:true, picks:p.picks} : p, {guestView:true}); }).join("")+'</div></div></div></aside></div></section>';
    return html; }

  var html2 = '<section class="sec o-top"><div class="o-lay"><div class="o-col">'+invite+
    '<div class="field"><label for="o-gname">Вашето име</label><input class="input" id="o-gname" autocomplete="given-name" placeholder="Например: Николай" value="'+esc(G.guest.name)+'" aria-describedby="o-gname-h o-gname-e"><span class="help" id="o-gname-h">Така '+esc(org)+' ще знае чие е ястието. Без профил.</span><span class="err" id="o-gname-e" data-err="gname" hidden></span></div>'+
    pickerHTML(gp, true)+'</div>'+
    '<aside class="o-aside o-col o-onlydesk"><div class="shell"><div class="core o-card"><h2 class="o-h3">Вашият избор</h2><div data-mine>'+minePicks(gp)+'</div>'+
      '<button class="pill pill-red pill-lg pill-block" type="button" data-act="guestsave" data-savebtn'+saveDis(gp)+' style="margin-top:16px">'+saveLbl(gp, "Добави към поръчката")+'</button>'+
      '<p class="o-fine" style="margin-top:12px">'+ic("info",18)+'<span>'+(G.pays==="one" ? esc(org)+" плаща за всички. После си уреждате сметката." : "Плащате своето при получаване, в брой или с карта.")+'</span></p></div></div></aside></div></section>';
  bar('<button class="pill pill-red" type="button" data-act="guestsave" data-savebtn'+saveDis(gp)+'>'+saveLbl(gp, "Добави към поръчката")+'</button>');
  return html2; }

function viewSent(){ var c = ctx(); var T = total(), list = eaters();
  var others = list.filter(function(p){ return !p.me; });
  return '<section class="sec o-top"><div class="shell" style="max-width:620px;margin:0 auto"><div class="core o-state">'+
    '<div class="ill ok">'+ic("check",44)+'</div><h1 class="h2">Поръчката е изпратена</h1>'+
    '<p class="muted">Ресторантът я получи. Ще ви известим, когато тръгне към вас.</p>'+
    '<div class="o-sentmeta"><div><span>Поръчка</span><b>№ '+ORDER_NO+'</b></div><div><span>'+(G.mode==="pickup"?"Готова":"Пристига около")+'</span><b>'+(c.day==="tomorrow"?"утре ":"")+clock(c.eta)+'</b></div><div><span>Ястия</span><b>'+totalCount()+' за '+souls(list.length)+'</b></div><div><span>Общо</span><b class="price">'+fmt(T)+'</b></div></div>'+
    (G.pays === "one" && others.length ? '<div style="width:100%;max-width:420px;text-align:left"><h2 class="o-h3" style="font-size:17px;margin:12px 0 2px">Колегите ви дължат</h2><div class="o-owe">'+others.map(function(p){ return '<div class="kv"><span>'+esc(p.n)+'</span><span class="price">'+fmt(sum(p.picks))+'</span></div>'; }).join("")+'</div></div>' : '')+
    '<div class="o-actions"><a class="pill pill-red pill-lg pill-block" href="tracking.html#'+ORDER_NO+'">Следи поръчката'+ic("arrow-right",20)+'</a>'+
    '<button class="pill pill-line pill-block" type="button" data-act="copydone">'+ic("copy",20)+'Копирай съобщение за чата</button></div>'+
    '<label class="check" style="text-align:left;max-width:420px;margin-top:6px"><input type="checkbox" id="o-news"><span><b>Пишете ми, когато има абонамент за офиси</b><br><span class="muted small">Обяд всеки ден в избран час. Пишем ви само за това.</span></span></label>'+
    '<a class="link" href="#" data-act="restart">Започни нова обща поръчка</a>'+
  '</div></div></section>'; }

function protoPanel(rt){ var v = rt.v;
  var views = [["#","1. Създаване","start"],["#share","2. Връзка","share"],["#list","3. Общ списък","list"],["#join-"+code(),"Поканен колега","join"],["#sent","Изпратена","sent"]];
  var states = [["empty","Празен списък"],["closed","Крайният час мина"],["offline","Без интернет"],["loading","Зареждане"]];
  return '<section class="sec" aria-labelledby="o-proto-h"><div class="o-proto"><h2 id="o-proto-h">'+ic("sliders-horizontal",20)+'Само в прототипа</h2><p>Изгледи на групата и състояния. Часът се сменя от лентата горе.</p>'+
    '<h3>Изгледи</h3><div class="o-quick">'+views.map(function(x){ return '<a class="chip" href="'+x[0]+'"'+(v===x[2]?' aria-current="true"':'')+'>'+x[1]+'</a>'; }).join("")+'</div>'+
    '<h3>Състояния</h3><div class="o-quick">'+states.map(function(x){ return '<button class="chip" type="button" data-sim="'+x[0]+'" aria-pressed="'+sim[x[0]]+'">'+x[1]+'</button>'; }).join("")+
    '<a class="chip" href="#join-0000">Грешна връзка</a><button class="chip" type="button" data-act="reset">'+ic("trash",18)+'Изчисти данните</button></div></div></section>'; }

/* ---------- floating action bar ---------- */
function bar(inner){ var old = SC.ov.querySelector(".o-bar"); if (old) old.remove();
  var fab = SC.ov.querySelector(".aifab");
  if (!inner){ fab && fab.classList.remove("up"); return; }
  SC.ov.insertAdjacentHTML("beforeend", '<div class="abar o-bar">'+inner+'</div>'); fab && fab.classList.add("up"); }

/* ---------- render ---------- */
function route(){ var h = decodeURIComponent(location.hash.slice(1));
  if (/^join/.test(h)) return {v:"join", code:(h.split("-")[1]||"").toUpperCase()};
  if (["share","list","mine","sent"].indexOf(h) > -1) return {v:h};
  return {v:"start"}; }
var lastV = null;
function render(keepScroll){ var rt = route(); clearInterval(tick); bar(null);
  if (rt.v !== "start" && rt.v !== "join" && !G.deadline) syncPlan();
  var html = rt.v === "share" ? viewShare() : rt.v === "list" ? viewList() : rt.v === "mine" ? viewMine() : rt.v === "join" ? viewJoin(rt) : rt.v === "sent" ? viewSent() : viewStart();
  main.innerHTML = html + protoPanel(rt);
  if (rt.v === "start") updEta();
  if (!keepScroll && lastV !== null) SC.scroller.scrollTop = 0;
  lastV = rt.v;
  if (rt.v === "list" || rt.v === "join" || rt.v === "share") tick = setInterval(liveTick, 1000);
  SC.reveal(); }
function liveTick(){ var c = ctx(), el = main.querySelector("[data-left]"), w = main.querySelector("[data-leftw]"), tr = main.querySelector("[data-track]");
  if (c.remain <= 0 && !sim.closed && (el || w)){ render(true); return; }
  if (el) el.innerHTML = left(c.remain);
  if (w) w.textContent = leftWords(c.remain);
  if (tr) tr.style.transform = "scaleX("+Math.min(1, Math.max(0, c.remain/(c.day==="today"?7200:86400))).toFixed(4)+")"; }

/* ---------- interactions ---------- */
function setErr(key, msg){ var e = main.querySelector('[data-err="'+key+'"]'); if (!e) return; var inp = document.getElementById(e.id.replace(/-e$/,""));
  e.hidden = !msg; e.textContent = msg || ""; if (inp) inp.setAttribute("aria-invalid", msg ? "true" : "false"); }
function pickTarget(){ return route().v === "mine" ? G.mine : G.guest.picks; }
function updPicker(id){ var picks = pickTarget(), row = main.querySelector('[data-row="'+id+'"]');
  if (row){ var tmp = document.createElement("div"); tmp.innerHTML = itemHTML(SC.byId[id], picks[id]||0); var nr = tmp.firstChild; row.replaceWith(nr);
    var f = nr.querySelector('[data-id="'+id+'"][data-q="1"]') || nr.querySelector(".plus"); }
  var m = main.querySelector("[data-mine]"); if (m) m.innerHTML = minePicks(picks);
  var verb = route().v === "mine" ? "Запази моя избор" : "Добави към поръчката";
  document.querySelectorAll("[data-savebtn]").forEach(function(b){ b.innerHTML = saveLbl(picks, verb); if (sum(picks)) b.removeAttribute("aria-disabled"); else b.setAttribute("aria-disabled","true"); });
  return nr; }

main.addEventListener("input", function(e){ var t = e.target;
  if (t.id === "o-office"){ G.office = t.value; save(); updEta(); }
  else if (t.id === "o-name"){ G.name = t.value; save(); setErr("name"); updEta(); }
  else if (t.id === "o-addr"){ G.addr = t.value; save(); setErr("addr"); updAddr(true); }
  else if (t.id === "o-phone"){ G.phone = t.value; save(); setErr("phone"); }
  else if (t.id === "o-gname"){ G.guest.name = t.value; save(); setErr("gname"); }
  else if (t.name === "pays"){ G.pays = t.value; save(); updEta(); } });
main.addEventListener("change", function(e){ if (e.target.name === "pays"){ G.pays = e.target.value; save(); updEta(); } });

main.addEventListener("submit", function(e){ if (!e.target.matches("[data-form]")) return; e.preventDefault();
  var bad = null;
  if (!G.name.trim()){ setErr("name", "Напишете името си, за да знаят колегите от кого е поканата."); bad = bad || "o-name"; }
  if (G.mode !== "pickup"){ var zr = zoneOf(G.addr);
    if (!G.addr.trim()){ setErr("addr", "Напишете адреса на офиса или изберете квартала отдолу."); bad = bad || "o-addr"; }
    else if (zr && zr.out){ setErr("addr", "До този адрес не доставяме. Изберете „Ще я вземем от ресторанта“."); bad = bad || "o-addr"; }
    else if (!zr || !zr.z){ setErr("addr", "Допишете квартала, за да проверим дали доставяме, например „Дружба 2“."); bad = bad || "o-addr"; } }
  if (bad){ var el = document.getElementById(bad); scrollToEl(el); setTimeout(function(){ el.focus({preventScroll:true}); }, SC.reduce ? 0 : 350); return; }
  if (!G.code){ var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = ""; for (var i=0;i<4;i++) s += A.charAt(Math.floor(Math.random()*A.length)); G.code = s; }
  save(); location.hash = "share"; });

function onClick(e){ var t = e.target.closest("button, a"); if (!t) return;
  var act = t.dataset.act, c;
  if (t.dataset.slot){ G.deadline = +t.dataset.slot; save(); main.querySelectorAll("[data-slot]").forEach(function(b){ b.setAttribute("aria-pressed", String(b === t)); }); updEta(); return; }
  if (t.dataset.zone){ var n = t.dataset.zone; G.addr = (/Дружба/.test(n) ? "ж.к. " : "") + n + ", "; save(); setErr("addr"); updAddr(false); var inp = document.getElementById("o-addr"); if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } return; }
  if (t.dataset.pay){ G.pay = t.dataset.pay; save(); main.querySelectorAll("[data-pay]").forEach(function(b){ b.setAttribute("aria-pressed", String(b === t)); }); return; }
  if (t.dataset.jump){ scrollToEl(document.getElementById(t.dataset.jump)); return; }
  if (t.dataset.q){ var id = t.dataset.id, picks = pickTarget(), q = (picks[id]||0) + (+t.dataset.q);
    if (q <= 0) delete picks[id]; else picks[id] = Math.min(q, 9); save(); SC.haptic();
    var nr = updPicker(id); var f = nr && (nr.querySelector('[data-q="'+t.dataset.q+'"]') || nr.querySelector(".plus") || nr.querySelector('[data-q="1"]')); f && f.focus({preventScroll:true}); return; }
  if (t.dataset.sim){ var k = t.dataset.sim; sim[k] = !sim[k]; if (k === "closed" && sim.closed) sim.loading = false;
    SC.toast(sim[k] ? "Включено: " + t.textContent : "Изключено: " + t.textContent); render(true); return; }
  switch (act){
    case "toform": scrollToEl(document.getElementById("o-create")); setTimeout(function(){ var i = document.getElementById("o-office"); i && i.focus({preventScroll:true}); }, SC.reduce ? 0 : 450); return;
    case "pickup": G.mode = "pickup"; save(); setErr("addr"); updAddr(false); return;
    case "delivery": G.mode = "delivery"; save(); updAddr(false); return;
    case "copylink": copy(link()); SC.flash(t, ic("check",22)+"Копирано", 1600); SC.toast("Връзката е копирана. Поставете я в чата."); return;
    case "copymsg": copy(chatMsg(ctx())); SC.toast("Съобщението е копирано"); return;
    case "viber": if (!/Android|iPhone|iPad/i.test(navigator.userAgent)){ e.preventDefault(); copy(chatMsg(ctx())); SC.toast("Съобщението е копирано. Поставете го във Viber."); } return;
    case "sharenative": c = ctx(); if (navigator.share){ navigator.share({title:"Обяд от Siracusa", text:chatMsg(c)}).catch(function(){}); } else { copy(chatMsg(c)); SC.toast("Съобщението е копирано. Поставете го в чата."); } return;
    case "copyowe": copy("Обяд от Siracusa: " + eaters().filter(function(p){ return !p.me; }).map(function(p){ return p.n + " " + fmt(sum(p.picks)); }).join(", ")); SC.toast("Копирано. Поставете го в чата."); return;
    case "copydone": c = ctx(); copy("Обядът е поръчан, пристига около " + clock(c.eta) + ". Благодаря!"); SC.toast("Съобщението е копирано"); return;
    case "paysone": G.pays = "one"; save(); render(true); return;
    case "payseach": G.pays = "each"; save(); render(true); return;
    case "drop": var who = t.dataset.who; G.removed.push(who); save(); render(true);
      SC.toast(who + " е махнат(а) от поръчката", function(){ G.removed = G.removed.filter(function(x){ return x !== who; }); save(); render(true); }); return;
    case "savemine": if (!sum(G.mine)){ SC.toast("Изберете поне едно ястие"); return; } save(); SC.toast("Изборът ви е в общия списък ✓"); location.hash = "list"; return;
    case "guestsave": if (!G.guest.name.trim()){ setErr("gname", "Напишете името си, за да знае "+(G.name.trim()||DEMO_ORG)+" чие е ястието."); var gi = document.getElementById("o-gname"); scrollToEl(gi); setTimeout(function(){ gi.focus({preventScroll:true}); }, SC.reduce ? 0 : 350); return; }
      if (!sum(G.guest.picks)){ SC.toast("Изберете поне едно ястие"); return; }
      G.guest.done = true; save(); render(); return;
    case "guestedit": G.guest.done = false; save(); render(); return;
    case "restart": e.preventDefault(); G = Object.assign({}, DEF, {office:G.office, name:G.name, addr:G.addr, mode:G.mode, pays:G.pays, phone:G.phone, guest:Object.assign({}, DEF.guest), mine:{}, removed:[]}); save(); sim.closed = false; if (location.hash) location.hash = ""; else render(); return;
    case "reset": G = JSON.parse(JSON.stringify(DEF)); save(); sim = {empty:false, closed:false, offline:false, loading:false}; SC.toast("Данните на прототипа са изчистени"); if (location.hash) location.hash = ""; else render(); return;
    case "send": if (!t.hasAttribute("data-busy")) send(t); return; } }
main.addEventListener("click", onClick);
SC.ov.addEventListener("click", function(e){ if (e.target.closest(".o-bar")) onClick(e); });

function send(btn){ var ok = /^(\+359\d{9}|0\d{9})$/.test(G.phone.replace(/[\s-]/g,""));
  var errBox = main.querySelector("[data-senderr]"); if (errBox) errBox.innerHTML = "";
  if (!ok){ setErr("phone", G.phone.trim() ? "Проверете номера: 10 цифри, например 0888 12 34 56." : "Напишете телефон, за да ви се обадим, ако има въпрос."); var p = document.getElementById("o-phone"); scrollToEl(p); setTimeout(function(){ p.focus({preventScroll:true}); }, SC.reduce ? 0 : 350); return; }
  var btns = document.querySelectorAll('[data-act="send"]'), label = btn.innerHTML;
  btns.forEach(function(b){ b.setAttribute("data-busy",""); b.innerHTML = label + '<span class="o-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="vh" role="status">Изпращаме</span>'; });
  setTimeout(function(){
    if (sim.offline){ btns.forEach(function(b){ b.removeAttribute("data-busy"); b.innerHTML = label; });
      var box = main.querySelector("[data-senderr]"); if (box) box.innerHTML = '<div class="o-note bad" role="alert">'+ic("warning-circle",22)+'<div><p>Няма връзка. Поръчката ви е запазена - опитайте пак.</p><button class="pill pill-line" type="button" data-act="send">Опитай пак</button></div></div>';
      SC.toast("Няма връзка. Опитайте пак."); scrollToEl(box); return; }
    G.sentAt = Date.now(); save(); handoff(); location.hash = "sent"; }
/* hand-off to tracking.html: same sc-order shape as cart.html */
function handoff(){ var c = ctx(), m = SC.minutes(), lines = {}, payName = G.pays === "each" ? "Всеки плаща своето" : (G.pay === "card" ? "Карта при получаване" : "В брой");
  eaters().forEach(function(p){ Object.keys(p.picks).forEach(function(k){ lines[k] = (lines[k]||0) + p.picks[k]; }); });
  var etaMins = c.day === "today" ? Math.max(0, c.eta - m) : (1440 - m) + c.eta;
  SC.store("sc-order", {no:String(ORDER_NO), mode:G.mode === "pickup" ? "pickup" : "delivery",
    lines:Object.keys(lines).map(function(k){ return {id:k, q:lines[k], mods:[], extra:0}; }),
    lunchOnly:true, zone:G.mode === "pickup" ? "" : (c.z ? c.z.n : ""), pay:G.pays === "each" ? "split" : G.pay, payLabel:payName, total:total(),
    eta:etaMins, at:clock(c.eta), sched:c.day === "tomorrow" ? "утре "+clock(c.eta) : "", placedAt:clock(m),
    ts:(function(){ var d = new Date(); d.setHours(Math.floor(m/60), m%60, 0, 0); return d.getTime(); })(), group:true}); }, SC.reduce ? 200 : 1100); }

window.addEventListener("hashchange", function(){ render(); });
render();
})();
</script>
