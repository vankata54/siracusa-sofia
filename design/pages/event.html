<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Събитие | Siracusa Bar & Grill</title>
<meta name="description" content="Събития в Siracusa Bar &amp; Grill, Дружба 2: тематични вечери, жива музика и празници. Запазете място онлайн.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="../ds/sc.css">
<style>
/* event.html - one event (hand-off 6.8). Page-only styles, tokens from sc.css only. */

/* ---------- hero ---------- */
.ev-hero{padding-top:18px; display:grid; gap:22px; grid-template-areas:"head" "ticket" "facts"}
.ev-head{grid-area:head; min-width:0}
.ev-ticket{grid-area:ticket; min-width:0}
.ev-facts{grid-area:facts; min-width:0}
.ev-eyebrow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
.ev-cat{display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 14px 0 11px; border-radius:var(--r-pill); background:var(--chip-dark); color:var(--on-chip-dark); font-size:14px; font-weight:700; white-space:nowrap; box-shadow:inset 0 0 0 1px var(--line)}
.ev-cat .ic{color:var(--ember)}
.ev-share{padding:0 18px 0 16px}
.ev-title{font-size:46px; line-height:.98; letter-spacing:-.055em; font-weight:800; margin:0; text-wrap:balance}
.ev-lead{margin-top:12px; max-width:40ch; font-size:17px; line-height:1.45}

/* ---------- the ticket ---------- */
.ticket .core{position:relative}
.tk-band{position:relative; display:block; height:34px; background:var(--ember); color:var(--on-ember)}
.tk-band > svg{display:block; width:100%; height:100%}
.tk-band .lbl{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 12px 0 9px; border-radius:var(--r-pill); background:var(--chip-dark); color:var(--on-chip-dark); box-shadow:0 0 0 3px var(--ember); font-size:14px; font-weight:800; white-space:nowrap; letter-spacing:-.01em}
.tk-band .lbl .ic{color:var(--ember)}
.tk-main{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; padding:18px 18px 12px}
.cal{width:104px; border-radius:20px; overflow:hidden; text-align:center; background:var(--surface); box-shadow:var(--hi), var(--shadow), inset 0 0 0 1px var(--line); transform-origin:50% 0; animation:calIn 900ms var(--ease) 150ms both}
.cal .m{display:block; padding:7px 0 6px; background:var(--ink); color:var(--bg); font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; line-height:1.2}
.cal .d{display:block; padding:10px 0 0; font-size:54px; font-weight:800; letter-spacing:-.06em; line-height:1; font-variant-numeric:tabular-nums}
.cal .w{display:block; padding:4px 0 12px; font-size:14px; font-weight:700; color:var(--muted)}
@keyframes calIn{from{transform:perspective(500px) rotateX(-75deg); opacity:0} to{transform:none; opacity:1}}
.when{min-width:0}
.when .k{display:block; font-size:14px; font-weight:700; color:var(--muted)}
.when .v{display:flex; align-items:center; gap:10px; font-size:clamp(30px, 10cqi, 40px); font-weight:800; letter-spacing:-.05em; line-height:1.05; font-variant-numeric:tabular-nums; margin-top:2px}
.when .s{display:block; font-size:16px; font-weight:600; margin-top:6px; line-height:1.35}
.live{position:relative; width:12px; height:12px; border-radius:50%; background:var(--ember); flex:none}
.live::after{content:""; position:absolute; inset:0; border-radius:50%; background:var(--ember); animation:livePulse 1.6s var(--ease) infinite}
@keyframes livePulse{from{transform:scale(1); opacity:.7} to{transform:scale(2.6); opacity:0}}
.seats{display:inline-flex; align-items:center; gap:6px; margin-top:10px; min-height:32px; padding:0 12px 0 9px; border-radius:var(--r-pill); font-size:14px; font-weight:800; color:var(--warn); box-shadow:inset 0 0 0 1.5px currentColor}
.tk-perf{position:relative; height:24px}
.tk-perf::before{content:""; position:absolute; left:22px; right:22px; top:11px; border-top:2px dashed var(--line-strong)}
.tk-perf i{position:absolute; top:0; width:24px; height:24px; border-radius:50%; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line)}
.tk-perf i:first-child{left:-12px} .tk-perf i:last-child{right:-12px}
.tk-stub{display:grid; gap:10px; padding:6px 18px 18px}
.ev-note{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:18px; background:var(--surface-2); line-height:1.4}
.ev-note .ic{color:var(--warn); margin-top:1px}
.tk-stub .go{min-height:60px}
.tk-stub .go .knob{background:rgba(255,255,255,.2)}

/* ---------- facts ---------- */
.facts{margin:0; padding:4px 18px}
.fact{display:grid; grid-template-columns:44px 1fr; gap:14px; align-items:start; padding:14px 0}
.fact + .fact{border-top:1px solid var(--line)}
.fact .fi{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2)}
.fact dt{font-size:14px; font-weight:700; color:var(--muted); line-height:1.3}
.fact dd{margin:2px 0 0; font-weight:700; font-size:17px; line-height:1.4}
.fact dd .muted{font-weight:600; font-size:16px}
.fact dd .missing{font-weight:600; font-size:16px}
.fact .link{min-height:44px; margin-top:2px}

/* ---------- program timeline ---------- */
.ev-cols{display:grid; gap:56px}
.tl{list-style:none; margin:0; padding:0}
.tl li{position:relative; display:grid; grid-template-columns:62px 22px 1fr; gap:10px; align-items:start; padding-bottom:22px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:""; position:absolute; left:82px; top:16px; bottom:-6px; width:2px; background:var(--line-strong)}
.tl li:last-child::before{display:none}
.tl .t{font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.4; letter-spacing:-.01em}
.tl .dot{width:14px; height:14px; margin:5px 4px 0; border-radius:50%; background:var(--surface); box-shadow:inset 0 0 0 3px var(--ink); position:relative; z-index:1}
.tl .dot.em{background:var(--ember); box-shadow:inset 0 0 0 3px var(--on-ember)}
.tl .dot.miss{box-shadow:inset 0 0 0 2px var(--line-strong)}
.tl b{display:block; font-size:17px; line-height:1.4}
.tl .sub{display:block; color:var(--muted); line-height:1.4; margin-top:2px}

/* ---------- missing-content slots (no photos until the new shoot) ---------- */
.slot{position:relative; overflow:hidden; border-radius:var(--r-img); background:radial-gradient(120% 90% at 50% 30%, var(--plate-1), var(--plate-2)); color:var(--ink)}
.slot .bg{position:absolute; right:-18px; top:50%; transform:translateY(-58%) rotate(-10deg); color:var(--ink); opacity:.07}
.slot .si{position:absolute; left:14px; top:14px; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:var(--surface); box-shadow:var(--shadow); color:var(--muted)}
.slot .sl{position:absolute; left:12px; right:12px; bottom:12px; padding:8px 12px; border-radius:14px; background:var(--glass); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); font-size:14px; line-height:1.35}
.slot-menu{min-height:190px}
.ev-also{margin:18px 0 4px; font-weight:700}
.ev-dish{padding:0 16px}
.ev-mosaic{display:grid; grid-template-columns:1fr 1fr; grid-template-areas:"a a" "b c"; gap:10px}
.ev-mosaic .slot:nth-child(1){grid-area:a; aspect-ratio:16/10}
.ev-mosaic .slot:nth-child(2){grid-area:b; aspect-ratio:1}
.ev-mosaic .slot:nth-child(3){grid-area:c; aspect-ratio:1}

/* ---------- good to know ---------- */
.rules{padding:4px 18px}
.rule{display:grid; grid-template-columns:44px 1fr; gap:14px; padding:16px 0; align-items:start; align-content:start}
.rule + .rule{border-top:1px solid var(--line)}
.rule .ri{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2)}
.rule .ri.ok{color:var(--ok)}
.rule .ri.em{background:var(--ember); color:var(--on-ember)}
.rule h3{margin:0; font-size:17px; line-height:1.3; letter-spacing:-.01em}
.rule p{margin:4px 0 0; color:var(--muted); line-height:1.45}
.ev-call{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding:6px 6px 6px 20px; border-radius:var(--r-pill); background:var(--surface-2)}
.ev-call span{font-weight:700}

/* ---------- next evening ---------- */
.nx{display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center; padding:18px}
.nx .cal{width:80px; animation:none; border-radius:18px}
.nx .cal .m{font-size:12px; padding:5px 0 4px}
.nx .cal .d{font-size:36px; padding-top:6px}
.nx .cal .w{font-size:13px; padding-bottom:8px}
.nx b{display:block; font-size:18px; line-height:1.3; letter-spacing:-.01em}
.nx .missing{display:block; margin-top:4px}
.nx-go{grid-column:1 / -1}

/* ---------- states ---------- */
.ev-state{padding-top:40px}
.ev-state .empty{padding:24px 0 8px}
.ev-state .empty h1{max-width:18ch}
.ev-state .empty p{margin:0; max-width:34ch}
.ev-state .ill.err{color:var(--danger)}
.ev-state .acts{display:grid; gap:10px; width:100%; max-width:360px; margin-top:8px}
.ev-up{margin-top:36px}
.ev-up h2{margin-bottom:12px}
.ev-upcard{display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; padding:16px; text-decoration:none; color:inherit}
.ev-upcard .cal{width:76px; animation:none; border-radius:18px}
.ev-upcard .cal .m{font-size:12px; padding:5px 0 4px} .ev-upcard .cal .d{font-size:36px; padding-top:6px} .ev-upcard .cal .w{font-size:13px; padding-bottom:8px}
.ev-upcard b{display:block; font-size:18px; line-height:1.3}
.ev-upcard .go2{width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:var(--red); color:var(--on-red)}
.sk-line{height:18px; border-radius:9px}

/* ---------- sticky action bar ---------- */
.ev-abar{transition:transform var(--t-slow) var(--ease), opacity var(--t-slow) var(--ease)}
.ev-abar.off{transform:translateY(24px); opacity:0; pointer-events:none}

/* ---------- sheets ---------- */
.sh-p{margin:2px 0 16px; color:var(--muted)}
.sh-list{display:grid; gap:10px}
.sh-list .pill{justify-content:flex-start; padding:0 20px}
.sh-fine{margin:16px 0 4px; font-size:14px; color:var(--muted)}

/* ---------- prototype-only state switcher (outside the device frame) ---------- */
.ev-pv{position:fixed; left:16px; bottom:16px; z-index:1000; display:none; flex-direction:column; gap:2px; width:236px; padding:10px; border-radius:24px; background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:inset 0 0 0 1px var(--glass-line), var(--shadow); font-size:14px}
.ev-pv b{padding:4px 10px 6px; font-size:13px; color:var(--muted); letter-spacing:.02em}
.ev-pv a{min-height:36px; padding:0 12px; border-radius:999px; display:flex; align-items:center; font-weight:700; text-decoration:none}
.ev-pv a[aria-current="true"]{background:var(--ink); color:var(--bg)}
html.pv-phone .ev-pv{display:flex}
@media (max-width:1000px){ html.pv-phone .ev-pv{display:none} }

/* ---------- desktop ---------- */
@container app (min-width:700px){
  .ev-mosaic{grid-template-columns:repeat(3,1fr); grid-template-areas:"a b c"; gap:16px}
  .ev-mosaic .slot:nth-child(n){aspect-ratio:4/3}
}
@container app (min-width:900px){
  .ev-hero{padding-top:56px; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); grid-template-areas:"head ticket" "facts ticket"; grid-template-rows:auto 1fr; gap:36px 64px; align-items:start}
  .ev-title{font-size:84px}
  .ev-lead{font-size:20px; margin-top:20px}
  .ev-eyebrow{margin-bottom:22px}
  .ev-ticket{position:sticky; top:170px}
  .tk-main{padding:26px 26px 20px; gap:22px}
  .cal{width:120px}
  .cal .d{font-size:64px}
  .when .v{font-size:48px}
  .tk-stub{padding:8px 26px 26px}
  .tk-perf::before{left:28px; right:28px}
  .facts{padding:6px 24px}
  .ev-cols{grid-template-columns:1fr 1fr; gap:64px}
  .rules{display:grid; grid-template-columns:repeat(4,1fr); padding:8px}
  .rule{grid-template-columns:1fr; gap:14px; padding:20px 18px}
  .rule + .rule{border-top:0; box-shadow:-1px 0 0 var(--line)}
  .ev-call{width:fit-content; gap:28px; padding-left:24px}
  .nx{grid-template-columns:auto 1fr auto; padding:20px 20px 20px 22px; gap:22px}
  .nx-go{grid-column:auto}
  .ev-state{padding-top:72px}
}
</style>
</head>
<body>
<script src="../ds/icons.js"></script>
<script src="../data/menu.js"></script>
<script src="../ds/sc.js"></script>
<script>
(function(){
"use strict";
var R = SC.RESTAURANT, ic = SC.ic, esc = SC.esc;
var TEL = "tel:+359894365577";
var WD = ["нд","пн","вт","ср","чт","пт","сб"];
var EVENTS = SC.events();

/* ---- address: event.html#<id>[/<demo-state>]; demo states exist only for reviewing the prototype ---- */
var DEMO = [["","Обикновено"],["dnes","Днес, преди началото"],["sega","Тече в момента"],["prikljuchi","Приключи"],["mesta","Остават 6 места"],["pulno","Няма свободни места"],["bez-internet","Без интернет"],["zarezhdane","Зареждане"],["greshka","Грешка при зареждане"]];
function parse(){ var h = ""; try{ h = decodeURIComponent(location.hash.slice(1)); }catch(e){ h = location.hash.slice(1); }
  var p = h.split("/"); return {id:p[0] || (EVENTS[0] && EVENTS[0].id) || "", st:p[1] || ""}; }
function find(id){ return EVENTS.filter(function(e){ return e.id === id; })[0] || null; }

/* ---- dates ---- */
function mid(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function toMin(t){ var a = String(t||"19:00").split(":"); return (+a[0])*60 + (+a[1]||0); }
function lastSat(y, m){ var d = new Date(y, m+1, 0); while (d.getDay() !== 6) d.setDate(d.getDate()-1); return d; }
function nextLastSat(d){ var m = d.getMonth() + 1, y = d.getFullYear(); if (m > 11){ m = 0; y++; } return lastSat(y, m); }
function longDate(d){ return SC.DAYS[d.getDay()] + ", " + d.getDate() + " " + SC.MONTHS[d.getMonth()]; }
function shortDate(d){ return WD[d.getDay()] + ", " + d.getDate() + " " + SC.MON[d.getMonth()]; }
/* Sofia offset for JSON-LD: EEST from the last Sunday of March to the last Sunday of October */
function sofiaOffset(d){ var y = d.getFullYear();
  function lastSun(m){ var x = new Date(y, m+1, 0); while (x.getDay() !== 0) x.setDate(x.getDate()-1); return x; }
  return (d >= lastSun(2) && d < lastSun(9)) ? "+03:00" : "+02:00"; }

/* ---- model: the event + everything that depends on the clock ---- */
function model(ev, st){
  var e = {}, k; for (k in ev) e[k] = ev[k];
  var today = mid(new Date()), m = SC.minutes();
  /* demo: pretend it is already the evening's day, at a fixed time */
  if (st === "dnes"){ today = mid(e.date); m = 16*60 + 30; }
  if (st === "sega"){ today = mid(e.date); m = 20*60 + 15; }
  if (st === "prikljuchi"){ today = mid(e.date); m = 23*60 + 20; }
  if (st === "mesta") e.seatsLeft = 6;
  if (st === "pulno") e.seatsLeft = 0;
  e.start = toMin(e.time);
  e.days = Math.round((mid(e.date) - today) / 864e5);
  e.minsLeft = e.start - m;
  e.phase = e.days > 1 ? "soon" : e.days === 1 ? "tomorrow" : m < e.start ? "today" : m < toMin(R.close) ? "live" : "over";
  e.offline = st === "bez-internet" || navigator.onLine === false;
  e.full = e.seatsLeft === 0;
  e.iso = ymd(e.date);
  e.next = nextLastSat(e.date);
  e.lockH = e.start >= 17*60 ? 2 : 1; /* change / cancel: 2 h before in the evening, 1 h during the day (hand-off 6.7) */
  return e; }

/* the one main action, by situation */
function cta(e){
  var res = "reservation.html#" + e.iso;
  if (e.phase === "over") return {t:"Виж следващите събития", bar:"Виж следващите събития", href:"events.html", ic:"arrow-right"};
  if (e.offline || e.phase === "live") return {t:"Обади се за място", bar:"Обади се · " + R.phone, href:TEL, ic:"phone"};
  if (e.full) return {t:"Запиши ме в чакащите", bar:"Запиши ме в списъка на чакащите", href:res, ic:"list-checks"};
  if (e.phase === "today") return {t:"Запази място за днес", bar:"Запази място за днес · " + e.time, href:res, ic:"arrow-right"};
  return {t:"Запази място", bar:"Запази място · " + shortDate(e.date), href:res, ic:"arrow-right"}; }

/* ---- pieces ---- */
function meander(id, h){ /* Greek key band, drawn in currentColor; numeric h = one row centred in the band */
  var H = typeof h === "number" ? h : 30, off = (H - 30) / 2;
  return '<svg aria-hidden="true" focusable="false" width="100%" height="'+h+'"><defs><pattern id="'+id+'" width="20" height="'+H+'" patternUnits="userSpaceOnUse">'+
    '<path transform="translate(0 '+off+')" d="M0 2.5H20M0 25.5H20M4 25.5V7H17.5V19.5H9V12.5H13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></pattern></defs>'+
    '<rect width="100%" height="100%" fill="url(#'+id+')"/></svg>'; }
function cal(d, small){ return '<span class="cal" aria-hidden="true"><span class="m">'+(small ? SC.MON[d.getMonth()] : SC.MONTHS[d.getMonth()])+'</span><span class="d">'+d.getDate()+'</span><span class="w">'+SC.DAYS[d.getDay()]+'</span></span>'; }
function whenHTML(e){ var k, v, s, extra = "";
  if (e.phase === "soon"){ k = "До вечерта остават"; v = SC.plural(e.days, "ден", "дни"); s = "Начало в " + e.time; }
  else if (e.phase === "tomorrow"){ k = "Вечерта е"; v = "Утре"; s = "Начало в " + e.time; }
  else if (e.phase === "today"){ var h = Math.floor(e.minsLeft/60), mm = e.minsLeft % 60;
    k = "Започва след " + (h ? h + "&nbsp;ч" : "") + (h && mm ? " " : "") + (mm ? mm + "&nbsp;мин" : ""); v = "Днес"; s = "Начало в " + e.time; }
  else if (e.phase === "live"){ k = "В момента"; v = '<span class="live" aria-hidden="true"></span>Тече'; s = "Работим до " + R.close; }
  else { k = "Тази вечер"; v = "Приключи"; s = "Следващата: " + e.next.getDate() + " " + SC.MONTHS[e.next.getMonth()]; }
  if (e.seatsLeft != null && e.phase !== "over") extra = '<span class="seats">'+ic("users-three",18)+(e.seatsLeft > 0 ? "Остават " + SC.plural(e.seatsLeft, "място", "места") : "Местата свършиха")+'</span>';
  return '<div class="when" role="group" aria-label="Кога"><span class="k">'+k+'</span><span class="v">'+v+'</span><span class="s">'+s+'</span>'+extra+'</div>'; }
function priceHTML(e){ if (e.free) return "Вход свободен"; if (e.price) return '<span class="price">'+SC.fmt(e.price)+'</span>';
  return '<span class="missing">[ЛИПСВА: цена, куверт или „Вход свободен“]</span>'; }
function slot(icon, label, cls){ return '<div class="slot '+(cls||"")+'" role="img" aria-label="Място за снимка: '+esc(label)+'"><span class="bg">'+ic(icon,160)+'</span><span class="si">'+ic(icon,24)+'</span><span class="sl"><span class="missing">['+esc(label)+']</span></span></div>'; }

function ticketHTML(e){ var c = cta(e);
  var offer = (e.phase === "soon" && !e.full) ? '<span class="lbl">'+ic("seal-percent",18)+'-5% при ранна резервация</span>' : "";
  var note = e.offline ? '<div class="ev-note" role="status">'+ic("warning-circle",20)+'<span>Няма връзка с интернет. Обадете ни се на <b>'+R.phone+'</b> и ще ви запазим място.</span></div>'
    : e.phase === "live" ? '<div class="ev-note">'+ic("info",20)+'<span>Вечерта тече. Обадете се и ще ви кажем дали има свободна маса.</span></div>'
    : e.full ? '<div class="ev-note">'+ic("info",20)+'<span>Всички места са заети. Запишете се и ще ви се обадим, ако се освободи маса.</span></div>' : "";
  var cal2 = (e.phase === "over" || e.phase === "live" || e.offline) ? "" : '<button class="pill pill-line pill-block" type="button" data-cal>'+ic("calendar-check",20)+'Добави в календара</button>';
  return '<div class="shell ticket"><div class="core">'+
    '<span class="tk-band">'+meander("mk-band", 34)+offer+'</span>'+
    '<div class="tk-main">'+cal(e.date)+whenHTML(e)+'</div>'+
    '<div class="tk-perf" aria-hidden="true"><i></i><i></i></div>'+
    '<div class="tk-stub">'+
      '<a class="pill pill-red go" href="'+c.href+'" data-hero-cta>'+c.t+'<span class="knob">'+ic(c.ic,22)+'</span></a>'+note+cal2+

/* ---- SEO: Event + BreadcrumbList structured data (hand-off / master 11.2) ---- */
function jsonLD(e){ var old = document.getElementById("ev-ld"); if (old) old.remove(); if (!e) return;
  var start = e.iso + "T" + e.time + ":00" + sofiaOffset(e.date);
  var ld = [{"@context":"https://schema.org", "@type":"Event", name:e.n, description:e.text, startDate:start,
    eventStatus:"https://schema.org/EventScheduled", eventAttendanceMode:"https://schema.org/OfflineEventAttendanceMode",
    location:{"@type":"Restaurant", name:R.name, telephone:"+359894365577", address:{"@type":"PostalAddress", streetAddress:"ж.к. Дружба 2, срещу бл. 311", postalCode:"1582", addressLocality:"София", addressCountry:"BG"}},
    organizer:{"@type":"Organization", name:R.name, url:"https://siracusa-sofia.com"}},
   {"@context":"https://schema.org", "@type":"BreadcrumbList", itemListElement:[
    {"@type":"ListItem", position:1, name:"Начало", item:"https://siracusa-sofia.com/"},
    {"@type":"ListItem", position:2, name:"Събития", item:"https://siracusa-sofia.com/sabitia/"},
    {"@type":"ListItem", position:3, name:e.n}]}];
  if (e.free || e.price) ld[0].offers = {"@type":"Offer", price:e.free ? 0 : e.price, priceCurrency:"EUR", availability:e.full ? "https://schema.org/SoldOut" : "https://schema.org/InStock"};
  var s = document.createElement("script"); s.type = "application/ld+json"; s.id = "ev-ld"; s.textContent = JSON.stringify(ld); document.head.appendChild(s); }

/* ---- calendar + share ---- */
function stamp(d, mins){ return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "T" + pad(Math.floor(mins/60)) + pad(mins%60) + "00"; }
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n"); }
function openCalendar(e){
  var end = toMin(R.close), title = e.n + " в Siracusa", where = R.name + ", " + R.address;
  var g = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) + "&dates=" + stamp(e.date, e.start) + "/" + stamp(e.date, end) +
    "&ctz=Europe/Sofia&location=" + encodeURIComponent(where) + "&details=" + encodeURIComponent(e.text + "\nРезервации: " + R.phone);
  var s = SC.sheet({title:"Добави в календара", html:'<p class="sh-p">Изберете своя календар. Той ще ви напомни за вечерта.</p><div class="sh-list">'+
    '<a class="pill pill-line pill-lg pill-block" href="'+g+'" target="_blank" rel="noopener" data-calg>'+ic("calendar-check",22)+'Google Календар</a>'+
    '<button class="pill pill-line pill-lg pill-block" type="button" data-ics>'+ic("calendar-dots",22)+'Apple, Outlook и други</button></div>'+
    '<p class="sh-fine">Записваме: '+longDate(e.date)+', '+e.time+' - '+R.close+', '+esc(R.name)+', Дружба 2.</p>'});
  s.el.querySelector("[data-calg]").addEventListener("click", function(){ setTimeout(s.close, 150); });
  s.el.querySelector("[data-ics]").addEventListener("click", function(){
    var ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Siracusa Bar & Grill//BG","CALSCALE:GREGORIAN","BEGIN:VEVENT",
      "UID:" + e.id + "-" + e.iso + "@siracusa-sofia.com", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z",
      "DTSTART;TZID=Europe/Sofia:" + stamp(e.date, e.start), "DTEND;TZID=Europe/Sofia:" + stamp(e.date, end),
      "SUMMARY:" + icsEsc(title), "LOCATION:" + icsEsc(where), "DESCRIPTION:" + icsEsc(e.text + "\nРезервации: " + R.phone),
      "BEGIN:VALARM","TRIGGER:-PT3H","ACTION:DISPLAY","DESCRIPTION:" + icsEsc(title),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
    try{ var url = URL.createObjectURL(new Blob([ics], {type:"text/calendar;charset=utf-8"})), a = document.createElement("a");
      a.href = url; a.download = e.id + "-" + e.iso + ".ics"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      s.close(); SC.toast("Готово. Отворете файла, за да влезе в календара."); }
    catch(x){ SC.toast("Не успяхме да създадем файла. Ползвайте Google Календар."); } }); }
function copyLink(url){ var ok = function(){ SC.toast("Връзката е копирана"); };
  try{ navigator.clipboard.writeText(url).then(ok, ok); }catch(x){ ok(); } }
function openShare(e){
  var url = location.href.split("#")[0] + "#" + e.id;
  var text = e.n + " в Siracusa, " + longDate(e.date) + ", " + e.time;
  var coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;
  if (navigator.share && coarse){ navigator.share({title:e.n, text:text, url:url}).catch(function(){}); return; }
  var s = SC.sheet({title:"Сподели", html:'<p class="sh-p">Поканете приятели за '+esc(text)+'.</p><div class="sh-list">'+
    '<a class="pill pill-line pill-lg pill-block" href="viber://forward?text='+encodeURIComponent(text + " " + url)+'">'+ic("chat-circle-dots",22)+'Изпрати във Viber</a>'+
    '<a class="pill pill-line pill-lg pill-block" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url)+'" target="_blank" rel="noopener">'+ic("facebook-logo",22)+'Сподели във Facebook</a>'+
    '<button class="pill pill-line pill-lg pill-block" type="button" data-copy>'+ic("copy",22)+'Копирай връзката</button></div>'});
  s.el.querySelector("[data-copy]").addEventListener("click", function(){ copyLink(url); s.close(); }); }

/* ---- mount ---- */
var q0 = parse(), ev0 = find(q0.id);
var main = SC.mount({page:"event", nav:null, back:{href:"events.html", label:"Събития"}, title:ev0 ? ev0.n : "Събитие", actionBar:true});
SC.ov.insertAdjacentHTML("beforeend", '<div class="abar ev-abar off" data-abar aria-hidden="true" inert></div>');
var abar = SC.ov.querySelector("[data-abar]"), io = null, cur = null;
function setBar(on){ abar.classList.toggle("off", !on); var fab = SC.device.querySelector(".aifab"); if (fab) fab.classList.toggle("up", on); if (on){ abar.removeAttribute("aria-hidden"); abar.removeAttribute("inert"); } else { abar.setAttribute("aria-hidden","true"); abar.setAttribute("inert",""); } }

function render(){
  var q = parse(), ev = find(q.id), ttl = document.querySelector(".top .ttl"), meta = document.querySelector('meta[name="description"]');
  if (io){ io.disconnect(); io = null; } setBar(false); cur = null;
  if (!ev){ main.innerHTML = invalidHTML(); if (ttl) ttl.textContent = "Събитие"; document.title = "Събитието не е намерено | Siracusa Bar & Grill"; jsonLD(null); pvSync(q); SC.reveal(); return; }
  if (ttl) ttl.textContent = ev.n;
  if (q.st === "zarezhdane"){ main.innerHTML = loadingHTML(); pvSync(q); return; }
  if (q.st === "greshka"){ main.innerHTML = errorHTML(ev.id); pvSync(q); return; }
  var e = cur = model(ev, q.st), c = cta(e);
  document.title = e.n + " · " + longDate(e.date) + " | Siracusa Bar & Grill";
  if (meta) meta.setAttribute("content", e.n + " в Siracusa Bar & Grill, Дружба 2: " + longDate(e.date) + " от " + e.time + ". " + e.text + " Запазете място онлайн или на " + R.phone + ".");
  jsonLD(e);
  main.innerHTML =
    '<section class="sec ev-hero">'+
      '<div class="ev-head"><div class="ev-eyebrow"><span class="ev-cat">'+ic("mask-happy",18)+esc(e.cat)+'</span>'+
        '<button class="pill pill-soft ev-share" type="button" data-evshare>'+ic("share-network",20)+'Сподели</button></div>'+
        '<h1 class="ev-title">'+esc(e.n)+'</h1><p class="lead ev-lead">'+esc(e.text)+'</p></div>'+
      '<div class="ev-ticket">'+ticketHTML(e)+'</div>'+
      '<div class="ev-facts">'+factsHTML(e)+'</div>'+
    '</section>'+
    '<section class="sec rv"><div class="ev-cols">'+programHTML(e)+menuHTML()+'</div></section>'+
    photosHTML()+rulesHTML(e)+nextHTML(e);
  abar.innerHTML = '<a class="pill pill-red" href="'+c.href+'">'+ic(c.ic === "arrow-right" ? (c.href.indexOf("reservation") === 0 ? "calendar-check" : "calendar-dots") : c.ic, 20)+esc(c.bar)+'</a>';
  var hc = main.querySelector("[data-hero-cta]");
  if ("IntersectionObserver" in window && hc){
    io = new IntersectionObserver(function(es){ var x = es[0]; setBar(!x.isIntersecting && x.boundingClientRect.top < (x.rootBounds ? x.rootBounds.top + 150 : 150)); }, {root:SC.scroller, rootMargin:"-150px 0px 0px 0px"});
    io.observe(hc); }
  pvSync(q); SC.reveal(); }

main.addEventListener("click", function(ev){ var t = ev.target.closest("button"); if (!t || !cur && !t.dataset.retry) return;
  if (t.hasAttribute("data-cal")) openCalendar(cur);
  else if (t.hasAttribute("data-evshare")) openShare(cur);
  else if (t.dataset.retry){ location.hash = t.dataset.retry; } });

/* ---- prototype-only: list of page states beside the phone frame ---- */
var pv = null;
if (window.innerWidth > 700){ pv = document.createElement("nav"); pv.className = "ev-pv"; pv.setAttribute("aria-label", "Състояния на страницата (само за прототипа)"); document.body.appendChild(pv); }
function pvSync(q){ if (!pv) return; var id = (EVENTS[0] && EVENTS[0].id) || "";
  var list = DEMO.map(function(d){ return ['#' + id + (d[0] ? "/" + d[0] : ""), d[1], find(q.id) && q.st === d[0]]; }).concat([["#nyama-takova", "Невалидно събитие", !find(q.id)]]);
  pv.innerHTML = '<b>Състояния на страницата</b>' + list.map(function(l){ return '<a href="'+l[0]+'"'+(l[2] ? ' aria-current="true"' : '')+'>'+l[1]+'</a>'; }).join(""); }

window.addEventListener("hashchange", function(){ render(); SC.scroller.scrollTop = 0; });
window.addEventListener("online", render); window.addEventListener("offline", render);
render();
})();
</script>
